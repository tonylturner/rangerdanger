name: Smoke

# Bring the lab up against the locally-built images (./scripts/dev-up.sh:
# the platform, then the US range through POST /api/range), run a layered
# series of correctness gates, then tear it down (./scripts/dev-down.sh,
# label-only by Compose project):
#
#   0. GET /api/range reports us-dnp3-substation ready (range gate)
#   1. /api/health and /api/build respond              (boot gate)
#   2. lab inventory matches the workshop deck         (content gate)
#   3. sim healthchecks pass                           (init gate)
#   4. firewall enforces the traffic matrix correctly  (dataplane gate)
#   5. reviewed YAML/CLI command examples satisfy semantic oracles
#   6. the workshop test-suite reports no step/reset failures
#
# The US smoke job catches startup regressions and lab-doc rot. The separate
# EU job runs its package and command gates on main/PRs in an isolated job,
# without sharing a Docker daemon with the US range.
#
# Budget: ~9–12 min on a GitHub-hosted runner. ~6 min for the build
# (no cache pull), ~2 min for boot, ~3 min for the matrix probes
# (mostly the negative-test 3s timeouts), and ~1 min for the workshop
# test-suite. Tradeoff: longer CI for never depending on GHCR availability
# for PR feedback.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Base images come from Docker Hub. Anonymous pulls share the runner's IP
# limit and fail with 429 under load, so log in when the repository has
# the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (forks run anonymous).
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  smoke:
    name: docker compose up + health check
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Validate compose syntax
        # Platform files under the platform project, every package's range
        # files under the range project, with the checkout as the project
        # directory and RANGERDANGER_ROOT, as setup runs them.
        run: |
          set -euo pipefail
          export RANGERDANGER_ROOT="$PWD"
          for f in docker-compose.yml docker-compose.release.yml; do
            docker compose -p rangerdanger-platform --project-directory "$PWD" -f "$f" config -q
          done
          for f in lab-definitions/packages/*/compose.source.yml lab-definitions/packages/*/compose.release.yml; do
            docker compose -p rangerdanger --project-directory "$PWD" -f "$f" config -q
          done

      - name: Free disk space (GH runner has ~14 GB by default)
        run: |
          # The 14 lab images plus their bases need more than the
          # default runner has. Shed a few hundred MB of preinstalled
          # tooling we don't need (Android SDK, .NET, Haskell).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install the Docker Engine the range needs
        # The runner image's Engine 28.0.4 cannot create the firewall's
        # pinned interface names (Compose interface_name needs 28.1+).
        run: ./scripts/ci-docker-engine.sh

      - name: Build and bring up the platform and the US range
        # setup.sh --from-source: build every platform and package image,
        # start the platform, wait for /api/health, POST /api/range and
        # wait until the range reports ready.
        run: ./scripts/dev-up.sh

      - name: Confirm the US range is ready
        run: |
          set -euo pipefail
          range=$(curl -fsS http://localhost:8088/api/range)
          echo "$range"
          echo "$range" | jq -e '.package == "us-dnp3-substation" and .phase == "ready"' >/dev/null \
            || { echo "::error::range is not us-dnp3-substation ready"; exit 1; }

      - name: Probe API endpoints
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 http://localhost:8088/api/health | tee /tmp/health.json
          curl -fsS --max-time 10 http://localhost:8088/api/build  | tee /tmp/build.json
          jq -e . /tmp/health.json
          jq -e . /tmp/build.json

      - name: Archive environment receipts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/smoke-receipts
          docker compose config > build/smoke-receipts/compose.resolved.yml
          docker compose images --format json > build/smoke-receipts/compose-images.json
          ids=$(docker compose images -q)
          image_list=()
          while IFS= read -r image; do
            [ -n "$image" ] && image_list+=("$image")
          done <<<"$ids"
          docker image inspect "${image_list[@]}" > build/smoke-receipts/images.json
          # Source mode builds the firewall locally; record the image it runs.
          docker image inspect "$(docker inspect --format '{{.Image}}' rangerdanger-firewall)" > build/smoke-receipts/containd.json
          curl -fsS --max-time 10 http://localhost:8088/api/build > build/smoke-receipts/api-build.json
          curl -fsS --max-time 10 http://localhost:8088/api/firewall/active > build/smoke-receipts/firewall-active.json

      - name: Embedded UI and desktop probes
        run: ./scripts/proxy-smoke.sh

      - name: Validate lab inventory
        # 6 workshop labs + 1 bonus, deck-aligned ordering. The list
        # of (order, id) pairs is the canonical workshop inventory -
        # add/remove rows here in lockstep with lab YAML files.
        run: |
          set -euo pipefail
          inv=$(curl -fsS http://localhost:8088/api/scenarios)
          declare -a expected=(
            "1.2|baseline-assessment"
            "1.3|segmentation-requirements"
            "1.4|remediation-planning"
            "2.2|firewall-implementation"
            "2.3|hardening-configurations"
            "2.3-bonus|vendor-rdp-compromise"
            "2.4|validation-evidence"
          )
          n=$(echo "$inv" | jq '.scenarios | length')
          if [ "$n" != "${#expected[@]}" ]; then
            echo "::error::expected ${#expected[@]} scenarios, got $n"
            echo "$inv" | jq -r '.scenarios[] | "  \(.order // "-")  \(.id)"'
            exit 1
          fi
          fail=0
          for entry in "${expected[@]}"; do
            order="${entry%%|*}"
            id="${entry##*|}"
            found=$(echo "$inv" | jq -r --arg id "$id" --arg ord "$order" \
                '.scenarios[] | select(.id == $id and .order == $ord) | .id')
            if [ "$found" = "$id" ]; then
              echo "  Lab $order  $id"
            else
              echo "::error::Lab $order $id missing or has wrong order"
              fail=1
            fi
          done
          # Every lab must have at least 3 steps. Counting via
          # "description": occurrences in the steps string blob -
          # each step has exactly one, action items don't have any.
          # (Direct fromjson parsing fails because the stored steps
          # blob has literal newlines inside string descriptions.)
          for entry in "${expected[@]}"; do
            id="${entry##*|}"
            steps=$(echo "$inv" | jq -r --arg id "$id" \
                '.scenarios[] | select(.id == $id) | .steps | [scan("\"description\":")] | length')
            if [ "$steps" -lt 3 ]; then
              echo "::error::$id has only $steps steps (expected >=3)"
              fail=1
            fi
          done
          exit $fail

      - name: Confirm sims report healthy
        run: |
          # All 7 alpine sims + opendss expose /api/health; rtac depends
          # on the field sims being healthy via service_healthy gates.
          # If startup ordering broke, this is where it surfaces.
          # Platform + range, label-only from an empty directory (from the
          # checkout Compose would load docker-compose.yml as the model).
          cd "$(mktemp -d)"
          ps_all() {
            docker compose -p rangerdanger-platform ps "$@"
            docker compose -p rangerdanger ps "$@"
          }
          ps_all --format '{{.Service}} {{.Status}}'
          healthy=$(ps_all --format '{{.Status}}' | grep -c '(healthy)')
          [ "$healthy" -ge 8 ] || { echo "expected >=8 healthy services, got $healthy"; exit 1; }

      - name: Firewall traffic enforcement smoke
        # scripts/firewall-smoke.sh applies weak then improved via the
        # lab API and probes a positive+negative traffic matrix from
        # inside the lab containers. Catches enforcement regressions
        # in the dataplane (multi-protocol bug, rule ordering,
        # autobind, etc.) before a workshop student trips over them.
        run: |
          set -euo pipefail
          ./scripts/firewall-smoke.sh

      - name: Lab commands smoke
        # Reviewed YAML examples, including hints and appliance commands.
        # This does not execute the old frontend's generated replacements;
        # the inventory explicitly reports unautomated manual mutations.
        # PyYAML is needed by the script's parser; install once
        # alongside any other ad-hoc deps.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          ./scripts/lab-commands-smoke.sh

      - name: Events + ICS DPI smoke
        # scripts/events-smoke.sh covers the v0.1.25 firewall.rule.hit
        # pipeline (kali probe → DENY event in engine + backend), ICS
        # template name normalization (hyphen ↔ underscore at the
        # apply boundary), and ICS DPI function-code allowlist
        # enforcement (RTAC FC8 → block_flows nft set entry). These
        # have their own failure modes the traffic-matrix and lab-doc
        # gates won't catch: backend Event JSON schema drift, NFQUEUE
        # library compat, chain ordering vs ct established fast-path,
        # template name normalization at the apply boundary.
        run: |
          set -euo pipefail
          ./scripts/events-smoke.sh

      - name: Substation physics smoke
        # scripts/substation-smoke.sh confirms field-device state flows
        # through RTAC -> OpenDSS and back: the capacitor bank (wired into
        # the power flow) raises the power factor on switch-in and its
        # in/out state echoes through both the device map and the electrical
        # results. The health/inventory gates don't exercise the physics.
        run: |
          set -euo pipefail
          ./scripts/substation-smoke.sh

      - name: Workshop test-suite
        # Exercises every workshop scenario through the backend's test
        # runner, including auto-pass and reset reporting. This resets lab
        # state, so run it only against the disposable CI stack.
        run: |
          set -euo pipefail
          ./scripts/test-suite-smoke.sh

      - name: Compiled full plan must meet hardened acceptance
        run: |
          set -euo pipefail
          API=http://localhost:8088
          receipts=build/smoke-receipts/rd01
          golden=frontend/lib/testdata/plans/us-full.json
          oracle=scripts/tests/fixtures
          mkdir -p "$receipts"
          restore_weak() {
            local rc=$?
            trap - EXIT
            if ! curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' \
                -d '{"config":"weak"}' "$API/api/firewall/apply" >"$receipts/restore.json"; then
              echo "RD-01 cleanup failed" >&2
              rc=1
            fi
            exit "$rc"
          }
          trap restore_weak EXIT
          jq -L "$oracle" 'include "plan-gate"; plan_request' "$golden" >"$receipts/plan.json"
          curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json' \
            --data-binary @"$receipts/plan.json" "$API/api/firewall/apply-plan" >"$receipts/apply.json"
          jq -e -L "$oracle" --slurpfile golden "$golden" \
            'include "plan-gate"; plan_applied($golden[0])' "$receipts/apply.json"
          sleep 3
          curl -fsS --max-time 90 -X POST "$API/api/firewall/validation-report" >"$receipts/report.json"
          jq -e -L "$oracle" --slurpfile golden "$golden" \
            'include "plan-gate"; plan_report($golden[0])' "$receipts/report.json"

      - name: Compiled partial plan must prove its remaining prevention gaps
        run: |
          set -euo pipefail
          API=http://localhost:8088
          receipts=build/smoke-receipts/rd01-partial
          golden=frontend/lib/testdata/plans/us-partial.json
          oracle=scripts/tests/fixtures
          mkdir -p "$receipts"
          restore_weak() {
            local rc=$?
            trap - EXIT
            if ! curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' \
                -d '{"config":"weak"}' "$API/api/firewall/apply" >"$receipts/restore.json"; then
              echo "partial-plan cleanup failed" >&2
              rc=1
            fi
            exit "$rc"
          }
          trap restore_weak EXIT
          jq -L "$oracle" 'include "plan-gate"; plan_request' "$golden" >"$receipts/plan.json"
          curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json' \
            --data-binary @"$receipts/plan.json" "$API/api/firewall/apply-plan" >"$receipts/apply.json"
          jq -e -L "$oracle" --slurpfile golden "$golden" \
            'include "plan-gate"; plan_applied($golden[0])' "$receipts/apply.json"
          sleep 3
          curl -fsS --max-time 90 -X POST "$API/api/firewall/validation-report" >"$receipts/report.json"
          jq -e -L "$oracle" --slurpfile golden "$golden" \
            'include "plan-gate"; plan_report($golden[0])' "$receipts/report.json"

      - name: Dump container logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs
          curl -sS http://localhost:8088/api/range > /tmp/logs/range.json 2>&1 || true
          for project in rangerdanger-platform rangerdanger; do
            for c in $(docker ps -a --filter "label=com.docker.compose.project=$project" --format '{{.Names}}'); do
              docker logs --tail=200 "$c" > "/tmp/logs/$c.log" 2>&1 || true
            done
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: /tmp/logs/
          retention-days: 7

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-smoke-evidence
          path: |
            build/smoke-receipts/
            build/lab-commands/
            build/proxy-smoke/
          retention-days: 7

      - name: Tear down
        if: always()
        run: ./scripts/dev-down.sh

  eu-smoke:
    name: EU IEC104 source gate
    runs-on: ubuntu-26.04
    # A clean run takes about 43 minutes; a slow apt mirror adds ten more.
    timeout-minutes: 60
    env:
      EU_GATE_EVIDENCE_DIR: /tmp/eu-gate-evidence

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install host tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          tshark --version

      - name: Verify EU gate host tools
        run: |
          set -euo pipefail
          for tool in curl jq python3 docker tshark; do
            command -v "$tool"
          done
          docker compose version

      - name: Prepare evidence directory
        run: mkdir -p "$EU_GATE_EVIDENCE_DIR"

      - name: Install the Docker Engine the range needs
        # The runner image's Engine 28.0.4 cannot create the firewall's
        # pinned interface names (Compose interface_name needs 28.1+).
        run: ./scripts/ci-docker-engine.sh

      - name: Build and bring up the platform and EU range
        run: ./scripts/dev-up.sh --package eu-iec104-substation

      - name: Confirm the EU range is ready
        run: |
          set -euo pipefail
          range=$(curl -fsS http://localhost:8088/api/range)
          echo "$range"
          echo "$range" | jq -e '.package == "eu-iec104-substation" and .phase == "ready"' >/dev/null \
            || { echo "::error::range is not eu-iec104-substation ready"; exit 1; }

      - name: Install EU command inventory dependency
        run: python3 -m pip install --quiet pyyaml

      - name: EU IEC104 smoke gate
        run: ./scripts/eu-iec104-smoke.sh

      - name: EU reviewed lab commands smoke
        run: ./scripts/lab-commands-smoke.sh eu-iec104-substation
        env:
          LAB_CMD_LOG_DIR: /tmp/eu-lab-commands

      - name: Collect range logs and EU gate evidence
        if: always()
        run: |
          mkdir -p /tmp/logs "$EU_GATE_EVIDENCE_DIR"
          curl -sS http://localhost:8088/api/range > /tmp/logs/range.json 2>&1 || true
          for project in rangerdanger-platform rangerdanger; do
            for c in $(docker ps -a --filter "label=com.docker.compose.project=$project" --format '{{.Names}}'); do
              docker logs --tail=200 "$c" > "/tmp/logs/$c.log" 2>&1 || true
            done
          done

      - name: Upload EU evidence and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eu-compose-logs-and-gate-evidence
          path: |
            /tmp/logs/
            /tmp/eu-gate-evidence/
            /tmp/eu-lab-commands/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down EU range and platform
        if: always()
        run: ./scripts/dev-down.sh
