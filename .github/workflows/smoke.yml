name: Smoke

# Bring the lab up against the locally-built images, run a layered
# series of correctness gates, then tear it down:
#
#   1. /api/health and /api/build respond              (boot gate)
#   2. lab inventory matches the workshop deck         (content gate)
#   3. sim healthchecks pass                           (init gate)
#   4. firewall enforces the traffic matrix correctly  (dataplane gate)
#   5. reviewed YAML/CLI command examples satisfy semantic oracles
#   6. the workshop test-suite reports no step/reset failures
#
# Runs on every push to main + PR. Catches startup regressions and
# lab-doc rot before a workshop student trips over them.
#
# Budget: ~9–12 min on a GitHub-hosted runner. ~6 min for the build
# (no cache pull), ~2 min for boot, ~3 min for the matrix probes
# (mostly the negative-test 3s timeouts), and ~1 min for the workshop
# test-suite. Tradeoff: longer CI for never depending on GHCR availability
# for PR feedback.

on:
  push:
    branches: [main, hotfix/v0.1.36-rc.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Base images come from Docker Hub. Anonymous pulls share the runner's IP
# limit and fail with 429 under load, so log in when the repository has
# the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (forks run anonymous).
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  smoke:
    name: docker compose up + health check
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Validate compose syntax
        run: |
          docker compose config -q
          docker compose -f docker-compose.release.yml config -q

      - name: Free disk space (GH runner has ~14 GB by default)
        run: |
          # The 14 lab images plus their bases need more than the
          # default runner has. Shed a few hundred MB of preinstalled
          # tooling we don't need (Android SDK, .NET, Haskell).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the stack
        run: docker compose build --parallel

      - name: Bring up the stack
        run: docker compose up -d

      - name: Wait for backend to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8088/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}0 seconds"
              exit 0
            fi
            sleep 10
          done
          echo "backend did not report healthy in 5 minutes"
          exit 1

      - name: Probe API endpoints
        run: |
          curl -fsS http://localhost:8088/api/health | tee /tmp/health.json
          curl -fsS http://localhost:8088/api/build  | tee /tmp/build.json

      - name: Archive environment receipts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/smoke-receipts
          docker compose config > build/smoke-receipts/compose.resolved.yml
          docker compose images --format json > build/smoke-receipts/compose-images.json
          ids=$(docker compose images -q)
          image_list=()
          while IFS= read -r image; do
            [ -n "$image" ] && image_list+=("$image")
          done <<<"$ids"
          docker image inspect "${image_list[@]}" > build/smoke-receipts/images.json
          docker image inspect ghcr.io/tonylturner/containd:latest > build/smoke-receipts/containd.json
          curl -fsS --max-time 10 http://localhost:8088/api/build > build/smoke-receipts/api-build.json
          curl -fsS --max-time 10 http://localhost:8088/api/firewall/active > build/smoke-receipts/firewall-active.json

      - name: Embedded UI and desktop probes
        run: ./scripts/proxy-smoke.sh

      - name: Validate lab inventory
        # 6 workshop labs + 1 bonus, deck-aligned ordering. The list
        # of (order, id) pairs is the canonical workshop inventory -
        # add/remove rows here in lockstep with lab YAML files.
        run: |
          set -euo pipefail
          inv=$(curl -fsS http://localhost:8088/api/scenarios)
          declare -a expected=(
            "1.2|baseline-assessment"
            "1.3|segmentation-requirements"
            "1.4|remediation-planning"
            "2.2|firewall-implementation"
            "2.3|hardening-configurations"
            "2.3-bonus|vendor-rdp-compromise"
            "2.4|validation-evidence"
          )
          n=$(echo "$inv" | jq '.scenarios | length')
          if [ "$n" != "${#expected[@]}" ]; then
            echo "::error::expected ${#expected[@]} scenarios, got $n"
            echo "$inv" | jq -r '.scenarios[] | "  \(.order // "-")  \(.id)"'
            exit 1
          fi
          fail=0
          for entry in "${expected[@]}"; do
            order="${entry%%|*}"
            id="${entry##*|}"
            found=$(echo "$inv" | jq -r --arg id "$id" --arg ord "$order" \
                '.scenarios[] | select(.id == $id and .order == $ord) | .id')
            if [ "$found" = "$id" ]; then
              echo "  Lab $order  $id"
            else
              echo "::error::Lab $order $id missing or has wrong order"
              fail=1
            fi
          done
          # Every lab must have at least 3 steps. Counting via
          # "description": occurrences in the steps string blob -
          # each step has exactly one, action items don't have any.
          # (Direct fromjson parsing fails because the stored steps
          # blob has literal newlines inside string descriptions.)
          for entry in "${expected[@]}"; do
            id="${entry##*|}"
            steps=$(echo "$inv" | jq -r --arg id "$id" \
                '.scenarios[] | select(.id == $id) | .steps | [scan("\"description\":")] | length')
            if [ "$steps" -lt 3 ]; then
              echo "::error::$id has only $steps steps (expected >=3)"
              fail=1
            fi
          done
          exit $fail

      - name: Confirm sims report healthy
        run: |
          # All 7 alpine sims + opendss expose /api/health; rtac depends
          # on the field sims being healthy via service_healthy gates.
          # If startup ordering broke, this is where it surfaces.
          docker compose ps --format '{{.Service}} {{.Status}}'
          healthy=$(docker compose ps --format '{{.Status}}' | grep -c '(healthy)')
          [ "$healthy" -ge 8 ] || { echo "expected >=8 healthy services, got $healthy"; exit 1; }

      - name: Firewall traffic enforcement smoke
        # scripts/firewall-smoke.sh applies weak then improved via the
        # lab API and probes a positive+negative traffic matrix from
        # inside the lab containers. Catches enforcement regressions
        # in the dataplane (multi-protocol bug, rule ordering,
        # autobind, etc.) before a workshop student trips over them.
        run: |
          set -euo pipefail
          ./scripts/firewall-smoke.sh

      - name: Lab commands smoke
        # Reviewed YAML examples, including hints and appliance commands.
        # This does not execute the old frontend's generated replacements;
        # the inventory explicitly reports unautomated manual mutations.
        # PyYAML is needed by the script's parser; install once
        # alongside any other ad-hoc deps.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          ./scripts/lab-commands-smoke.sh

      - name: Events + ICS DPI smoke
        # scripts/events-smoke.sh covers the v0.1.25 firewall.rule.hit
        # pipeline (kali probe → DENY event in engine + backend), ICS
        # template name normalization (hyphen ↔ underscore at the
        # apply boundary), and ICS DPI function-code allowlist
        # enforcement (RTAC FC8 → block_flows nft set entry). These
        # have their own failure modes the traffic-matrix and lab-doc
        # gates won't catch: backend Event JSON schema drift, NFQUEUE
        # library compat, chain ordering vs ct established fast-path,
        # template name normalization at the apply boundary.
        run: |
          set -euo pipefail
          ./scripts/events-smoke.sh

      - name: Substation physics smoke
        # scripts/substation-smoke.sh confirms field-device state flows
        # through RTAC -> OpenDSS and back: the capacitor bank (wired into
        # the power flow) raises the power factor on switch-in and its
        # in/out state echoes through both the device map and the electrical
        # results. The health/inventory gates don't exercise the physics.
        run: |
          set -euo pipefail
          ./scripts/substation-smoke.sh

      - name: Workshop test-suite
        # Exercises every workshop scenario through the backend's test
        # runner, including auto-pass and reset reporting. This resets lab
        # state, so run it only against the disposable CI stack.
        run: |
          set -euo pipefail
          ./scripts/test-suite-smoke.sh

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs
          for svc in backend firewall rtac_sim relay_sim recloser_sim regulator_sim capbank_sim opendss_sim fuxa_hmi proxy frontend; do
            docker compose logs --tail=200 "$svc" > "/tmp/logs/$svc.log" 2>&1 || true
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: /tmp/logs/
          retention-days: 7

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-smoke-evidence
          path: |
            build/smoke-receipts/
            build/lab-commands/
            build/proxy-smoke/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  release-compat:
    name: RC checkout with cached v0.1.35 images (no build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: v0.1.35
      COMPOSE_FILE: docker-compose.release.yml
      COMPOSE_PROJECT_NAME: rangerdanger
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python3 -m pip install pyyaml
      - name: Make room for approximately 21 GB of expanded images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          python3 - <<'PY'
          import shutil
          if shutil.disk_usage(".").free < 21 * 1024**3:
              raise SystemExit("Need ~21 GiB before pulling v0.1.35 images; use a larger runner")
          PY
      - name: Cache published v0.1.35 images (including containd latest)
        # This is CI-only cache population. The local twin NEVER pulls.
        run: docker compose -f docker-compose.release.yml pull
      - name: Repo-only hard gates
        id: hard-gates
        run: |
          docker compose -f docker-compose.release.yml up -d --no-build --pull never
          ./scripts/release-compat-smoke.sh --existing-stack
      - name: Known defects RD-01 - generated full plan must block all 11 unauthorized flows
        if: ${{ !cancelled() && steps.hard-gates.outcome != 'skipped' }}
        continue-on-error: true
        run: ./scripts/release-compat-smoke.sh --known-defects --replace
      - name: Capture final compat logs
        if: always()
        run: |
          mkdir -p build/release-compat
          docker compose -f docker-compose.release.yml logs --no-color > build/release-compat/compose.final.log 2>&1
      - name: Upload compat receipts and command output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-compat-v0.1.35
          path: |
            build/release-compat/
            build/lab-commands/
            build/proxy-smoke/
          retention-days: 14
      - name: Tear down disposable CI stack
        if: always()
        run: docker compose -f docker-compose.release.yml down -v --remove-orphans
