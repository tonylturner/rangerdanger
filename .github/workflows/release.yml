name: Release

# Tag pushes build/promote; pre-releases do not move :latest. Frontend uses
# native builders and OpenPLC is amd64-only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)publish (e.g. v0.1.0). Must already exist."
        required: true
      rebuild_all:
        description: "Refresh every image from upstream bases and packages"
        type: boolean
        required: false
        default: false
# One release at a time per target tag. A tag push and a manual rerun of the
# same tag would otherwise both clear the "already published" guard and then
# push the same image tags independently, so the second run could overwrite
# the roots the first one recorded in release-images.json. Queue instead of
# cancelling: a run that is already pushing manifests must finish, and the
# queued one then fails on the guard.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: tonylturner

jobs:
  plan:
    name: Plan image builds and promotions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      commit: ${{ steps.commit.outputs.commit }}
      promote_count: ${{ steps.plan.outputs.promote_count }}
      build_count: ${{ steps.plan.outputs.build_count }}
      frontend_decision: ${{ steps.plan.outputs.frontend_decision }}
      override: ${{ steps.commit.outputs.override }}
    steps:
      - name: Resolve target tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF##*/}"
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Reject an already-published target release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          release_view_error="$RUNNER_TEMP/release-view-error"
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$release_view_error")"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Delete or unpublish it before rerunning this workflow."
              exit 1
            fi
          elif ! grep -Fxq "release not found" "$release_view_error"; then
            cat "$release_view_error" >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve released commit and rebuild override
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.name }}
          DISPATCH_REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          commit="$(git rev-parse "$TAG^{commit}")"
          tag_message="$(git tag -l --format='%(contents)' "$TAG")"
          override=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$tag_message" == *"[rebuild-all]"* ]]; then
            override=true
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_REBUILD_ALL" == "true" ]]; then
            override=true
          fi
          {
            echo "commit=$commit"
            echo "override=$override"
          } >> "$GITHUB_OUTPUT"

      - name: Find previous published release and download its record
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          RECORD_DIR: ${{ runner.temp }}/previous-release
        run: |
          previous_release="$(gh release list --limit 1000 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft == false) | select(.tagName != env.TAG)][0].tagName // ""')"
          if [ -z "$previous_release" ]; then
            echo "No previous published release; the planner will build without a baseline."
          else
            assets="$(gh release view "$previous_release" --json assets --jq '[.assets[].name]')"
            if jq -e 'index("release-images.json") != null' >/dev/null <<< "$assets"; then
              mkdir -p "$RECORD_DIR"
              if ! gh release download "$previous_release" --pattern release-images.json --dir "$RECORD_DIR" ||
                 ! python3 -m json.tool "$RECORD_DIR/release-images.json" >/dev/null; then
                echo "::warning::The previous release record is unreadable; proceeding without a promotion baseline."
                rm -f "$RECORD_DIR/release-images.json"
              fi
            else
              echo "The previous release has no record; this is a normal build-only baseline."
            fi
          fi

      - name: Run release image planner
        id: plan
        env:
          TAG: ${{ steps.tag.outputs.name }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          OVERRIDE: ${{ steps.commit.outputs.override }}
          EVENT: ${{ github.event_name == 'push' && 'tag_push' || 'dispatch' }}
          PLAN_PATH: ${{ runner.temp }}/release-plan.json
          PREVIOUS_RECORD: ${{ runner.temp }}/previous-release/release-images.json
        run: |
          override_args=()
          previous_record_args=()
          if [ "$OVERRIDE" = "true" ]; then
            override_args+=(--override)
          fi
          if [ -f "$PREVIOUS_RECORD" ]; then
            previous_record_args+=(--previous-record "$PREVIOUS_RECORD")
          fi
          python3 scripts/release_image_plan.py \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --event "$EVENT" \
            "${override_args[@]}" \
            "${previous_record_args[@]}" \
            --out "$PLAN_PATH"

      - name: Prepare plan and baseline artifact
        env:
          PLAN_PATH: ${{ runner.temp }}/release-plan.json
          PLAN_DIR: ${{ runner.temp }}/release-plan
          PREVIOUS_RECORD: ${{ runner.temp }}/previous-release/release-images.json
        run: |
          mkdir -p "$PLAN_DIR"
          cp "$PLAN_PATH" "$PLAN_DIR/release-plan.json"
          if [ -f "$PREVIOUS_RECORD" ]; then
            cp "$PREVIOUS_RECORD" "$PLAN_DIR/release-images.json"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Resolve target tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: release-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan

      - name: Compute build metadata
        id: meta
        env:
          VERSION: ${{ steps.tag.outputs.name }}
        run: |
          {
            echo "version=$VERSION"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%FT%TZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute artifact build labels
        id: artifact-labels
        if: matrix.decision == 'build'
        env:
          IMAGE_TITLE: ${{ matrix.image }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          build_revision="$(git rev-parse HEAD)"
          build_created="$(date -u +%FT%TZ)"
          {
            echo "build_labels<<EOF"
            printf 'org.opencontainers.image.title=%s\n' "$IMAGE_TITLE"
            printf 'org.opencontainers.image.source=%s\n' "$SOURCE_URL"
            printf 'org.opencontainers.image.licenses=Apache-2.0\n'
            printf 'org.opencontainers.image.revision=%s\n' "$build_revision"
            printf 'org.opencontainers.image.created=%s\n' "$build_created"
            echo EOF
            echo "build_revision=$build_revision"
            echo "build_created=$build_created"
          } >> "$GITHUB_OUTPUT"

      - name: Image metadata + tag plan
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}
            type=raw,value=latest,enable=${{ !contains(steps.tag.outputs.name, '-') }}

      - name: Build and push
        id: build
        if: matrix.decision == 'build'
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ join(matrix.platforms, ',') }}
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.artifact-labels.outputs.build_labels }}
          pull: ${{ needs.plan.outputs.override == 'true' }}
          no-cache: ${{ needs.plan.outputs.override == 'true' }}
          # Backend consumes these; other Dockerfiles ignore them.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Wait before retry 1
        if: matrix.decision == 'build' && steps.build.outcome == 'failure'
        run: sleep 30

      - name: Build and push (retry 1)
        id: retry1
        if: matrix.decision == 'build' && steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ join(matrix.platforms, ',') }}
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.artifact-labels.outputs.build_labels }}
          pull: ${{ needs.plan.outputs.override == 'true' }}
          no-cache: ${{ needs.plan.outputs.override == 'true' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Wait before retry 2
        if: matrix.decision == 'build' && steps.build.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60

      - name: Build and push (retry 2)
        id: retry2
        if: matrix.decision == 'build' && steps.build.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ join(matrix.platforms, ',') }}
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.artifact-labels.outputs.build_labels }}
          pull: ${{ needs.plan.outputs.override == 'true' }}
          no-cache: ${{ needs.plan.outputs.override == 'true' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Promote recorded image root
        id: promote
        if: matrix.decision == 'promote'
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          SOURCE_DIGEST: ${{ matrix.source_digest }}
          IMAGE_TAGS: ${{ steps.docker-meta.outputs.tags }}
        run: |
          source_ref="${IMAGE_REPOSITORY}@${SOURCE_DIGEST}"
          source_metadata="$(docker buildx imagetools inspect --format '{{json .}}' "$source_ref")"
          media_type="$(jq -er '.manifest.mediaType | strings | select(length > 0)' <<< "$source_metadata")"
          prefer_index_args=()
          if [[ "$media_type" != "application/vnd.oci.image.index.v1+json" &&
                "$media_type" != "application/vnd.docker.distribution.manifest.list.v2+json" ]]; then
            prefer_index_args+=(--prefer-index=false)
          fi
          tag_args=()
          while IFS= read -r image_tag; do
            [ -z "$image_tag" ] || tag_args+=(-t "$image_tag")
          done <<< "$IMAGE_TAGS"
          [ "${#tag_args[@]}" -gt 0 ] || { echo "No planned tags for $IMAGE_REPOSITORY" >&2; exit 1; }
          docker buildx imagetools create \
            "${prefer_index_args[@]}" \
            "${tag_args[@]}" \
            "$source_ref"
          echo "root_digest=$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve build root digest
        id: build-root
        if: matrix.decision == 'build'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          RETRY1_OUTCOME: ${{ steps.retry1.outcome }}
          RETRY1_DIGEST: ${{ steps.retry1.outputs.digest }}
          RETRY2_OUTCOME: ${{ steps.retry2.outcome }}
          RETRY2_DIGEST: ${{ steps.retry2.outputs.digest }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ]; then
            digest="$BUILD_DIGEST"
          elif [ "$RETRY1_OUTCOME" = "success" ]; then
            digest="$RETRY1_DIGEST"
          elif [ "$RETRY2_OUTCOME" = "success" ]; then
            digest="$RETRY2_DIGEST"
          else
            echo "No successful build attempt produced a root digest." >&2
            exit 1
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Build output was not a full root digest: $digest" >&2
            exit 1
          }
          echo "root_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published root and platform manifests
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          IMAGE_TAGS: ${{ steps.docker-meta.outputs.tags }}
          ROOT_DIGEST: ${{ steps.promote.outputs.root_digest || steps.build-root.outputs.root_digest }}
          EXPECTED_PLATFORMS: ${{ toJSON(matrix.platforms) }}
        run: scripts/verify_published_image.sh "$IMAGE_REPOSITORY" "$ROOT_DIGEST" "$IMAGE_TAGS" "$EXPECTED_PLATFORMS"

      - name: Write image result
        env:
          PLAN_PATH: ${{ runner.temp }}/release-plan/release-plan.json
          IMAGE: ${{ matrix.image }}
          REPOSITORY: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          DECISION: ${{ matrix.decision }}
          ROOT_DIGEST: ${{ steps.promote.outputs.root_digest || steps.build-root.outputs.root_digest }}
          PLATFORMS: ${{ toJSON(matrix.platforms) }}
          BUILD_REVISION: ${{ steps.artifact-labels.outputs.build_revision }}
          BUILD_CREATED: ${{ steps.artifact-labels.outputs.build_created }}
          RESULT_PATH: ${{ runner.temp }}/plan-result-${{ matrix.image }}.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads(Path(os.environ["PLAN_PATH"]).read_text())
          image = os.environ["IMAGE"]
          planned = next(item for item in plan["images"] if item["image"] == image)
          if planned["decision"] != os.environ["DECISION"]:
              raise SystemExit("Matrix decision disagrees with the release plan")
          revision, created, source = (
              (planned["source_build_revision"], planned["source_build_created"], planned["source_release"])
              if planned["decision"] == "promote" else
              (os.environ["BUILD_REVISION"], os.environ["BUILD_CREATED"], plan["release"])
          )
          if not all((revision, created, source)):
              raise SystemExit(f"Incomplete original build metadata for {image}")
          result = dict(
              image=image, repository=os.environ["REPOSITORY"], decision=planned["decision"],
              reason=planned["reason"], root_digest=os.environ["ROOT_DIGEST"],
              platforms=json.loads(os.environ["PLATFORMS"]), build_revision=revision,
              build_created=created, source_release=source, policy_version=plan["policy_version"],
          )
          Path(os.environ["RESULT_PATH"]).write_text(json.dumps(result, sort_keys=True) + "\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: plan-result-${{ matrix.image }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan-result-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 1

  # ── frontend: native-runner multi-arch build; avoid the SWC QEMU failure.
  frontend:
    name: rangerdanger-frontend (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Resolve target tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 1

      - name: Compute build metadata
        id: meta
        env:
          VERSION: ${{ steps.tag.outputs.name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo "version=$VERSION"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%FT%TZ)"
          } >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2153 # Inputs are injected through step env.
          platform=$PLATFORM
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: needs.plan.outputs.frontend_decision == 'build'

      - uses: docker/login-action@v4
        if: needs.plan.outputs.frontend_decision == 'build'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute artifact build labels
        id: artifact-labels
        if: needs.plan.outputs.frontend_decision == 'build'
        env:
          IMAGE_TITLE: rangerdanger-frontend
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          build_revision="$(git rev-parse HEAD)"
          build_created="$(date -u +%FT%TZ)"
          {
            echo "build_labels<<EOF"
            printf 'org.opencontainers.image.title=%s\n' "$IMAGE_TITLE"
            printf 'org.opencontainers.image.source=%s\n' "$SOURCE_URL"
            printf 'org.opencontainers.image.licenses=Apache-2.0\n'
            printf 'org.opencontainers.image.revision=%s\n' "$build_revision"
            printf 'org.opencontainers.image.created=%s\n' "$build_created"
            echo EOF
            echo "build_revision=$build_revision"
            echo "build_created=$build_created"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        if: needs.plan.outputs.frontend_decision == 'build'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.artifact-labels.outputs.build_labels }}
          pull: ${{ needs.plan.outputs.override == 'true' }}
          no-cache: ${{ needs.plan.outputs.override == 'true' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/rangerdanger-frontend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=rangerdanger-frontend-${{ steps.meta.outputs.pair }}
          cache-to: type=gha,mode=max,scope=rangerdanger-frontend-${{ steps.meta.outputs.pair }}

      - name: Export digest
        if: needs.plan.outputs.frontend_decision == 'build'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          mkdir -p "$DIGEST_DIR"
          touch "$DIGEST_DIR/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        if: needs.plan.outputs.frontend_decision == 'build'
        with:
          name: digests-frontend-${{ steps.meta.outputs.pair }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Write frontend build metadata
        if: needs.plan.outputs.frontend_decision == 'build'
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_REVISION: ${{ steps.artifact-labels.outputs.build_revision }}
          BUILD_CREATED: ${{ steps.artifact-labels.outputs.build_created }}
          METADATA_PATH: ${{ runner.temp }}/frontend-build-${{ steps.meta.outputs.pair }}.json
        run: |
          printf '{"platform":"%s","build_revision":"%s","build_created":"%s"}\n' \
            "$PLATFORM" "$BUILD_REVISION" "$BUILD_CREATED" > "$METADATA_PATH"

      - name: Upload frontend build metadata
        if: needs.plan.outputs.frontend_decision == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ steps.meta.outputs.pair }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-build-${{ steps.meta.outputs.pair }}.json
          if-no-files-found: error
          retention-days: 1

  frontend-merge:
    name: rangerdanger-frontend (merge)
    needs: [plan, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve target tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: release-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan

      - name: Download digests
        uses: actions/download-artifact@v8
        if: needs.plan.outputs.frontend_decision == 'build'
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-frontend-*-${{ github.run_attempt }}
          merge-multiple: true

      - name: Download frontend build metadata
        uses: actions/download-artifact@v8
        if: needs.plan.outputs.frontend_decision == 'build'
        with:
          path: ${{ runner.temp }}/frontend-builds
          pattern: frontend-build-*-${{ github.run_attempt }}
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag plan
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/rangerdanger-frontend
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}
            type=raw,value=latest,enable=${{ !contains(steps.tag.outputs.name, '-') }}

      - name: Create manifest list and push
        id: create
        if: needs.plan.outputs.frontend_decision == 'build'
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/rangerdanger-frontend
          METADATA_PATH: ${{ runner.temp }}/frontend-create-metadata.json
        run: |
          # imagetools create reports the pushed root digest only through
          # --metadata-file: its stdout is empty and the copy/push progress
          # goes to stderr. Both expansions word-split: planned -t flags and
          # per-arch digests.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --metadata-file "$METADATA_PATH" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for digest_file in *; do printf '%s@sha256:%s ' "$IMAGE_REPOSITORY" "$digest_file"; done)
          root_digest="$(jq -r '."containerimage.descriptor".digest // empty' "$METADATA_PATH")"
          [[ "$root_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "imagetools create metadata reported no root digest: [$root_digest]" >&2
            exit 1
          }
          echo "root_digest=$root_digest" >> "$GITHUB_OUTPUT"

      - name: Promote recorded frontend root
        id: promote
        if: needs.plan.outputs.frontend_decision == 'promote'
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/rangerdanger-frontend
          IMAGE_TAGS: ${{ steps.docker-meta.outputs.tags }}
          PLAN_PATH: ${{ runner.temp }}/release-plan/release-plan.json
        run: |
          source_digest="$(jq -r '.images[] | select(.image == "rangerdanger-frontend") | .source_digest' "$PLAN_PATH")"
          source_ref="${IMAGE_REPOSITORY}@${source_digest}"
          source_metadata="$(docker buildx imagetools inspect --format '{{json .}}' "$source_ref")"
          media_type="$(jq -er '.manifest.mediaType | strings | select(length > 0)' <<< "$source_metadata")"
          prefer_index_args=()
          if [[ "$media_type" != "application/vnd.oci.image.index.v1+json" &&
                "$media_type" != "application/vnd.docker.distribution.manifest.list.v2+json" ]]; then
            prefer_index_args+=(--prefer-index=false)
          fi
          tag_args=()
          while IFS= read -r image_tag; do
            [ -z "$image_tag" ] || tag_args+=(-t "$image_tag")
          done <<< "$IMAGE_TAGS"
          [ "${#tag_args[@]}" -gt 0 ] || { echo "No planned frontend tags." >&2; exit 1; }
          docker buildx imagetools create \
            "${prefer_index_args[@]}" \
            "${tag_args[@]}" \
            "$source_ref"
          echo "root_digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Verify published frontend root and platform manifests
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/rangerdanger-frontend
          IMAGE_TAGS: ${{ steps.docker-meta.outputs.tags }}
          ROOT_DIGEST: ${{ steps.promote.outputs.root_digest || steps.create.outputs.root_digest }}
          PLAN_PATH: ${{ runner.temp }}/release-plan/release-plan.json
        run: |
          # The inventory owns the platform list; do not restate it here.
          expected_platforms="$(jq -c '.images[] | select(.image == "rangerdanger-frontend") | .platforms' "$PLAN_PATH")"
          [ -n "$expected_platforms" ] || { echo "The plan has no frontend platforms." >&2; exit 1; }
          scripts/verify_published_image.sh "$IMAGE_REPOSITORY" "$ROOT_DIGEST" "$IMAGE_TAGS" "$expected_platforms"

      - name: Write frontend image result
        env:
          PLAN_PATH: ${{ runner.temp }}/release-plan/release-plan.json
          BUILD_METADATA_PATH: ${{ runner.temp }}/frontend-builds
          DECISION: ${{ needs.plan.outputs.frontend_decision }}
          ROOT_DIGEST: ${{ steps.promote.outputs.root_digest || steps.create.outputs.root_digest }}
          RESULT_PATH: ${{ runner.temp }}/plan-result-rangerdanger-frontend.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path(os.environ["PLAN_PATH"]).read_text())
          planned = next(image for image in plan["images"] if image["image"] == "rangerdanger-frontend")
          if planned["decision"] != os.environ["DECISION"]:
              raise SystemExit("Frontend decision disagrees with the saved release plan")

          platform_builds = None
          if planned["decision"] == "promote":
              revision, created, source = (
                  planned["source_build_revision"], planned["source_build_created"], planned["source_release"]
              )
              previous = Path(os.environ["PLAN_PATH"]).with_name("release-images.json")
              if previous.exists():
                  old = json.loads(previous.read_text())
                  platform_builds = next(
                      image for image in old["images"] if image["image"] == planned["image"]
                  ).get("platform_builds")
          else:
              builds = [
                  json.loads(path.read_text())
                  for path in Path(os.environ["BUILD_METADATA_PATH"]).glob("*.json")
              ]
              builds.sort(key=lambda build: build["platform"])
              if [build["platform"] for build in builds] != sorted(planned["platforms"]):
                  raise SystemExit("Expected metadata from every native frontend build")
              if len({build["build_revision"] for build in builds}) != 1:
                  raise SystemExit("Frontend architecture builds used different revisions")
              revision, created, source = (
                  builds[0]["build_revision"], builds[0]["build_created"], plan["release"]
              )
              platform_builds = [
                  {key: build[key] for key in ("platform", "build_revision", "build_created")}
                  for build in builds
              ]
          if not all((revision, created, source)):
              raise SystemExit("Incomplete original frontend build metadata")
          result = {
              "image": planned["image"],
              "repository": "ghcr.io/tonylturner/rangerdanger-frontend",
              "decision": planned["decision"],
              "reason": planned["reason"],
              "root_digest": os.environ["ROOT_DIGEST"],
              "platforms": planned["platforms"],
              "build_revision": revision,
              "build_created": created,
              "source_release": source,
              "policy_version": plan["policy_version"],
          }
          if platform_builds is not None:
              result["platform_builds"] = platform_builds
          Path(os.environ["RESULT_PATH"]).write_text(json.dumps(result, sort_keys=True) + "\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: plan-result-rangerdanger-frontend-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan-result-rangerdanger-frontend.json
          if-no-files-found: error
          retention-days: 1

  github-release:
    # Keep incomplete image mappings in a draft, even after job failures.
    name: GitHub Release
    needs: [plan, publish, frontend, frontend-merge]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve target tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release draft or require an existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          release_view_error="$RUNNER_TEMP/release-view-error"
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$release_view_error")"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Delete or unpublish it before rerunning this workflow."
              exit 1
            fi
          else
            if ! grep -Fxq "release not found" "$release_view_error"; then
              cat "$release_view_error" >&2
              exit 1
            fi
            prerelease_flag=()
            if [[ "$TAG" == *-* ]]; then
              prerelease_flag+=(--prerelease)
            fi
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Image publication and release record are in progress." \
              --verify-tag \
              --draft \
              "${prerelease_flag[@]}"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 1

      - name: Extract CHANGELOG section for tag
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          tag="$TAG"
          awk -v tag="$tag" '
            $0 ~ "^## \\[" tag "\\] - " { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -e '/./,$!d' \
                  -e :a -e '/^$/{$d;N;ba' -e '}' \
            > release-body.md
          if [ ! -s release-body.md ]; then
            echo "Release ${tag}. See CHANGELOG.md for details." > release-body.md
          fi

      - uses: actions/download-artifact@v8
        with:
          name: release-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan

      - uses: actions/download-artifact@v8
        with:
          pattern: plan-result-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-results
          merge-multiple: true

      - name: Validate all image results and compose release record
        env:
          PLAN_PATH: ${{ runner.temp }}/release-plan/release-plan.json
          RESULTS_PATH: ${{ runner.temp }}/image-results
          RECORD_PATH: ${{ runner.temp }}/release-images.json
          INVENTORY_PATH: .github/release-images.json
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          OVERRIDE: ${{ needs.plan.outputs.override }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          plan = json.loads(Path(os.environ["PLAN_PATH"]).read_text())
          inventory = json.loads(Path(os.environ["INVENTORY_PATH"]).read_text())
          result_paths = sorted(Path(os.environ["RESULTS_PATH"]).glob("plan-result-*.json"))
          results = [json.loads(path.read_text()) for path in result_paths]
          expected = {image["image"]: image for image in plan["images"]}
          if set(expected) != {image["image"] for image in inventory["images"]}: raise SystemExit("Plan does not cover the image inventory")
          if (plan["release"], plan["commit"], str(plan["override"]).lower()) != (os.environ["RELEASE_TAG"], os.environ["RELEASE_COMMIT"], os.environ["OVERRIDE"]): raise SystemExit("Plan identity or override disagrees")
          compose_files = plan.get("compose_files")
          if not isinstance(compose_files, dict) or not isinstance(compose_files.get("platform"), dict) or not isinstance(compose_files.get("packages"), dict):
              raise SystemExit("Plan does not contain platform/package Compose membership")
          compose_models = [("platform", compose_files["platform"])] + sorted(compose_files["packages"].items())
          for owner, model in compose_models:
              if (
                  not isinstance(model, dict)
                  or not isinstance(model.get("file"), str)
                  or not re.fullmatch(r"[0-9a-f]{64}", model.get("sha256", ""))
                  or not isinstance(model.get("services"), dict)
                  or any(not isinstance(service, str) or not isinstance(image, str) or not image
                         for service, image in model["services"].items())
              ):
                  raise SystemExit(f"{owner}: Compose membership or file hash is incomplete")
          names = [result.get("image") for result in results]
          if len(names) != len(set(names)) or set(names) != set(expected):
              raise SystemExit(f"Image results incomplete/duplicated: expected={sorted(expected)}, got={sorted(names)}")
          observed = dict(zip(names, results))

          images = []
          for image_name, planned in expected.items():
              result = observed[image_name]
              if (
                  result.get("repository") != planned["repository"]
                  or result.get("decision") != planned["decision"]
                  or sorted(result.get("platforms", [])) != sorted(planned["platforms"])
                  or result.get("policy_version") != plan["policy_version"]
                  or not re.fullmatch(r"sha256:[0-9a-f]{64}", result.get("root_digest", ""))
                  or not re.fullmatch(r"[0-9a-f]{40}", result.get("build_revision", ""))
                  or not result.get("build_created") or not result.get("source_release")
              ):
                  raise SystemExit(f"{image_name}: result is incomplete or disagrees with the plan")
              if planned["decision"] == "build":
                  if result["build_revision"] != plan["commit"] or result["source_release"] != plan["release"]:
                      raise SystemExit(f"{image_name}: build metadata does not describe this release")
              elif any(result.get(key) != planned.get(source) for key, source in (
                  ("root_digest", "source_digest"), ("build_revision", "source_build_revision"),
                  ("build_created", "source_build_created"), ("source_release", "source_release"),
              )):
                  raise SystemExit(f"{image_name}: promotion differs from the recorded evidence")
              if image_name == "rangerdanger-frontend" and planned["decision"] == "build":
                  # A promoted frontend carries whatever provenance the source
                  # record held; only a fresh build owes both native timestamps.
                  platform_builds = result.get("platform_builds", [])
                  if (
                      sorted(build["platform"] for build in platform_builds) != sorted(planned["platforms"])
                      or any(not build.get("build_created") for build in platform_builds)
                  ):
                      raise SystemExit("Frontend result must preserve every native build timestamp")
                  if any(build["build_revision"] != result["build_revision"] for build in platform_builds):
                      raise SystemExit("Frontend platform build revisions disagree")
              images.append(result)

          record = {
              "schema": 1,
              "release": plan["release"],
              "commit": plan["commit"],
              "previous_release": plan.get("previous_release"),
              "override": plan["override"],
              "policy_version": plan["policy_version"],
              "compose_files": compose_files,
              "images": images,
          }
          Path(os.environ["RECORD_PATH"]).write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          print(f"Validated {len(images)} image results for {record['release']}")
          PY

      - name: Upload and verify release-images.json asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          RECORD_PATH: ${{ runner.temp }}/release-images.json
        run: |
          gh release upload "$TAG" "$RECORD_PATH" --clobber
          mkdir -p "${RUNNER_TEMP}/uploaded-record"
          gh release download "$TAG" \
            --pattern release-images.json \
            --dir "${RUNNER_TEMP}/uploaded-record"
          cmp "$RECORD_PATH" "${RUNNER_TEMP}/uploaded-record/release-images.json"

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          prerelease_flag=()
          latest_flag=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag+=(--prerelease)
          else
            latest_flag+=(--latest)
          fi
          gh release edit "$TAG" \
            --title "$TAG" \
            --notes-file release-body.md \
            --draft=false \
            "${prerelease_flag[@]}" \
            "${latest_flag[@]}"

  release-failed:
    # Alert on failure; incomplete results keep the GitHub Release as a draft.
    name: Alert on release failure
    needs: [plan, publish, frontend, frontend-merge, github-release]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - name: Resolve target tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: needs.plan.result == 'success'
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 1

      - name: File or update a failure alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release ${TAG} failed — images / GitHub Release may be incomplete"
          body=$(printf '%s\n' \
            "The Release workflow for \`${TAG}\` did not complete: ${RUN_URL}" \
            "" \
            "Likely effects: if image jobs started, one or more GHCR images may be missing or partial. An existing published release is never re-drafted; otherwise, incomplete runs keep the release as a draft and do not publish it without all 16 verified image results and its release-images.json asset." \
            "" \
            "Recover: fix the failing job above. If the existing-published-release guard failed, delete or unpublish that release first. Then re-run via Actions -> Release -> \"Run workflow\" -> tag \`${TAG}\`. Manual runs build all images; set rebuild_all to refresh moving upstream bases and packages." \
            "" \
            "_Filed automatically by release.yml on failure._")
          existing=$(gh issue list --state open --search "in:title Release ${TAG} failed" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --body "Failed again: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "$body"
          fi
