name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        # -count=1 defeats Go's test cache for this module. The
        # firewall_config_test reads canonical policy JSONs at
        # runtime; Go's cache doesn't track external files, so a
        # JSON-only edit silently keeps the cached PASS. -count=1
        # forces every run.
        run: go test -race -count=1 ./...
      - name: go build
        working-directory: backend
        run: go build ./cmd/server

  services:
    name: Services (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - name: gofmt
        working-directory: services
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: services
        run: go vet ./...
      - name: go test
        working-directory: services
        run: go test -race ./...
      - name: go build
        working-directory: services
        run: go build ./...

  dnp3go:
    name: dnp3go library (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: dnp3go/go.mod
          cache-dependency-path: dnp3go/go.sum
      - name: gofmt
        working-directory: dnp3go
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: dnp3go
        run: go vet ./...
      - name: go test
        working-directory: dnp3go
        run: go test -race ./...
      - name: go build
        working-directory: dnp3go
        run: go build ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: test
        working-directory: frontend
        run: npm test
      - name: build
        working-directory: frontend
        run: npm run build

  compose-validate:
    name: Compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: docker compose config -q

  govulncheck:
    # Hard gate. Findings other than the documented exceptions in
    # docs/security-known-issues.md fail the build. To allowlist a
    # new finding: add a triage entry to security-known-issues.md
    # and append the GOID to ALLOWED below in the same PR.
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Some ALLOWED entries below are accepted only because the
      # vulnerable package is absent from the build graph. The filter
      # in the next step matches on GOID alone, so it cannot notice
      # that rationale going stale. This asserts the precondition
      # those exceptions actually rest on.
      - name: assert unreachable exceptions still hold
        run: ./scripts/assert-unreachable-vulns.sh
      - name: scan + allowlist filter
        # Documented exceptions are listed in docs/security-known-issues.md;
        # the ALLOWED list lives in scripts/govulncheck-gate.sh.
        run: ./scripts/govulncheck-gate.sh
