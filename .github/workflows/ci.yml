name: CI

on:
  push:
    branches: [main, iec104]
  pull_request:
    branches: [main, iec104]

permissions:
  contents: read

jobs:
  eu-gates:
    name: EU gates (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install capture decoder and JSON tools
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark jq
      - name: Test EU gates without a range
        run: bash scripts/tests/eu-gate/run.sh

  iec104:
    name: IEC 104 image and protocol checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build IEC 104 image
        run: docker build -f services/iec104/Dockerfile -t rdci-g-iec104 .
      - name: Check IEC 104 protocols
        run: RD_CHECK_PREFIX=rdci-g-iec104 services/iec104/check/run.sh "$GITHUB_WORKSPACE/build/iec104-check"

  release-tooling:
    name: Release image planner and input guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release image input coverage
        run: python3 scripts/check_release_inputs.py
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -t .

  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        # -count=1 defeats Go's test cache for this module. The
        # firewall_config_test reads canonical policy JSONs at
        # runtime; Go's cache doesn't track external files, so a
        # JSON-only edit silently keeps the cached PASS. -count=1
        # forces every run.
        run: go test -race -count=1 ./...
      - name: go build
        working-directory: backend
        run: go build ./cmd/server
      - name: Package lint
        working-directory: backend
        run: go run ./cmd/packagelint

  services:
    name: Services (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - name: gofmt
        working-directory: services
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: services
        run: go vet ./...
      - name: go test
        working-directory: services
        run: go test -race ./...
      - name: go build
        working-directory: services
        run: go build ./...

  opendss-sim:
    name: opendss-sim (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install requirements
        working-directory: services/opendss-sim
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: services/opendss-sim
        run: python -m pytest -q

  dnp3go:
    name: dnp3go library (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: dnp3go/go.mod
          # Stdlib-only module: there is no go.sum to key the cache.
          cache: false
      - name: gofmt
        working-directory: dnp3go
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: dnp3go
        run: go vet ./...
      - name: go test
        working-directory: dnp3go
        run: go test -race ./...
      - name: go build
        working-directory: dnp3go
        run: go build ./...

  iec104go:
    name: iec104go library (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: iec104go/go.mod
          cache: false
      - name: gofmt
        working-directory: iec104go
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: iec104go
        run: go vet ./...
      - name: go test
        working-directory: iec104go
        run: go test -race -count=1 -timeout 300s ./...
      - name: go build
        working-directory: iec104go
        run: go build ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: test
        working-directory: frontend
        run: npm test
      - name: build
        working-directory: frontend
        run: npm run build

  compose-validate:
    name: Compose validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: RANGERDANGER_ROOT="$PWD" docker compose config -q

  govulncheck:
    # Hard gate. Findings other than the documented exceptions in
    # docs/security-known-issues.md fail the build. To allowlist a
    # new finding: add a triage entry to security-known-issues.md and
    # add its GOID to ALLOWED in scripts/govulncheck-gate.sh.
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Some ALLOWED entries in scripts/govulncheck-gate.sh are accepted
      # only because the vulnerable package is absent from the build graph.
      # The filter in the next step matches on GOID alone, so it cannot notice
      # that rationale going stale. This asserts the precondition
      # those exceptions actually rest on.
      - name: assert unreachable exceptions still hold
        run: ./scripts/assert-unreachable-vulns.sh
      - name: scan + allowlist filter
        # Documented exceptions are listed in docs/security-known-issues.md;
        # the ALLOWED list lives in scripts/govulncheck-gate.sh.
        run: ./scripts/govulncheck-gate.sh
