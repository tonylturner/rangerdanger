name: rangerdanger-platform

# Persistent backend, frontend and reverse proxy.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rangerdanger-backend
    environment:
      RANGERDANGER_HTTP_PORT: 8080
      RANGERDANGER_DB_PATH: /data/rangerdanger.db
      RANGERDANGER_LAB_DEFINITIONS_PATH: /lab-definitions
      RANGERDANGER_ROOT: ${RANGERDANGER_ROOT:?run setup}
      RANGERDANGER_MODE: source
      RANGERDANGER_PACKAGE: ${RANGERDANGER_PACKAGE:-us-dnp3-substation}
      CONTAIND_JWT_SECRET: ${CONTAIND_JWT_SECRET:-rangerdanger-dev}
    volumes:
      - ./backend/data:/data
      - ./lab-definitions:/lab-definitions:ro
      - ${RANGERDANGER_ROOT}:${RANGERDANGER_ROOT}:ro
      - ./data/proxy-routes:/proxy-routes
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      mgmt_net:
        ipv4_address: 10.99.99.10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rangerdanger-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    networks:
      mgmt_net:
        ipv4_address: 10.99.99.11
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: rangerdanger-proxy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/proxy-routes:/etc/nginx/rd-routes:ro
    ports:
      # Bound to 127.0.0.1 only (lab-only posture; A3 in release plan).
      # See SECURITY.md → "Exposing the lab beyond localhost" for how
      # to share the stack with another machine on purpose.
      - "127.0.0.1:8088:8080"
    depends_on:
      - backend
      - frontend
    networks:
      mgmt_net:
        ipv4_address: 10.99.99.3
    restart: unless-stopped

networks:
  mgmt_net:
    name: rangerdanger_mgmt_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.99.0/24
          gateway: 10.99.99.1
