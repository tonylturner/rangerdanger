schema: 1
requirements:
  enterprise-to-field:
    label: Enterprise/vendor → field devices on Modbus/502
    impl:
      BLOCK:
        - block-enterprise-to-field
        - block-vendor-to-field
      BLOCK and LOG:
        - block-enterprise-to-field
        - block-vendor-to-field
        - improve-logging
  enterprise-to-station:
    label: Enterprise → station RTU on IEC 104/2404
    impl:
      BLOCK:
        - block-enterprise-to-station
      BLOCK and LOG:
        - block-enterprise-to-station
        - improve-logging
  vendor-to-station:
    label: Vendor DMZ → station (engineering access)
    impl:
      BLOCK:
        - restrict-vendor-to-station
      BLOCK and LOG:
        - restrict-vendor-to-station
        - improve-logging
      RESTRICT:
        - restrict-vendor-to-station
  non-rtu-to-field:
    label: Hosts other than RTU (and PLC→OLTC) → field devices
    impl:
      BLOCK:
        - pin-rtu-to-field
      BLOCK and LOG:
        - pin-rtu-to-field
        - improve-logging
  unauth-control:
    label: Unauthorized IEC 104 commands / Modbus writes
    impl:
      BLOCK:
        - modbus-dpi
        - iec104-dpi
      BLOCK and LOG:
        - modbus-dpi
        - iec104-dpi
        - improve-logging
      LOG:
        - improve-logging
requirementOrder:
  - enterprise-to-field
  - enterprise-to-station
  - vendor-to-station
  - non-rtu-to-field
  - unauth-control
readiness:
  - id: ot-eng-availability
    label: OT engineering capacity
    good: AVAILABLE
  - id: fw-admin-skills
    label: Firewall admin skills
    good: IN_HOUSE
  - id: vendor-change-window
    label: Vendor change windows
    good: SECURED
  - id: risk-acceptance-authority
    label: Risk-acceptance authority
    good: CLEAR
readinessFlags:
  - actions:
      - restrict-vendor-to-station
      - block-vendor-to-field
      - pin-rtu-to-field
      - modbus-dpi
      - iec104-dpi
      - station-architecture-review
      - positive-validation
    severity: warn
    source: ot-eng-availability
    sourceLabel: OT engineering capacity
    verdict: STRETCHED
    message: OT Engineer marked STRETCHED — expect this to take longer than the budget shows.
  - actions:
      - restrict-vendor-to-station
      - block-vendor-to-field
      - pin-rtu-to-field
      - modbus-dpi
      - iec104-dpi
      - station-architecture-review
      - positive-validation
    severity: blocked
    source: ot-eng-availability
    sourceLabel: OT engineering capacity
    verdict: UNAVAILABLE
    message: OT Engineer marked UNAVAILABLE — this action can't ship without OT review.
  - actions:
      - modbus-dpi
      - iec104-dpi
    severity: warn
    source: fw-admin-skills
    sourceLabel: Firewall admin skills
    verdict: VENDOR_LED
    message: Firewall admin skills are vendor-led — DPI tuning will need vendor cycles, not just internal time.
  - actions:
      - block-enterprise-to-field
      - block-enterprise-to-station
      - restrict-vendor-to-station
      - block-vendor-to-field
      - pin-rtu-to-field
      - tighten-firewall-objects
    severity: warn
    source: fw-admin-skills
    sourceLabel: Firewall admin skills
    verdict: GAP
    message: Firewall admin skills marked GAP — basic policy work needs hiring or training to land cleanly.
  - actions:
      - modbus-dpi
      - iec104-dpi
    severity: blocked
    source: fw-admin-skills
    sourceLabel: Firewall admin skills
    verdict: GAP
    message: Firewall admin skills marked GAP — DPI tuning can't ship without hiring or training first.
  - actions:
      - restrict-vendor-to-station
      - block-vendor-to-field
    severity: warn
    source: vendor-change-window
    sourceLabel: Vendor change windows
    verdict: NEGOTIATING
    message: Vendor change window NEGOTIATING — schedule slip is likely.
  - actions:
      - restrict-vendor-to-station
      - block-vendor-to-field
    severity: blocked
    source: vendor-change-window
    sourceLabel: Vendor change windows
    verdict: NOT_DISCUSSED
    message: Vendor change window NOT_DISCUSSED — this action can't ship until that conversation happens.
  - actions:
      - block-enterprise-to-field
      - block-enterprise-to-station
      - block-vendor-to-field
      - pin-rtu-to-field
    severity: warn
    source: risk-acceptance-authority
    sourceLabel: Risk-acceptance authority
    verdict: UNCLEAR
    message: Risk-acceptance authority UNCLEAR — get the signoff path nailed down before applying this rule.
  - actions:
      - block-enterprise-to-field
      - block-enterprise-to-station
      - block-vendor-to-field
      - pin-rtu-to-field
    severity: blocked
    source: risk-acceptance-authority
    sourceLabel: Risk-acceptance authority
    verdict: DISPUTED
    message: Risk-acceptance authority DISPUTED — denying production flows without a clear signoff path is unsafe.
