        proto: TCP
        port: '2404'
        action: ALLOW
        purpose: Allow the named Control Centre to open IEC104 sessions to the RTU
        ics:
          protocol: iec104
          readOnly: true
          mode: enforce
    effect: semantic
  improve-logging:
    title: improve logging
    description: EU segmentation planning example
    rules: []
    effect: logging
  station-architecture-review:
    title: station architecture review
    description: EU segmentation planning example
    rules: []
    effect: conceptual
  tighten-firewall-objects:
