  modbus-dpi:
    title: modbus dpi
    description: EU segmentation planning example
    rules:
      - id: rtu-to-feeder-modbus
        source: ${ip:rtu-1}/32
        destination: ${ip:breaker-1}/32, ${ip:f2-breaker}/32, ${ip:rmu-1}/32, ${ip:rmu-2}/32, ${ip:oltc-1}/32
        proto: TCP
        port: '502'
        action: ALLOW
        purpose: Allow the named RTU to poll both breakers, RMUs and OLTC and control the existing command targets over Modbus TCP
        ics:
          protocol: modbus
          functionCode:
            - 3
            - 4
            - 6
            - 16
    effect: semantic
  iec104-dpi:
    title: iec104 dpi
    description: EU segmentation planning example
    rules:
      - id: control-centre-to-rtu-iec104
