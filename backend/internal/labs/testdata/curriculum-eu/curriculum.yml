policy:
  - rule:
      id: control-centre-to-rtu-iec104
      description: Allow the named Control Centre to open IEC104 sessions to the RTU
      sourceZones:
        - ${zone:control_centre_net}
      destZones:
        - ${zone:station_net}
      sources:
        - ${ip:cc-1}/32
      destinations:
        - ${ip:rtu-1}/32
      protocols:
        - name: tcp
          port: '2404'
      action: ALLOW
    logging: true
    semantic: iec104-dpi
    predicate:
      protocol: iec104
      readOnly: true
      mode: enforce
  - rule:
      id: rtu-to-feeder-modbus
      description: Allow the named RTU to poll both breakers, RMUs and OLTC and control the existing command targets over Modbus TCP
      sourceZones:
        - ${zone:station_net}
      destZones:
        - ${zone:field_net}
      sources:
        - ${ip:rtu-1}/32
      destinations:
        - ${ip:breaker-1}/32
        - ${ip:f2-breaker}/32
        - ${ip:rmu-1}/32
        - ${ip:rmu-2}/32
        - ${ip:oltc-1}/32
      protocols:
        - name: tcp
          port: '502'
      action: ALLOW
    logging: true
    semantic: modbus-dpi
    predicate:
      protocol: modbus
      functionCode:
        - 3
        - 4
        - 6
        - 16
  - rule:
      id: plc-to-oltc-modbus
