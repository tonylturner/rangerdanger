      destZones:
        - ${zone:ops_dmz_net}
      sources:
        - ${subnet:enterprise_net}
      destinations:
        - ${ip:historian-1}/32
      protocols:
        - name: tcp
          port: '8080'
      action: ALLOW
    logging: true
  - rule:
      id: engineering-to-plc-web
      description: Allow engineering maintenance of the OpenPLC web UI
      sourceZones:
        - ${zone:vendor_net}
      destZones:
        - ${zone:station_net}
      sources:
        - ${ip:eng-ws-1}/32
      destinations:
        - ${ip:plc-1}/32
      protocols:
        - name: tcp
          port: '8080'
      action: ALLOW
    logging: true
  - rule:
      id: deny-block-enterprise-to-field
      description: deny-block-enterprise-to-field
      sourceZones:
        - ${zone:enterprise_net}
      destZones:
        - ${zone:field_net}
      protocols:
        - name: tcp
          port: '502'
