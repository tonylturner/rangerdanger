name: rangerdanger-platform
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.fixture
    container_name: fixture-backend
    environment:
      RANGERDANGER_MODE: source
    networks:
      mgmt_net:
        ipv4_address: 10.99.99.10
networks:
  mgmt_net:
    name: rangerdanger_mgmt_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.99.0/24
          gateway: 10.99.99.1
