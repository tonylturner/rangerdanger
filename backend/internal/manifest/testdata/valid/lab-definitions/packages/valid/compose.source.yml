name: rangerdanger
services:
  firewall:
    container_name: fixture-firewall
    build:
      context: .
      dockerfile: Dockerfile.fixture
    networks:
      mgmt_net:
        ipv4_address: 10.99.99.2
      field_net:
        ipv4_address: 10.40.40.2
    ports:
      - "127.0.0.1:9080:80"
    volumes:
      - ./data/firewall:/data
networks:
  mgmt_net:
    external: true
    name: rangerdanger_mgmt_net
  field_net:
    name: rangerdanger_field_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.40.0/24
          gateway: 10.40.40.1
