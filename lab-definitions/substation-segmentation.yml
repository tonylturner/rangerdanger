id: substation-segmentation
name: Substation Segmentation Validation Lab
description: >
  Electric cooperative distribution substation segmentation lab.
  Students validate and improve network segmentation to protect critical
  substation control functions from enterprise compromise, vendor access
  abuse, and OT east-west lateral movement.

firewall_config: firewall/substation-weak.json

networks:
  - id: enterprise_net
    name: Enterprise Zone
    subnet: 10.10.10.0/24
    zone: wan
    description: Corporate IT environment - lowest trust, common attacker foothold

  - id: vendor_net
    name: Vendor / Engineering Zone
    subnet: 10.20.20.0/24
    zone: dmz
    description: Remote support, contractor access, engineering maintenance

  - id: ot_ops_net
    name: OT Operations Zone
    subnet: 10.30.30.0/24
    zone: lan1
    description: Substation operational services - HMI, RTAC, supervisory control

  - id: field_net
    name: Field Device Zone
    subnet: 10.40.40.0/24
    zone: lan2
    description: Substation and feeder control endpoints - relay, recloser, regulator

nodes:
  # Zone 7: Security Infrastructure
  - id: fw-1
    type: containd_ngfw
    name: Containd Firewall
    container: rangerdanger-firewall
    networks:
      - enterprise_net
      - vendor_net
      - ot_ops_net
      - field_net
    ip: 10.10.10.2

  # Zone 1: Enterprise
  - id: corp-ws-1
    type: corp_workstation
    name: Corporate Workstation
    container: rangerdanger-corp-ws
    networks:
      - enterprise_net
    ip: 10.10.10.10

  # Zone 6: Adversary (in enterprise_net)
  - id: kali-1
    type: kali_pentest
    name: Kali Attacker
    container: rangerdanger-kali
    networks:
      - enterprise_net
    ip: 10.10.10.50

  # Zone 2: Vendor / Engineering
  - id: vendor-jump-1
    type: vendor_jumpbox
    name: Vendor Jump Box
    container: rangerdanger-vendor-jump
    networks:
      - vendor_net
    ip: 10.20.20.10

  - id: eng-ws-1
    type: eng_workstation
    name: Engineering Workstation
    container: rangerdanger-eng-ws
    networks:
      - vendor_net
    ip: 10.20.20.20

  # Zone 3: OT Operations
  - id: hmi-1
    type: fuxa_hmi
    name: Substation HMI
    container: rangerdanger-fuxa-hmi
    networks:
      - ot_ops_net
    ip: 10.30.30.10

  - id: rtac-1
    type: rtac_sim
    name: RTAC / Supervisory Controller
    container: rangerdanger-rtac-sim
    networks:
      - ot_ops_net
      - field_net
    ip: 10.30.30.20

  - id: openplc-1
    type: openplc
    name: Substation Automation PLC
    container: rangerdanger-openplc
    networks:
      - ot_ops_net
    ip: 10.30.30.30

  - id: historian-1
    type: historian_sim
    name: Data Historian
    container: rangerdanger-historian-sim
    networks:
      - ot_ops_net
    ip: 10.30.30.40

  - id: gps-1
    type: gps_sim
    name: GPS Time Server
    container: rangerdanger-gps-sim
    networks:
      - ot_ops_net
    ip: 10.30.30.50

  # Zone 4: Field Devices
  - id: relay-1
    type: relay_sim
    name: Feeder Breaker / Relay
    container: rangerdanger-relay-sim
    networks:
      - field_net
    ip: 10.40.40.20

  - id: recloser-1
    type: recloser_sim
    name: Mid-Feeder Recloser
    container: rangerdanger-recloser-sim
    networks:
      - field_net
    ip: 10.40.40.21

  - id: regulator-1
    type: regulator_sim
    name: Voltage Regulator
    container: rangerdanger-regulator-sim
    networks:
      - field_net
    ip: 10.40.40.22

  - id: capbank-1
    type: capbank_sim
    name: Capacitor Bank
    container: rangerdanger-capbank-sim
    networks:
      - field_net
    ip: 10.40.40.23

# Scenarios are not listed here. The package that owns this topology
# (packages/us-dnp3-substation/package.yml) names its scenarios directory,
# lab-definitions/scenarios/; a non-empty list below is a load error.
# Workshop labs (aligned to the DefendICS slide deck):
#   1.2 baseline-assessment
#   1.3 segmentation-requirements
#   1.4 remediation-planning
#   2.2 firewall-implementation
#   2.3 hardening-configurations
#   2.3-bonus vendor-rdp-compromise (optional)
#   2.4 validation-evidence
scenarios: []

# Package-owned teaching flows; liveness keys are opaque to consumers.
flows:
  - id: rtac-1-relay-1-modbus
    source: rtac-1
    target: relay-1
    protocol: Modbus
    port: 502
    cadence: ~3s
    category: baseline
    liveness_key: rtac-relay
  - id: rtac-1-recloser-1-modbus
    source: rtac-1
    target: recloser-1
    protocol: Modbus
    port: 502
    cadence: ~3s
    category: baseline
    liveness_key: rtac-recloser
  - id: rtac-1-regulator-1-modbus
    source: rtac-1
    target: regulator-1
    protocol: Modbus
    port: 502
    cadence: ~3s
    category: baseline
    liveness_key: rtac-regulator
  - id: rtac-1-relay-1-dnp3
    source: rtac-1
    target: relay-1
    protocol: DNP3
    port: 20000
    cadence: ~5s
    category: baseline
    liveness_key: rtac-relay
  - id: rtac-1-recloser-1-dnp3
    source: rtac-1
    target: recloser-1
    protocol: DNP3
    port: 20000
    cadence: ~5s
    category: baseline
    liveness_key: rtac-recloser
  - id: rtac-1-regulator-1-dnp3
    source: rtac-1
    target: regulator-1
    protocol: DNP3
    port: 20000
    cadence: ~5s
    category: baseline
    liveness_key: rtac-regulator
  - id: gps-1-relay-1-ntp
    source: gps-1
    target: relay-1
    protocol: NTP
    port: 123
    cadence: ~30s
    category: baseline
    liveness_key: gps
  - id: gps-1-recloser-1-ntp
    source: gps-1
    target: recloser-1
    protocol: NTP
    port: 123
    cadence: ~30s
    category: baseline
    liveness_key: gps
  - id: gps-1-regulator-1-ntp
    source: gps-1
    target: regulator-1
    protocol: NTP
    port: 123
    cadence: ~30s
    category: baseline
    liveness_key: gps
  - id: rtac-1-capbank-1-modbus
    source: rtac-1
    target: capbank-1
    protocol: Modbus
    port: 502
    cadence: ~3s
    category: baseline
    liveness_key: rtac-capbank
  - id: rtac-1-capbank-1-dnp3
    source: rtac-1
    target: capbank-1
    protocol: DNP3
    port: 20000
    cadence: ~5s
    category: baseline
    liveness_key: rtac-capbank
  - id: gps-1-capbank-1-ntp
    source: gps-1
