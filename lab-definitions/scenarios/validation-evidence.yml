id: validation-evidence
order: "2.4"
name: "Testing & Validation"
summary: "Generate a change-board validation report (authorized/unauthorized tests + PCAP) against the policy you have active, then reflect on residual risk."
estimated_minutes: 7
validator: us-validation-evidence
description: >
  After applying your plan or the Hardened reference in Lab 2.2 and
  stress-testing it in Lab 2.3, this exercise builds the formal
  evidence package: positive tests confirming authorized flows still
  work, tests comparing unauthorized flows with the applied plan and Hardened, and
  PCAP evidence from the firewall. You generate it in one click against
  the policy you have active - then read it like a reviewer would. This
  is the validation step required before any segmentation change goes to
  production.
nodes:
  - kali-1
  - vendor-jump-1
  - eng-ws-1
  - rtac-1
  - fw-1
  - historian-1
tags:
  - validation
  - testing
  - pcap
  - evidence
  - defense
steps:
  - id: confirm-hardened-config-is-active
    title: "Confirm hardened config is active"
    expected_config: hardened
    description: |
      You're now validating the work you did across Labs 1.2 → 2.3. Below is the design + plan you committed; this validation pass tests whether the firewall enforces what you specified.

      :::findings-panel from=segmentation-requirements title="Your design verdicts (Lab 1.3)"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Unauthorized Modbus writes / DNP3 Direct Operate
      :::

      Confirm the intended applied plan in the policy banner. Keep its exported plan
      record with package revision, action IDs and policy hash. Do not replace a partial plan with
      Hardened just to make the report green. Apply Hardened only when you intend
      to test the reference. A saved browser plan is not an applied plan.

      :::findings-panel from=firewall-implementation title="Your evidence status (Lab 2.2)"
      evidence-policy: Running policy export and identity
      evidence-positive: Positive tests and operational continuity
      evidence-negative: Negative tests and deferred exposures
      evidence-capture: PCAP tied to the test window
      :::

      These are your earlier evidence statuses, not current proof. Resolve missing or
      unclear items and regenerate the report for this policy commit.

      Named and manual policies use Hardened expectations. Their plan proof is
      not applicable. Check the running policy before generating the report.

      :::hint Optional: cross-check the running policy in containd
      Confirm the running policy from
      either interface:

      - **Web UI:** [http://localhost:9080](http://localhost:9080),
        Configuration → Running config shows committed policy.
        Firewall Rules edits and its Default row describe the candidate;
        applied counters are separate evidence, not candidate activation.
        Log in with `containd` / `containd` if the session has expired.
      - **CLI:** the `fw-1` terminal opens in the configuration CLI; run:

            show running-config

      For Hardened, expect this rule set: RTAC source-pinned to
      field, vendor restricted to SSH/HTTPS, enterprise-to-field
      removed, default deny on cross-zone. For a plan, also expect the compiled
      deferred Weak allows for actions you did not select.
      :::

      **Time budget:** ~7 minutes (Guided path - one-click report plus reflection. The by-hand Advanced verification hints are optional).
    action:
      type: check
      expect:
        firewall_config: improved

  - id: generate-the-validation-report
    title: "Generate the validation report"
    expected_config: hardened
    description: |
      Generate the full **21-row TCP matrix** against the active policy.
      The report has two independent results:

      - **Plan proof** checks observed allow/deny results against this applied plan.
        It requires 0 skipped and the recorded plan hash before and after probing.
      - **Hardened acceptance** requires authorized **8/8** and unauthorized denied
        **13/13**, 0 skipped, a stable running hash and capture evidence. Confirm a
        healthy HMI separately. Acceptance does not prove command-level filtering.

      A partial plan can pass plan proof and fail Hardened acceptance. Read the
      prevention gaps by row ID. Deferred controls keep their Weak exposures open;
      that expected consequence is not a reason to hide a row or change the target.
      A named or manual policy has no applicable plan proof; use Hardened acceptance.

      :::validation-report
      :::

      Completion uses the backend-retained result for the judging target, full running firewall hash and probe UTC window from this range and latest policy commit. The running policy is read before and after probing; a change or unreadable hash fails the report. Reapplying even the same policy invalidates the previous commit window: generate again. The backend retains the latest generated report until range/backend restart. Use **Download markdown** to save the report, and copy the PCAP at the report's path (relative to the install root) out of the captures folder before any reset or shutdown; reset deletes captures. A local screenshot or old browser report cannot substitute for the retained proof.

      Only a connection timeout counts as deny. Connection refused means reached
      (allow). Tool or container errors are skipped evidence, never a pass.
      The matrix tests TCP connectivity, not DNP3 function-code rejection.
      The L4 source pin enforces; DPI detects and logs.

      Keep the report, UTC window, policy hash and PCAP with the plan's package
      revision and action IDs. Inspect sources against Plan and Hardened results;
      a captured ingress SYN alone does not prove that traffic reached a device.

      At the HMI, require no alarms, closed breaker/recloser, auto-reclose on and
      energized loads. Restoration and operational checks apply to every plan.
      Validate Exercise does not replace report evidence.

      :::decision id=pos-test-ops-intact options=NORMAL_OPS,DEGRADED,ALARMS_PRESENT
      Are operations healthy after validation?
      :::why
      NORMAL_OPS needs healthy operator observations and independent device/process continuity, not only open TCP ports. DEGRADED or ALARMS_PRESENT needs investigation and restoration; the dropdown records your run and is not an acceptance test.
      :::

      :::decision id=neg-test-no-impact options=UNCHANGED,DEGRADED,UNCLEAR
      Did operations remain unchanged? Compare this result with the validation report and structured plan coverage.
      :::why
      UNCHANGED needs before/after operational evidence alongside the report. DEGRADED means investigate impact; UNCLEAR means collect a comparable baseline. A timeout alone does not establish that operations were unaffected.
      :::

      :::hint Advanced: run the positive tests by hand
      The report automates this, but the manual method is what you'd do on a
      real appliance. From the **RTAC** terminal, confirm authorized flows:

          mbpoll -a 1 -r 1 -c 4 -1 -t 0 10.40.40.20
          dnp3poll -a 1 -t 3s 10.40.40.20:20000
          dnp3poll -a 2 -t 3s 10.40.40.21:20000
          dnp3poll -a 3 -t 3s 10.40.40.22:20000

      All should return data. Then intra-zone HMI → RTAC, and the RTAC's
      aggregated field-comms view:

          curl -s http://10.30.30.20:8080/api/health
          curl -s http://10.30.30.20:8080/api/state | python3 -m json.tool

      `device_comms` should be `true` for every field device. From
      **vendor-jump** (`10.20.20.10`), the hardened policy keeps SSH/HTTPS
      open for vendor monitoring (but blocks Modbus/DNP3):

          ssh -o StrictHostKeyChecking=no rangerdanger@10.30.30.20 'hostname'
          curl -ks https://10.30.30.20/ -o /dev/null -w '%{http_code}\n'

      A banner or HTTP response confirms application access. A refusal means
      the port was reached but no service accepted it; it is not a deny.
      These two management ports stay allowed for every plan. They do not
      prove that the other vendor paths closed. Use the full TCP matrix too.
      :::

      :::hint Advanced: run the negative tests by hand
      Use `-Pn` to skip host discovery across the firewall. A filtered TCP
      port (with an open-port control under Weak baseline) proves denial;
      "host seems down" or "0 hosts up" does not.

      From **Kali** (`10.10.10.50`, enterprise) - lead with DNP3, the primary
      attack vector from Lab 2.3:

          nmap -Pn -p 20000 10.40.40.20 --max-retries 1 -T4
          dnp3poll -a 1 -t 3s 10.40.40.20:20000

      From **vendor-jump** (`10.20.20.10`) - the vendor-pivot path (Lab
      2.3-bonus):

          nmap -Pn -p 20000 10.40.40.21 --max-retries 1 -T4
          dnp3poll -a 2 -t 3s 10.40.40.21:20000

      From **historian** (a single-homed non-RTAC OT host) - the source-pin
      test: only the RTAC may reach field, even from inside OT Ops:

          nmap -Pn -p 20000 10.40.40.22 --max-retries 1 -T4

      Under Hardened, all should be filtered / time out. For an applied plan,
      compare each path with its owning action: enterprise-to-field,
      vendor-to-field or non-RTAC OT-to-field. Deferred paths remain reachable. The same L4 source-pin closes Modbus
      too - repeat with port 502 and `mbpoll` for a two-protocol package.
      Any single-homed OT host (historian-sim, fuxa-hmi, openplc) works as
      the probe source.
      :::

      :::hint Advanced: capture PCAP by hand
      The report captures this automatically; the manual form, from the
      `fw-1` terminal, captures on `lan2`, the firewall's field-zone
      interface:

      In the configuration CLI, type `exit` before these Linux commands.
      RangerDanger then starts bash; use `containd cli` to return.

          tcpdump -i lan2 -nn 'tcp port 502 or tcp port 20000' -w /data/captures/validation.pcap

      Let it run ~30s while the RTAC polls, Ctrl-C, then see who's on the
      wire:

          tcpdump -r /data/captures/validation.pcap -nn | awk '{ s = $3; d = $5; sub(/\.[0-9]+$/, "", s); sub(/\.[0-9]+:$/, "", d); print s, "->", d }' | sort | uniq -c | sort -rn

      `lan2` records each packet once, as it enters or leaves the field
      zone. The `awk` strips the ports, so each line counts packets from
      one host to another.

      Under Hardened, the only Modbus/DNP3 source reaching field should be
      `10.30.30.20` (the RTAC). For a partial plan, compare additional
      sources with deferred exposures; preserve the prevention gaps.
      :::

      :::hint Advanced: assemble the evidence package by hand
      Beyond the test results + PCAP, a change board wants the policy itself
      and proof it's the one running. From the `fw-1` terminal:

      If still in bash after the capture, type `containd cli` to return
      to the configuration CLI before these appliance commands.

          export config
          show audit

      Copy that redacted running JSON to your evidence document; the appliance
      CLI does not create a file through redirection. Full export requires
      explicit administrator intent.

      `export config` is the change-board-ready record of the running rule
      set; the recent `config.commit` entries in `show audit` prove the
      policy you attached is the policy that's loaded. Add an **HMI
      screenshot** (Feeder One-Line, no alarms, customers served) for the
      operational side. Per-rule deny events for each blocked probe are in
      the [/console](/console) Segmentation drawer's **Live Firewall Events**
      strip - correlate each event with its tuple and time. A detection record alone
      is not proof of prevention.
      :::
    action:
      type: check
      expect:
        firewall_config: improved
        breaker_closed: true

  - id: reflection-what-did-your-plan-close
    title: "Reflection - what did your plan close?"
    description: |
      Before wrapping up, review what your plan addressed vs deferred.

      Below are the design verdicts and findings you committed across the planning labs. The Plan Coverage panel in [Lab 1.4](/exercises/remediation-planning) shows, in real-time, which of these your selected actions implement and which remain gaps. Use that as the structured input to your reflection.

      :::findings-panel from=baseline-assessment title="What you observed (Lab 1.2 step 6)"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Unauthorized Modbus writes / DNP3 Direct Operate
      :::

      :::findings-panel from=baseline-assessment title="What active probing revealed (Lab 1.2 step 7)"
      latent-exposure-confirmed: Latent exposure beyond passive observation
      :::

      :::findings-panel from=segmentation-requirements title="What you committed to as design (Lab 1.3)"
      enterprise-to-field: Enterprise → Field
      enterprise-to-ot: Enterprise → OT Operations
      vendor-to-ot: Vendor DMZ → OT Operations
      non-rtac-to-field: Non-RTAC OT hosts → Field
      unauth-modbus-writes: Unauthorized Modbus writes / DNP3 Direct Operate
      :::

      ### Other observations from Lab 2.2 / 2.3

      - **Firewall visibility blind spot at the RTAC.** The RTAC is multi-homed (it polls field devices over DNP3/Modbus) but its application traffic is routed through containd by preinstalled host-level hardening. The **Validate and document RTAC hardening** action plans a review; it installs no control. Worth noting as a compensating control on your evidence package, not a network-layer enforcement. The RTAC is the *only* host with a leg in field_net - every other OT host is single-homed on ot_ops_net.
      - **No protocol-aware constraints by default.** L4 port filtering does not distinguish reads from writes. The **Apply Modbus ICS DPI - provide function-code visibility** and **Apply DNP3 ICS DPI - detect and log Direct Operate writes** actions add visibility only. The L4 source pin enforces; DPI detects and logs.

      ### Review the structured plan coverage

      :::plan-coverage title="Coverage of your committed Lab 1.3 design"
      :::

      The panel above is computed live from your Lab 1.4 selections. Each requirement is marked **fully addressed**, **partial**, **deferred** (gap), or **n/a** (you marked the verdict as ALLOW or didn't commit one). Use the panel and report together; the design verdicts and funded/deferred actions already carry forward as structured inputs.

      ### Now reflect

      In your Exercise Notes, discuss the validation evidence:

      1. Which positive or negative test result most changed your confidence in the running policy?
      2. What does the report prove, and what remains outside its scope?
      3. What evidence, operational owner or retest is needed before this change could be approved?
      4. What additional architecture or monitoring control would reduce a visibility blind spot?

      These discussion notes add context to the report; they do not replace its evidence or repeat the structured plan inputs.
