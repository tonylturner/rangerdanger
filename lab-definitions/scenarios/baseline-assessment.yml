id: baseline-assessment
order: "1.2"
name: "Baseline Traffic Analysis"
summary: "Capture cross-zone traffic at the firewall, identify the critical conduits your operations depend on, and define what good segmentation would look like."
estimated_minutes: 20
validator: us-baseline-assessment
description: >
  Before you can segment a substation network, you need to
  understand two things: what traffic actually exists between
  zones, and which of those flows are required for normal
  operations. In this exercise you'll capture live traffic at
  the firewall, use it to identify the critical conduits
  operations depends on, and frame concrete success criteria
  for segmentation - without building diagrams or matrices.
nodes:
  - fw-1
  - eng-ws-1
  - kali-1
  - rtac-1
tags:
  - assessment
  - pcap
  - baseline
  - defense
steps:
  - id: walk-the-topology-and-inspect-the-crossings
    title: "Walk the topology and inspect the crossings"
    expected_config: weak
    description: |
      Open the [Network Map](/console) and identify the four zones:

      | Zone | Subnet | Hosts you should see |
      |------|--------|----------------------|
      | **Enterprise** | `10.10.10.0/24` | corp-ws, kali |
      | **Vendor / DMZ** | `10.20.20.0/24` | vendor-jump, eng-ws |
      | **OT Ops** | `10.30.30.0/24` | fuxa-hmi, rtac, openplc, historian, gps |
      | **Field** | `10.40.40.0/24` | relay, recloser, regulator, capbank |

      The **containd firewall** is the gateway between zones. Toggle **Purdue Model View** to relate them to architectural levels:

      - **Level 4 · Enterprise** - corporate IT (`10.10.10.0/24`)
      - **Level 3.5 · IDMZ** - vendor / engineering (`10.20.20.0/24`)
      - **Level 3 · Supervisory** - HMI / RTAC / historian (`10.30.30.0/24`)
      - **Level 1 · Field Devices** - relays / recloser / regulator / capbank (`10.40.40.0/24`)

      Open Segmentation Policy and inspect these crossings. Policy rows show configured permission, not observed traffic; active probes test reachability.

      1. **Enterprise → Field** (`10.10.10.0/24` → `10.40.40.0/24`)
      2. **Vendor → OT Ops** (`10.20.20.0/24` → `10.30.30.0/24`)
      3. **OT Ops → Field** (`10.30.30.0/24` → `10.40.40.0/24`)

      The RTAC (`10.30.30.20`) is the central OT Ops-to-Field control node.

      :::decision id=zones-located options=ALL_FOUR,SOME_MISSING,COULDNT_FIND correct=ALL_FOUR
      Did you locate all four zones on the canvas?
      :::why
      All four boundaries are visible on the map; recognizing the zones helps place each cross-zone flow.
      :::

      :::decision id=ent-to-field-protocols options=NO_ICS,MODBUS_OR_DNP3,UNCLEAR correct=MODBUS_OR_DNP3
      Enterprise → Field — which protocols does the policy permit?
      :::why
      The Weak Baseline permits Modbus and DNP3 between Enterprise and Field; the policy row is permission, not observed traffic.
      :::

      :::decision id=ot-to-field-protocols options=MODBUS_OR_DNP3,HTTP_ONLY,NOTHING correct=MODBUS_OR_DNP3
      OT Ops → Field — which protocols does the policy permit?
      :::why
      The Weak Baseline permits the RTAC-to-field control protocols on this crossing.
      :::

      **Time budget:** ~20 minutes (Guided path; the Advanced analyst hints are optional extras on top).
    action:
      type: check
      expect:
        breaker_closed: true

  - id: generate-scenario-traffic
    title: "Generate scenario traffic"
    description: |
      The **autonomous baseline** runs continuously: RTAC polling field devices by Modbus/DNP3, GPS sending relay NTP, and HMI/historian reads from the RTAC. The generator adds engineering/vendor scenario activity, not 24×7 operations.

      :::generate-traffic-button
      :::

      Leave it running during capture. In the Network Map's **Traffic Matrix**, compare RTAC→Field polling, same-zone HMI/historian traffic, and generated Vendor→OT flows.

      :::decision id=matrix-rtac-to-field options=ACTIVE,QUIET,NOT_SEEN correct=ACTIVE
      RTAC↔field-device traffic in the Traffic Matrix — how active is it?
      :::why
      The autonomous RTAC pollers continuously contact field devices, so this path should be active.
      :::

      :::decision id=matrix-enterprise-to-ot-visible options=YES_VISIBLE,NO_NOT_SEEN,UNCLEAR correct=NO_NOT_SEEN
      Did you see Enterprise traffic reaching OT or Field? The generator creates Vendor flows; Enterprise reachability is tested later from Kali.
      :::why
      The generator creates vendor activity, not Enterprise control probes. Those paths are tested later from Kali.
      :::

  - id: capture-traffic-at-the-firewall
    title: "Capture traffic at the firewall"
    node: fw-1
    description: |
      Open **fw-1** from Show terminal or the [Network Map](/console). The configuration CLI opens first. Type `exit` to leave it for bash; use `containd cli` to return. Leaving the CLI does not commit or discard pending edits.

      | Prompt | What you can run | How you got here |
      |---|---|---|
      | Configuration CLI | `show *`, `set *`, `commit`, `export config` - appliance commands | Default; opens here |
      | Linux shell (bash) | `tcpdump`, `nft`, `ip`, generic Linux - acts immediately | Type `exit` from the configuration CLI |

      Start a 60-second capture across all interfaces from bash:

        tcpdump -i any -w /data/captures/baseline.pcap -G 60 -W 1 'not host 127.0.0.1'

      Wait for tcpdump to finish and report its packet count. The one-file limit message is the expected end of capture; check that the kernel dropped no packets.

      > This filter excludes loopback only. `-i any` also sees management traffic on `10.99.99.0/24`; ignore it when inventorying teaching conduits. An ingress packet alone does not prove forwarding.

  - id: analyze-cross-zone-flows
    title: "Analyze cross-zone flows"
    node: eng-ws-1
    description: |
      Analysis happens on the **engineering workstation**. The firewall PCAP is mounted read-only at `/home/abc/pcaps/baseline.pcap`.

      Check the PCAP, then build the source/destination view and protocol counts:

          ls -lh /home/abc/pcaps/baseline.pcap
          tshark -r /home/abc/pcaps/baseline.pcap 2>/dev/null | wc -l
          tshark -r /home/abc/pcaps/baseline.pcap -q -z conv,ip 2>/dev/null
          tshark -r /home/abc/pcaps/baseline.pcap -q -z io,stat,0,"tcp.port==20000","tcp.port==502","tcp.port==8080","tcp.port==1881","udp.port==123" 2>/dev/null
          tshark -r /home/abc/pcaps/baseline.pcap -Y 'ip.src==10.20.20.0/24 and ip.dst==10.30.30.0/24' 2>/dev/null | head -15
          tshark -r /home/abc/pcaps/baseline.pcap -Y 'ip.src==10.10.10.0/24 and (ip.dst==10.30.30.0/24 or ip.dst==10.40.40.0/24)' 2>/dev/null

      An empty result means **not observed in this window**, not denied. The RTAC state API also shows field devices it contacts; HMI and historian traffic to the RTAC stays inside OT Ops and is invisible at the firewall:

          tshark -r /home/abc/pcaps/baseline.pcap -q -z conv,tcp 2>/dev/null | head -20
          tshark -r /home/abc/pcaps/baseline.pcap -Y 'ip.src==10.30.30.0/24 and ip.dst==10.40.40.0/24' 2>/dev/null | head -15
          tshark -r /home/abc/pcaps/baseline.pcap -Y 'tcp.port==20000' 2>/dev/null | head -10
          tshark -r /home/abc/pcaps/baseline.pcap -Y 'tcp.port==502' 2>/dev/null | head -10
          tshark -r /home/abc/pcaps/baseline.pcap -Y 'ip.src==10.30.30.20' 2>/dev/null | head -20
          curl -s http://10.30.30.20:8080/api/state | python3 -m json.tool | head -40

      Use the next step to distinguish required cross-zone flows from same-zone dependencies.
  - id: critical-conduits-what-must-flow
    title: "Critical conduits - what MUST flow"
    description: |
      Use the capture and RTAC state output to distinguish required cross-zone flows from scenario traffic and same-zone dependencies.

      | Flow | Source → destination | Protocol | Role |
      |---|---|---|---|
      | **A. GPS → field NTP** | `10.30.30.50` → `10.40.40.{20,21,22,23}` | UDP 123 | **Preserve** |
      | **B. Eng-ws → RTAC** | `10.20.20.20` → `10.30.30.20` | HTTP 8080 | **Blocked by reference** |
      | **C. Eng-ws → OpenPLC** | `10.20.20.20` → `10.30.30.30` | HTTP 8080 | **Blocked by reference** |
      | **D. Vendor-jump → HMI** | `10.20.20.10` → `10.30.30.10` | FUXA 1881 | **Blocked by reference** |
      | **E. RTAC → field DNP3** | `10.30.30.20` → `10.40.40.{20,21,22,23}` | TCP 20000 | **Preserve** |
      | **E. RTAC → field Modbus** | `10.30.30.20` → `10.40.40.{20,21,22,23}` | TCP 502 | **Preserve** |
      | **F. HMI → RTAC** | `10.30.30.10` → `10.30.30.20` | Modbus 502 | **Preserve** |
      | **G. Historian → RTAC** | `10.30.30.40` → `10.30.30.20` | HTTP 8080 | **Preserve** |

      The reference preserves A/E and F/G; B/C/D are scenario maintenance examples, not required for normal operation in this version.

      :::decision id=required-cross-zone-conduits options=AUTONOMOUS_BASELINE_ONLY,EVERY_OBSERVED_FLOW,RTAC_FIELD_ONLY correct=AUTONOMOUS_BASELINE_ONLY
      Which cross-zone flows must remain available for normal operation?
      :::why
      The autonomous cross-zone baseline is GPS→field NTP and RTAC→field DNP3/Modbus. Engineering and vendor maintenance examples B/C/D are not part of this reference's required set.
      :::

      :::decision id=intra-zone-dependencies options=HMI_AND_HISTORIAN_TO_RTAC,RTAC_TO_FIELD,ENTERPRISE_TO_OT correct=HMI_AND_HISTORIAN_TO_RTAC
      Which important relationship is absent from the firewall capture because it stays within one subnet?
      :::why
      HMI and historian both communicate with the RTAC inside OT Ops, so those dependencies do not cross the firewall.
      :::

      :::decision id=continuity-with-minimal-conduits options=YES_REQUIRED_CROSS_ZONE_PLUS_INTRAZONE,NO_ALL_WEAK_FLOWS,YES_RTAC_ONLY correct=YES_REQUIRED_CROSS_ZONE_PLUS_INTRAZONE
      Would the feeder remain operational if only the required cross-zone flows were allowed?
      :::why
      Yes, if A/E and the same-zone HMI/historian dependencies F/G remain healthy. The scenario-driven maintenance examples are not required for this baseline.
      :::
  - id: findings-what-you-observed
    title: "Findings - what you observed"
    description: |
      Record what appeared in the passive capture, not what you want to block. The design verdicts come in Lab 1.3.

      :::decision id=enterprise-to-field options=EXPOSURE_OBSERVED,LIKELY_OK,NOT_OBSERVED correct=NOT_OBSERVED
      Enterprise → Field on Modbus/DNP3 — what did the passive capture show?
      :::why
      NOT_OBSERVED in the prescribed read-only capture: the generator and autonomous baseline do not originate Enterprise control traffic. Absence does not prove denial.
      :::

      :::decision id=enterprise-to-ot options=EXPOSURE_OBSERVED,LIKELY_OK,NOT_OBSERVED correct=NOT_OBSERVED
      Enterprise → OT Operations on ICS ports — what did the passive capture show?
      :::why
      NOT_OBSERVED in the prescribed read-only capture; active probing tests whether the weak policy still allows this path.
      :::

      :::decision id=vendor-to-ot options=EXPOSURE_OBSERVED,LIKELY_OK,NOT_OBSERVED
      Vendor DMZ → OT Operations on Modbus/HMI control — what did the passive capture show?
      :::why
      This finding depends on whether the capture window overlaps vendor or engineering probes. Record the observed result; an empty window does not prove denial.
      :::

      :::decision id=non-rtac-to-field options=EXPOSURE_OBSERVED,LIKELY_OK,NOT_OBSERVED correct=NOT_OBSERVED
      Non-RTAC OT hosts → Field devices — what did the passive capture show?
      :::why
      NOT_OBSERVED: only the RTAC polls field devices in the autonomous baseline. This says what was used, not what the policy permits.
      :::

      :::decision id=unauth-modbus-writes options=EXPOSURE_OBSERVED,LIKELY_OK,NOT_OBSERVED correct=NOT_OBSERVED
      Foreign-source Modbus writes / DNP3 Direct Operate — what did the passive capture show?
      :::why
      NOT_OBSERVED in the read-only capture: it sends reads and HTTP requests, not unauthorized writes or Direct Operate commands. Reachability alone is not evidence of a write.
      :::
  - id: probe-for-latent-exposure
    title: "Probe for latent exposure"
    expected_config: weak
    node: kali-1
    description: |
      Four of your passive findings may be `NOT_OBSERVED`, or all five if the capture missed Vendor→OT. That does not prove denial. From Kali, use `-Pn` to skip host discovery and test whether dormant Enterprise paths are reachable:

          nmap -Pn -p 502,8080,20000 10.40.40.20 --max-retries 1 -T4

          mbpoll -a 1 -r 1 -c 4 -1 -t 0 10.40.40.20

          dnp3poll -a 2 -t 3s 10.40.40.21:20000

          nmap -Pn -p 502,8080,20000 10.30.30.20 --max-retries 1 -T4

          nmap -Pn -p 1881 10.30.30.10 --max-retries 1 -T4

      Weak permits these paths. A successful protocol read proves reachability, not command authority or an observed write.

      :::decision id=latent-exposure-confirmed options=YES,NO,UNSURE correct=YES
      **After running the active probes, did you confirm exposure that the passive capture missed?**
      :::why
      The Weak Baseline permits the probed paths. Active reachability can exist even when a passive capture did not show it.
      :::

    action:
      type: probe
      targets:
        - { host: 10.40.40.20, port: 502, note: "Kali Modbus to relay" }
        - { host: 10.40.40.21, port: 20000, note: "Kali DNP3 to recloser" }
        - { host: 10.30.30.20, port: 502, note: "Kali Modbus to RTAC" }

  - id: transition-decide-what-to-fix-first
    title: "Transition - decide what to fix first"
    description: |
      Confirm the substation is still operating normally; this is the **known-good** state your segmentation must preserve. Your passive findings, active reachability and reviewed criteria now feed design verdicts in [Lab 1.3](/exercises/segmentation-requirements), then funded changes in Lab 1.4. Deferred exposure remains risk, not a completed control.
    action:
      type: check
      expect:
        breaker_closed: true
        recloser_closed: true
        reclose_enabled: true
