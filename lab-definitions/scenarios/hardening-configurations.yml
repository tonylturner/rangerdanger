id: hardening-configurations
order: "2.3"
name: "Protocol-Hardened Configurations"
summary: "Stress-test your firewall against the canonical distribution-substation attack: a DNP3 Direct Operate injection that disables auto-reclose and trips the recloser from an unauthorized source. The lesson: on this build the L4 source pin is what enforces, so verify enforcement by device state, not by policy labels. Modbus FC5/FC6 variants available as optional bonus attacks."
estimated_minutes: 10
description: >
  Stress-test the policy you built in Lab 2.2 against the canonical
  distribution-substation attack: a DNP3 Direct Operate (FC05) injection
  from Kali that disables the recloser's auto-reclose and trips it,
  turning a brief flicker into a sustained downstream outage. You'll run
  the attack under the weak baseline (it succeeds), then under the
  hardened policy (it's blocked by the L4 source pin, the control that
  enforces on this build; the ICS DPI layer records the attempt). The
  lesson: verify enforcement by device state, not by policy labels.
  Optional Modbus FC5/FC6 bonus attacks in the same step are closed by
  the same source pin.
nodes:
  - kali-1
  - rtac-1
tags:
  - dpi
  - dnp3
  - segmentation
  - hardening
  - modbus
steps:
  - title: "Verify normal operations"
    expected_config: weak
    node: rtac-1
    description: |
      Confirm the substation is healthy under the weak baseline:

      - Breaker closed, recloser closed, auto-reclose enabled
      - Regulator in auto, tap near 0
      - Critical-load voltage in ANSI C84.1 Range A (114–126V)

      Read the RTAC's aggregated state via Modbus from the RTAC's own
      terminal. The RTAC re-exposes every field device's state as a
      unified Modbus holding-register view, so a single read captures
      the whole substation:

      These reads poll continuously so you can watch updates. Use Ctrl-C
      after recording the values, before running the next command.

          mbpoll -a 1 -t 4 -r 1 -c 5 10.30.30.20

      Expected: `[0]=1` (breaker closed), `[1]=1` (recloser closed),
      `[2]=1` (auto-reclose enabled), `[3]≈0` (regulator tap),
      `[4]=0` (regulator auto mode).

          mbpoll -a 1 -t 3 -r 1 -c 6 10.30.30.20

      Analog measurements (FC4, x10 scaling): `[0]≈1200` (substation
      bus 120V), `[1]≈1200` (downstream 120V), `[2]≈1240`
      (critical-load 124V), `[3]≈360` (feeder current 36A).

      :::hint Cyber → state → physics has a ~2–3s lag
      Every protocol write you'll send mutates the field-device sim's
      state immediately, but the *electrical* impact (voltages,
      energization, feeder currents) only updates after the RTAC
      polls field devices (every 2 seconds) and pushes the
      aggregated state to the OpenDSS solver. If you read RTAC tags
      *immediately* after an attack, you may see the device state
      change but not the kinetic outcome yet. Wait 3 seconds, then
      re-read.
      :::

      **Time budget:** ~10 minutes (Guided path - the primary DNP3 attack and re-test. The optional Modbus bonus attacks and the No-Ack evasion hint are extra).
    action:
      type: check
      expect:
        breaker_closed: true
        recloser_closed: true
        reclose_enabled: true
        voltage_normal: true

  - title: "Attack - DNP3 Direct Operate injection against the recloser"
    expected_config: weak
    node: kali-1
    description: |
      > **Tip:** click **Show terminal** (top right) to run these from an
      > embedded shell on the **Kali** box, or use the **copy** button on each
      > command block and paste into your own terminal.

      From Kali (`10.10.10.50`, enterprise zone), under the weak
      baseline, send a DNP3 Direct Operate (FC05) to the recloser
      (`10.40.40.21`, DNP3 outstation address 2). Two CROB writes:
      first disable auto-reclose, then trip the recloser. Without
      auto-reclose, the trip becomes a sustained outage instead of
      a recoverable flicker.

      The CROB (Control Relay Output Block) targets binary outputs.
      Index 1 on the recloser maps to `reclose_enabled`. Index 0
      maps to `closed`:

          dnp3cmd 10.40.40.21:20000 -a 2 crob 1 latch-off
          dnp3cmd 10.40.40.21:20000 -a 2 crob 0 trip

      > **Background:** CROB (Control Relay Output Block) is DNP3's
      > primary command verb - see [DNP3 in Substations](/knowledge#dnp3)
      > if op codes like `latch-off` and `trip` are new. It also
      > covers why Direct Operate (FC05) is the function code that
      > matters for write restrictions, and why every modern
      > recloser controller (G&W, S&C, NOJA, Cooper, ABB) exposes a
      > DNP3 outstation like this one. The defense-in-depth pattern
      > the next steps demonstrate is covered in
      > [What is ICS DPI?](/knowledge#ics-dpi).

      Wait ~3 seconds for the RTAC's 2-second poll → OpenDSS push to
      land, then confirm the downstream de-energization from the
      RTAC's terminal:

          mbpoll -a 1 -t 4 -r 1 -c 5 10.30.30.20

      Holding register 1 reads `0` (recloser_closed=false) and
      register 2 reads `0` (reclose_enabled=false).

          mbpoll -a 1 -t 3 -r 1 -c 6 10.30.30.20

      Input register 1 (`downstream_voltage_v × 10`) and register 3
      (`feeder_current_a × 10`) both read `0` - the loads
      downstream of the recloser are unenergized. Hospital and fire
      station are dark. The substation bus (input register 0) is
      still energized at the source side because the substation
      breaker is still closed - only the downstream feeder lost
      power.

      **Why it worked:** the weak baseline allows enterprise → field
      DNP3 20000 with no source pinning and no DPI. There's
      nothing to distinguish a Direct Operate (FC05) from a benign
      read (FC01) - they ride on the same TCP port.

      ### Operational consequence at the HMI

      Switch to the [Feeder HMI](/substation) → **Feeder One-Line**
      tab. The breaker is still closed (substation bus energized)
      but everything past the recloser is dark:

      - **Alarm banner:** "RECLOSER OPEN - downstream loads lost"
        and "AUTO-RECLOSE DISABLED - no fault recovery"
      - **General Load** reads "NO POWER" (red)
      - **Critical Load** reads "NO POWER" (red) - *"Hospital and
        fire station without power"* shows in red beneath
      - **Customer-service tile:** "ALL CUSTOMERS WITHOUT POWER"

      The attacker didn't have to trip the substation breaker to
      cause an outage - disabling auto-reclose and tripping the
      recloser had the same effect for everyone downstream.

      :::decision id=attack-hmi-impact options=DOWNSTREAM_OUTAGE,LOW_VOLTAGE_ALARM,FEEDER_OUTAGE,NO_ALARM correct=DOWNSTREAM_OUTAGE
      **What alarm did the Feeder One-Line tab show after this attack?**
      :::

      :::hint Optional: try the same attack via Modbus
      DNP3 is the dominant SCADA protocol on these field devices, but
      Modbus is also present on most installed gear (primarily for
      HMI integration). Under the hardened policy the same L4 source
      pin closes both protocols from Kali, and the Modbus variants
      show that the pin - not a per-protocol signature - is what
      blocks an unauthorized source. Two optional Modbus attacks:

      **Modbus FC6 - regulator tap override.** From Kali:

          mbpoll -a 1 -t 4 -r 1 10.40.40.22 -- 65520

      `65520` is `-16` as an unsigned 16-bit (two's complement).
      Forces the regulator tap to the minimum position, dropping
      critical-load voltage below ANSI Range A. Wait 3 s, read the
      RTAC analog tags - input register 2 (`critical_load_voltage_v
      × 10`) drops below 1140. HMI shows the **LOW VOLTAGE**
      alarm banner; customers still have power but at unsafe voltage.

      **Modbus FC5 - direct breaker trip.** From Kali:

          mbpoll -a 1 -t 0 -r 1 10.40.40.20 0

      Single write to relay coil 0 (`breaker_closed`). One packet,
      total feeder outage. HMI shows the **FEEDER BREAKER OPEN**
      alarm; entire feeder dark. This is the worst-case
      single-packet kinetic outcome in the lab.

      Both ride on TCP 502 - the same L4 source pin closes both from
      Kali. The reference RTAC Modbus rule still permits supervisory
      writes from the RTAC itself, so do not read these timeouts as
      function-code filtering. The re-test
      step later covers the hardened-policy behavior for whichever
      of these you tried; if you only ran the primary DNP3 attack,
      the re-test step covers that one.
      :::
    action:
      type: sequence
      commands:
        - device: recloser
          command: disable_reclose
          source: "10.10.10.50"
        - device: recloser
          command: open
          source: "10.10.10.50"

  - title: "Restore the substation"
    expected_config: weak
    description: |
      Use the Supervisory Control tab in the [Feeder HMI](/substation)
      to reset the lab state, or click **Reset Lab** below. This
      restores every device touched by the primary attack and any
      optional bonus attacks you ran:

      - Relay: clear fault, unlock, close substation breaker
      - Regulator: set to Auto, tap to 0
      - Recloser: clear fault, enable auto-reclose, reset lockout, close
    action:
      type: sequence
      commands:
        - device: relay
          command: clear_fault
          source: "operator"
        - device: relay
          command: unlock
          source: "operator"
        - device: relay
          command: close
          source: "operator"
        - device: regulator
          command: set_auto
          source: "operator"
        - device: regulator
          command: set_tap
          source: "operator"
          value: 0
        - device: recloser
          command: clear_fault
          source: "operator"
        - device: recloser
          command: enable_reclose
          source: "operator"
        - device: recloser
          command: reset_lockout
          source: "operator"
        - device: recloser
          command: close
          source: "operator"

  - title: "Apply the hardened policy"
    expected_config: hardened
    description: |
      **Workshop note:**
      - Keep your plan as a design artifact. Apply **Hardened reference**, not **Apply Your Plan**.
      - Execute Step verifies its label without replacing it; a green banner is not enforcement evidence.

      Get a hardened policy active in containd before the re-test.
      The policy banner at the top of this step is your signal -
      it must show **Hardened reference** before the re-test.

      :::guided
      Click **Apply Hardened** in the **containd NGFW - policy actions** panel below this step to push the canned
      reference policy.
      :::

      :::technical
      Keep your Lab 2.2 policy work for design review. Use the **Apply Hardened**
      button below for this workshop's enforcement test, not a custom-policy commit.

      One DPI gotcha worth knowing: an **ICS Protocol Filter** rule
      defaults to **Rule Mode: Learning (passive)**, which only observes;
      the reference policy sets **Enforcement (active)**. Judge the result
      by device state in the re-test, not by the rule's mode label.
      :::

      The hardened policy has two layers:

      - **L4 source-pinning:** only the RTAC (`10.30.30.20`) can reach
        field devices on Modbus 502 and DNP3 20000. Enterprise and
        vendor sources are blocked at the perimeter - this is the
        control that closes the primary DNP3 attack and both optional
        Modbus attacks, and it is the control you will verify.
      - **ICS DPI:** the reference DNP3 rule permits reads only (FC1),
        even from RTAC, and lists no Direct Operate verb. On this build
        the DPI layer records a Direct Operate sent from the RTAC as a
        firewall event, but it does not stop that write. Modbus uses a
        separate source-pinned RTAC rule that permits supervisory
        reads/writes; do not assume it becomes read-only if you loosen
        that pin for monitoring access.

      So on this build the source pin enforces and the DPI layer gives
      visibility. Prove enforcement by device state in the re-test:
      `reclose_enabled` stays `1` after the Kali attempt. A policy label,
      a green banner or a rule's function-code list is not that proof.

      :::plan-coverage title="Your plan vs the primary attack"
      :::

      If your Lab 1.4 plan didn't pin RTAC-to-field
      (`pin-rtac-to-field`), record that design gap - the pin is the
      control that enforces here. `dnp3-dpi` is the right design for
      visibility, but on this build it is not what stops the write.
      Keep **Hardened reference** active for the re-test.
    action:
      type: check
      expect:
        firewall_config: improved

  - title: "Re-test the attack under the hardened policy"
    expected_config: hardened
    node: kali-1
    description: |
      **Workshop note:**
      - A TCP PASS, a green banner or the dnp3-dpi selection does not prove FC5/6 rejection. Enforcement proof is device state: after the Kali re-test, the RTAC read below must still show auto-reclose enabled.
      - Execute may show red failure/BLOCKED without advancing. That label is not a packet verdict; it can reject before sending a packet. Run the real protocol retest, inspect healthy device/HMI state and firewall evidence, record the result, then Mark Complete.
      - A refused/timeout connection without state/evidence is not enough to claim enforcement; record the register read with it.

      Repeat the DNP3 Direct Operate from Kali:

          dnp3cmd 10.40.40.21:20000 -a 2 crob 1 latch-off

      The connection should time out - containd's L4 source pin
      blocks the packet at the perimeter. Auto-reclose stays enabled,
      the recloser stays closed, the downstream feeder stays energized.

      Confirm via the RTAC tags that nothing changed:

          mbpoll -a 1 -t 4 -r 1 -c 5 10.30.30.20

      Holding registers 1 and 2 both read `1` (recloser_closed,
      reclose_enabled). The cross-zone DNP3 control surface is
      closed - by the source pin. That register read is your
      enforcement evidence; record it.

      ### Operational consequence at the HMI

      Switch to the [Feeder HMI](/substation) → **Feeder One-Line**
      tab. The attack alarm chain you saw earlier is *absent*:

      - **No alarm banner** at the top
      - **Recloser (79)** still closed, **Auto-reclose ON** green badge
      - **General Load + Critical Load** both energized (green kW)
      - **Customer-service tile:** "N kW serving ~M customers"

      :::decision id=retest-hmi-state options=NORMAL_OPS,DOWNSTREAM_OUTAGE,UNCHANGED_FROM_ATTACK correct=NORMAL_OPS
      **What did the Feeder One-Line tab show after the Kali re-test?**
      Answer for the Kali re-test above, before any optional RTAC check.
      :::

      :::decision id=retest-defense-in-depth options=L4_SOURCE_PIN,DNP3_DPI,EITHER_LAYER correct=L4_SOURCE_PIN
      **On this build, which layer actually stopped the Direct Operate
      from Kali?** Consider what would happen if the L4 source pin were
      loosened (e.g., to allow engineering workstation monitoring).
      :::

      :::hint Optional: see what the DPI layer does with an RTAC-origin write
      The RTAC is allowed through the source pin, so a Direct Operate
      sent from the **RTAC** terminal tab under Hardened reference reaches
      the DPI layer. On this build it is recorded, not stopped - expect
      the write to land. Type
      `dnp3cmd 10.40.40.21:20000 -a 2 crob 1 latch-off` in the RTAC
      terminal (not the Run button, which targets Kali).

      Expected result: `Result: SUCCESS`; the RTAC register read above
      now shows auto-reclose `0`; the Feeder One-Line shows the yellow
      **AUTO-RECLOSE DISABLED** banner; the firewall records the attempt
      as a DPI event (Network Map → Segmentation drawer → **Live DPI
      Events**). That is the point: the event proves visibility, the
      register proves enforcement, and here only the source pin enforces.

      Restore before you continue: [Feeder HMI](/substation) →
      **Supervisory Control** → **Enable Reclose** (or click **Reset Lab**,
      then re-apply **Hardened reference**). The Validate step expects
      auto-reclose enabled.
      :::

      :::hint Optional: confirm Modbus is blocked too
      If you ran either of the optional Modbus attacks in Step 2,
      repeat them now under the hardened policy - both also time
      out at the L4 perimeter. The same source-pin rule that
      blocked DNP3 above (only `10.30.30.20`/RTAC can reach field
      on TCP/502) closes both Modbus attacks:

      From Kali, repeat the writes:

          mbpoll -a 1 -t 4 -r 1 10.40.40.22 -- 65520   # FC6 regulator tap
          mbpoll -a 1 -t 0 -r 1 10.40.40.20 0          # FC5 breaker trip

      Both should time out. Confirm via the RTAC tags:

          mbpoll -a 1 -t 4 -r 1 -c 5 10.30.30.20

      `[0]=1` (breaker still closed), `[3]≈0` (regulator tap
      unchanged). One rule, three attack paths neutralized.

      These Modbus timeouts demonstrate source-pinning, not read-only DPI.
      A future monitoring allowance would need an explicit read-only
      function-code policy; the reference RTAC Modbus rule permits
      supervisory writes.
      :::

      :::hint Optional: try to evade DPI with Direct Operate No Ack
      A real attacker who suspects function-code filtering will try a
      variant. DNP3 has two Direct Operate verbs: **FC05 Direct
      Operate** (the one you used, which expects a response) and
      **FC06 Direct Operate No Ack**, which performs the same control
      write but tells the outstation *not* to reply. An attacker reaches
      for FC06 to (a) slip past a signature that only matched FC05, and
      (b) stay quieter - no response packet to notice.

      `dnp3cmd` exposes it with `-no-ack`. From Kali, against the
      recloser:

          dnp3cmd 10.40.40.21:20000 -a 2 -no-ack crob 1 latch-off

      Under the **hardened** policy this times out too: the L4 source
      pin doesn't care about function codes at all. FC05 and FC06 ride
      the same TCP/20000 from the same blocked source, so the packet
      never reaches the outstation regardless.

      The reference DNP3 rule lists neither verb for the RTAC. On this
      build, do not rely on the DPI layer to stop either one - the source
      pin is what blocks them. The design lesson still stands: enumerate
      the *whole* family of dangerous verbs, not just the textbook one. A
      control-write restriction that misses the No-Ack variant is the kind
      of gap an attacker probes for first - and a rule that lists the
      right verbs still has to be verified by device state.

      For comparison, send the same command under the **weak** baseline
      (Reset Lab, then re-apply weak) and it executes silently with no
      reply - the No-Ack outage with no acknowledgement to betray it.
      :::
    action:
      type: command
      device: recloser
      command: disable_reclose
      source: "10.10.10.50"

  - title: "Validate"
    expected_config: hardened
    description: |
      Confirm the attack was blocked, the substation is healthy,
      and the hardened firewall policy is active.

      **Workshop note:**
      - PARTIAL may include successful attacks from earlier weak-policy training or smoke runs. Record current retest timestamps; compare those events with earlier weak-policy writes.
      - Check for healthy restored state and blocked current attempts; do not clear audit or repeatedly reset/re-attack to make the banner green. Current successful unauthorized writes still fail.

      If you ran the optional RTAC-origin write, restore auto-reclose
      first (**Supervisory Control** → **Enable Reclose**, or **Reset
      Lab** and re-apply **Hardened reference**): this check expects it
      enabled.

      The cross-zone DNP3 control surface is closed by the source pin.
      Lab 2.4 takes this further with a positive/negative TCP
      reachability pass across the full zone-pair matrix and a
      change-board-ready evidence package; the device-state check you
      just made is what proves protocol-level enforcement.
    action:
      type: check
      expect:
        voltage_normal: true
        breaker_closed: true
        recloser_closed: true
        reclose_enabled: true
        firewall_config: improved
