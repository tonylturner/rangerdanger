id: hardening-configurations
order: "2.3"
name: "Protocol-Hardened Configurations"
summary: "Stress-test your firewall against the canonical distribution-substation attack: a DNP3 Direct Operate injection that disables auto-reclose and trips the recloser from an unauthorized source. The lesson: on this build the L4 source pin is what enforces, so verify enforcement by device state, not by policy labels. Modbus FC5/FC6 variants available as optional bonus attacks."
estimated_minutes: 12
validator: us-hardening-configurations
description: >
  Stress-test the policy you built in Lab 2.2 against the canonical
  distribution-substation attack: a DNP3 Direct Operate (FC05) injection
  from Kali that disables the recloser's auto-reclose and trips it,
  turning a brief flicker into a sustained downstream outage. You'll run
  the attack under the weak baseline (it succeeds), then under the
  applied plan. A selected enterprise-to-field closure denies it; a
  deferred closure leaves the Weak exposure open. The
  lesson: verify enforcement by device state, not by policy labels.
  Optional Modbus FC5/FC6 cases follow the same owning action.
nodes:
  - kali-1
  - rtac-1
tags:
  - dpi
  - dnp3
  - segmentation
  - hardening
  - modbus
steps:
  - id: verify-normal-operations
    title: "Verify normal operations"
    expected_config: weak
    node: rtac-1
    description: |
      Confirm the substation is healthy under the weak baseline:

      - Breaker closed, recloser closed, auto-reclose enabled
      - Regulator in auto, tap near 0
      - Critical-load voltage in ANSI C84.1 Range A (114–126V)

      Read the RTAC's aggregated state via Modbus from the RTAC's own
      terminal. The RTAC re-exposes every field device's state as a
      unified Modbus holding-register view, so a single read captures
      the whole substation. `-r 1` starts at Modbus reference 1, so the
      output labels the values `[1]`..`[5]` (reference = 0-based
      register address + 1). `-1` polls once and exits.

          mbpoll -a 1 -t 4 -r 1 -c 5 -1 10.30.30.20

      Expected: `[1]=1` (breaker closed), `[2]=1` (recloser closed),
      `[3]=1` (auto-reclose enabled), `[4]≈0` (regulator tap),
      `[5]=0` (regulator manual mode off, i.e. auto).

          mbpoll -a 1 -t 3 -r 1 -c 6 -1 10.30.30.20

      Analog measurements (FC4, x10 scaling): `[1]≈1200` (substation
      bus 120V), `[2]≈1200` (downstream 120V), `[3]≈1240`
      (critical-load 124V), `[4]≈360` (feeder current 36A).

      :::hint Cyber → state → physics has a ~2–3s lag
      Every protocol write you'll send mutates the field-device sim's
      state immediately, but the *electrical* impact (voltages,
      energization, feeder currents) only updates after the RTAC
      polls field devices (every 2 seconds) and pushes the
      aggregated state to the OpenDSS solver. If you read RTAC tags
      *immediately* after an attack, you may see the device state
      change but not the kinetic outcome yet. Wait 3 seconds, then
      re-read.
      :::

      **Time budget:** ~12 minutes (Guided path - the primary DNP3 attack and re-test. The optional Modbus cases are extra).
    action:
      type: check
      expect:
        breaker_closed: true
        recloser_closed: true
        reclose_enabled: true
        voltage_normal: true

  - id: attack-dnp3-direct-operate-injection-against-the-recloser
    title: "Attack - DNP3 Direct Operate injection against the recloser"
    expected_config: weak
    node: kali-1
    description: |
      > **Tip:** click **Show terminal** (top right) to run these from an
      > embedded shell on the **Kali** box, or use the **copy** button on each
      > command block and paste into your own terminal.

      From Kali (`10.10.10.50`, enterprise zone), under the weak
      baseline, send a DNP3 Direct Operate (FC05) to the recloser
      (`10.40.40.21`, DNP3 outstation address 2). Two CROB writes:
      first disable auto-reclose, then trip the recloser. Without
      auto-reclose, the trip becomes a sustained outage instead of
      a recoverable flicker.

      The CROB (Control Relay Output Block) targets binary outputs.
      Index 1 on the recloser maps to `reclose_enabled`. Index 0
      maps to `closed`:

          dnp3cmd 10.40.40.21:20000 -a 2 crob 1 latch-off
          dnp3cmd 10.40.40.21:20000 -a 2 crob 0 trip

      > **Background:** CROB (Control Relay Output Block) is DNP3's
      > primary command verb - see [DNP3 in Substations](/knowledge#dnp3)
      > if op codes like `latch-off` and `trip` are new. It also
      > covers why Direct Operate (FC05) is the function code that
      > matters for write restrictions, and why every modern
      > recloser controller (G&W, S&C, NOJA, Cooper, ABB) exposes a
      > DNP3 outstation like this one. The next steps demonstrate the
      > distinction: the L4 source pin enforces, while ICS DPI detects
      > and logs.

      Wait ~3 seconds for the RTAC's 2-second poll → OpenDSS push to
      land, then confirm the downstream de-energization from the
      RTAC's terminal:

          mbpoll -a 1 -t 4 -r 1 -c 5 -1 10.30.30.20

      `[2]` (recloser_closed) reads `0` and `[3]` (reclose_enabled)
      reads `0`.

          mbpoll -a 1 -t 3 -r 1 -c 6 -1 10.30.30.20

      `[2]` (`downstream_voltage_v × 10`) and `[4]`
      (`feeder_current_a × 10`) both read `0` - the loads
      downstream of the recloser are unenergized. Hospital and fire
      station are dark. The substation bus (`[1]`) is
      still energized at the source side because the substation
      breaker is still closed - only the downstream feeder lost
      power.

      **Why it worked:** the weak baseline allows enterprise → field
      DNP3 20000 with no source pinning and no DPI. There's
      nothing to distinguish a Direct Operate (FC05) from a benign
      read (FC01) - they ride on the same TCP port.

      ### Operational consequence at the HMI

      Switch to the [Feeder HMI](/substation) → **Feeder One-Line**
      tab. The breaker is still closed (substation bus energized)
      but everything past the recloser is dark:

      - **Alarm banner:** "RECLOSER OPEN - downstream loads lost"
        and "AUTO-RECLOSE DISABLED - no fault recovery"
      - **General Load** reads "NO POWER" (red)
      - **Critical Load** reads "NO POWER" (red) - *"Hospital and
        fire station without power"* shows in red beneath
      - **Customer-service tile:** "ALL CUSTOMERS WITHOUT POWER"

      The attacker didn't have to trip the substation breaker to
      cause an outage - disabling auto-reclose and tripping the
      recloser had the same effect for everyone downstream.

      :::decision id=attack-hmi-impact options=DOWNSTREAM_OUTAGE,LOW_VOLTAGE_ALARM,FEEDER_OUTAGE,NO_ALARM correct=DOWNSTREAM_OUTAGE
      **What alarm did the Feeder One-Line tab show after this attack?**
      :::

      :::hint Optional: try the same attack via Modbus
      DNP3 is the dominant SCADA protocol on these field devices, but
      Modbus is also present on most installed gear (primarily for
      HMI integration). Under the hardened policy the same L4 source
      pin closes both protocols from Kali, and the Modbus variants
      show that the pin - not a per-protocol signature - is what
      blocks an unauthorized source. Two optional Modbus attacks:

      **Modbus FC6 - regulator tap override.** From Kali:

          mbpoll -a 1 -t 4 -r 1 10.40.40.22 -- 65520

      `65520` is `-16` as an unsigned 16-bit (two's complement).
      Forces the regulator tap to the minimum position, dropping
      critical-load voltage below ANSI Range A. Wait 3 s, read the
      RTAC analog tags - `[3]` (`critical_load_voltage_v
      × 10`) drops below 1140. HMI shows the **LOW VOLTAGE**
      alarm banner; customers still have power but at unsafe voltage.

      **Modbus FC5 - direct breaker trip.** From Kali:

          mbpoll -a 1 -t 0 -r 1 10.40.40.20 0

      Single write to relay coil 0 (`breaker_closed`). One packet,
      total feeder outage. HMI shows the **FEEDER BREAKER OPEN**
      alarm; entire feeder dark. This is the worst-case
      single-packet kinetic outcome in the lab.

      Both ride on TCP 502 - the same L4 source pin closes both from
      Kali. The reference RTAC Modbus rule still permits supervisory
      writes from the RTAC itself, so do not read these timeouts as
      function-code filtering. The re-test
      step later covers the hardened-policy behavior for whichever
      of these you tried; if you only ran the primary DNP3 attack,
      the re-test step covers that one.
      :::
    action:
      type: sequence
      commands:
        - device: recloser
          command: disable_reclose
          source: "10.10.10.50"
        - device: recloser
          command: open
          source: "10.10.10.50"

  - id: restore-the-substation
    title: "Restore the substation"
    expected_config: weak
    description: |
      Use the Supervisory Control tab in the [Feeder HMI](/substation)
      to reset the lab state, or click **Reset Lab** below. This
      restores every device touched by the primary attack and any
      optional bonus attacks you ran:

      - Relay: clear fault, unlock, close substation breaker
      - Regulator: set to Auto, tap to 0
      - Recloser: clear fault, enable auto-reclose, reset lockout, close
    action:
      type: sequence
      commands:
        - device: relay
          command: clear_fault
          source: "operator"
        - device: relay
          command: unlock
          source: "operator"
        - device: relay
          command: close
          source: "operator"
        - device: regulator
          command: set_auto
          source: "operator"
        - device: regulator
          command: set_tap
          source: "operator"
          value: 0
        - device: recloser
          command: clear_fault
          source: "operator"
        - device: recloser
          command: enable_reclose
          source: "operator"
        - device: recloser
          command: reset_lockout
          source: "operator"
        - device: recloser
          command: close
          source: "operator"

  - id: apply-the-hardened-policy
    title: "Apply the hardened policy"
    expected_config: hardened
    description: |
      :::guided
      Apply Your Plan to test the choices from Lab 1.4. Use Apply Hardened only
      for the full reference.
      :::

      :::technical
      A manual policy uses Hardened expectations. Commit the named-source
      reference rules, then inspect the running configuration.
      :::

      Execute Step checks the active policy without replacing it. Verify the running hash and selected action IDs.

      The primary Kali→field DNP3 and optional Modbus attempts belong to
      `block-enterprise-to-field`. If selected, expect a timeout. If deferred,
      the Weak path stays open and the same command can still change the device.
      `pin-rtac-to-field` owns non-RTAC OT→field attempts, not Kali's enterprise path.

      The L4 source pin enforces; DPI detects and logs. Neither `dnp3-dpi` nor
      `modbus-dpi` changes these verdicts. Required RTAC and HMI flows remain.

      :::plan-coverage title="Your plan vs the primary attempt"
      :::

      Compare observed results with the applied plan, then record the Hardened
      prevention gap for each deferred closure. A saved selection is not proof.
    action:
      type: check
      expect:
        firewall_config: improved

  - id: re-test-the-attack-under-the-hardened-policy
    title: "Re-test the attack under the hardened policy"
    expected_config: hardened
    node: kali-1
    description: |
      Repeat the same DNP3 Direct Operate from Kali:

          dnp3cmd 10.40.40.21:20000 -a 2 crob 1 latch-off

      With `block-enterprise-to-field` selected, expect a connection timeout and
      auto-reclose still enabled. With it deferred, the command still lands:
      auto-reclose becomes disabled. This command alone does not trip the recloser.
      The deferred result matches plan proof but leaves a Hardened prevention gap.
      Detection selections do not close it.

      Read from the RTAC terminal after the poll/solve interval:

          mbpoll -a 1 -t 4 -r 1 -c 5 -1 10.30.30.20

      `[2]` is recloser closed; `[3]` is auto-reclose enabled. Record both values
      and HMI alarms with source, time and policy hash. Do not treat an Execute
      Step label as a packet verdict. Use the wire result and device evidence.

      :::decision id=retest-hmi-state options=NORMAL_OPS,AUTO_RECLOSE_DISABLED,DOWNSTREAM_OUTAGE,UNCHANGED_FROM_ATTACK
      What did the HMI show for this plan? Record auto-reclose separately in Notes.
      :::

      :::decision id=retest-defense-in-depth options=L4_SOURCE_PIN,DNP3_DPI,EITHER_LAYER correct=L4_SOURCE_PIN
      When the enterprise path is denied, which layer enforces that denial?
      :::

      :::hint Optional Modbus re-test
      If you ran the optional Modbus cases, repeat them from Kali:

          mbpoll -a 1 -t 4 -r 1 10.40.40.22 -- 65520   # FC6 regulator tap
          mbpoll -a 1 -t 0 -r 1 10.40.40.20 0          # FC5 breaker trip

      The same owning action controls both. Selected means timeout; deferred
      means the tap override or breaker trip still lands. Record the consequence.
      The L4 source pin enforces; DPI detects and logs.
      From the RTAC terminal, confirm the breaker and tap after those cases:

          mbpoll -a 1 -t 4 -r 1 -c 5 -1 10.30.30.20

      Record any change before restoration.
      :::

      :::hint Optional No-Ack protocol comparison
      From Kali, the same enterprise-to-field action owns the No-Ack case:

          dnp3cmd 10.40.40.21:20000 -a 2 -no-ack crob 1 latch-off

      Selected means a TCP timeout. Deferred means the write reaches the device
      without an application acknowledgement. Use auto-reclose state, not silence,
      as the observation. This is a protocol comparison, not a DPI prevention test.
      :::

      Restore every changed device before Validate, for every plan. Use HMI
      Supervisory Control: enable auto-reclose, close the recloser and breaker,
      clear fault/lockout, and return the regulator to auto and tap zero.
      Do not Reset Lab to improve the evidence: it reapplies Weak. If reset is
      needed for recovery, reapply the intended plan and collect a new window.
    action:
      type: command
      device: recloser
      command: disable_reclose
      source: "10.10.10.50"

  - id: validate
    title: "Validate"
    expected_config: hardened
    description: |
      Keep the applied plan active. Compare the current re-test result with its
      expected verdict. A deferred enterprise-to-field closure leaves the command
      path open even when the plan proof passes. Hardened is the comparison.

      Restoration is common to every plan: breaker and recloser closed,
      auto-reclose enabled, regulator auto, voltage normal and loads energized.
      Restore before Validate. A successful deferred test is not permission to
      leave the feeder degraded.

      Audit history can include earlier Weak-policy writes. Keep the current
      re-test timestamps; do not clear history or repeatedly reset to obtain a
      green banner. A state check is not TCP proof. Run Lab 2.4 for the full
      21-row matrix, capture and stable-hash evidence.
    action:
      type: check
      expect:
        voltage_normal: true
        breaker_closed: true
        recloser_closed: true
        reclose_enabled: true
        firewall_config: improved
