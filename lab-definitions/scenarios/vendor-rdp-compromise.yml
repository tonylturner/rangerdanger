id: vendor-rdp-compromise
order: "2.3-bonus"
name: "Vendor Remote Access Compromise (Bonus)"
summary: "Optional - Compromised vendor RDP/VNC credentials let an enterprise attacker pivot through the DMZ to OT field devices."
estimated_minutes: 12
validator: us-vendor-rdp-compromise
description: >
  Optional companion to Lab 2.3. Phished vendor credentials let an
  attacker RDP/VNC into the vendor jump box from an enterprise foothold,
  then pivot east-west to OT field devices. You'll walk the kill chain
  under the weak baseline, then apply containd rules that block
  remote-access protocols (RDP/3389, VNC/5900) from enterprise into the
  vendor DMZ. In an applied plan, each link follows its owning action.
nodes:
  - kali-1
  - vendor-jump-1
tags:
  - vendor
  - remote-access
  - segmentation
  - bonus
steps:
  - id: confirm-the-lateral-path-is-open
    title: "Confirm the lateral path is open"
    expected_config: weak
    node: kali-1
    description: |
      **Time budget:** ~12 minutes (Guided path). This is an optional
      bonus lab.

      Under the weak baseline, the enterprise zone can reach the
      vendor DMZ on remote-access protocols. This is the lateral
      path the attacker will exploit.

      Scan for remote-access services at 10.20.20.10.
      From **Kali** (10.10.10.50):

          nmap -Pn -p 3389,5900 10.20.20.10

      `-Pn` skips host discovery across the firewall so you test TCP ports,
      not whether discovery probes receive a response.

      You should see at least one of `3389/tcp` (RDP) or
      `5900/tcp` (VNC) open. The RangerDanger lab's vendor-jump is
      a Linux container with `xrdp` and a VNC server running - the
      same defensive lesson applies to a real Windows vendor jump
      host on RDP.
    action:
      type: probe
      outcome: reachable
      targets:
        - { host: 10.20.20.10, port: 3389, note: "RDP to vendor jump" }
        - { host: 10.20.20.10, port: 5900, note: "VNC to vendor jump" }

  - id: pivot-via-rdp-or-vnc
    title: "Pivot via RDP (or VNC)"
    expected_config: weak
    node: kali-1
    description: |
      From Kali, connect to the vendor jump box's remote desktop
      using the stolen credentials (`rangerdanger` / `rangerdanger`
      - the standard lab account documented in
      `docs/lab-credentials.md`).

      **Option A - RDP** (preferred when 3389 is open):

          xfreerdp /v:10.20.20.10:3389 /u:rangerdanger /p:rangerdanger +clipboard /cert:ignore

      **Option B - VNC** (fallback; password `rangerdanger`):

          xtightvncviewer 10.20.20.10:5900

      Native RDP/VNC viewers require a GUI/DISPLAY. From terminal-only Kali use the existing SSH fallback;
      the browser desktop is available after the vendor startup fix.
      Do not install a GUI during class.

      With a GUI client, you now have an interactive desktop on the vendor jump host.
      From the vendor's perspective, the connection looks
      legitimate - credentials valid, source IP not yet anomalous,
      and the firewall allows enterprise → vendor on remote-access
      ports. **This is the foothold.** Anything the vendor box can
      do, you can now do, from the vendor's network position.

      :::hint Headless mode (no GUI on Kali)
      If you're running Kali in a terminal-only mode, you can pivot
      to the same effect with SSH (port 22 is also open under the
      weak baseline):

          sshpass -p rangerdanger ssh -o StrictHostKeyChecking=no rangerdanger@10.20.20.10

      SSH tests the vendor network position, not the RDP/VNC closure.
      The Hardened reference and `restrict-enterprise-to-vendor` keep TCP/22
      available. Do not use an SSH session as proof that RDP/VNC is open.
      :::

  - id: use-the-vendor-foothold-to-attack-field-devices
    title: "Use the vendor foothold to attack field devices"
    expected_config: weak
    node: vendor-jump-1
    description: |
      Open a terminal **inside the RDP/VNC session you just
      established** (or use the vendor-jump terminal tab below).
      You're now operating from the vendor zone (10.20.20.10).

      Disable auto-reclose on the recloser via Modbus FC5 (write
      single coil), targeting coil 1 (`reclose_enabled`). `-t 0`
      is mbpoll's coil data type, `-r 2` is mbpoll's 1-indexed
      reference for coil 1, and `0` drives the coil low (disable):

          mbpoll -a 1 -t 0 -r 2 10.40.40.21 0

      Then inject a transient fault on coil 4 (`inject_fault`)
      with value `1`:

          mbpoll -a 1 -t 0 -r 5 10.40.40.21 1

      The recloser sees the fault and trips. Auto-reclose is off,
      so the recloser stays open instead of attempting to recover.
      Downstream loads - the hospital and fire station - lose power.

      Wait ~3 seconds for the RTAC poll → OpenDSS push to land,
      then read the RTAC's Modbus tags to confirm the kinetic
      outcome (the RTAC aggregates field-device state and
      OpenDSS electrical results into Modbus registers a vendor
      host can read). `-r 1` starts at Modbus reference 1, so mbpoll
      labels the values from `[1]` (reference = 0-based register
      address + 1). `-1` polls once and exits.

          mbpoll -a 1 -t 4 -r 1 -c 5 -1 10.30.30.20

      `[2]` (`recloser_closed`) is now `0` (the fault
      tripped the recloser) and `[3]` (`reclose_enabled`) is `0`
      (your earlier Modbus FC5 write disabled auto-reclose). Re-run
      with `-c 6` to also see `[6]` (`recloser_shot_count`) at `1`:
      the fault was counted as the first shot, but with reclose
      disabled there will be no shots 2 or 3 to recover from.

          mbpoll -a 1 -t 3 -r 1 -c 6 -1 10.30.30.20

      `[2]` (`downstream_voltage_v × 10`) and `[4]`
      (`feeder_current_a × 10`) both read `0` - the loads
      downstream of the recloser are unenergized. The substation
      bus (`[1]`) stays energized at the source.

      :::hint Cyber → state → physics has a ~2-3s lag
      The Modbus writes mutate recloser-sim state immediately,
      but the *electrical* impact (voltages, energization) only
      updates after the RTAC polls field devices (every 2 seconds)
      and pushes the aggregated state to the OpenDSS solver. If
      you re-read RTAC tags *immediately* after the writes, you
      may see device state changed but not the kinetic outcome
      yet. Wait 3 seconds, then re-read.
      :::

      The attack succeeded because the kill chain had two open
      links: enterprise → vendor RDP, and vendor → field Modbus.

      > **Background:** the two-hop kill chain (compromise hop A,
      > pivot to hop B, attack from B) is the central lesson of
      > defense in depth. See [OT Network Segmentation Overview](/knowledge#ot-segmentation-overview)
      > for why segmentation between the *vendor* and *field* zones
      > is as important as the perimeter rule, even though the
      > attacker never directly touches the field network from the
      > internet. The full pattern catalog -
      > [Vendor Remote Access Patterns](/knowledge#vendor-remote-access)
      > and [The OT Kill Chain](/knowledge#ot-kill-chain) - covers how
      > real utilities defend this surface and what historical
      > incidents (Industroyer, Volt Typhoon) it mirrors.

      ### Operational consequence at the HMI

      Switch to the [Feeder HMI](/substation) → **Feeder One-Line**
      tab. The kinetic outcome is identical to Lab 2.3 Attack 2 -
      different protocol path, same lights-out for downstream
      customers:

      - **Alarm banner:** "RECLOSER OPEN - downstream loads lost"
        and "AUTO-RECLOSE DISABLED - no fault recovery"
      - **General Load + Critical Load** both read "NO POWER"
      - *"Hospital and fire station without power"* under critical load
      - **Customer-service tile:** "ALL CUSTOMERS WITHOUT POWER"

      ### Who sent the write?

      The recloser cannot tell you. Open the **Electrical Detail** tab →
      **Protection & Device Status** → **Mid-Feeder Recloser (79)**: its
      **Last Command** row reads `modbus-tcp` - the protocol, not an
      address. A field device sees a valid Modbus request on TCP 502 and
      executes it; it records no peer address, so it cannot tell a
      vendor session from the RTAC. (The One-Line's **Last command
      from:** line belongs to the feeder breaker, not the recloser.)

      The firewall saw the connection. **Right after the attack**, open
      the [containd firewall](/containd/) (log in as `containd` /
      `containd`) and go to **NETWORK → Sessions**. Find the rows with
      **DST `10.40.40.21`** and **DPORT `502`** - one per `mbpoll` write.
      Their **SRC** is `10.20.20.10`, the vendor jump host:

          tcp   TIME_WAIT   10.20.20.10   41368   10.40.40.21   502   ...   118s

      There is no `10.10.10.50` row for this write. The attack was
      laundered through the trusted vendor host, and the firewall
      attributes it to the vendor zone. This is why perimeter rules at
      the *RDP* hop matter: by the time the Modbus packet reaches the
      recloser, it looks legitimate.

      Open **Sessions** before running the write, set the list limit above
      500 rows, and filter on `10.20.20.10` so the vendor row is visible.
      These rows expire in about 17 seconds. If they are gone, re-run the
      first `mbpoll` write above and refresh Sessions.

      :::decision id=vendor-attack-hmi-impact options=DOWNSTREAM_OUTAGE,FEEDER_OUTAGE,LOW_VOLTAGE_ALARM,NO_ALARM correct=DOWNSTREAM_OUTAGE
      **What alarm did the Feeder One-Line tab show after this attack?**
      :::

      :::decision id=vendor-source-attribution options=ATTACKER_IP,VENDOR_JUMP_IP,RTAC_IP correct=VENDOR_JUMP_IP
      **In containd Sessions, which SRC address do the rows to
      `10.40.40.21:502` show?** The attack laundered through the vendor
      session.
      :::
    action:
      type: sequence
      commands:
        - device: recloser
          command: disable_reclose
          source: "10.20.20.10"
        - device: recloser
          command: inject_fault
          source: "10.20.20.10"

  - id: restore-service
    title: "Restore service"
    expected_config: weak
    description: |
      Use the Supervisory Control tab in the [Feeder HMI](/substation)
      (or click **Reset Lab**) to restore the feeder: reset lockout,
      enable auto-reclose, clear fault, close the recloser.
    action:
      type: sequence
      commands:
        - device: recloser
          command: reset_lockout
          source: "operator"
        - device: recloser
          command: enable_reclose
          source: "operator"
        - device: recloser
          command: clear_fault
          source: "operator"
        - device: recloser
          command: close
          source: "operator"

  - id: apply-hardened-policy
    title: "Apply hardened policy"
    expected_config: hardened
    description: |
      Apply Your Plan, or Apply Hardened for the full reference. Execute Step
      checks the active policy without replacing it. Verify its action IDs and running hash.

      | Chain link | Owning action | Selected / deferred |
      |---|---|---|
      | Enterprise→vendor RDP/3389 and VNC/5900 | `restrict-enterprise-to-vendor` | deny / allow |
      | Vendor→field Modbus/502 and DNP3/20000 | `block-vendor-to-field` | deny / allow |
      | Vendor→OT Modbus and HMI web | `restrict-vendor-to-ot` | deny / allow |

      Either of the first two closures breaks this two-hop chain. Test each
      independently. `pin-rtac-to-field` owns OT-source attempts, not the vendor
      hop. A ZTNA broker selection is planning-only; it deploys no login control.
      The L4 source pin enforces; DPI detects and logs.

      :::plan-coverage title="Your plan vs the vendor chain"
      :::
    action:
      type: check
      expect:
        firewall_config: improved

  - id: re-attempt-the-pivot
    title: "Re-attempt the pivot"
    expected_config: hardened
    node: kali-1
    description: |
      Retest hop one from Kali:

          nmap -Pn -p 3389,5900 10.20.20.10

      `restrict-enterprise-to-vendor` selected means both ports time out or show
      filtered. Deferred means reachable. A refused connection counts as reached,
      not denied. Record the result, not an assumed successful login.

      Retest hop two independently from the vendor-jump terminal:

          mbpoll -a 1 -t 0 -r 2 10.40.40.21 0

      `block-vendor-to-field` selected means timeout. Deferred means the write
      still disables auto-reclose. The app terminal represents an existing vendor
      foothold even when hop one is denied; it does not prove a new login.
      Read `[3]` from the RTAC terminal, not vendor-jump: `restrict-vendor-to-ot`
      can deny the vendor Modbus read. Record the HMI auto-reclose badge too.

      :::decision id=vendor-retest-hmi-state options=NORMAL_OPS,AUTO_RECLOSE_DISABLED,DOWNSTREAM_OUTAGE,UNCHANGED_FROM_ATTACK
      What did the HMI show? Record auto-reclose and the owning action in Notes.
      :::

      :::decision id=vendor-retest-defense-layer options=ENTERPRISE_TO_VENDOR,VENDOR_TO_FIELD,EITHER_LAYER
      Which selected layer closed this chain? If neither was selected, record
      that both links remain open in Notes.
      :::

      Restore auto-reclose and normal feeder state before Validate for every plan.
      A partial plan can match plan proof while retaining either prevention gap.
    action:
      type: check
      expect:
        firewall_config: improved
        recloser_closed: true
        reclose_enabled: true

  - id: validate
    title: "Validate"
    expected_config: hardened
    description: |
      Keep the applied plan active. Record each link's observation against that
      plan and against Hardened. Named or manual policies use Hardened expectations.
      Restore auto-reclose, closed breaker/recloser and energized loads for every
      plan. Validate checks restored operation; retain the actual TCP and device
      results separately. A green banner does not prove either link was denied.
    action:
      type: check
      expect:
        recloser_closed: true
        reclose_enabled: true
        breaker_closed: true
        firewall_config: improved
