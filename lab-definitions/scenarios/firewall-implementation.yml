id: firewall-implementation
order: "2.2"
name: "Firewall Policy Implementation"
summary: "Apply a least-privilege segmentation policy on the containd NGFW, replacing the weak baseline with enforceable rules, then validate it holds."
estimated_minutes: 22
validator: us-firewall-implementation
description: >
  You have identified the required flows, designed your
  requirements, and planned which remediations to execute.
  Now you implement. You will replace the permissive weak
  baseline on the containd NGFW with a least-privilege policy -
  applying it with one click on the Guided track, or authoring
  the rules yourself on the Advanced track. The applied plan defines which
  unauthorized cross-zone paths close or remain open,
  while critical substation operations continue without
  interruption.
nodes:
  - fw-1
  - kali-1
  - eng-ws-1
  - rtac-1
  - vendor-jump-1
tags:
  - segmentation
  - firewall
  - defense
  - containd
steps:
  - id: exercise-overview
    title: "Exercise overview"
    expected_config: weak
    description: |
      In the Baseline Traffic Analysis, Segmentation Requirements, and Remediation Planning exercises you captured baseline traffic, designed zone-pair requirements, and selected which remediations to execute under labor budget. This exercise is where those design decisions become real firewall policy.

      Your prior work is summarised below - your design verdicts and findings drive the rule set you'll build in Stage 3.

      :::findings-panel from=segmentation-requirements title="Your design verdicts (Lab 1.3)"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Unauthorized Modbus writes / DNP3 Direct Operate
      :::

      :::findings-panel from=baseline-assessment title="What your assessment confirmed (Lab 1.2)"
      latent-exposure-confirmed: Active probing revealed latent exposure beyond passive observation
      :::

      A diagram or a requirements doc isn't segmentation. It becomes real
      only when the firewall enforces it and you can prove two things:
      **authorized traffic still works** (RTAC polls field devices, GPS
      delivers NTP, the HMI reads state) and **each tested path matches its expected verdict**.
      Selected closures deny traffic; deferred exposures stay reachable. That's what you'll put in place here, then validate in
      Stages 5-6.

      ### How you'll work

      This lab runs **Guided by default**: you apply the policy with the
      **Apply Your Plan** button below the step and
      walk containd's UI and CLI to see exactly what landed - no rule syntax
      and no commit step. Prefer to author and commit the rules yourself?
      Switch to the **Advanced** track - recommended only if you're
      comfortable with firewall policy syntax. The policy banner at the top
      of every step shows what's currently running.

      :::track-picker
      :::

      **Time budget:** ~22 minutes on the Guided path (longer if you author rules yourself on Advanced). The containd firewall supports both a web UI and a CLI - use whichever you prefer.

  - id: verify-access-to-containd
    title: "Verify access to containd"
    expected_config: weak
    description: |
      Confirm you can reach the containd NGFW through either of its
      management interfaces. **Use whichever you prefer in this lab -
      both the Web UI and the CLI expose the same policy.**

      **Option 1: Web UI**

      Open [http://localhost:9080](http://localhost:9080). If you're
      prompted to log in, use the default workshop credentials -
      **username `containd`, password `containd`** (the login page lists
      them too). The dashboard then shows zone interface status for all
      four networks (`wan`, `dmz`, `lan1`, `lan2`) and the current rule
      count.

      **Option 2: containd CLI**

      The `fw-1` terminal tab on the [Network Map](/console) opens
      directly into the **configuration CLI**. Its prompt reads
      `containd(config)#` for a clean candidate (`config`); the mode changes to
      `config*` for pending edits or `config?` when candidate status is unavailable.
      These markers do not prove live traffic protection.
      List the interfaces and the running policy:

          show interfaces
          show running-config

      You should see four zones (`wan`, `dmz`, `lan1`, `lan2`) and
      a set of broad allow rules - this is the weak baseline. If you
      see rules that allow broad cross-zone traffic (enterprise to
      field, vendor to field, any-to-any on ICS ports), the weak
      baseline is active. That is your starting point.

      ### Switching between the CLI and bash

      Two prompts, one terminal:

      | Prompt | What you can run | How you got here |
      |---|---|---|
      | Configuration CLI | `show *`, `set *`, `commit`, `export config` - appliance commands | Default; opens here |
      | Linux shell (bash) | `tcpdump`, `nft`, `ip`, generic Linux - acts immediately | Type `exit` from the configuration CLI |

      `exit` ends the CLI process; RangerDanger's terminal wrapper then starts
      Linux bash. Leaving never commits or discards the shared candidate.
      **From bash back to the CLI: type `containd cli`.** `configure` is also
      a supported CLI entry point. `wizard` belongs to SSH-appliance guided
      setup, not the local CLI.

  - id: phase-1-verify-current-access-under-the-weak-baseline
    title: "Phase 1 - Verify current access under the weak baseline"
    expected_config: weak
    node: kali-1
    description: |
      Before you change anything, run the commands that confirmed your latent exposure in Lab 1.2 step 7 - this time with intent. Observe what the weak baseline allows. This is your "before" picture; every test below should succeed now. After apply, each result follows its owning action.

      **From the kali terminal** (`kali-1` on the [Network Map](/console)):

      Test Modbus read from enterprise to field relay:

          mbpoll -a 1 -r 1 -c 4 -1 -t 0 10.40.40.20

      Test DNP3 poll from enterprise to field relay:

          dnp3poll -a 1 -t 3s 10.40.40.20:20000

      Test DNP3 poll from enterprise to field recloser:

          dnp3poll -a 2 -t 3s 10.40.40.21:20000

      Test Modbus read from enterprise to field recloser:

          mbpoll -a 1 -r 1 -c 4 -1 -t 0 10.40.40.21

      **From the eng-ws terminal** (`eng-ws-1` on the [Network Map](/console)):

      From the eng-ws terminal, test Modbus read to field regulator:

          mbpoll -a 1 -r 1 -c 2 -1 -t 4 10.40.40.22

      From the eng-ws terminal, test Modbus to field capbank:

          mbpoll -a 1 -r 1 -c 4 -1 -t 0 10.40.40.23

      All of these should return data. That is the problem. Kali (an attacker box in the enterprise zone) can speak Modbus and DNP3 directly to field protection relays. The engineering workstation can bypass the RTAC entirely. This is what you are about to fix.
    action:
      type: probe
      targets:
        - { host: 10.40.40.20, port: 502, note: "Modbus to relay" }
        - { host: 10.40.40.20, port: 20000, note: "DNP3 to relay" }
        - { host: 10.40.40.21, port: 502, note: "Modbus to recloser" }
        - { host: 10.40.40.21, port: 20000, note: "DNP3 to recloser" }
        - { from: eng-ws-1, host: 10.40.40.22, port: 502, note: "Modbus to regulator" }
        - { from: eng-ws-1, host: 10.40.40.23, port: 502, note: "Modbus to capbank" }

  - id: phase-2-remove-broad-trust-and-establish-default-deny
    title: "Phase 2 - Remove broad trust and establish default-deny"
    expected_config: weak
    description: |
      Review broad Weak allows before applying the plan in Phase 3.
      A selected enforceable action closes its exposure. A deferred action keeps
      that Weak path open. Default DENY is the backstop, not proof that a deferred
      path closed. Preserve management and required operational allows.
      Inspect the final **Default** row: both reference policies already use
      DENY. Only if needed, use **Change default** → **DENY** → **Stage default**.
      Review consequences and the complete candidate diff before commit.

      ### Review a proposed change

      **Prepared change request CR-22** removes broad cross-zone trust, keeps
      management access, and keeps only these operational allows:

      | Allow | Source → destination | Port |
      |---|---|---|
      | RTAC→field web | 10.30.30.20→field devices | TCP/8080 |
      | GPS→field time | 10.30.30.50→field devices | UDP/123 |

      Compare it with the operational conduits from your Lab 1.3 design before
      approving it. Review only: never apply an incomplete request to create an
      outage. Keep a known-good export and agree a rollback owner and trigger
      before any actual change.

      :::decision id=change-request-gap options=RTAC_TO_FIELD_POLLING,ENTERPRISE_TO_FIELD_DNP3,GPS_TO_FIELD_TIME,NOTHING_MISSING correct=RTAC_TO_FIELD_POLLING
      Which required conduit does CR-22 drop?
      :::why
      RTAC field polling (10.30.30.20→field on TCP/502 Modbus and TCP/20000 DNP3) is
      missing, so the RTAC loses its field data and the HMI goes stale.
      Enterprise→field DNP3 is the attack path to remove, not a requirement.
      GPS→field time is in the request.
      :::

      :::decision id=change-request-review options=APPROVE_AS_WRITTEN,CORRECT_BEFORE_COMMIT,UNCLEAR correct=CORRECT_BEFORE_COMMIT
      What should happen to this proposed change before commit?
      :::why
      Correct the missing operational allow before commit: RTAC field polling fails and the HMI loses fresh device communications.
      Default DENY cannot replace a required allow. Execute Step checks the running
      policy; it does not grade this review or approve the request.
      :::

      :::guided
      Apply Your Plan in the next step. Use Apply Hardened only for the reference.
      :::

      :::technical
      Export a known-good rollback before edits. Preserve the compiled rule order.
      Deletion preserves survivor order; do not insert a deny above required operational exceptions.
      Manual policies are judged against Hardened, not saved browser selections.
      For the Hardened manual target, remove the five broad Weak allows in
      containd. Do not run these deletes to implement a partial plan: its deferred
      allows must stay. Keep management and required operational rules intact.
      Stage these deletes only; do not commit until Phase 3 has staged their
      operational replacements. From the fw-1 CLI:

          delete firewall rule enterprise-to-ot-weak
          delete firewall rule enterprise-to-field-weak
          delete firewall rule vendor-to-ot-weak
          delete firewall rule vendor-to-field-weak
          delete firewall rule ot-to-field-broad
          show diff

      Do not commit yet. The running Weak rules still carry operations while
      you build the candidate. In particular, deleting `ot-to-field-broad`
      without its RTAC replacements would interrupt field polling and the HMI.
      Continue directly to Phase 3 with this same shared candidate.
      :::
  - id: phase-3-create-minimal-required-rules
    title: "Phase 3 - Create minimal required rules"
    expected_config: hardened
    description: |
      Review the compiled rules for this plan. Required rules stay in every plan.
      Selected enforceable actions narrow their paths. Deferred rules retain the
      same Weak exposures. Detection-only actions change no TCP verdict.
      The L4 source pin enforces; DPI detects and logs.

      :::guided
      Click **Apply Your Plan**, or **Apply Hardened** for the reference.
      An empty or planning-only plan is valid. It leaves Weak exposures open.
      Inspect the running rules, not just the policy banner. Execute Step checks
      the active policy without replacing it.
      :::

      :::technical
      For a plan, use the compiled rule order without adding broad allows.
      The first matching enforcing terminal rule decides; monitor rules never decide. Keep RTAC field exceptions before `deny-ot-to-field-direct`. Rule IDs do not set priority. Review configured order and shadow warnings before commit, then inspect running order.
      On Configuration, **Review changes** leads with entity summaries; **Advanced** opens the exact JSON diff. Review the complete candidate before using the persistent **Commit** actions.
      For manual work, use Hardened as the judging target. With
      **Restrict enterprise → vendor remote access** selected, replace broad enterprise→vendor
      access with TCP 22, 80 and 443. With it deferred, RDP/3389 and VNC/5900
      remain reachable. **Create rule** and **Delete** do not reload the firewall.
      Keep the Phase 2 deletes staged until all replacements are in this candidate.
      Before the single commit, verify the Hardened operational rules:
      `rtac-to-field-modbus`, `rtac-to-field-dnp3` and `rtac-to-field-http`
      allow source `10.30.30.20/32` on TCP 502, 20000 and 8080 respectively,
      before `deny-ot-to-field-direct`. Preserve `ot-intrazone-ops` for HMI
      operations, `gps-to-field-ntp` for `10.30.30.50/32` UDP/123, and the
      reserved management access. Review the full candidate, not just the deletes.
      From the fw-1 configuration CLI, commit replacements and removals together:

          show diff
          commit

      Or use **Commit** on the **Configuration** page after the same review.
      Verify that reference closure from Kali:

          mbpoll -a 1 -r 1 -c 1 -1 -t 0 -o 3 10.40.40.20

      This manual reference test should time out. For a compiled plan, the
      enterprise-to-field verdict instead follows its owning action.
      After commit, run `nmap -Pn -p 3389,5900 10.20.20.10` from Kali.
      For the manual Hardened target, both ports must be `filtered`; if not,
      fix the rule and commit again. A plan uses its compiled verdict instead.
      :::

      Keep the RTAC source `10.30.30.20/32` on its required field rules:
      TCP/502, TCP/20000 and TCP/8080. Preserve GPS `10.30.30.50/32` NTP/123
      and HMI operations. These operational paths cannot be deferred.

      :::hint Policy evidence at the containd CLI
      In the configuration CLI, `export config` prints redacted running JSON; it does not create a file:

          export config

      Copy the output into your evidence. Do not use shell redirection.
      Full export requires explicit administrator intent; do not share secrets.
      This reference example includes detection; it is not the whole policy:

          {
            "id": "rtac-to-field-modbus",
            "sourceZones": ["lan1"],
            "destZones": ["lan2"],
            "sources": ["10.30.30.20/32"],
            "protocols": [{"name": "tcp", "port": "502"}],
            "ics": {"protocol": "modbus", "functionCode": [1, 2, 3, 4, 5, 6]},
            "action": "ALLOW",
            "log": true
          }
      :::

      Export the compiled config and the companion **Export plan record**.
      The record contains the package ID, revision, label, action IDs and
      policy hash. Use `GET /api/firewall/active` to check what is running.
    action:
      type: check
      expect:
        firewall_config: improved

  - id: phase-4-enable-logging-and-visibility
    title: "Phase 4 - Enable logging and visibility"
    expected_config: hardened
    description: |
      Inspect the log flags in the compiled rule table.
      **Improve firewall logging and PCAP retention**,
      **Apply Modbus ICS DPI - provide function-code visibility** and
      **Apply DNP3 ICS DPI - detect and log Direct Operate writes** add
      visibility, not prevention. Deferring them changes no TCP verdict. Do not
      add flags by hand and still call the result an unchanged applied plan; a
      running-hash change clears plan provenance.

      With **Restrict vendor → OT to SSH/HTTPS only** selected, `deny-vendor-to-ot`
      explicitly denies Vendor DMZ → OT Operations on TCP 8080, 1881, 502 and 20000.
      **Improve firewall logging and PCAP retention** enables its log flag,
      alongside the HTTPS/443 and SSH/22 allow rule and the selected vendor →
      field deny. Hardened logs these rules too. If the restriction is deferred,
      its Weak exposure stays open; selecting logging alone does not close or log
      that exposure.

      The L4 source pin enforces; DPI detects and logs. Explicit logged rules
      can provide tuple evidence. Default DENY is a silent backstop. A missing
      event does not prove that no attempt occurred.

      In the configuration CLI, inspect administrative evidence:

          show audit

      Recent `config.commit` entries establish the policy change, not per-flow
      verdicts. Compare real TCP results and device/HMI state with the active
      plan. Retain timestamps and capture. The Network Map event strip can add
      rule or protocol context; a detection alone is not proof of prevention.
  - id: phase-5-validate-allowed-traffic
    title: "Phase 5 - Validate allowed traffic"
    expected_config: hardened
    node: rtac-1
    description: |
      Verify operations for every plan. From the RTAC terminal, run:

          mbpoll -a 1 -r 1 -c 4 -1 -t 0 10.40.40.20
          dnp3poll -a 1 -t 3s 10.40.40.20:20000

      Both should return data. Check field `device_comms` with:

          curl -s http://10.30.30.20:8080/api/state | python3 -m json.tool

      Open the HMI. Confirm no alarms, closed breaker and recloser, auto-reclose
      on and energized loads. Check GPS NTP separately; the proof matrix is TCP.
      All eight authorized TCP rows must remain reachable for every plan.
      Bridged rows do not cross the firewall and do not prove a firewall rule.
      Lab 2.4 separates plan proof from Hardened acceptance: 8/8 authorized and
      13/13 unauthorized denied, 0 skipped, stable hash, capture and healthy HMI.

      From an OT Ops terminal, check the intra-zone HMI service:

          curl -sf http://10.30.30.10:1881 --connect-timeout 3

      This check must work for every plan. It is not routed firewall proof.
    action:
      type: probe
      targets:
        - { host: 10.40.40.20, port: 502, note: "RTAC Modbus to relay" }
        - { host: 10.40.40.20, port: 20000, note: "RTAC DNP3 to relay" }
        - { host: 10.30.30.10, port: 1881, note: "OT ops to FUXA HMI" }

  - id: phase-6-validate-blocked-traffic
    title: "Phase 6 - Validate blocked traffic"
    expected_config: hardened
    node: kali-1
    description: |
      Test the expected outcomes for the applied plan, not its label.
      Run all 13 unauthorized TCP rows from their named sources in Lab 2.4.
      A deny verdict requires a connection timeout. Connection refused means
      reached (allow). Tool or container errors are skipped evidence and fail proof.

      | Path | Owning action | Selected / deferred |
      |---|---|---|
      | Kali→vendor RDP/3389 and VNC/5900 | Restrict enterprise → vendor remote access | deny / allow |
      | Enterprise→OT ICS and web | Block enterprise → OT Operations ICS ports | deny / allow |
      | Enterprise→field | Block enterprise → field direct access | deny / allow |
      | Vendor→OT Modbus and web | Restrict vendor → OT to SSH/HTTPS only | deny / allow |
      | Vendor and eng-ws→field | Block vendor → field devices entirely | deny / allow |
      | Non-RTAC OT hosts→field | Pin field-device access to RTAC source IP | deny / allow |

      A deferred exposure is a prevention gap against Hardened, not a failed
      plan proof if it matches this plan. Do not change policy just to hide the gap.
      Preserve timestamps and the running hash. `show audit` lists `config.commit` evidence,
      not a per-flow verdict. Keep capture and HMI evidence with both results.

      :::hint Run the sampled protocol checks from their real sources
      From Kali, test the enterprise-to-field action:

          mbpoll -a 1 -r 1 -c 4 -1 -t 0 -o 3 10.40.40.20
          dnp3poll -a 1 -t 3s 10.40.40.20:20000

      From eng-ws, test the vendor-to-field action:

          mbpoll -a 1 -r 1 -c 4 -1 -t 0 -o 3 10.40.40.23

      From vendor-jump, test that same action independently:

          dnp3poll -a 1 -t 3s 10.40.40.20:20000
          mbpoll -a 1 -r 1 -c 4 -1 -t 0 -o 3 10.40.40.20

      Selected means timeout; deferred means reachable. These sampled commands
      do not replace the full report matrix. Execute Step checks the running
      policy. Preserve the observation and the report verdict.
      :::
    action:
      type: probe
      targets:
        - { host: 10.40.40.20, port: 502, note: "Kali Modbus to relay" }
        - { host: 10.40.40.20, port: 20000, note: "Kali DNP3 to relay" }
        - { from: eng-ws-1, host: 10.40.40.23, port: 502, note: "Engineering Modbus to capbank" }
        - { from: vendor-jump-1, host: 10.40.40.20, port: 502, note: "Vendor Modbus to relay" }
        - { from: vendor-jump-1, host: 10.40.40.20, port: 20000, note: "Vendor DNP3 to relay" }

  - id: export-your-policy
    title: "Export your policy"
    expected_config: hardened
    description: |
      You have applied a plan or the Hardened reference.
      Export it so you have a record of what is running - most
      change boards want the policy as a versioned artifact, not
      just "rules live in the firewall."

      This step matters regardless of which path you chose at the
      top of the lab. If you applied the canned hardened reference,
      exporting gives you the starting point for your own future
      edits. If you authored the policy in containd, the export is the artifact you hand
      to change management.

      **Web UI:** go to **Configuration** → **Overview** and click
      **Download full** to save the running config as JSON (**Download
      redacted** strips secrets if you're sharing it).

      **CLI:** the `fw-1` terminal opens in the configuration CLI; run:

          export config

      **Workshop note:**
      - Copy that redacted running JSON to your evidence document; the appliance CLI does not support shell redirection. Full export requires explicit administrator intent. Validate the saved copy on your workstation with `python3 -m json.tool`.
      - The CLI JSON-file edit/import exercise is deferred. Author/review in **Configuration** at http://localhost:9080; do not edit a file the CLI never created.
      - Browser export is optional; the copied CLI JSON is your evidence.

      Use **Export plan record** as the companion to **Export compiled config**.
      The record contains package ID, revision, label, action IDs and policy
      hash. Check `GET /api/firewall/active` to confirm the current plan and
      running hash before and after probing.

      A partial plan is not equivalent to Hardened. Use structured plan coverage
      for its deferred exposures and preserve both plan proof and Hardened acceptance results. Named and
      manual policies are judged against Hardened; they have no plan proof.

      ### Save evidence status for Lab 2.4

      These statuses carry forward automatically; they describe your evidence, not a
      passing score. Keep the actual artifacts with their UTC window and running hash.
      Update the statuses if you collect missing evidence; Lab 2.4 regenerates proof
      against its own current policy window.

      :::decision id=evidence-policy options=READY,MISSING,UNCLEAR
      Do you have the running policy export and its identity (plus the plan record when applicable)?
      :::why
      READY means the export and running identity agree. MISSING needs collection; UNCLEAR needs an identity check before approval.
      :::

      :::decision id=evidence-positive options=READY,MISSING,UNCLEAR
      Do you have positive-test and operational-continuity evidence?
      :::why
      READY needs authorized flows and independent operator/process observations. MISSING or UNCLEAR means connectivity alone has not established continuity.
      :::

      :::decision id=evidence-negative options=READY,MISSING,UNCLEAR
      Do you have the negative-test results, including deferred exposures?
      :::why
      READY means real-source results are retained with the plan comparison. Deferred reachable paths remain prevention gaps, not skipped tests.
      :::

      :::decision id=evidence-capture options=READY,MISSING,UNCLEAR
      Do you have PCAP evidence tied to the test window?
      :::why
      READY means the capture is retained and correlated with the policy and test times. MISSING or UNCLEAR needs capture review; an ingress SYN alone is not delivery proof.
      :::

    action:
      type: check
      expect:
        firewall_config: improved
