id: remediation-planning
name: "Remediation Planning Under Constraint"
summary: "Review findings, fund the scope and write an approved change request with tests and rollback."
estimated_minutes: 30
validator: us-remediation-planning
description: >
  Write a change request for the substation firewall. Use the findings, required conduits and available roles to agree what to change now. Name an owner for every deferred exposure.
nodes: []
tags:
  - planning
  - requirements
  - defense
  - tradeoffs
steps:
  - id: review-the-findings-you-captured
    title: "Review the findings you captured"
    expected_config: weak
    description: |
      **Time budget:** ~30 minutes (estimate).

      Review your structured passive findings, latent exposure and design verdicts before planning.

      :::findings-panel from=baseline-assessment title="Passive findings"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Foreign-source Modbus writes / DNP3 Direct Operate
      :::

      :::findings-panel from=baseline-assessment title="Latent exposure and required conduits"
      latent-exposure-confirmed: Active probe confirmed latent exposure
      required-cross-zone-conduits: Required cross-zone conduits
      intra-zone-dependencies: Same-zone operational dependencies
      continuity-with-minimal-conduits: Continuity with required conduits
      :::

      :::findings-panel from=segmentation-requirements title="Design verdicts"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Foreign-source Modbus writes / DNP3 Direct Operate
      :::

      ### Other observations you may have made

      A thorough review may include findings that are not in the formal list:

      - **No protocol-aware constraints on ICS ports.** The capture shows traffic on TCP/502 and TCP/20000, but the firewall has no visibility into Modbus or DNP3 function codes. Reads and writes look identical at L4. **Apply Modbus ICS DPI - provide function-code visibility** and **Apply DNP3 ICS DPI - detect and log Direct Operate writes** add detection, not prevention. The L4 source pin enforces; DPI detects and logs.
      - **Firewall visibility has a blind spot at the RTAC.** The RTAC is multi-homed across OT Ops and Field for realism, but its application traffic to field devices is forced through containd by host-level hardening. The hardening is in place, but it is a compensating control, not network-layer enforcement, and it can drift if not periodically validated. This is the gap **Validate and document RTAC hardening** closes.

      These additional observations map to remediation actions just like the formal findings.

      :::hint From finding to planned closure
      An empty passive filter is not a design verdict. Compare the active probe
      result with your Lab 1.3 requirement, then select the action owning that
      source/path. Keep the required poller conduit and any deferred risk explicit.
      :::

  - id: understand-the-team-budget
    title: "Understand the team budget"
    description: |
      You have **500 labor hours** this quarter. Default capacities are:

      | Role | Capacity |
      |---|---:|
      | OT Engineer | 120h |
      | Firewall Admin | 140h |
      | Network Engineer | 120h |
      | Security Analyst | 120h |

      - **OT Engineer** understands substation operations and signs off on changes that could affect control traffic or protection.
      - **Firewall Admin** owns containd policy and applies rules.
      - **Network Engineer** handles network access and zone/interface configuration.
      - **Security Analyst** writes requirements, reviews PCAPs and validates evidence.

      Actions require one or more roles simultaneously. If a role is assigned more work than its capacity, that team is overloaded even if the total 500-hour budget still has room. An action's effort is split evenly across its required roles; for example, an 80h DNP3 DPI action shared by three roles is about 27h per role after rounding.

      Lab 1.3 readiness can reduce caps, increase action effort or block actions with unmet dependencies. **Use default budget** restores the unconstrained model. Blocked choices stay saved but are excluded from the scope and budget totals. Resolve their dependencies before scheduling them.

      Watch the role utilization bars as you select actions. A role in red is over capacity. This is a warning, not an apply limit.

      :::hint Check the constrained role, not only the total
      A 500-hour overall budget does not make every allocation feasible. Compare
      each selected action with the individual role bar. If vendor readiness is
      NEGOTIATING, vendor-restriction effort is multiplied by 1.5; record the
      change-window dependency rather than treating the default estimate as a date.
      :::


  - id: choose-your-remediation-plan
    title: "Choose your remediation plan"
    description: |
      Select a defensible subset in the planner. Some actions change L4
      reachability; others add detection or remain planning-only.

      The L4 source pin enforces; DPI detects and logs. Monitoring never satisfies
      a BLOCK requirement. Planning-only actions do not change the firewall.

      Read each action's **why** and link it to a finding. Check Remaining hours,
      role utilization and readiness. Your selections save automatically. They
      set the change-request scope used to cross-check your hand-written policy
      in Lab 2.2. Keep the written request and the selection in agreement.

      Partial plans are valid. Deferred controls leave their Weak exposures open;
      name the risk and its owner. Required operations cannot be deferred.
      If no eligible actions are selected, there is no change request for the
      **Cross-check the current system**: it uses the full Hardened reference instead.
      Selecting only detection or planning work does not close an exposure.

      Selection does not change the running firewall. Write the implementation,
      tests and rollback in the next step before seeking approval.

    action:
      type: decision

  - id: reflect-what-are-you-accepting
    title: "Write and approve the change request"
    description: |
      :::plan-coverage title="Coverage of your design"
      :::

      ### Write the change request

      Copy this template into **Notes**. Fill it in with your partner. Use names,
      addresses and expected results, not just action titles. Check that the
      approved scope agrees with your saved selections. Do not approve a change
      that removes required operations or firewall management access.

          Change ID / site:
          Findings and approved scope:
          Rule changes (one row per change):
            Order | Source host/zone | Destination host/zone | Service | Allow/deny | Reason
          Roles and labor hours:
          Dependencies and readiness limits:
          Maintenance window (UTC start/end):
          Sequence and operator hold points:
          Pre-change running export / identity / retained location:
          Cut-in: stage deletes and replacements → review full diff → single commit-confirmed → read back → check management and operations → confirm
          Positive acceptance tests:
            Test ID | Source host/zone | Destination | Service | Expected response
          Negative acceptance tests:
            Test ID | Source host/zone | Destination | Service | Expected result
          Abort / rollback triggers:
          Rollback owner and authority:
          Restore steps: withhold confirm until expiry or rollback; if needed import backup, review, commit-confirmed, check, confirm
          Deferred exposures / reason / residual risk / named risk owner:
          Requester:
          Implementer:
          OT reviewer / operator:
          Security reviewer:
          Approver / date:

      Agree rollback triggers before the window. Include lost required traffic,
      unexpected prohibited access, lost management and degraded operator data.

      :::hint Change safety and a restorable backup
      Name who checks management and required operations before `confirm`, who
      withholds confirmation on an abort trigger, and who verifies restoration.
      `commit confirmed <seconds>` restores the previous running config at the
      deadline without `confirm`; `rollback` returns one level immediately.
      Save `export config` JSON (or a browser download) as evidence and a restorable
      backup. Browser import or local/SSH `import config <file>` in fw-1 stages it;
      review and commit to activate it. Reserved management protection refuses
      unsafe changes and rollback targets. Read back and retest after restoration.
      :::

      Ask the OT reviewer to check the operating sequence and acceptance tests.
      Ask the security reviewer to check the source boundaries and deferred risk.
      Obtain approval before Lab 2.2. There you implement this request by hand.
      Lab 2.4 adds the test record and operator sign-off. Planned coverage is not
      evidence of a running change.
