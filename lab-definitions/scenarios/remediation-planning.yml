id: remediation-planning
order: "1.4"
name: "Remediation Planning Under Constraint"
summary: "Choose what to fix first. A finite labor budget forces tradeoffs between firewall changes, protocol controls, and architecture work."
estimated_minutes: 12
validator: us-remediation-planning
description: >
  You have findings from the baseline assessment but not unlimited time, people,
  or political capital. Pick which remediations to execute this quarter - knowing
  some attack paths stay open because you can't fix everything at once.
  Apply Your Plan compiles your selections. Deferred controls leave their Weak exposures open.
nodes: []
tags:
  - planning
  - requirements
  - defense
  - tradeoffs
steps:
  - id: review-the-findings-you-captured
    title: "Review the findings you captured"
    expected_config: weak
    description: |
      **Time budget:** ~12 minutes (Guided path).

      Review your structured passive findings, latent exposure and design verdicts before planning.

      :::findings-panel from=baseline-assessment title="Passive findings"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Foreign-source Modbus writes / DNP3 Direct Operate
      :::

      :::hint Optional depth
      Keep observations, active reachability and design judgments distinct when comparing findings.
      :::

      :::findings-panel from=baseline-assessment title="Latent exposure and required conduits"
      latent-exposure-confirmed: Active probe confirmed latent exposure
      required-cross-zone-conduits: Required cross-zone conduits
      intra-zone-dependencies: Same-zone operational dependencies
      continuity-with-minimal-conduits: Continuity with required conduits
      :::

      :::findings-panel from=segmentation-requirements title="Design verdicts"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Foreign-source Modbus writes / DNP3 Direct Operate
      :::
  - id: understand-the-team-budget
    title: "Understand the team budget"
    description: |
      You have **500 labor hours** this quarter. Default capacities are:

      | Role | Capacity |
      |---|---:|
      | OT Engineer | 120h |
      | Firewall Admin | 140h |
      | Network Engineer | 120h |
      | Security Analyst | 120h |

      - **OT Engineer** reviews operational impact and continuity.
      - **Firewall Admin** configures and reviews firewall policy.
      - **Network Engineer** supports network access and interfaces.
      - **Security Analyst** checks requirements and test evidence.

      An action's effort is split across its required roles. For example, an 80h DNP3 DPI action shared by three roles is about 27h per role after rounding.

      Readiness can change caps, effort or eligibility. Use default budget to compare with the unconstrained model; blocked selections stay saved but are excluded from effective totals and coverage.

      :::hint Optional depth
      Confirm role availability and change windows before treating estimates as a schedule.
      :::
  - id: choose-your-remediation-plan
    title: "Choose your remediation plan"
    description: |
      Select a defensible subset in the planner. Some actions change L4 reachability; others add detection or remain planning-only.

      The L4 source pin enforces; DPI detects and logs. Planning-only actions do not change the running firewall.

      :::hint Optional depth
      Confirm the site test owner and operational window before scheduling policy changes.
      :::
    action:
      type: decision

  - id: reflect-what-are-you-accepting
    title: "Reflect - what are you accepting?"
    description: |
      :::plan-coverage title="Coverage of your design"
      :::

      For discussion:

      1. Which findings do the funded actions address, and what stays open?
      2. What did you defer, why, and who accepts the residual risk?
      3. Which role or readiness constraint binds, and what test shows the work is done?

      Your action selections and design verdicts carry forward as structured inputs. Applying a plan and validating the running policy happen in later labs.

      :::hint Optional depth
      Coverage reports what a plan targets; it is not evidence that live validation has passed.
      :::
