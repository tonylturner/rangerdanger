id: segmentation-requirements
order: "1.3"
name: "Segmentation Requirements & Policy Design"
summary: "Define zone-pair communication requirements and compare your design to the hardened configuration."
estimated_minutes: 10
validator: us-segmentation-requirements
description: >
  Using the baseline assessment findings, define what
  communications should be allowed between each zone pair.
  Apply the principle of least privilege: deny by default,
  allow only named flows required for operations. Then
  compare your requirements to the improved containd
  configuration to see how they translate to firewall rules.
tags:
  - requirements
  - planning
  - segmentation
  - defense
steps:
  - id: translate-findings-into-design-requirements
    title: "Translate findings into design requirements"
    expected_config: weak
    description: |
      **Time budget:** ~10 minutes (Guided path). This is a design and decision lab—no commands to run.

      ### Look at the policy that's running today

      Before you decide what *should* be allowed, look at what the active firewall actually permits right now. Open the [Network Map](/console). On the **left edge** of the map you'll see a narrow vertical strip of icons. Click this one:

      :::icon name="shield" color="amber" label="Segmentation Policy"
      :::

      The Segmentation Policy drawer slides open from the left.

      You'll see:

      - **Active Policy** banner—the **Weak Baseline** is red and named *"All zones can reach field devices directly."*
      - **Evaluation** table—one row per zone pair with an ALLOW or DENY chip. Walk down it and notice how many explicit ALLOW rows exist between Enterprise / Vendor and OT / Field zones. These are exposure paths you observed in Lab 1.2, now confirmed at the policy level. Rows tagged *"(implicit default-deny - no explicit rule)"* are zone pairs that fall through to the firewall's `defaultAction`—denied at the policy edge even though no rule says so directly.

      Now use the dropdown to **preview Hardened Segmentation**—don't click Apply, just inspect. The Evaluation table compares zone-pair action labels, not individual rules or packet tests. Six of the fourteen rows change from ALLOW to DENY or MIXED (a mix of allow and deny rules). Enterprise → Vendor stays ALLOW even though its allowed ports narrow. The six reverse-direction rows remain implicit default-deny; they do not gain explicit logged denies. Rows tagged *"-> would change"* have a different action label from the active policy.

      :::decision id=current-policy-allowable options=MOSTLY_ALLOW,MOSTLY_DENY,MIXED correct=MOSTLY_ALLOW
      How would you characterize the Weak Baseline's zone-pair allow/deny mix?
      :::why
      The Weak Baseline allows most evaluated zone pairs. A policy row describes configured permission, not proof that traffic was observed.
      :::

      :::decision id=hardened-changes-rough-count options=FEW_CHANGES,ABOUT_HALF,MOST_ROWS correct=ABOUT_HALF
      When you preview Hardened Segmentation, roughly what fraction of zone-pair rows show a change?
      :::why
      Six of the fourteen rows change from ALLOW to DENY or MIXED. Enterprise→Vendor remains ALLOW with narrower ports, while reverse-direction rows remain implicit default-deny.
      :::

      :::hint Optional: see the Security Level target for the firewall
      With the **Purdue Model view** toggled on in [/console](/console), hover the **firewall node**. The SL-3 number is a design target only. The badge reports selected segmentation criteria for the conduit: restricted Enterprise/Vendor direct Field access and source-pinned permitted cross-zone Field traffic. `MET` follows the backend-reported active Hardened reference policy, not a packet-path test. Empty, custom, partial or unknown summaries show `NOT ASSESSED`, never `MET`. This is not an IEC 62443 SL assessment. The L4 source pin enforces; DPI detects and logs. See [IEC 62443 Security Levels Explained](/knowledge#iec-62443-security-levels) for what SL-1 through SL-4 mean, and [Purdue Model Levels (L0–L5)](/knowledge#purdue-model) for the architectural levels the bands represent.
      :::

      ### From observation to design

      In Lab 1.2 you observed five exposure categories and selected what was present in the capture. Lab 1.3 is where you decide what the design should *do* about each finding—the firewall's specification, in the form of a verdict per category.

      Your Lab 1.2 findings appear below in panels for passive capture, active reachability and required conduits. Commit to a design verdict for each category. Your verdicts need to address both exposures seen in passive capture and latent paths active probing revealed.

      :::findings-panel from=baseline-assessment title="Passive findings"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Foreign-source Modbus writes / DNP3 Direct Operate
      :::

      :::findings-panel from=baseline-assessment title="Latent exposure and required conduits"
      latent-exposure-confirmed: Active probe confirmed latent exposure
      required-cross-zone-conduits: Required cross-zone conduits
      intra-zone-dependencies: Same-zone operational dependencies
      continuity-with-minimal-conduits: Continuity with required conduits
      :::

      :::decision id=enterprise-to-field
      Enterprise → Field on Modbus/DNP3 — choose your requirement.
      :::why
      Reference design: **BLOCK**. Corporate IT should never speak control-plane protocols to field devices. This closes the direct Enterprise-to-Field exposure.
      :::

      :::decision id=enterprise-to-ot
      Enterprise → OT Operations on ICS ports — choose your requirement.
      :::why
      Reference design: **BLOCK**. Enterprise reaches OT only through constrained management paths, not Modbus or DNP3. This closes the Modbus-override staging path.
      :::

      :::decision id=vendor-to-ot
      Vendor DMZ → OT Operations on Modbus/HMI control — choose your requirement.
      :::why
      Reference design: **RESTRICT**. Vendor remote access stays on encrypted management protocols (HTTPS, SSH), not direct Modbus or HMI control. Those direct paths are the Vendor Remote Access Compromise vector.
      :::

      :::decision id=non-rtac-to-field
      Non-RTAC OT hosts → Field devices — choose your requirement.
      :::why
      Reference design: **BLOCK**. Only the RTAC, pinned to source `10.30.30.20`, should reach field devices. A compromised HMI or OpenPLC must not become an alternate field-control path.
      :::

      :::decision id=unauth-modbus-writes
      Foreign-source Modbus writes / DNP3 Direct Operate — choose your requirement.
      :::why
      Reference design: **BLOCK**. Close enterprise, vendor and non-RTAC paths at L4; do not rely on detection as prevention. The L4 source pin enforces; DPI detects and logs, and neither authorizes commands in an allowed RTAC session.
      :::

      Your design may differ; the reference is guidance, not an answer key. Your verdicts drive Lab 1.4's labor budget against the design you commit.

      :::hint Zone-pair reference (the rules these requirements imply)
      The verdicts above translate into per-zone-pair rules. Use this as a quick reference when you build the policy in Lab 2.2:

      | From → To | Allowed protocols | Notes |
      |---|---|---|
      | Enterprise → Vendor/DMZ | SSH (22), HTTP/S (80, 443) | jump-box access |
      | Enterprise → OT Ops | - | DENY all (1.3 verdict 2) |
      | Enterprise → Field | - | DENY all (1.3 verdict 1) |
      | Vendor/DMZ → OT Ops | SSH (22), HTTPS (443) | management only (1.3 verdict 3 RESTRICT) |
      | Vendor/DMZ → Field | - | DENY all |
      | OT Ops intra-zone | Modbus (502), DNP3 (20000), HTTP (8080), FUXA (1881), NTP (123) | HMI ↔ RTAC, etc. |
      | OT Ops → Field | Modbus (502), DNP3 (20000), HTTP (8080) - **RTAC only** | source-pin to `10.30.30.20` (1.3 verdict 4). HTTP/8080 is the field devices' lab-only status API the RTAC polls for health (`/api/state` on each device); it would not exist on a production relay. |

      Detection layer (1.3 verdict 5):
      - **Apply Modbus ICS DPI - provide function-code visibility** and **Apply DNP3 ICS DPI - detect and log Direct Operate writes** add protocol visibility, not prevention.
      - L4 controls foreign-source reachability. They do not authorize commands within an allowed RTAC session. Keep that residual risk explicit.
      :::
  - id: resourcing-reality-check
    title: "Resourcing reality check"
    expected_config: weak
    description: |
      Real OT segmentation projects fail more often on resourcing than on technology—vendor change windows that never materialise, OT engineers stretched between operations and security work, unclear risk-acceptance authority. Before you pick remediation actions in Lab 1.4, commit to your team's current state. Lab 1.4 will surface dependencies on these answers per action.

      :::decision id=ot-eng-availability options=AVAILABLE,STRETCHED,UNAVAILABLE
      **OT engineering capacity** — is a dedicated OT engineer available for this work, or is the person also covering operations/on-call?
      :::why
      Lab 1.4 gives OT Engineer a 120h cap when AVAILABLE, 60h when STRETCHED, and 0h when UNAVAILABLE; UNAVAILABLE blocks OT-touching work.
      :::

      :::decision id=fw-admin-skills options=IN_HOUSE,VENDOR_LED,GAP
      **Firewall admin skills** — is configuration handled in-house, vendor-led, or by a team with a skills gap?
      :::why
      IN_HOUSE keeps the 140h cap. VENDOR_LED sets 80h and adds 20h per DPI action; GAP sets 40h and blocks DPI actions.
      :::

      :::decision id=vendor-change-window options=SECURED,NEGOTIATING,NOT_DISCUSSED
      **Vendor change windows** — are vendor-touching changes scheduled?
      :::why
      NEGOTIATING multiplies vendor-restriction effort by 1.5; NOT_DISCUSSED blocks vendor-touching actions.
      :::

      :::decision id=risk-acceptance-authority options=CLEAR,UNCLEAR,DISPUTED
      **Risk-acceptance authority** — is the person who accepts residual OT risk clear and agreed?
      :::why
      UNCLEAR leaves signoff pending; DISPUTED blocks high-impact deny actions until authority is resolved.
      :::

      :::hint How readiness appears in the planner
      The total envelope remains 500h. The planner shows original → adjusted values and the answer behind each change. **Use default budget** restores default caps, effort and eligibility for comparison; the setting is saved per package and revision. Readiness-blocked saved choices stay visible but are excluded from draft totals, coverage and Apply Your Plan, even if you change readiness without reopening Lab 1.4. Changing readiness back restores those saved choices. An already-applied plan keeps its recorded provenance and proof expectations. Budget or role overrun alone remains a warning, not an apply limit.
      :::
  - id: define-success-criteria-for-segmentation
    title: "Define success criteria for segmentation"
    description: |
      Before moving on, review what **"good"** looks like for this substation. These are concrete, testable statements—not a plan or a matrix. You will use them in Lab 2.4 (Testing & Validation) to validate that your changes worked.

      ### Good segmentation for this substation means

      1. **Enterprise cannot directly reach Field devices.**
         *Test:* `tcpdump -i lan2` on the firewall (its field interface) should show zero packets originating from `10.10.10.0/24`; new denied connections should report a TCP timeout.

      2. **Vendor access to OT Ops is constrained and brokered.**
         *Test:* vendor DMZ can reach the RTAC/HMI only on approved management ports, not on raw Modbus/DNP3.

      3. **Unauthorized writes are blocked and logged.**
         *Test:* a Modbus FC6 write or DNP3 Direct Operate from a non-RTAC source should be denied and produce a firewall event.

      4. **Enterprise ransomware cannot propagate into OT.**
         *Test:* SMB, RDP, and SSH from `10.10.10.0/24` to `10.30.30.0/24` or `10.40.40.0/24` should be denied.

      5. **Operations are not broken by the segmentation change.**
         *Test:* A/E autonomous and F/G intra-zone operational dependencies continue; B/C/D insecure maintenance tuples fail under the reference in this version. Verify the actual authorized/unauthorized matrix, a healthy HMI and fresh, valid device/process state.

      The L4 source pin enforces; DPI detects and logs, but does not prevent traffic. Keep policy identity, test results, capture and residual-risk ownership together as evidence.

      :::decision id=deny-test-outcome options=TIMEOUT,CONNECTION_REFUSED,OPEN correct=TIMEOUT
      What result shows a denied test path?
      :::why
      A filtered path times out. A refusal means the destination was reached and rejected the connection; it is not the expected deny result.
      :::

      :::decision id=source-pin-enforcement options=L4_SOURCE_PIN,DPI,LOGGING correct=L4_SOURCE_PIN
      Which control enforces a foreign-source boundary?
      :::why
      The L4 source pin enforces reachability; DPI detects and logs matching protocol traffic but does not block it.
      :::

      :::decision id=continuity-evidence options=FRESH_VALID_OPERATIONAL_STATE,CONNECTED_SOCKET_ONLY,STATIC_STATUS_ONLY correct=FRESH_VALID_OPERATIONAL_STATE
      What evidence supports operational continuity after a change?
      :::why
      Use a completed protocol operation with fresh valid observations and healthy device/process state—not a socket or stale status alone.
      :::
