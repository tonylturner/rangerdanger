id: segmentation-requirements
order: "1.3"
name: "Segmentation Requirements & Policy Design"
summary: "Define zone-pair communication requirements and compare your design to the hardened configuration."
estimated_minutes: 10
validator: us-segmentation-requirements
description: >
  Using the baseline assessment findings, define what
  communications should be allowed between each zone pair.
  Apply the principle of least privilege: deny by default,
  allow only named flows required for operations. Then
  compare your requirements to the improved containd
  configuration to see how they translate to firewall rules.
tags:
  - requirements
  - planning
  - segmentation
  - defense
steps:
  - id: translate-findings-into-design-requirements
    title: "Translate findings into design requirements"
    expected_config: weak
    description: |
      **Time budget:** ~10 minutes (Guided path).

      Inspect the **Weak Baseline** in the Segmentation Policy drawer, then preview **Hardened Segmentation** without applying it. The table shows zone-pair outcomes, not packet tests; keep Weak active.

      :::decision id=current-policy-allowable options=MOSTLY_ALLOW,MOSTLY_DENY,MIXED correct=MOSTLY_ALLOW
      How would you characterize the Weak Baseline's zone-pair allow/deny mix?
      :::why
      The Weak Baseline allows most evaluated zone pairs. A policy row describes configured permission, not proof that traffic was observed.
      :::

      :::decision id=hardened-changes-rough-count options=FEW_CHANGES,ABOUT_HALF,MOST_ROWS correct=ABOUT_HALF
      When you preview Hardened Segmentation, roughly what fraction of zone-pair rows show a change?
      :::why
      Six of the fourteen rows change from ALLOW to DENY or MIXED. Enterprise→Vendor remains ALLOW with narrower ports, while reverse-direction rows remain implicit default-deny.
      :::

      :::findings-panel from=baseline-assessment title="Passive findings"
      enterprise-to-field: Enterprise → Field on Modbus/DNP3
      enterprise-to-ot: Enterprise → OT Operations on ICS ports
      vendor-to-ot: Vendor DMZ → OT Operations on Modbus/HMI control
      non-rtac-to-field: Non-RTAC OT hosts → Field devices
      unauth-modbus-writes: Foreign-source Modbus writes / DNP3 Direct Operate
      :::

      :::findings-panel from=baseline-assessment title="Latent exposure and required conduits"
      latent-exposure-confirmed: Active probe confirmed latent exposure
      required-cross-zone-conduits: Required cross-zone conduits
      intra-zone-dependencies: Same-zone operational dependencies
      continuity-with-minimal-conduits: Continuity with required conduits
      :::

      :::decision id=enterprise-to-field
      Enterprise → Field on Modbus/DNP3 — choose your requirement.
      :::why
      Reference design: **BLOCK**. Corporate IT should not reach field devices over control protocols.
      :::

      :::decision id=enterprise-to-ot
      Enterprise → OT Operations on ICS ports — choose your requirement.
      :::why
      Reference design: **BLOCK**. Enterprise access to OT stays on constrained management paths, not Modbus or DNP3.
      :::

      :::decision id=vendor-to-ot
      Vendor DMZ → OT Operations on Modbus/HMI control — choose your requirement.
      :::why
      Reference design: **RESTRICT**. Permit named encrypted management access, not direct Modbus or HMI control.
      :::

      :::decision id=non-rtac-to-field
      Non-RTAC OT hosts → Field devices — choose your requirement.
      :::why
      Reference design: **BLOCK**. The RTAC is the field-control source; pin field access to its OT Ops address.
      :::

      :::decision id=unauth-modbus-writes
      Foreign-source Modbus writes / DNP3 Direct Operate — choose your requirement.
      :::why
      Reference design: **BLOCK**. Close foreign-source paths at L4. The L4 source pin enforces; DPI detects and logs. Detection alone cannot meet a BLOCK requirement.
      :::
  - id: resourcing-reality-check
    title: "Resourcing reality check"
    expected_config: weak
    description: |
      Before planning, select the team's current readiness. The answers below adjust capacity, effort and action eligibility in Lab 1.4.

      :::decision id=ot-eng-availability options=AVAILABLE,STRETCHED,UNAVAILABLE
      **OT engineering capacity** — is a dedicated OT engineer available for this work, or is the person also covering operations/on-call?
      :::why
      Lab 1.4 gives OT Engineer a 120h cap when AVAILABLE, 60h when STRETCHED, and 0h when UNAVAILABLE; UNAVAILABLE blocks OT-touching work.
      :::

      :::decision id=fw-admin-skills options=IN_HOUSE,VENDOR_LED,GAP
      **Firewall admin skills** — is configuration handled in-house, vendor-led, or by a team with a skills gap?
      :::why
      IN_HOUSE keeps the 140h cap. VENDOR_LED sets 80h and adds 20h per DPI action; GAP sets 40h and blocks DPI actions.
      :::

      :::decision id=vendor-change-window options=SECURED,NEGOTIATING,NOT_DISCUSSED
      **Vendor change windows** — are vendor-touching changes scheduled?
      :::why
      NEGOTIATING multiplies vendor-restriction effort by 1.5; NOT_DISCUSSED blocks vendor-touching actions.
      :::

      :::decision id=risk-acceptance-authority options=CLEAR,UNCLEAR,DISPUTED
      **Risk-acceptance authority** — is the person who accepts residual OT risk clear and agreed?
      :::why
      UNCLEAR leaves signoff pending; DISPUTED blocks high-impact deny actions until authority is resolved.
      :::
  - id: define-success-criteria-for-segmentation
    title: "Define success criteria for segmentation"
    description: |
      Use these shared pass/fail criteria as a reference before planning:

      - A denied path should time out (expected result: timeout); connection refused means the host was reached.
      - Restrict engineering access to named sources and services; close unrelated remote access.
      - Preserve A/E autonomous and F/G intra-zone operations; the B/C/D maintenance paths fail under the reference in this version.
      - Verify fresh, valid device/process state after a change.
      - The L4 source pin enforces; DPI detects and logs but does not prevent traffic.
      - Keep policy identity, test results, capture and residual-risk ownership together as evidence.

      :::decision id=deny-test-outcome options=TIMEOUT,CONNECTION_REFUSED,OPEN correct=TIMEOUT
      What result shows a denied test path?
      :::why
      A filtered path times out. A refusal means the destination was reached and rejected the connection; it is not the expected deny result.
      :::

      :::decision id=source-pin-enforcement options=L4_SOURCE_PIN,DPI,LOGGING correct=L4_SOURCE_PIN
      Which control enforces a foreign-source boundary?
      :::why
      The L4 source pin enforces reachability; DPI detects and logs matching protocol traffic but does not block it.
      :::

      :::decision id=continuity-evidence options=FRESH_VALID_OPERATIONAL_STATE,CONNECTED_SOCKET_ONLY,STATIC_STATUS_ONLY correct=FRESH_VALID_OPERATIONAL_STATE
      What evidence supports operational continuity after a change?
      :::why
      Use a completed protocol operation with fresh valid observations and healthy device/process state—not a socket or stale status alone.
      :::
