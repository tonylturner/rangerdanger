    # OpenPLC (OT Ops zone)
    location /apps/openplc/ {
      set $u http://openplc:8080;
      rewrite ^/apps/openplc/(.*)$ /$1 break;
      proxy_pass $u;
      proxy_set_header Host $http_host;
      proxy_hide_header X-Frame-Options;
      proxy_redirect / /apps/openplc/;
      proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$http_host/apps/openplc$1;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter "'/static/" "'/apps/openplc/static/";
    }


    # Friendly hint if someone hits /apps without a service suffix
    location = /apps {
      return 404 "Use /apps/hmi/ /apps/hmi-control/ /apps/ews/ /apps/jumpbox/ /apps/plc/ /apps/firewall/ /apps/corp-ws/ /apps/vendor-jump/ /apps/eng-ws/ /apps/fuxa-hmi/ /apps/openplc/";
    }
