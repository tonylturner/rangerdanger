    # FUXA HMI (OT Ops zone) - API and socket.io first
    location /apps/fuxa-hmi/api/ {
      set $u http://fuxa_hmi:1881;
      rewrite ^/apps/fuxa-hmi/api/(.*)$ /api/$1 break;
      proxy_pass $u;
