    location /apps/fuxa-hmi/ {
      set $u http://fuxa_hmi:1881;
      rewrite ^/apps/fuxa-hmi/(.*)$ /$1 break;
      proxy_pass $u;
      proxy_redirect http://fuxa_hmi/ /apps/fuxa-hmi/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
