      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400;
    }

    location /apps/hmi-control/ {
      set $u http://fuxa_hmi:1881;
      rewrite ^/apps/hmi-control/(.*)$ /$1 break;
      proxy_pass $u;
      proxy_redirect http://hmi_control/ /apps/hmi-control/;
