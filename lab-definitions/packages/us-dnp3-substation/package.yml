# The US workshop package. Its topology and scenarios stay where they have
# always lived; this file only declares that the package owns them.
schema: 1
id: us-dnp3-substation
title: "US distribution substation (DNP3)"
# Curriculum revision: bump when step IDs or validator meaning change.
# Browser progress is keyed by it.
revision: 4
topology: ../../substation-segmentation.yml
knowledge: knowledge/index.yml
scenarios: ../../scenarios
capabilities: [process.electrical, policy.containd, audit.device-control, capture.firewall]
# Named policies the firewall buttons and lab actions apply, relative to
# this file. The topology's firewall_config is the default and must be one
# of them.
policies:
  weak:
    file: ../../firewall/substation-weak.json
    label: Weak Baseline
    description: Cross-zone attacks succeed under this policy.
  improved:
    file: ../../firewall/substation-improved.json
    label: Hardened Segmentation
    description: The reference segmentation policy for this range.
operator_view: us-dnp3-substation
course:
  nodes: nodes.yml
  modules:
  - id: section-1
    title: Section 1
    activities:
    - scenario: baseline-assessment
      label: '1.2'
      hideBanner: true
      validate: false
    - scenario: segmentation-requirements
      label: '1.3'
      hideBanner: true
      validate: false
    - scenario: remediation-planning
      label: '1.4'
      hideBanner: true
      validate: false
  - id: section-2
    title: Section 2
    activities:
    - scenario: firewall-implementation
      label: '2.2'
      policyActions: true
      hideBanner: true
    - scenario: hardening-configurations
      label: '2.3'
      policyActions: true
    - scenario: vendor-rdp-compromise
      label: 2.3-bonus
      policyActions: true
    - scenario: validation-evidence
      label: '2.4'
      policyActions: true
  features:
    segmentationPlan:
      dir: curriculum
      activities:
        requirements: segmentation-requirements
        planning: remediation-planning
        implementation: firewall-implementation
      dynamicSteps:
        phase-3-create-minimal-required-rules: rules
        phase-5-validate-allowed-traffic: positive
        phase-6-validate-blocked-traffic: negative
