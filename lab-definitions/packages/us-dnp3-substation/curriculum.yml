# field-intrazone from Weak is omitted: lan2 → lan2 stays on the bridge.
# pin-rtac-to-field also owns the non-GPS UDP/123 restriction.
# The required HTTP rule preserves the reference policy's empty ICS object.
# No global management/return ALLOW rules: management comes from the envelope.
plan:
  rules:
  - action: restrict-enterprise-to-vendor
    selected:
    - id: enterprise-to-vendor-only
      description: 'Enterprise to Vendor: SSH, HTTP/S only (no direct OT access)'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:vendor_net}
      protocols:
      - name: tcp
        port: '22'
      - name: tcp
        port: '80'
      - name: tcp
        port: '443'
      ics: {}
      action: ALLOW
    deferred:
    - id: enterprise-to-vendor
      description: 'Enterprise to Vendor: SSH, HTTP/S, RDP, VNC'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:vendor_net}
      protocols:
      - name: tcp
        port: '22'
      - name: tcp
        port: '80'
      - name: tcp
        port: '443'
      - name: tcp
        port: '3389'
      - name: tcp
        port: '5900'
      ics: {}
      action: ALLOW
  - action: block-enterprise-to-ot
    selected:
    - id: deny-enterprise-to-ot
      description: 'BLOCK: Enterprise cannot reach OT Operations (Modbus, DNP3, HTTP, HMI)'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:ot_ops_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '1881'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: DENY
    deferred:
    - id: enterprise-to-ot-weak
      description: 'WEAK: Enterprise direct access to OT Operations (should be blocked)'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:ot_ops_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '1881'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: ALLOW
  - action: block-enterprise-to-field
    selected:
    - id: deny-enterprise-to-field
      description: 'BLOCK: Enterprise cannot reach Field Devices (Modbus, DNP3, or HTTP)'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: DENY
    deferred:
    - id: enterprise-to-field-weak
      description: 'WEAK: Enterprise direct Modbus/DNP3/HTTP access to Field Devices (should be blocked)'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: ALLOW
  - action: restrict-vendor-to-ot
    selected:
    - id: vendor-to-ot-restricted
      description: 'Vendor to OT: HTTPS and SSH only for monitoring (no Modbus, no HMI control)'
      sourceZones:
      - ${zone:vendor_net}
      destZones:
      - ${zone:ot_ops_net}
      protocols:
      - name: tcp
        port: '443'
      - name: tcp
        port: '22'
      ics: {}
      action: ALLOW
    deferred:
    - id: vendor-to-ot-weak
      description: 'WEAK: Vendor broad access to OT Operations including Modbus/DNP3 (should be narrowed)'
      sourceZones:
      - ${zone:vendor_net}
      destZones:
      - ${zone:ot_ops_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '1881'
      - name: tcp
        port: '22'
      - name: tcp
        port: '443'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: ALLOW
  - action: block-vendor-to-field
    selected:
    - id: deny-vendor-to-field
      description: 'BLOCK: Vendor cannot reach Field Devices directly (no Modbus, no DNP3, no HTTP)'
      sourceZones:
      - ${zone:vendor_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: DENY
    deferred:
    - id: vendor-to-field-weak
      description: 'WEAK: Vendor direct Modbus/DNP3/HTTP access to Field Devices (should be blocked)'
      sourceZones:
      - ${zone:vendor_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: ALLOW
  - required:
      id: rtac-to-field-modbus
      description: 'RTAC to Field Devices: Modbus TCP read/write (supervisory control only)'
      sourceZones:
      - ${zone:ot_ops_net}
      destZones:
      - ${zone:field_net}
      sources:
      - ${ip:rtac-1}/32
      protocols:
      - name: tcp
        port: '502'
      action: ALLOW
  - required:
      id: rtac-to-field-dnp3
      description: 'RTAC to Field Devices: DNP3 TCP - the L4 source pin enforces RTAC field access; DPI detects
        and logs function codes, including Direct Operate (FC5) and No-Ack (FC6).'
      sourceZones:
      - ${zone:ot_ops_net}
      destZones:
      - ${zone:field_net}
      sources:
      - ${ip:rtac-1}/32
      protocols:
      - name: tcp
        port: '20000'
      action: ALLOW
  - required:
      id: rtac-to-field-http
      description: 'RTAC to Field Devices: HTTP API (supervisory management)'
      sourceZones:
      - ${zone:ot_ops_net}
      destZones:
      - ${zone:field_net}
      sources:
      - ${ip:rtac-1}/32
      protocols:
      - name: tcp
        port: '8080'
      ics: {}
      action: ALLOW
  - action: pin-rtac-to-field
    selected:
    - id: deny-ot-to-field-direct
      description: 'BLOCK: Other OT nodes cannot Modbus/DNP3/HTTP to Field Devices (prevents lateral movement)'
      sourceZones:
      - ${zone:ot_ops_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: DENY
    deferred:
    - id: ot-to-field-broad
      description: 'WEAK: All OT Operations nodes can Modbus/DNP3/HTTP to all Field Devices (should be RTAC only)'
      sourceZones:
      - ${zone:ot_ops_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      ics: {}
      action: ALLOW
    - id: ntp-ot-to-field
      description: 'WEAK: NTP time sync from OT ops to field (no source restriction)'
      sourceZones:
      - ${zone:ot_ops_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: udp
        port: '123'
      ics: {}
      action: ALLOW
  - required:
      id: ot-intrazone-ops
      description: 'OT Operations internal: HMI↔RTAC Modbus, DNP3, HTTP, FUXA, NTP'
      sourceZones:
      - ${zone:ot_ops_net}
      destZones:
      - ${zone:ot_ops_net}
      protocols:
      - name: tcp
        port: '8080'
      - name: tcp
        port: '1881'
      - name: tcp
        port: '502'
      - name: tcp
        port: '20000'
      - name: udp
