budgetHours: 500
teams:
  - name: OT Engineer
    capacity_hours: 120
  - name: Firewall Admin
    capacity_hours: 140
  - name: Network Engineer
    capacity_hours: 120
  - name: Security Analyst
    capacity_hours: 120
catalog:
  - id: restrict-enterprise-to-vendor
    title: Restrict enterprise → vendor remote access
    why: Remove direct enterprise RDP/VNC access to the vendor jump box; retain only the package’s named operational
      exceptions.
    effort_hours: 30
    roles:
    - Firewall Admin
    - Network Engineer
    tags:
    - enterprise-vendor
  - id: block-enterprise-to-field
    title: Block enterprise → field direct access
    why: |
      Removes the Modbus 502, DNP3 20000, and HTTP 8080 paths from the corporate IT zone straight to relays and reclosers. Closes the DNP3 command injection attack surface stress-tested in the Protocol-Hardened Configurations exercise.
    effort_hours: 40
    roles:
      - Firewall Admin
      - Security Analyst
    tags:
      - enterprise-field
  - id: block-enterprise-to-ot
    title: Block enterprise → OT Operations ICS ports
    why: |
      Removes enterprise access to HMI, RTAC, and OpenPLC on Modbus, DNP3, HMI web, and management HTTP. Blocks the Modbus override staging path that assumes an enterprise foothold.
    effort_hours: 30
    roles:
      - Firewall Admin
      - Security Analyst
    tags:
      - enterprise-ot
  - id: restrict-vendor-to-ot
    title: Restrict vendor → OT to SSH/HTTPS only
    why: |
      Vendor remote access should be monitoring and administration via encrypted management protocols, not direct Modbus or HMI web. Reduces the blast radius of a compromised vendor credential and closes the Vendor Remote Access Compromise pivot path.
    effort_hours: 50
    roles:
      - Firewall Admin
      - Network Engineer
      - OT Engineer
    tags:
      - vendor
  - id: block-vendor-to-field
    title: Block vendor → field devices entirely
    why: |
      There is no legitimate reason for the vendor DMZ to reach field devices directly. The engineering workstation should drive field work through the RTAC or via OT Ops, not via bare Modbus or DNP3 from the vendor zone.
    effort_hours: 30
    roles:
      - Firewall Admin
      - OT Engineer
    tags:
      - vendor
      - vendor-field
  - id: pin-rtac-to-field
    title: Pin field-device access to RTAC source IP
    why: |
      Restricts OT Ops → field rules to source ${ip:rtac-1} only (the RTAC's OT Ops interface, which is the wire-visible source after RTAC host-level hardening), so a compromised OpenPLC or historian cannot reach relays directly even from inside OT Ops. Closes the Modbus-override lateral path, hardened in the Protocol-Hardened Configurations exercise.
    effort_hours: 40
    roles:
      - Firewall Admin
      - OT Engineer
    tags:
      - ot-lateral
  - id: modbus-dpi
    title: Apply Modbus ICS DPI - provide function-code visibility
    why: |
      Modbus DPI provides function-code visibility and detects and logs writes. The L4 source pin enforces field access from the RTAC source address.
    effort_hours: 70
    roles:
      - Firewall Admin
      - OT Engineer
      - Security Analyst
    tags:
      - dpi
      - modbus
  - id: dnp3-dpi
    title: Apply DNP3 ICS DPI - detect and log Direct Operate writes
    why: |
      DNP3 DPI provides function-code visibility and detects and logs Direct Operate writes (FC05 and No-Ack FC06). The L4 source pin enforces field access from the RTAC source address.
    effort_hours: 80
    roles:
      - Firewall Admin
      - OT Engineer
      - Security Analyst
    tags:
      - dpi
      - dnp3
  - id: improve-logging
    title: Improve firewall logging and PCAP retention
    why: |
      Enable per-rule logging, keep rolling PCAPs on cross-zone interfaces, and forward events to syslog. Without this, post-incident review of attempted attacks is blind.
    effort_hours: 50
    roles:
      - Firewall Admin
      - Security Analyst
    tags:
      - visibility
  - id: rtac-architecture-review
    title: Validate and document RTAC hardening
    why: |
      The RTAC is multi-homed across OT Ops and Field for realism but is hardened at the host level so its application traffic to field devices is forced through the firewall. Validate that the hardening is in place (ip_forward=0, FORWARD DROP, policy routing for field subnet via OT Ops firewall), document it as a compensating control for auditors, and add a periodic check to detect drift. Defense in depth for the intra-zone flows the firewall still cannot see.
    effort_hours: 30
    roles:
      - OT Engineer
      - Security Analyst
    tags:
      - architecture
      - defense-in-depth
  - id: tighten-firewall-objects
    title: Tighten firewall object hygiene
    why: |
      Replace broad /24 matches with host objects for RTAC, HMI, historian, GPS. Name and document each rule. Reduces drift and makes the next audit defensible.
    effort_hours: 40
    roles:
      - Firewall Admin
      - Network Engineer
    tags:
      - hygiene
  - id: positive-validation
    title: Post-change positive/negative validation
    why: |
      Build a test plan that verifies legitimate flows still work and illegitimate flows are blocked, with captured PCAP evidence. Required for acceptance of the change and for the Testing & Validation exercise.
    effort_hours: 60
    roles:
      - Security Analyst
      - OT Engineer
    tags:
      - validation
  - id: ids-deployment
    title: Deploy IDS sensors with ICS rule packs on OT zones
    why: |
      Add Snort/Suricata or Zeek sensors on the OT Ops and Field interfaces with industrial protocol rule packs. The firewall blocks; the IDS detects anomalies the firewall doesn't deny - unusual scan patterns, malformed Modbus frames, DNP3 sequence anomalies. Pairs with the Testing & Validation exercise: an IDS alert chain is a stronger evidence package than firewall logs alone. Different team and timeline than the firewall work itself.
    effort_hours: 80
    roles:
      - Security Analyst
      - Network Engineer
    tags:
      - detection
      - ids
  - id: ot-asset-inventory
    title: Build OT asset inventory + change baseline
    why: |
      Enumerate every device on OT Ops and Field - MAC, software version, exposed services, ownership, last-patched date. Without an inventory, change management is by hope: you cannot detect when an unknown device appears, when firmware drifts, or when a vendor swaps a relay during a maintenance window. Foundation work that pays off across every later defense, but its cost-to-attribute is hard to defend in a tight quarter.
    effort_hours: 100
    roles:
      - Security Analyst
      - OT Engineer
      - Network Engineer
    tags:
      - foundation
      - inventory
  - id: vendor-zta-broker
    title: Replace vendor VPN with ZTNA / PAM broker
    why: |
      Stand up a Privileged Access Management broker (BeyondTrust, CyberArk, Cyolo) or a Zero-Trust Network Access path (Zscaler, Tailscale) for vendor support sessions. Just-in-time access, MFA, full session recording, per-action audit trail. Closes more of the Vendor Remote Access Compromise kill chain than restrict-vendor-to-ot alone, because the vendor's path is closed by default and opens only for scheduled windows under identity. Heaviest organizational change in this list - requires vendor contract amendments.
    effort_hours: 150
    roles:
      - Network Engineer
      - Firewall Admin
      - Security Analyst
    tags:
      - vendor
      - modernization
      - identity
impact:
  block-enterprise-to-field:
    defends:
      - hardening-configurations
    note: Blocks enterprise → field — closes the DNP3 command-injection path demonstrated in Lab 2.3
  block-enterprise-to-ot:
    defends:
      - hardening-configurations
    note: Blocks enterprise → OT Ops — removes the staging foothold for the Modbus override demonstrated in Lab 2.3
  restrict-vendor-to-ot:
    defends:
      - vendor-rdp-compromise
    note: Restricts vendor → OT to encrypted management protocols — narrows the vendor pivot lane in Lab 2.3-bonus
  block-vendor-to-field:
    defends:
      - vendor-rdp-compromise
    note: Blocks vendor → field entirely — closes the second hop of the vendor RDP/VNC kill chain in Lab 2.3-bonus
  pin-rtac-to-field:
    defends:
      - hardening-configurations
    note: Pins field access to the RTAC source IP — prevents the lateral Modbus override demonstrated in Lab 2.3
  modbus-dpi:
    defends:
      - hardening-configurations
    note: Modbus DPI provides function-code visibility and detects and logs writes; the L4 source pin enforces field access from the RTAC source address (Lab 2.3 DPI lesson)
  dnp3-dpi:
    defends:
      - hardening-configurations
    note: DNP3 DPI provides function-code visibility and detects and logs Direct Operate writes; the L4 source pin enforces field access from the RTAC source address (Lab 2.3 DPI lesson)
  positive-validation:
    defends:
      - validation-evidence
    note: Planning-only test preparation. Run Lab 2.4 to collect the evidence package.
  ids-deployment:
    defends:
      - validation-evidence
    note: Planning-only sensor work. Selecting it deploys no IDS and changes no firewall verdict.
  ot-asset-inventory:
    defends:
      - validation-evidence
    note: Planning-only inventory work. Selecting it creates no inventory and changes no firewall verdict.
  vendor-zta-broker:
    defends:
      - vendor-rdp-compromise
    note: Planning-only ZTNA/PAM review. Selecting it deploys no broker and changes no pivot result.
groups:
  block-enterprise-to-field:
    title: Block enterprise → field direct access
    description: Remove the paths from the corporate IT zone straight to field relays and reclosers.
    effect: closes
  block-enterprise-to-ot:
    title: Block enterprise → OT Operations ICS ports
    description: Remove enterprise access to HMI, RTAC, and OpenPLC on ICS and management ports.
    effect: closes
  restrict-vendor-to-ot:
    title: Restrict vendor → OT to SSH/HTTPS only
    description: Vendor remote access limited to encrypted management protocols. No direct Modbus or HMI web.
    effect: restricts
  block-vendor-to-field:
    title: Block vendor → field devices entirely
    description: No legitimate reason for the vendor DMZ to reach field devices directly.
    effect: closes
  pin-rtac-to-field:
    title: Pin field-device access to RTAC source IP
    description: Only the RTAC (${ip:rtac-1}) can reach field devices from OT Ops. The RTAC ALLOW rules above this DENY take priority (first-match), so RTAC traffic passes while all other OT Ops hosts are blocked.
    effect: restricts
  modbus-dpi:
    title: Modbus ICS DPI — function-code visibility
    description: Modbus DPI provides function-code visibility and detects and logs writes. The L4 source pin enforces field access from the RTAC source address.
    effect: semantic
  dnp3-dpi:
    title: DNP3 ICS DPI — Direct Operate detection
    description: DNP3 DPI provides function-code visibility and detects and logs Direct Operate writes. The L4 source pin enforces field access from the RTAC source address.
    effect: semantic
  improve-logging:
    title: Enable firewall logging and PCAP retention
    description: Enable per-rule logging on all deny actions and critical allow rules. Without this, post-incident review is blind.
    effect: logging
  tighten-firewall-objects:
    title: Tighten firewall object hygiene
    description: Planning-only object review. Required RTAC and GPS pins already exist; this action changes no rule.
    effect: restricts
  positive-validation:
    title: Post-change positive/negative validation
    description: Build a test plan that verifies legitimate flows still work and illegitimate flows are blocked.
    effect: conceptual
  rtac-architecture-review:
    title: Validate and document RTAC hardening
    description: Verify RTAC host-level hardening (ip_forward=0, FORWARD DROP, policy routing). Document as a compensating control.
    effect: conceptual
phases:
  rules: |-
    Review the compiled rules for this plan. Required rules stay in every plan.
    Selected enforceable actions narrow their paths. Deferred rules retain the
    same Weak exposures. Detection-only actions change no TCP verdict.
    The L4 source pin enforces; DPI detects and logs.

    :::guided
    Click **Apply Your Plan**, or **Apply Hardened** for the reference.
    An empty or planning-only plan is valid. It leaves Weak exposures open.
    Inspect the running rules, not just the policy banner. Execute Step checks
    the active policy without replacing it.
    :::

    :::technical
    For a plan, use the compiled rule order without adding broad allows.
    For manual work, use Hardened as the judging target. With
    `restrict-enterprise-to-vendor` selected, replace broad enterprise→vendor
    access with TCP 22, 80 and 443. With it deferred, RDP/3389 and VNC/5900
    remain reachable. **Create rule** and **Delete** do not reload the firewall.
    Run `commit` at `containd#` or **Commit** on the **Configuration** page.
    After commit, run `nmap -Pn -p 3389,5900 10.20.20.10` from Kali.
    For the manual Hardened target, both ports must be `filtered`; if not,
    fix the rule and commit again. A plan uses its compiled verdict instead.
    :::

    Keep the RTAC source `10.30.30.20/32` on its required field rules:
    TCP/502, TCP/20000 and TCP/8080. Preserve GPS `10.30.30.50/32` NTP/123
    and HMI operations. These operational paths cannot be deferred.

    :::hint Policy evidence at the containd CLI
    At `containd#`, `export config` prints JSON; it does not create a file:

        export config

    Copy the output into your evidence. Do not use shell redirection.
    This reference example includes detection; it is not the whole policy:

        {
          "id": "rtac-to-field-modbus",
          "sourceZones": ["lan1"],
          "destZones": ["lan2"],
          "sources": ["10.30.30.20/32"],
          "protocols": [{"name": "tcp", "port": "502"}],
          "ics": {"protocol": "modbus", "functionCode": [1, 2, 3, 4, 5, 6]},
          "action": "ALLOW",
          "log": true
        }
    :::

    Export the compiled config and the companion **Export plan record**.
    The record contains the package ID, revision, label, action IDs and policy
    hash. Use `GET /api/firewall/active` to check what is running.

    ### Compiled rules

    {{noPlan}}
    {{ruleTable}}
  positive: |-
    Verify operations for every plan. From the RTAC terminal, run:

        mbpoll -a 1 -r 1 -c 4 -1 -t 0 10.40.40.20
        dnp3poll -a 1 -t 3s 10.40.40.20:20000

    Both should return data. Check field `device_comms` with:

        curl -s http://10.30.30.20:8080/api/state | python3 -m json.tool

    Open the HMI. Confirm no alarms, closed breaker and recloser, auto-reclose
    on and energized loads. Check GPS NTP separately; the proof matrix is TCP.
    All eight authorized TCP rows must remain reachable for every plan.
    Bridged rows do not cross the firewall and do not prove a firewall rule.
    Lab 2.4 separates plan proof from Hardened acceptance: 8/8 authorized and
    13/13 unauthorized denied, 0 skipped, stable hash, capture and healthy HMI.

    From an OT Ops terminal, check the intra-zone HMI service:

        curl -sf http://10.30.30.10:1881 --connect-timeout 3

    This check must work for every plan. It is not routed firewall proof.

    ### Compiled expectations

    {{tests}}
  negative: |-
    Test the expected outcomes for the applied plan, not its label.
    Run all 13 unauthorized TCP rows from their named sources in Lab 2.4.
    A deny verdict requires a connection timeout. Connection refused means
    reached (allow). Tool or container errors are skipped evidence and fail proof.

    | Path | Owning action | Selected / deferred |
    |---|---|---|
    | Kali→vendor RDP/3389 and VNC/5900 | `restrict-enterprise-to-vendor` | deny / allow |
    | Enterprise→OT ICS and web | `block-enterprise-to-ot` | deny / allow |
    | Enterprise→field | `block-enterprise-to-field` | deny / allow |
    | Vendor→OT Modbus and web | `restrict-vendor-to-ot` | deny / allow |
    | Vendor and eng-ws→field | `block-vendor-to-field` | deny / allow |
    | Non-RTAC OT hosts→field | `pin-rtac-to-field` | deny / allow |

    A deferred exposure is a prevention gap against Hardened, not a failed
    plan proof if it matches this plan. Do not change policy just to hide the gap.
    Preserve timestamps and the running hash. `show audit` lists `config.commit` evidence,
    not a per-flow verdict. Keep capture and HMI evidence with both results.

    :::hint Run the sampled protocol checks from their real sources
    From Kali, test the enterprise-to-field action:

        mbpoll -a 1 -r 1 -c 4 -1 -t 0 -o 3 10.40.40.20
        dnp3poll -a 1 -t 3s 10.40.40.20:20000

    From eng-ws, test the vendor-to-field action:

        mbpoll -a 1 -r 1 -c 4 -1 -t 0 -o 3 10.40.40.23

    From vendor-jump, test that same action independently:

        dnp3poll -a 1 -t 3s 10.40.40.20:20000
        mbpoll -a 1 -r 1 -c 4 -1 -t 0 -o 3 10.40.40.20

    Selected means timeout; deferred means reachable. These sampled commands
    do not replace the full report matrix. Execute Step checks the running
    policy. Preserve the observation and the report verdict.
    :::

    ### Compiled expectations

    {{tests}}
tests:
  - kind: positive
    text: |-
      Verify current RTAC application/device state (TCP reachability alone is not operational proof):

          curl -s http://${ip:rtac-1}:8080/api/state | python3 -m json.tool
negativeEmpty: Deferred controls leave their Weak exposures open. Run the full compiled proof matrix and retain the Hardened comparison.
