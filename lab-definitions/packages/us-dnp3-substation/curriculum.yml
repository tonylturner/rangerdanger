dpiNotice:
  title: ICS DPI enabled
  description: ' - containd provides Modbus/DNP3 function-code visibility and detects and logs writes; the L4 source pin enforces field access from the RTAC source address'
dpiForbiddenNotice:
  title: ICS DPI planned
  description: ', not enforceable in this range yet'

# field-intrazone from Weak is omitted: lan2 → lan2 stays on the bridge.
# pin-rtac-to-field also owns the non-GPS UDP/123 restriction.
# The required HTTP rule preserves the reference policy's empty ICS object.
# No global management/return ALLOW rules: management comes from the envelope.
plan:
  rules:
  - action: restrict-enterprise-to-vendor
    selected:
    - id: enterprise-to-vendor-only
      description: 'Enterprise to Vendor: SSH, HTTP/S only (no direct OT access)'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:vendor_net}
      protocols:
      - name: tcp
        port: '22'
      - name: tcp
        port: '80'
      - name: tcp
        port: '443'
      ics: {}
      action: ALLOW
    deferred:
    - id: enterprise-to-vendor
      description: 'Enterprise to Vendor: SSH, HTTP/S, RDP, VNC'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:vendor_net}
      protocols:
      - name: tcp
        port: '22'
      - name: tcp
        port: '80'
      - name: tcp
        port: '443'
      - name: tcp
        port: '3389'
      - name: tcp
        port: '5900'
      ics: {}
      action: ALLOW
  - action: block-enterprise-to-ot
    selected:
    - id: deny-enterprise-to-ot
