impact:
  block-enterprise-to-field:
    defends:
    - eu-hardening-configurations
    note: Close direct corporate Modbus access to the feeder; an unused path is still exposure.
  block-enterprise-to-station:
    defends:
    - eu-hardening-configurations
    note: Close enterprise IEC 104 access to RTU; only the named CC should initiate telecontrol.
  restrict-vendor-to-station:
    defends:
    - eu-hardening-configurations
    note: Replace broad vendor-zone trust with named engineering PLC web access; field control is separate.
  block-vendor-to-field:
    defends:
    - eu-hardening-configurations
    note: Remove direct vendor Modbus access even if a compromised remote-access foothold exists.
  pin-rtu-to-field:
    defends:
    - eu-hardening-configurations
    note: Keep RTU field polling and the explicit PLC→OLTC exception; exclude other station sources.
  modbus-dpi:
    defends:
    - eu-hardening-configurations
    note: Planning-only protocol review. No Modbus inspection or verdict change is emitted.
  iec104-dpi:
    defends:
    - eu-hardening-configurations
    note: Observe CC breaker and OLTC commands with explicit monitor rules; never admits or denies traffic.
  improve-logging:
    defends:
    - eu-hardening-configurations
    note: Planning-only evidence review. Required diagnostic denies always log; this action changes no rule.
  station-architecture-review:
    defends:
    - eu-validation-evidence
    note: Planning-only review of RTU/PLC/GPS same-subnet trust and endpoint authority; no policy effect.
  tighten-firewall-objects:
    defends:
    - eu-hardening-configurations
    note: Pin historian reader/ingest destinations and separate read 8080 from CC ingest 8081.
  positive-validation:
    defends:
    - eu-validation-evidence
    note: 'Planning-only validation work: authorized operations, denied exposures and bounded evidence.'
  ids-deployment:
    defends:
    - eu-validation-evidence
    note: 'Planning-only detection work: sensors, rule tuning and response ownership; no sensor is deployed here.'
  ot-asset-inventory:
    defends:
    - eu-validation-evidence
    note: Planning-only inventory and drift baseline for station and field assets.
  vendor-zta-broker:
    defends:
    - eu-validation-evidence
    note: Planning-only identity, MFA, approval and recorded-session work; no broker is deployed here.
