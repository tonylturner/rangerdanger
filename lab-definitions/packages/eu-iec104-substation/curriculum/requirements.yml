requirements:
  enterprise-to-field:
    label: Enterprise/vendor → five field devices on Modbus/502
    impl:
      BLOCK:
      - block-enterprise-to-field
      - block-vendor-to-field
      BLOCK and LOG:
      - block-enterprise-to-field
      - block-vendor-to-field
  enterprise-to-station:
    label: Enterprise → station RTU on IEC 104/2404
    impl:
      BLOCK:
      - block-enterprise-to-station
      BLOCK and LOG:
      - block-enterprise-to-station
  vendor-to-station:
    label: Vendor DMZ → station (engineering access)
    impl:
      BLOCK:
      - restrict-vendor-to-station
      BLOCK and LOG:
      - restrict-vendor-to-station
      RESTRICT:
      - restrict-vendor-to-station
  non-rtu-to-field:
    label: Non-RTU station sources → field (except PLC→OLTC)
    impl:
      BLOCK:
      - pin-rtu-to-field
      BLOCK and LOG:
      - pin-rtu-to-field
  unauth-control:
    label: Cross-zone foreign-source IEC 104 / Modbus attempts
    impl:
      BLOCK:
      - block-enterprise-to-station
      - restrict-vendor-to-station
      - block-enterprise-to-field
      - block-vendor-to-field
      - pin-rtu-to-field
      BLOCK and LOG:
      - block-enterprise-to-station
      - restrict-vendor-to-station
      - block-enterprise-to-field
      - block-vendor-to-field
      - pin-rtu-to-field
requirementOrder:
- enterprise-to-field
- enterprise-to-station
- vendor-to-station
- non-rtu-to-field
- unauth-control
