# Required operational allows precede deferred Weak exposures and logged diagnostic denies.
# Empty selected lists close through those denies or default DENY, without extra rules.
# Historian read (8080) and CC-only ingest (8081) preserve separate Weak scopes.

plan:
  rules:
  - required:
      id: control-centre-to-rtu-iec104
      description: Allow the named Control Centre to open IEC104 sessions to the RTU
      sourceZones:
      - ${zone:control_centre_net}
      destZones:
      - ${zone:station_net}
      sources:
      - ${ip:cc-1}/32
      destinations:
      - ${ip:rtu-1}/32
      protocols:
      - name: tcp
        port: '2404'
      action: ALLOW
  - required:
      id: rtu-to-feeder-modbus
      description: Allow the named RTU to poll both breakers, RMUs and OLTC and control the existing command targets
        over Modbus TCP
      sourceZones:
      - ${zone:station_net}
      destZones:
      - ${zone:field_net}
      sources:
      - ${ip:rtu-1}/32
      destinations:
      - ${ip:breaker-1}/32
      - ${ip:rmu-1}/32
      - ${ip:rmu-2}/32
      - ${ip:oltc-1}/32
      - ${ip:f2-breaker}/32
      protocols:
      - name: tcp
        port: '502'
      action: ALLOW
  - required:
      id: plc-to-oltc-modbus
      description: Allow only the named PLC to regulate the OLTC over Modbus TCP
      sourceZones:
      - ${zone:station_net}
      destZones:
      - ${zone:field_net}
      sources:
      - ${ip:plc-1}/32
      destinations:
      - ${ip:oltc-1}/32
      protocols:
      - name: tcp
        port: '502'
      action: ALLOW
  - required:
      id: control-centre-to-historian-ingest
      description: Allow only the named CC to push historian snapshots
      sourceZones:
      - ${zone:control_centre_net}
      destZones:
      - ${zone:ops_dmz_net}
      sources:
      - ${ip:cc-1}/32
      destinations:
      - ${ip:historian-1}/32
      protocols:
      - name: tcp
        port: '8081'
      action: ALLOW
  - required:
      id: enterprise-to-historian-read
      description: Allow enterprise read-only historian access
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:ops_dmz_net}
      sources:
      - ${subnet:enterprise_net}
      destinations:
      - ${ip:historian-1}/32
      protocols:
      - name: tcp
        port: '8080'
      action: ALLOW
  - required:
      id: engineering-to-plc-web
      description: Allow engineering maintenance of the OpenPLC web UI
      sourceZones:
      - ${zone:vendor_net}
      destZones:
      - ${zone:station_net}
      sources:
      - ${ip:eng-ws-1}/32
      destinations:
      - ${ip:plc-1}/32
      protocols:
      - name: tcp
        port: '8080'
      action: ALLOW
  - action: restrict-enterprise-to-vendor
    selected: []
    deferred:
    - id: weak-enterprise-vendor-remote
      description: Workshop weak exposure
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:vendor_net}
      protocols:
      - name: tcp
        port: '3389'
      - name: tcp
        port: '5900'
      action: ALLOW
      log: true
      destinations:
      - ${ip:vendor-jump-1}/32
  - action: block-enterprise-to-field
    selected: []
    deferred:
    - id: weak-foreign-field-modbus-enterprise
      description: 'WEAK teaching exposure: enterprise and vendor direct Modbus access to field devices (should
        be blocked)'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '502'
      action: ALLOW
  - action: block-enterprise-to-station
    selected: []
    deferred:
    - id: weak-iec104-exposure-enterprise
      description: 'WEAK: enterprise, vendor, and control centre can open IEC104 sessions to the RTU'
      sourceZones:
      - ${zone:enterprise_net}
      destZones:
      - ${zone:station_net}
      protocols:
      - name: tcp
        port: '2404'
      action: ALLOW
  - action: restrict-vendor-to-station
    selected: []
    deferred:
    - id: weak-iec104-exposure-vendor
      description: 'WEAK: enterprise, vendor, and control centre can open IEC104 sessions to the RTU'
      sourceZones:
      - ${zone:vendor_net}
      destZones:
      - ${zone:station_net}
      protocols:
      - name: tcp
        port: '2404'
      action: ALLOW
    - id: weak-vendor-station-web
      description: Workshop weak exposure
      sourceZones:
      - ${zone:vendor_net}
      destZones:
      - ${zone:station_net}
      protocols:
      - name: tcp
        port: '8080'
      action: ALLOW
      log: true
  - action: block-vendor-to-field
    selected: []
    deferred:
    - id: weak-foreign-field-modbus-vendor
      description: 'WEAK teaching exposure: enterprise and vendor direct Modbus access to field devices (should
        be blocked)'
      sourceZones:
      - ${zone:vendor_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '502'
      action: ALLOW
  - action: pin-rtu-to-field
    selected: []
    deferred:
    - id: weak-rtu-modbus
      description: 'WEAK: all station-zone nodes can reach every field device over Modbus TCP'
      sourceZones:
      - ${zone:station_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '502'
      action: ALLOW
  - action: tighten-firewall-objects
    selected: []
    deferred:
    - id: weak-iec104-exposure-control-centre
      description: 'WEAK: enterprise, vendor, and control centre can open IEC104 sessions to the RTU'
      sourceZones:
      - ${zone:control_centre_net}
      destZones:
      - ${zone:station_net}
      protocols:
      - name: tcp
        port: '2404'
      action: ALLOW
    - id: weak-historian-read
      description: 'WEAK: enterprise, vendor and control centre can read the historian'
      sourceZones:
      - ${zone:enterprise_net}
      - ${zone:vendor_net}
      - ${zone:control_centre_net}
      destZones:
      - ${zone:ops_dmz_net}
      protocols:
      - name: tcp
        port: '8080'
      action: ALLOW
    - id: weak-historian-ingest
      description: 'WEAK: any control-centre-zone source can push historian snapshots'
      sourceZones:
      - ${zone:control_centre_net}
      destZones:
      - ${zone:ops_dmz_net}
      protocols:
      - name: tcp
        port: '8081'
      action: ALLOW
  - required:
      id: deny-unauthorized-historian-ingest
      description: Deny and log other sources attempting historian snapshot ingest on TCP/8081
      sourceZones:
      - ${zone:enterprise_net}
      - ${zone:vendor_net}
      - ${zone:station_net}
      - ${zone:field_net}
      - lan3
      - ${zone:control_centre_net}
      - ${zone:ops_dmz_net}
      destZones:
      - ${zone:ops_dmz_net}
      destinations:
      - ${ip:historian-1}/32
      protocols:
      - name: tcp
        port: '8081'
      action: DENY
      log: true
  - required:
      id: deny-unauthorized-plc-web
      description: Deny and log other sources attempting OpenPLC web maintenance on TCP/8080
      sourceZones:
      - ${zone:enterprise_net}
      - ${zone:vendor_net}
      - ${zone:station_net}
      - ${zone:field_net}
      - lan3
      - ${zone:control_centre_net}
      - ${zone:ops_dmz_net}
      destZones:
      - ${zone:station_net}
      destinations:
      - ${ip:plc-1}/32
      protocols:
      - name: tcp
        port: '8080'
      action: DENY
      log: true
  - required:
      id: deny-unauthorized-iec104
      description: Deny and log other sources attempting to reach IEC104 on TCP/2404
      sourceZones:
      - ${zone:enterprise_net}
      - ${zone:vendor_net}
      - ${zone:station_net}
      - ${zone:field_net}
      - lan3
      - ${zone:control_centre_net}
      - ${zone:ops_dmz_net}
      destZones:
      - ${zone:station_net}
      protocols:
      - name: tcp
        port: '2404'
      action: DENY
      log: true
  - required:
      id: deny-unauthorized-modbus
      description: Deny and log other sources attempting to reach Modbus on TCP/502
      sourceZones:
      - ${zone:enterprise_net}
      - ${zone:vendor_net}
      - ${zone:station_net}
      - ${zone:field_net}
      - lan3
      - ${zone:control_centre_net}
      - ${zone:ops_dmz_net}
      destZones:
      - ${zone:field_net}
      protocols:
      - name: tcp
        port: '502'
      action: DENY
      log: true
  detect:
    iec104-dpi:
      rules:
      - id: observe-cc-breaker-command
        description: "Monitor only: CC breaker commands; never admits or denies"
        sourceZones:
        - ${zone:control_centre_net}
        destZones:
        - ${zone:station_net}
        sources:
        - ${ip:cc-1}/32
        destinations:
        - ${ip:rtu-1}/32
        protocols:
        - name: tcp
          port: '2404'
        action: DENY
        ics:
          protocol: iec104
          mode: monitor
          direction: request
          ca: [1]
          typeIds: [46]
          ioa:
          - start: 3001
            end: 3001
      - id: observe-cc-oltc-step
        description: "Monitor only: CC OLTC steps; never admits or denies"
        sourceZones:
        - ${zone:control_centre_net}
        destZones:
        - ${zone:station_net}
        sources:
        - ${ip:cc-1}/32
        destinations:
        - ${ip:rtu-1}/32
        protocols:
        - name: tcp
          port: '2404'
        action: ALLOW
        ics:
          protocol: iec104
          mode: monitor
          direction: request
          ca: [1]
          typeIds: [47]
          ioa:
          - start: 3301
            end: 3301
          cot: [6]
          commandStates: [1, 2]
          commandQualifiers: [0]
          negative: false
          test: false
      - id: observe-cc-oltc-raise-only
        description: "Monitor only: CC OLTC raises; never admits or denies"
        sourceZones:
        - ${zone:control_centre_net}
        destZones:
        - ${zone:station_net}
        sources:
        - ${ip:cc-1}/32
        destinations:
        - ${ip:rtu-1}/32
        protocols:
        - name: tcp
          port: '2404'
        action: ALLOW
        ics:
          protocol: iec104
          mode: monitor
          direction: request
          ca: [1]
          typeIds: [47]
          ioa:
          - start: 3301
            end: 3301
          cot: [6]
          commandStates: [2]
          commandQualifiers: [0]
          negative: false
          test: false
  proof:
