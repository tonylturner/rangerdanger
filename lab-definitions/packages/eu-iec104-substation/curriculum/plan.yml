    to: rtu-1
    network: station_net
    port: 2404
    category: authorized
    expect: allow
    owners: []
    note: CC IEC 104 to RTU
  - id: A2
    from: plc-1
    to: oltc-1
    network: field_net
    port: 502
    category: authorized
    expect: allow
    owners: []
    note: PLC to OLTC (pinned station-to-field conduit)
  - id: A3
