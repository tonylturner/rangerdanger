schema: 1
budgetHours: 500
teams:
- name: OT Engineer
  capacity_hours: 120
- name: Firewall Admin
  capacity_hours: 140
- name: Network Engineer
  capacity_hours: 120
- name: Security Analyst
  capacity_hours: 120
catalog:
- id: restrict-enterprise-to-vendor
  title: Restrict enterprise → vendor remote access
  why: Remove direct enterprise RDP/VNC access to the vendor jump box; retain only the package’s named operational
    exceptions.
  effort_hours: 30
  roles:
  - Firewall Admin
  - Network Engineer
  tags:
  - enterprise-vendor
- id: block-enterprise-to-field
  title: Block enterprise → field access
  why: Close direct corporate Modbus access to the feeder; an unused path is still exposure.
  effort_hours: 40
  roles: [Firewall Admin, Security Analyst]
  tags: []
- id: block-enterprise-to-station
  title: Block enterprise → station RTU access
  why: Close enterprise IEC 104 access to RTU; only the named CC should initiate telecontrol.
  effort_hours: 30
  roles: [Firewall Admin, Security Analyst]
  tags: []
- id: restrict-vendor-to-station
  title: Restrict vendor → station engineering access
  why: Replace broad vendor-zone trust with named engineering PLC web access; field control is separate.
  effort_hours: 50
  roles: [Firewall Admin, Network Engineer, OT Engineer]
  tags: []
- id: block-vendor-to-field
  title: Block vendor → field access
  why: Remove direct vendor Modbus access even if a compromised remote-access foothold exists.
  effort_hours: 30
  roles: [Firewall Admin, OT Engineer]
  tags: []
- id: pin-rtu-to-field
  title: Pin field access to the RTU
  why: Keep RTU field polling and the explicit PLC→OLTC exception; exclude other station sources.
  effort_hours: 40
  roles: [Firewall Admin, OT Engineer]
  tags: []
- id: modbus-dpi
  title: Plan Modbus inspection (planning only)
  why: Plan function-code restrictions for southbound Modbus. Planning-only protocol review; this range emits no protocol rule.
    The L4 source pin enforces; DPI detects and logs.
  effort_hours: 70
  roles: [Firewall Admin, OT Engineer, Security Analyst]
  tags: []
- id: iec104-dpi
  title: Monitor IEC 104 commands
  why: Observe CC breaker and OLTC commands with three explicit monitor rules; compare lower and raise matches.
    Monitoring never blocks or satisfies a BLOCK requirement. The L4 source pin enforces; DPI detects and logs.
  effort_hours: 80
  roles: [Firewall Admin, OT Engineer, Security Analyst]
  tags: []
- id: improve-logging
  title: Plan firewall logging (planning only)
  why: Retain per-rule evidence and cross-zone PCAP so a policy change can be reviewed.
  effort_hours: 50
  roles: [Firewall Admin, Security Analyst]
  tags: []
- id: station-architecture-review
  title: Review station architecture (planning only)
  why: Planning-only review of RTU/PLC/GPS same-subnet trust and endpoint authority; no policy effect.
  effort_hours: 30
  roles: [OT Engineer, Security Analyst]
  tags: []
- id: tighten-firewall-objects
  title: Tighten firewall object hygiene
  why: Pin CC telecontrol to the RTU endpoint, pin historian reader/ingest destinations and separate read 8080 from CC ingest 8081.
  effort_hours: 40
  roles: [Firewall Admin, Network Engineer]
  tags: []
- id: positive-validation
  title: Plan positive/negative validation
  why: 'Planning-only validation work: authorized operations, denied exposures and bounded evidence.'
  effort_hours: 60
  roles: [Security Analyst, OT Engineer]
  tags: []
- id: ids-deployment
  title: Plan IDS deployment
  why: 'Planning-only detection work: sensors, rule tuning and response ownership; no sensor is deployed here.'
  effort_hours: 80
  roles: [Security Analyst, Network Engineer]
  tags: []
- id: ot-asset-inventory
  title: Build an OT asset inventory
  why: Planning-only inventory and drift baseline for station and field assets.
  effort_hours: 100
  roles: [Security Analyst, OT Engineer, Network Engineer]
  tags: []
- id: vendor-zta-broker
  title: Plan vendor ZTNA/PAM access
  why: Planning-only identity, MFA, approval and recorded-session work; no broker is deployed here.
  effort_hours: 150
  roles: [Network Engineer, Firewall Admin, Security Analyst]
  tags: []
