phases:
  rules: |-
    **Prepared change request CR-22 (review before approval):** replace broad trust with default deny; retain RTU→field, PLC→OLTC, CC→historian ingest, enterprise→historian read and engineering→PLC web. The request accidentally omits CC→RTU TCP/2404. Identify the operator impact, correct that gap before commit and retain a known-good export plus rollback trigger/owner. Rejecting/correcting the request passes; causing an outage is never required. If you choose to test the incomplete request, remove only `control-centre-to-rtu-iec104` from a copy of improved, keep its logged deny rules and management access, and have rollback ready.

    Compare the request against the complete minimal operational rules:

    | Required conduit | Pin | Port |
    |---|---|---|
    | CC→RTU | 10.60.60.20→10.30.30.20 | TCP/2404 |
    | RTU→field | 10.30.30.20→10.40.40.20…24 | TCP/502 |
    | PLC→OLTC | 10.30.30.30→10.40.40.23 | TCP/502 |
    | CC→historian ingest | 10.60.60.20→10.70.70.40 | TCP/8081 |
    | Enterprise→historian read | 10.10.10.0/24→10.70.70.40 | TCP/8080 |
    | Engineering→PLC web | 10.20.20.20→10.30.30.30 | TCP/8080 |

    :::guided
    Apply Hardened to load the reference, or Apply Your Plan to exercise funded controls and discover residual gaps. Review the generated table, not just a green banner.
    :::

    :::technical
    Author these six intents with source and destination pins in containd. Keep historian read 8080 separate from CC ingest 8081. Engineering PLC web is 10.20.20.20 only. Do not grant the vendor zone field control or enterprise access to RTU. Commit, then read back running configuration.
    :::

    :::hint No semantic enforcement claim
    Keep the six L4 allows and four diagnostic denies unchanged. Hardened adds `observe-cc-breaker-command`, `observe-cc-oltc-step` and `observe-cc-oltc-raise-only` as separate IEC 104 rules, each explicitly `mode: monitor`; Apply Your Plan adds them only when `iec104-dpi` is selected. Never overlay a monitor predicate on an operational allow. Monitor ALLOW does not admit traffic and monitor DENY does not deny it. The L4 source pin enforces; DPI detects and logs. Monitoring never satisfies a BLOCK requirement; Modbus DPI remains planning-only.
    :::

    The compiler retains the six required allows and four logged diagnostic denies.
    EU selected closure slots emit no extra per-action rule; `iec104-dpi` appends
    three observation rules. Selecting a closure removes
    its deferred Weak allow; it does not remove the required operational rules.
    An empty or planning-only plan is valid and keeps those exposures open.
    Export the compiled config and the companion **Export plan record**.
    The record contains package ID, revision, label, action IDs and policy
    hash. Use `GET /api/firewall/active` to check what is running.

    ### Compiled rules

    {{noPlan}}
    {{ruleTable}}
  positive: |-
    Prove all six required operational intents, not merely open sockets. In the Control Centre require a completed current-connection GI and every inventory point non-null and GOOD, received at or after that attempt’s GI start. Quiet status does not need advancing receipt times; float quality includes the reporting watchdog. Include F2 position, protection trip, current and MW (indication only, no command). Confirm RTU field telemetry and a healthy PLC heartbeat; observe an actual PLC request and its motion after the policy change. Check CC historian ingest and advancing archive samples separately from reader access.

    :::hint Use your live operator connection
    The validator anchors the proof on a retained matched GI start/completion on the current connection within ten minutes and after the attempt boundary. The CC `link.since` must be strictly later than the policy commit; use **POST /api/operator/reconnect** first, then wait for its connect GI. Interrogate station on the old connection does not test the new policy. If only GI evidence is missing or outside the window on an already post-commit connection, press **Interrogate station** and validate again. Establish this GI boundary before collecting the PLC and historian proof; later periodic GIs do not restart an already valid attempt. Routine GI runs on connect and every 15 minutes, not every second.
    :::

    ### Verify applied IEC 104 observations

    For Hardened, or a plan selecting `iec104-dpi`, inspect the embedded containd **Firewall/ICS tables** and running configuration. Confirm DPI and the IEC 104 decoder are healthy, NFQUEUE is **101**, and all three separate rules are applied with `protocol: iec104`, explicit `mode: monitor`, `direction: request`, CA **1**, and CC **10.60.60.20** → RTU **10.30.30.20 TCP/2404** (lan4→lan1):

    | Rule ID | Configured action | Selectors |
    |---|---|---|
    | `observe-cc-breaker-command` | DENY (monitor) | Type 46, IOA 3001 |
    | `observe-cc-oltc-step` | ALLOW (monitor) | Type 47, IOA 3301, COT 6, states [1,2], QU [0], negative false, test false |
    | `observe-cc-oltc-raise-only` | ALLOW (monitor) | Same OLTC selectors, but states [2] |

    **Reconnect CC first** with the Phase 4 procedure: inspection starts only at a fresh SYN, not halfway through the old session. Wait for connect GI, then record a shadow-counter baseline from the embedded tables: `available: true`, all three rule IDs, `snapshotVersion`, `since`, `unit` and each rule's `shadowMatches`, `wouldAllow`, `wouldDeny`. Counters reset on every successful apply and are lost on engine restart. `available:false` is never zero; a missing applied rule is not zero either. If the snapshot or since changes, discard the comparison and establish a new baseline after reconnect/GI. A plan deferring `iec104-dpi` has no such rules: record observation work as deferred, not as zero matches or prevention.

    Correlate a prescribed, approved CC breaker operation with `observe-cc-breaker-command` `wouldDeny` increasing by **≥1**, `ics.decision` (`mode: monitor`, `decision: would_drop`, `reason: rule`, matching `ruleId` and UTC window), fresh feedback and the actual field result. Restore normal breaker/supply state before continuing. The monitor DENY does not stop CB1 operating; it is a rule-local hypothetical decision, not a denied command or a whole-policy prediction. See [monitor evidence](/knowledge#eu-ics-dpi).

    **Forwarding dependency:** monitor traffic traverses NFQUEUE 101 and adds engine processing latency. There is no queue bypass; if the engine is down, the CC conduit drops. Monitor-only does not mean availability-neutral. Preserve rollback and prove GI, PLC and historian continuity independently; do not deliberately stop the engine for this lesson.

    **Package test instructions — controlled regulation loop.** First wait for a settled tap and the 20.196–20.604 kV band (20.4 kV ±1%). Reset starts at zero but the profile-disabled nominal equilibrium is +2, about 20.429 kV; the daily profile normally keeps running. When regulation is quiescent the PLC sends no tap request, so perturb regulation and let automatic control correct it, producing the PLC-originated request the proof requires. Use the **Control Centre** selected-device faceplate or the [operator API](/knowledge#eu-rtu-control-centre-apis); read tap, auto and voltage from `GET /api/operator/state` and wait for completed feedback before each command — an in-flight step returns 409:

    1. Select **manual**: command `oltc-1-mode` → `manual`. Verify the auto feedback (IOA 1303) clears before continuing.
    2. With `iec104-dpi` applied, compare OLTC shadow evidence while manual: record counters, request `oltc-1-step` → `lower`, and wait for completed feedback. `observe-cc-oltc-step` must gain **≥1** match; `observe-cc-oltc-raise-only` must gain **0**. Then request one `raise` to restore that tap and wait: **both** rules must gain **≥1** match. Keep snapshotVersion/since unchanged and correlate rule/mode/time events with the field feedback. A successful fully decoded SBO action normally produces **2 matches** per matching rule (select + execute, both COT 6), but this is **not guaranteed**; early refusal can end the sequence. Count matching decoded messages, not successful operations. Never require exactly two or interpret missing/unavailable evidence as a non-match. If monitoring is deferred, still perform the lower/raise and check field feedback, but record shadow evidence as deferred.
    3. Now request **two lower steps**, waiting for completed feedback after each, to exercise automatic correction next. Watch IOA 1301 go transient, then settle at each adjacent tap. One step can remain inside the band and would not prove automatic correction. See [step telemetry](/knowledge#eu-iec104-step-telemetry).
    4. Return to **auto**: `oltc-1-mode` → `auto`. Wait for the configured 30 s sustained demand, then the 2 s motion for each correction; IOA 2403 reports configured delay, not its countdown. Automatic control now issues PLC-originated Modbus requests toward the operating band, not necessarily the exact starting tap under the daily profile. Confirm that PLC request, its motion completion and the solved revision, and that the historian ingests the advancing tap.

    From **Kali**, read the historian; from **eng-ws**, retrieve the PLC login page:

        curl -fsS --max-time 3 http://10.70.70.40:8080/api/points

        curl -fsS --max-time 3 http://10.30.30.30:8080/login

    :::hint Continuity is a hard constraint
    Both breakers closed, RMU1 closed/RMU2 open and a fresh (≤3 s) bus20/S1/S2/S3 supply solve are independently checked from field/process truth. OLTC remote/auto, PLC motion and fresh operator observations must survive. The validator collects operational evidence, including same-subnet endpoint checks; same-subnet success is not firewall enforcement.
    :::

    :::hint Instructor-supervised F2 visibility check
    Save the policy and UTC window before temporarily over-restricting RTU→F2 Modbus. Removing an allow alone does not revoke an established L4 session; the instructor must cut the affected session to test reconnect denial. F2's four last values must remain visible with IV/NT and device_unreachable while other devices stay GOOD and the IEC 104 link stays started. This is observation loss, not proof that F2 opened. Restore the named F2 destination, request a new GI and retain all inventory points non-null and GOOD received since that GI start. Keep the loss, healthy-peer and recovery evidence for Lab 2.4. Do not issue an F2 supervisory command or reset its protection to repair communications.
    :::

    All ten authorized TCP rows must remain reachable for every plan. The report
    has 37 rows in total. Plan proof checks this plan; Hardened acceptance requires
    10/10 authorized and 27/27 unauthorized denied, zero skipped, capture and stable
    hash. Confirm a healthy HMI and fresh CC observations separately. Bridged
    rows are endpoint evidence, not proof of a routed firewall rule.

    ### Compiled expectations

    {{tests}}
  negative: |-
    Test new unauthorized connections from each real source terminal: Kali→RTU:2404, Kali→all field:502, vendor→all field:502, eng-ws→all field:502, enterprise→PLC:8080 and Kali→vendor:3389/5900. Each should time out under Hardened. For an applied plan, compare with
    its compiled verdict: a deferred exposure stays reachable. The report runs
    all 27 unauthorized rows; role-specific validators use their declared rows.

    From **Kali**:

        nmap -p 2404 10.30.30.20 --max-retries 1 -T4
        nmap -p 502 10.40.40.20 --max-retries 1 -T4
        nmap -p 3389,5900 10.20.20.10 --max-retries 1 -T4

    :::hint Diagnose a gap honestly
    A deferred plan can leave a sampled path open. Correct the plan/rules or record the gap; do not label it passed because the policy is called custom or improved. Connection refused is reached, not denied.
    :::

    | Path | Owning action | Selected / deferred |
    |---|---|---|
    | Kali→vendor TCP/3389 and TCP/5900 | `restrict-enterprise-to-vendor` | deny / allow |
    | Enterprise→RTU TCP/2404 | `block-enterprise-to-station` | deny / allow |
    | Vendor→RTU TCP/2404 and PLC web | `restrict-vendor-to-station` | deny / allow |
    | Enterprise→field TCP/502 | `block-enterprise-to-field` | deny / allow |
    | Vendor and eng-ws→field TCP/502 | `block-vendor-to-field` | deny / allow |
    | Non-RTU station sources→field except PLC→OLTC | `pin-rtu-to-field` | deny / allow |
    | CC endpoint scope and historian reader/ingest scope | `tighten-firewall-objects` | narrowed / Weak scope |

    Invariant negatives still deny, even for an empty plan. Connection refused
    means reached (allow); only connect timeout means deny. Missing tools or
    container errors are skipped evidence and fail proof. Keep deferred allow
    results as prevention gaps against Hardened, not as skipped steps.

    Execute Step compares the observation with the running firewall policy.

