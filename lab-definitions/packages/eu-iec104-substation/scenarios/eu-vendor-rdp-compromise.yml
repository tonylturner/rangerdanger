id: eu-vendor-rdp-compromise
order: 2.3-bonus
name: Vendor Remote Access Compromise (Bonus)
summary: Prove enterprise remote-access exposure, pivot from the vendor terminal, then retest both hops independently.
estimated_minutes: 25
validator: eu-vendor-rdp-compromise
description: Trace a two-hop vendor compromise. Prove RDP/VNC reachability from enterprise,
  represent the compromised foothold in the vendor terminal and issue the prescribed Modbus write. Restore service,
  harden and independently test the first and second hop without requiring a graphical desktop.
nodes:
- kali-1
- eng-ws-1
- fw-1
- cc-1
- rtu-1
- vendor-jump-1
tags:
- iec104
- eu-substation
- vendor
- remote-access
- segmentation
- bonus
steps:
- id: confirm-the-lateral-path-is-open
  title: Confirm the lateral path is open
  expected_config: weak
  node: kali-1
  description: |
    Before proceeding, save your confirmed Lab 2.2 running export and Notes.
    Use **Reset to Weak** for this lesson's initial demonstration only. It replaces
    the running policy, but `rollback` can restore your Lab 2.2 policy after the
    plant is restored: one level only, and only while no other commit came after
    Reset to Weak. Do not apply another policy or commit edits in between.
    If that previous-running slot has changed, import your Lab 2.2 backup and
    commit it using the reviewed Lab 2.2 change-safety procedure.
    **Apply Your Plan** is catch-up for students without their own policy,
    not restoration of hand-written rules. An empty selection loads Weak;
    without a saved request, use the full Hardened reference instead.

    **Time budget:** ~25 minutes (estimate; optional depth takes extra time).

    Optional bonus, weak active. From **Kali** prove the first hop:

        nmap -Pn -p 3389,5900 10.20.20.10 --max-retries 1 -T4

    Record reachability on RDP and VNC. This TCP probe runs headless; an allowed remote-access path is the exposure, not proof of a successful login. The next step represents the credential compromise from the vendor's network position.

    :::hint Two hops
    Enterprise→vendor remote access and vendor→field control are independent boundaries. Either can break the chain; test each separately.
    :::
  action:
    type: probe
    targets:
    - host: 10.20.20.10
      port: 3389
      note: RDP to vendor jump
    - host: 10.20.20.10
      port: 5900
      note: VNC to vendor jump
- id: pivot-via-rdp-or-vnc
  title: Pivot via RDP (or VNC)
  expected_config: weak
  node: vendor-jump-1
  description: |
    The graphical client line is **illustrative only**, not a required runnable command:

        xfreerdp /v:10.20.20.10:3389 /u:rangerdanger /p:rangerdanger +clipboard /cert:ignore

    :::hint Headless mode (no GUI on Kali)
    Use the **vendor-jump-1 terminal tab** provided by the app to represent the compromised vendor foothold. Do not open a GUI or add SSH/port 22. The preceding TCP probe proves the first hop; this terminal supplies the vendor network position for the second hop.
    :::

    A valid vendor account is not authority to operate every field device. Keep the first-hop result and source attribution separate from the physical outcome.
- id: use-the-vendor-foothold-to-attack-field-devices
  title: Use the vendor foothold to attack field devices
  expected_config: weak
  node: vendor-jump-1
  description: |
    > **Tip:** open the **vendor-jump-1 terminal tab** (not Kali). You are now
    > operating from the vendor DMZ position (`10.20.20.10`) that hop one gave you.

    From the vendor foothold, issue the prescribed **FC6** (Modbus write single
    register) against the RMU: write `1` to holding register **HR0**, which opens
    RMU1:

        mbpoll -m tcp -a 1 -t 4 -0 -r 0 -1 10.40.40.21 1

    `-t 4` selects holding registers, `-0` uses zero-based addressing, `-r 0`
    targets HR0, and the trailing `1` is the value written (RMU1 OPEN). This is a
    **real wire write** from the vendor source; Execute Step on this step only
    reads the resulting device state, it does not send the write for you.

    To locate device evidence, open **Control Centre → Physical System →
    Advanced diagnostics → Audit device** in the second browser tab. Select
    `breaker-1` for the breaker lesson or `rmu-1` for the vendor lesson. Copy
    the relevant audit row (UTC, revision, peer, operation and result) and the
    terminal command output into Notes before restoration. Record the displayed
    solved revision and supply outcome too; “export evidence” means saving
    those records, not Reset Lab.

    Wait for the poll/solve interval, then confirm the outcome:

    - **Physical System** view in [/substation](/substation): opening RMU1 drops
      the section it feeds, so that section loses supply. Use the Control Centre and Physical System view as the
      operator-facing surfaces.
    - **Device audit:** the RMU records the Modbus request with its peer. The peer
      reads **10.20.20.10** (the vendor jump host), not Kali 10.10.10.50 or the
      RTU 10.30.30.20. The write was laundered through the vendor foothold, so do
      not infer the source from whoever clicked the terminal. See
      [Misuse of trusted hosts](/knowledge#eu-trusted-host-misuse) and
      [Southbound Modbus: RTU polling of field devices](/knowledge#eu-southbound-modbus).

    **Why it worked:** the kill chain had two open links — enterprise → vendor
    remote access, and vendor → field Modbus. A valid vendor network position is
    not authority to operate a field device, but the weak baseline never pins the
    field source, so the vendor-origin write lands.

    :::decision id=vendor-attack-hmi-impact options="SECTION_OUTAGE,FEEDER_OUTAGE,NO_ALARM" correct=SECTION_OUTAGE
    What was the operational consequence?
    :::why
    Opening RMU1 isolated the section it feeds, so that section lost supply — a
    section outage. It is not a whole-feeder outage (the breaker and the rest of
    the ring stayed supplied) and not "no alarm": the Control Centre shows the
    section de-energized once fresh observations arrive.
    :::
    :::decision id=vendor-source-attribution options="ATTACKER_IP,VENDOR_JUMP_IP,RTU_IP" correct=VENDOR_JUMP_IP
    Which source appears in the device audit?
    :::why
    The RMU records the Modbus peer it received the write from. Because the write
    left the vendor jump host, the audit shows `10.20.20.10`, not the attacker's
    enterprise address and not the RTU. Laundering through a trusted host is why
    the enterprise→vendor hop must be closed.
    :::

    :::hint Real wire write
    This is a real wire write. No out-of-band simulator attack substitutes for the
    packet from the vendor source; Execute Step only reads the state it left.
    :::
  action:
    type: check
    run:
      - node: vendor-jump-1
        command: mbpoll -m tcp -a 1 -t 4 -0 -r 0 -1 10.40.40.21 1
    expect:
      rmu_normal: false
- id: restore-service
  title: Restore service
  expected_config: weak
  description: |
    Use the restoration sequence below to return RMU1 closed and RMU2 open after preserving evidence. Confirm breaker closed, supply present and the normal radial topology. This lab reset of devices is not an operating switching order.

    :::hint Safe handover
    Do not close the tie onto a live parallel feed. Normal baseline is RMU1 closed, RMU2 open. Ordinary remote operations still enforce authority and interlocks; reset is only workshop restoration.
    :::
  action:
    type: sequence
    commands:
    - device: rmu-2
      command: reset
    - device: rmu-1
      command: reset
- id: apply-hardened-policy
  title: "Review and commit the two boundaries"
  expected_config: hardened
  description: |
    Restore your own Lab 2.2 policy after restoring the plant. Only if no other
    commit came after **Reset to Weak**, from the fw-1 configuration CLI use:

        rollback

    Or use **Recovery → Rollback** in the UI. This restores the previous running
    config immediately; it is one level only. A second rollback does not go
    further back. UI rollback keeps the newer staged candidate: inspect the diff
    and do not accidentally commit it. If another commit came after Reset to
    Weak, use `import config /data/lab-2.2-policy.json` from the fw-1 CLI to
    stage the saved Lab 2.2 backup. Browser import of your downloaded JSON is the
    alternative. Review the full diff and commit to activate it. Follow Lab 2.2:
    `commit confirmed <seconds>`, check management
    and required operational conduits, then `confirm` before the deadline.
    Read back the running rules and record the running identity and UTC time.
    Compare source pins, required conduits and deferred paths with your Lab 1.4
    change request before retesting. Do not widen scope to obtain a green result.
    The **Cross-check the current system** reads the policy without replacing it.

    | Chain link | Owning action | Selected / deferred |
    |---|---|---|
    | Enterprise→vendor RDP/3389 and VNC/5900 | Restrict enterprise → vendor remote access | deny / allow |
    | Vendor→field Modbus/502 | Block vendor → field access | deny / allow |
    | Vendor→RTU/PLC engineering paths | Restrict vendor → station engineering access | narrowed / Weak scope |

    Either of the first two closures breaks a new two-hop chain. Test them
    independently; a blocked first hop does not test the second boundary.
    **Pin field access to the RTU** owns station-source attempts, not the
    vendor hop. Preserve the six operational conduits. The engineering
    exception remains named eng-ws→PLC web only, not vendor field control.
    A ZTNA broker selection is planning-only; it deploys no login control.
    The L4 source pin enforces; DPI detects and logs.

    :::hint Optional catch-up — for less technical students or teams behind schedule
    For students without their own Lab 2.2 policy, **Apply Your Plan** compiles the
    saved, approved Lab 1.4 selection; it does not import hand-written rules.
    An empty selection loads Weak. Without a saved request, use **Apply Hardened**
    for the full reference. Read back the running rules and record the identity
    and UTC time. This replaces typing rules, not observations, operator checks
    or sign-off. Do not use it before rollback: another commit replaces the
    previous-running slot needed to recover your own policy.
    :::

  action:
    type: check
    expect:
      firewall_config: improved
- id: re-attempt-the-pivot
  title: Re-attempt the pivot
  expected_config: hardened
  node: kali-1
  description: |
    Retest each hop independently. From **Kali**:

        nmap -Pn -p 3389,5900 10.20.20.10 --max-retries 1 -T4

    With **Restrict enterprise → vendor remote access** selected, both ports time
    out or show filtered. Deferred means reachable. No graphical client is required.

    From the **vendor-jump-1 terminal tab** (still available), repeat the identical field write:

        mbpoll -m tcp -a 1 -t 4 -0 -r 0 -1 10.40.40.21 1

    With **Block vendor → field access** selected, expect a timeout and unchanged RMU1.
    Deferred means the write still opens RMU1 and removes section supply, even
    when hop one is denied. Record device audit, source tuples and results.
    Restore RMU1 closed, RMU2 open and normal supply before **Cross-check the current system** for every
    plan. Preserve evidence first, then return to **Restore service** and select
    **Run again** to restore RMU1. Reset Lab would reapply Weak.

    :::decision id=vendor-retest-hmi-state options="NORMAL_OPS,SECTION_OUTAGE,UNCHANGED_FROM_ATTACK"
    What did the feeder show after retest?
    :::why
    This depends on your plan, so it is not graded. You send this retest from the
    vendor foothold itself, so hop one (enterprise → vendor) does not affect it —
    only **Block vendor → field access** decides the outcome. Selected, RMU1 stays
    closed and the section keeps supply (NORMAL_OPS); deferred, the vendor write
    still opens RMU1 and the section loses supply (SECTION_OUTAGE), even when hop
    one is denied. Either restriction still breaks a new end-to-end intrusion.
    Read the physical outcome and device audit, not the Execute Step label.
    :::
    :::decision id=vendor-retest-defense-layer options="ENTERPRISE_TO_VENDOR,VENDOR_TO_FIELD,EITHER_LAYER,NEITHER_LAYER"
    Which selected layer breaks this chain? If neither was selected, record
    that both links remain open in Notes.
    :::why
    Either hop closes the two-hop chain, so this is not graded on one answer.
    **Restrict enterprise → vendor remote access** closes hop one;
    **Block vendor → field access** closes hop two; selecting both is defense
    in depth. NEITHER_LAYER means both links
    stay open and the chain still works end to end.
    :::

    :::hint Attribution survives the story
    The second probe is vendor-originated even when enterprise cannot reach the vendor host. The app terminal is an intentional teaching foothold, not proof that the perimeter login still works.
    :::
  action:
    type: check
    run:
      - node: vendor-jump-1
        command: mbpoll -m tcp -a 1 -t 4 -0 -r 0 -1 10.40.40.21 1
    expect:
      firewall_config: improved
      rmu_normal: true
      supply_present: true
- id: validate
  title: "Sign the two-boundary test and restoration record"
  expected_config: hardened
  description: |
    Keep the reviewed policy active. Write a two-boundary test record in Notes.
    Use the actual source, tuple, UTC time and observed result for each hop.
    Record the expected result from your approved change request before comparing.

    | Boundary | Source / destination / port | Expected | Observed TCP / device result | UTC / evidence file |
    |---|---|---|---|---|
    | Enterprise → vendor RDP/VNC | | | | |
    | Vendor → field | | | | |

    Connection refused means the connection got an answer — from the host (nothing listening) or a firewall RESET rule; only a timeout can prove a DENY drop. A timeout needs capture
    and baseline evidence to explain its cause. Keep the vendor source attribution;
    the existing vendor terminal is not evidence of a successful new login.

    Confirm RMU1 closed, RMU2 open, breaker closed, OLTC remote/auto and fresh
    section supply. Check fresh valid CC points separately.
    Record the restored values, UTC time and running policy identity. Name any
    open boundary, exception and risk owner. Sign the record as tester and
    operator; ask the change owner to accept or reject the remaining risk.

    The **Cross-check the current system** samples current policy and recovery
    state. It does not sign this record, prove an earlier login/pivot or certify
    all restoration actions. Keep those observations separately. This bonus is
    optional; Lab 2.4 does not require its records.

    :::hint Residual risk
    Neither boundary proves vendor identity security. Record MFA, just-in-time
    approval and session recording as organizational follow-up, not controls
    deployed by this exercise.
    :::
  action:
    type: check
    expect:
      firewall_config: improved
      breaker_closed: true
      rmu_normal: true
      oltc_auto: true
      supply_present: true
