id: eu-firewall-implementation
order: '2.2'
name: Firewall Policy Implementation
summary: Implement default deny and six pinned conduits; test allowed and denied flows, then export.
estimated_minutes: 22
validator: eu-firewall-implementation
description: Implement your approved Lab 1.4 change request by authoring and committing rules in containd.
  Preserve required operations and test the named sources.
nodes:
- kali-1
- eng-ws-1
- fw-1
- cc-1
- rtu-1
- vendor-jump-1
tags:
- iec104
- eu-substation
- segmentation
- firewall
- defense
- containd
steps:
- id: exercise-overview
  title: Exercise overview
  expected_config: weak
  description: |+
    :::notes-panel from=eu-remediation-planning title="Your change request (Lab 1.4)"
    :::

    This lab turns your design and funded plan into an enforceable boundary. Work in order: prove weak access, remove broad trust, preserve six minimal conduits, enable visibility, test both directions and export. Keep rollback available.

    **Time budget:** ~22 minutes. Use the containd web UI or CLI.
    Author, review and commit your rules. Read back the running policy and test
    it from the named sources. Optional catch-up controls replace rule entry,
    not observations, operator checks or sign-off.

    :::findings-panel from=eu-baseline-assessment title="Your baseline findings"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU station sources → field (except PLC→OLTC)
    unauth-control: Cross-zone foreign-source IEC 104 / Modbus attempts
    :::

    :::findings-panel from=eu-segmentation-requirements title="Your design verdicts"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU station sources → field (except PLC→OLTC)
    unauth-control: Cross-zone foreign-source IEC 104 / Modbus attempts
    :::

    :::findings-panel from=eu-baseline-assessment title="What active probing revealed (Lab 1.2)"
    latent-exposure-confirmed: Active probing revealed latent exposure beyond passive observation
    :::

- id: verify-access-to-containd
  title: Verify access to containd
  expected_config: weak
  description: |
    Confirm access before changing the policy. Use the portal's
    [containd link](/containd/); management stays out of band.

    **Option 1: Web UI**

    Log in with username **containd**, password **containd**. Open
    **Configuration** and inspect the running rules, not just the candidate.
    The teaching interfaces are `wan`, `dmz`, `lan1`, `lan2`, `lan4` and `lan5`;
    `lan3` is reserved management. Expect broad cross-zone allows under Weak
    Baseline. Export a known-good rollback before editing.

    **Option 2: containd CLI**

    On the [Network Map](/console), select **fw-1** and **Show terminal**.
    The terminal opens in the configuration CLI. Inspect interfaces and policy:

        show interfaces
        show running-config

    `show interfaces` identifies the named zone interfaces; `show running-config`
    shows the committed rule set. Broad enterprise/vendor access to station and
    field is the Weak Baseline exposure, not an operational requirement.

    ### Switching between the CLI and bash

    | Prompt | What you can run | How you got here |
    |---|---|---|
    | `containd(config)#` | `show`, `set`, `commit`, `export config` | Default configuration CLI |
    | Linux shell (bash) | `tcpdump`, `ip`, `nft` | Type `exit` from the CLI |

    `config*` means pending edits; `config?` means candidate status unavailable.
    Neither proves live protection. `exit` leaves the CLI and the terminal
    wrapper starts bash; it does not commit or discard the shared candidate.
    Type `containd cli` in bash to return before using appliance commands.
    See [policy enforcement](/knowledge#eu-containd-policy-enforcement).

    :::hint Do not move management
    Management is out of band. Do not add teaching-to-management allows, routing exceptions or new host ports to make a test pass.
    :::
- id: phase-1-verify-current-access-under-the-weak-baseline
  title: Phase 1 - Verify current access under the weak baseline
  expected_config: weak
  node: kali-1
  description: |
    Open **kali-1** on the [Network Map](/console) and choose **Show terminal**.
    From **Kali** prove Weak Baseline access before changing policy:

        nmap -Pn -p 2404 10.30.30.20 --max-retries 1 -T4
        nmap -Pn -p 502 10.40.40.20 --max-retries 1 -T4

    The first scan tests the RTU's IEC 104 listener on TCP/2404; the second
    tests field Modbus on TCP/502. `-Pn` skips host discovery, which may be
    filtered independently. Expect `open` under Weak Baseline. This worked
    because broad cross-zone rules admit foreign sources, not because those
    sources have control authority. The Control Centre can look normal while
    this latent exposure exists; an unchanged operator screen is not closure.
    See [active probes](/knowledge#eu-tool-nmap-probes).

    Use the eng-ws and vendor-jump terminal tabs to probe field TCP/502 too. Use each named source; successful access now is the exposure you must remove, not authorized control.

    :::hint Fresh attempts
    Start new connections for each handshake comparison. A commit also re-evaluates established traffic on its next packet; a retained conntrack entry is not proof of delivery. [Conntrack](/knowledge#eu-established-sessions).
    :::
  action:
    type: probe
    targets:
    - host: 10.30.30.20
      port: 2404
    - host: 10.40.40.24
      port: 502
    - host: 10.40.40.20
      port: 502
    - host: 10.40.40.23
      port: 502
      from: eng-ws-1
    - host: 10.40.40.21
      port: 502
      from: vendor-jump-1
- id: phase-2-remove-broad-trust-and-establish-default-deny
  title: Phase 2 - Remove broad trust and establish default-deny
  expected_config: weak
  description: |
    Remove broad trust and use default **DENY** for cross-zone traffic. Do not drop the legitimate allows first and strand operations.
    Inspect the final **Default** row; both reference policies already use DENY.
    Only if needed, use **Change default** → **DENY** → **Stage default**.
    Review consequences and the complete candidate diff before commit.

    ### Review a proposed change

    **Prepared change request CR-22** removes broad cross-zone trust, keeps
    management access, and keeps only these operational allows:

    | Allow | Source → destination | Port |
    |---|---|---|
    | RTU→field | 10.30.30.20→10.40.40.20…24 | TCP/502 |
    | PLC→OLTC | 10.30.30.30→10.40.40.23 | TCP/502 |
    | CC→historian ingest | 10.60.60.20→10.70.70.40 | TCP/8081 |
    | Enterprise→historian read | 10.10.10.0/24→10.70.70.40 | TCP/8080 |
    | Engineering→PLC web | 10.20.20.20→10.30.30.30 | TCP/8080 |

    Compare it with the operational conduits from your Lab 1.3 design before
    approving it. Review only: never apply an incomplete request to create an
    outage. Keep a known-good export and agree a rollback owner and trigger
    before any actual change.

    :::decision id=change-request-gap options=CC_TO_RTU_IEC104,VENDOR_TO_RTU_IEC104,ENTERPRISE_TO_HISTORIAN_READ,NOTHING_MISSING correct=CC_TO_RTU_IEC104
    Which required conduit does CR-22 drop?
    :::why
    The Control Centre's IEC 104 link to the RTU (10.60.60.20→10.30.30.20 TCP/2404) is
    missing. Vendor→RTU IEC 104 is an exposure to remove, not a requirement.
    Enterprise→historian read is in the request.
    :::

    :::decision id=change-request-review options=APPROVE_AS_WRITTEN,CORRECT_BEFORE_COMMIT,UNCLEAR correct=CORRECT_BEFORE_COMMIT
    What should happen to this proposed change before commit?
    :::why
    Correct the missing operational allow before commit: the Control Centre loses fresh observations even while field supply may remain healthy.
    Default DENY cannot replace a required allow. Execute Step checks the running
    policy; it does not grade this review or approve the request.
    :::

    :::hint Optional catch-up — for less technical students or teams behind schedule
    This replaces typing rules. It does not replace your own observations, operator check or sign-off.
    Use Apply Your Plan for your funded subset, or Apply Hardened for the reference in the next step. Inspect which deferred exposures remain before claiming success.
    :::

    In containd Policy & Rules, replace broad wan/dmz→station/field allows with named-source rules. Keep infrastructure/management intact. Stage six operational intents before committing default deny. Retain an exported rollback and test the committed configuration, not just candidate rules.

    :::hint Order matters
    Place operational exceptions before overlapping diagnostic denies. Remove broad Weak allows when closing an exposure: a source-pinned allow alone does not restrict other sources.
    :::
- id: implement-rules
  title: Phase 3 - Create minimal required rules
  expected_config: hardened
  description: |
    Use the corrected Phase 2 request: preserve all six operational conduits.
    Execute Step checks the active policy; it does not apply one or grade the
    change-request answer. Compare the complete minimal operational rules:

    | Required conduit | Pin | Port |
    |---|---|---|
    | CC→RTU | 10.60.60.20→10.30.30.20 | TCP/2404 |
    | RTU→field | 10.30.30.20→10.40.40.20…24 | TCP/502 |
    | PLC→OLTC | 10.30.30.30→10.40.40.23 | TCP/502 |
    | CC→historian ingest | 10.60.60.20→10.70.70.40 | TCP/8081 |
    | Enterprise→historian read | 10.10.10.0/24→10.70.70.40 | TCP/8080 |
    | Engineering→PLC web | 10.20.20.20→10.30.30.30 | TCP/8080 |

    :::hint Optional catch-up — for less technical students or teams behind schedule
    This replaces typing rules. It does not replace your own observations, operator check or sign-off.
    Apply Your Plan to exercise funded controls, or Apply Hardened to load the reference. Inspect residual gaps. Review the generated table, not just a green banner.
    :::

    Author these six intents with source and destination pins in containd. Keep historian read 8080 separate from CC ingest 8081. Engineering PLC web is 10.20.20.20 only. Do not grant the vendor zone field control or enterprise access to RTU. The first matching enforcing terminal rule decides; monitor rules never decide. Put the CC allow before `deny-unauthorized-iec104`, RTU and PLC Modbus allows before `deny-unauthorized-modbus`, CC ingest before `deny-unauthorized-historian-ingest`, and engineering web before `deny-unauthorized-plc-web`. If recreating the CC allow, insert or move it before its deny. Review configured order and shadow warnings before commit, then inspect running order. Commit, then read back running configuration.
    On Configuration, **Review changes** leads with entity summaries; **Advanced** opens the exact JSON diff. Review the complete candidate before using the persistent **Commit** actions.

    :::hint No semantic enforcement claim
    Keep the six L4 allows and four diagnostic denies unchanged. Hardened adds `observe-cc-breaker-command`, `observe-cc-oltc-step` and `observe-cc-oltc-raise-only` as separate IEC 104 rules, each explicitly `mode: monitor`; Apply Your Plan adds them only when **Monitor IEC 104 commands** is selected. Never overlay a monitor predicate on an operational allow. Monitor ALLOW does not admit traffic and monitor DENY does not deny it. The L4 source pin enforces; DPI detects and logs. Monitoring never satisfies a BLOCK requirement; Modbus DPI remains planning-only.
    :::

    Required operational allows and logged diagnostic denies remain in every plan.
    Selected enforceable actions close their cross-zone exposures; deferred
    actions keep their Weak access. Selecting **Monitor IEC 104 commands** adds
    observation evidence, not prevention. Operational continuity cannot be deferred.
    An empty or planning-only plan is valid and keeps those exposures open.
    Export the compiled config and the companion **Export plan record**.
    The record contains package ID, revision, label, action IDs and policy
    hash. Use `GET /api/firewall/active` to check what is running.
  action:
    type: check
    expect:
      firewall_config: improved
- id: phase-4-enable-logging-and-visibility
  title: Phase 4 - Enable logging and visibility
  expected_config: hardened
  description: |
    Preserve PCAP and the UTC commit boundary. Keep `deny-unauthorized-iec104` after the CC allow: it includes the CC zone, TCP/2404, DENY and `log: true`. If the allow is missing, new CC→RTU sessions hit this explicit logged deny rather than the silent default drop. A custom policy must keep equivalent logged coverage for this lesson.

    Compare the **Control Centre** link/quality, **Network Map** CC→RTU conduit and **Live DPI Events** tuple/rule. A missing CC allow stops established traffic on its next packet after commit. Sessions may still retain the conntrack entry, which is not delivery proof. Separately check fresh-handshake admission and DPI inspection from SYN: force a fresh session after every commit with the portal operator API. From the host terminal:

        curl -fsS -X POST http://localhost:8088/api/operator/reconnect

    Or from the **cc-1 terminal**, use its management listener:

        wget -qO- --post-data '' http://10.99.99.21:8080/api/reconnect

    A 202 queues the actual connection close; normal reconnect runs at the
    configured interval (currently 2 s), followed by a general interrogation
    (**GI**). GI refreshes the station inventory on this connection. A 409 means
    reconnect pending or a command in flight; 503 means the link is already down
    and retrying. Do not blindly repeat. If CC observations are invalid or
    `link_lost`, inspect the required CC allow before continuing. Field supply
    can remain healthy during observation loss; no trip/reset repairs a missing
    communications allow. See [GI and quality](/knowledge#iec104-gi-cot-quality).

    Exact firewall session retirement is an optional diagnostic to clear a retained entry or force a fresh handshake for DPI inspection from SYN, not a prerequisite for enforcing a committed DENY: the session-kill API revokes the exact tuple in both directions for 60 seconds by default, with TCP resets signalled on subsequent matching packets. A fresh source port still meets the active policy. With a silent blackhole, detection can take configured t3+t1 (currently about 35 s). See [established sessions](/knowledge#eu-established-sessions).

    :::hint A timeout is a specific result
    Strict active probes count only connection timeout as denied. Connection refused means the packet reached a host; a missing tool or failed container exec is missing evidence, never a pass. A logged SYN deny cannot reveal the denied command payload.
    :::
- id: test-positive
  title: Phase 5 - Validate allowed traffic
  expected_config: hardened
  description: |
    Prove all six required operational intents, not merely open sockets. In the Control Centre require a completed current-connection general interrogation (GI) and every inventory point non-null and valid, received at or after that attempt’s GI start. Quiet status does not need advancing receipt times; float quality includes the reporting watchdog. Include F2 position, protection trip, lockout, current and MW (indication only, no command). Confirm RTU field telemetry and a healthy PLC heartbeat; observe an actual PLC request and its motion after the policy change. Check CC historian ingest and advancing archive samples separately from reader access.

    :::hint Use your live operator connection
    The validator anchors the proof on a retained matched GI start/completion on the current connection within ten minutes and after the attempt boundary. The CC `link.since` must be strictly later than the policy commit; use **POST /api/operator/reconnect** first, then wait for its connect GI. Interrogate station on the old connection does not test the new policy. If only GI evidence is missing or outside the window on an already post-commit connection, press **Interrogate station** and validate again. Establish this GI boundary before collecting the PLC and historian proof; later periodic GIs do not restart an already valid attempt. Routine GI runs on connect and every 15 minutes, not every second.
    :::

    The L4 source pin enforces; DPI detects and logs. Monitoring never satisfies
    a BLOCK requirement. Select-before-operate (**SBO**) sequences a command;
    it is not authorization. A double command (**C_DC**) addresses an information
    object address (**IOA**); observing it does not prevent its operation.

    **Forwarding dependency:** monitor traffic traverses NFQUEUE 101 and adds engine processing latency. There is no queue bypass; if the engine is down, the CC conduit drops. Monitor-only does not mean availability-neutral. Preserve rollback and prove GI, PLC and historian continuity independently; do not deliberately stop the engine for this lesson.

    :::hint Optional depth: shadow counters and approved breaker operations

    For Hardened, or a plan selecting **Monitor IEC 104 commands**, inspect the embedded containd **Firewall/ICS tables** and running configuration. Confirm DPI and the IEC 104 decoder are healthy, NFQUEUE is **101**, and all three separate rules are applied with `protocol: iec104`, explicit `mode: monitor`, `direction: request`, CA **1**, and CC **10.60.60.20** → RTU **10.30.30.20 TCP/2404** (lan4→lan1):
    Expand **Inspect rule** for Conditions, ICS Filter and full Shadow matches. On ICS, inspect **Active inspection**, **Why?** and **Inspection details**; **Technical details** retains queue/interface values.

    | Rule ID | Configured action | Selectors |
    |---|---|---|
    | `observe-cc-breaker-command` | DENY (monitor) | Double command (C_DC), Type 46, information object address (IOA) 3001 |
    | `observe-cc-oltc-step` | ALLOW (monitor) | Type 47, IOA 3301, COT 6, states [1,2], QU [0], negative false, test false |
    | `observe-cc-oltc-raise-only` | ALLOW (monitor) | Same OLTC selectors, but states [2] |

    **Reconnect CC first** with the Phase 4 procedure: inspection starts only at a fresh SYN, not halfway through the old session. Wait for connect GI, then record a shadow-counter baseline from the embedded tables: `available: true`, all three rule IDs, `snapshotVersion`, `since`, `unit` and each rule's `shadowMatches`, `wouldAllow`, `wouldDeny`. Counters reset on every successful apply and are lost on engine restart. `available:false` is never zero; a missing applied rule is not zero either. If the snapshot or since changes, discard the comparison and establish a new baseline after reconnect/GI. A plan deferring **Monitor IEC 104 commands** has no such rules: record observation work as deferred, not as zero matches or prevention.

    Correlate a prescribed, approved CC breaker operation with `observe-cc-breaker-command` `wouldDeny` increasing by **≥1**, `ics.decision` (`mode: monitor`, `decision: would_drop`, `reason: rule`, matching `ruleId` and UTC window), fresh feedback and the actual field result. Restore normal breaker/supply state before continuing. The monitor DENY does not stop CB1 operating; it is a rule-local hypothetical decision, not a denied command or a whole-policy prediction. See [monitor evidence](/knowledge#eu-ics-dpi).

    :::

    **Package test instructions — controlled regulation loop.** First wait for a settled tap and the 20.196–20.604 kV band (20.4 kV ±1%). Reset starts at zero but the profile-disabled nominal equilibrium is +2, about 20.429 kV; the daily profile normally keeps running. When regulation is quiescent the PLC sends no tap request, so perturb regulation and let automatic control correct it, producing the PLC-originated request the proof requires. Use the **Control Centre** selected-device faceplate or the [operator API](/knowledge#eu-rtu-control-centre-apis); read tap, auto and voltage from `GET /api/operator/state` and wait for completed feedback before each command — an in-flight step returns 409:

    1. Select **manual**: command `oltc-1-mode` → `manual`. Verify the auto feedback (IOA 1303) clears before continuing.
    2. Request `oltc-1-step` → `lower`, wait for completed feedback, then one
       `raise` and wait again to restore that tap. This verifies adjacent motion;
       it is not yet proof of PLC automatic correction.
    3. Now request **two lower steps**, waiting for completed feedback after each, to exercise automatic correction next. Watch IOA 1301 go transient, then settle at each adjacent tap. One step can remain inside the band and would not prove automatic correction. See [step telemetry](/knowledge#eu-iec104-step-telemetry).
    4. Return to **auto**: `oltc-1-mode` → `auto`. Wait for the configured 30 s sustained demand, then the 2 s motion for each correction; IOA 2403 reports configured delay, not its countdown. Automatic control now issues PLC-originated Modbus requests toward the operating band, not necessarily the exact starting tap under the daily profile. Confirm that PLC request, its motion completion and the solved revision, and that the historian ingests the advancing tap.

    :::hint Optional depth: compare OLTC monitor matches
    With **Monitor IEC 104 commands** applied, compare OLTC shadow evidence while manual: record counters, request `oltc-1-step` → `lower`, and wait for completed feedback. `observe-cc-oltc-step` must gain **≥1** match; `observe-cc-oltc-raise-only` must gain **0**. Then request one `raise` to restore that tap and wait: **both** rules must gain **≥1** match. Keep snapshotVersion/since unchanged and correlate rule/mode/time events with the field feedback. A successful fully decoded SBO action normally produces **2 matches** per matching rule (select + execute, both COT 6), but this is **not guaranteed**; early refusal can end the sequence. Count matching decoded messages, not successful operations. Never require exactly two or interpret missing/unavailable evidence as a non-match. If monitoring is deferred, still perform the lower/raise and check field feedback, but record shadow evidence as deferred.
    :::

    From the **Kali terminal**, read the historian:

        curl -fsS --max-time 3 http://10.70.70.40:8080/api/points

    From the **eng-ws terminal**, retrieve the PLC login page:

        curl -fsS --max-time 3 http://10.30.30.30:8080/login

    :::hint Continuity is a hard constraint
    Both breakers closed, RMU1 closed/RMU2 open and a fresh (≤3 s) bus20/S1/S2/S3 supply solve are independently checked from field/process truth. OLTC remote/auto, PLC motion and fresh operator observations must survive. The validator collects operational evidence, including same-subnet endpoint checks; same-subnet success is not firewall enforcement.
    :::

    :::hint Optional depth: instructor-supervised F2 visibility check
    Save the policy and UTC window before temporarily over-restricting RTU→F2 Modbus. A commit re-evaluates established connections on their next packet against the current first-match policy. Traffic no longer admitted stops without session deletion. Sessions may retain the conntrack entry until timeout; its presence is not proof of delivery. Observe loss after commit and allow for protocol failure detection. F2's five last values must remain visible with INVALID / NOT TOPICAL and STALE (underlying reason `device_unreachable`) while other devices retain valid observations and the IEC 104 link stays started. This is observation loss, not proof that F2 opened. Restore the named F2 destination, request a new GI and retain all inventory points non-null and valid received since that GI start. Keep any loss, healthy-peer and recovery evidence locally with this optional exercise; Lab 2.4 does not require it. Do not issue an F2 supervisory command or reset its protection to repair communications.
    :::

    All ten authorized TCP rows must remain reachable for every plan. The report
    has 37 rows in total. Plan proof checks this plan; Hardened acceptance requires
    10/10 authorized and 27/27 unauthorized denied, zero skipped, capture and stable
    hash. Confirm Control Centre / process continuity separately, with fresh valid CC observations. Bridged
    rows are endpoint evidence, not proof of a routed firewall rule.
  action:
    type: probe
    targets:
    - host: 10.30.30.20
      port: 2404
      from: cc-1
    - host: 10.40.40.20
      port: 502
      from: rtu-1
    - host: 10.40.40.24
      port: 502
      from: rtu-1
    - host: 10.40.40.23
      port: 502
      from: plc-1
    - host: 10.70.70.40
      port: 8081
      from: cc-1
    - host: 10.70.70.40
      port: 8080
      from: kali-1
    - host: 10.30.30.30
      port: 8080
      from: eng-ws-1
- id: test-negative
  title: Phase 6 - Validate blocked traffic
  expected_config: hardened
  node: kali-1
  description: |
    Test new unauthorized connections from each real source terminal: Kali→RTU:2404, Kali→all field:502, vendor→all field:502, eng-ws→all field:502, enterprise→PLC:8080 and Kali→vendor:3389/5900. Each should time out under Hardened. For an applied plan, compare with
    its compiled verdict: a deferred exposure stays reachable. The report runs
    all 27 unauthorized rows; role-specific validators use their declared rows.

    From **Kali**:

        nmap -Pn -p 2404 10.30.30.20 --max-retries 1 -T4
        nmap -Pn -p 502 10.40.40.20 --max-retries 1 -T4
        nmap -Pn -p 3389,5900 10.20.20.10 --max-retries 1 -T4

    :::hint Diagnose a gap honestly
    A deferred plan can leave a sampled path open. Correct the plan/rules or record the gap; do not label it passed because the policy is called custom or improved. Connection refused is reached, not denied.
    :::

    | Path | Owning action | Selected / deferred |
    |---|---|---|
    | Kali→vendor TCP/3389 and TCP/5900 | Restrict enterprise → vendor remote access | deny / allow |
    | Enterprise→RTU TCP/2404 | Block enterprise → station RTU access | deny / allow |
    | Vendor→RTU TCP/2404 and PLC web | Restrict vendor → station engineering access | deny / allow |
    | Enterprise→field TCP/502 | Block enterprise → field access | deny / allow |
    | Vendor and eng-ws→field TCP/502 | Block vendor → field access | deny / allow |
    | Non-RTU station sources→field except PLC→OLTC | Pin field access to the RTU | deny / allow |
    | CC endpoint scope and historian reader/ingest scope | Tighten firewall object hygiene | narrowed / Weak scope |

    Invariant negatives still deny, even for an empty plan. Connection refused
    means reached (allow); only connect timeout means deny. Missing tools or
    container errors are skipped evidence and fail proof. Keep deferred allow
    results as prevention gaps against Hardened, not as skipped steps.

    Execute Step compares the observation with the running firewall policy.
  action:
    type: probe
    targets:
    - host: 10.30.30.20
      port: 2404
    - host: 10.40.40.20
      port: 502
    - host: 10.40.40.21
      port: 502
      from: vendor-jump-1
    - host: 10.40.40.23
      port: 502
      from: eng-ws-1
    - host: 10.30.30.30
      port: 8080
    - host: 10.20.20.10
      port: 3389
    - host: 10.20.20.10
      port: 5900
- id: export-your-policy
  title: Export your policy
  expected_config: hardened
  description: |
    Export the running configuration from containd's **Configuration** → **Overview**, or in **fw-1**'s configuration CLI use `export config` (redacted running JSON, not a file). Full export requires explicit administrator intent. Retain policy identity, UTC bounds, positive/negative results and PCAP. Run RangerDanger's step **Validate** while your evidence is fresh; containd's JSON **Validate** only checks editor text without staging it and does not run the lab's live acceptance checks.

    :::hint Next break point
    Keep the intended policy and rollback. Lab 2.3 will restore weak deliberately to demonstrate unauthorized wire control, then restore service and repeat under the applied plan or Hardened reference. A policy file alone is not acceptance evidence.
    :::

    Use **Export plan record** as the companion to **Export compiled config**.
    The record contains package ID, revision, label, action IDs and policy
    hash. Check `GET /api/firewall/active` to confirm the current plan and
    running hash before and after probing. Keep both plan proof and
    Hardened acceptance; a faithful partial plan can still have prevention gaps.

    ### Save evidence status for Lab 2.4

    These statuses carry forward automatically; they describe your evidence, not a
    passing score. Keep the actual artifacts with their UTC window and running hash.
    Update the statuses if you collect missing evidence; Lab 2.4 regenerates proof
    against its own current policy window.

    :::decision id=evidence-policy options=READY,MISSING,UNCLEAR
    Do you have the running policy export and its identity (plus the plan record when applicable)?
    :::why
    READY means the export and running identity agree. MISSING needs collection; UNCLEAR needs an identity check before approval.
    :::

    :::decision id=evidence-positive options=READY,MISSING,UNCLEAR
    Do you have positive-test and operational-continuity evidence?
    :::why
    READY needs authorized flows and independent operator/process observations. MISSING or UNCLEAR means connectivity alone has not established continuity.
    :::

    :::decision id=evidence-negative options=READY,MISSING,UNCLEAR
    Do you have the negative-test results, including deferred exposures?
    :::why
    READY means real-source results are retained with the plan comparison. Deferred reachable paths remain prevention gaps, not skipped tests.
    :::

    :::decision id=evidence-capture options=READY,MISSING,UNCLEAR
    Do you have PCAP evidence tied to the test window?
    :::why
    READY means the capture is retained and correlated with the policy and test times. MISSING or UNCLEAR needs capture review; an ingress SYN alone is not delivery proof.
    :::

