id: eu-hardening-configurations
order: '2.3'
name: Protocol-Hardened Configurations
summary: Unauthorized IEC 104 SBO breaker OPEN, loss of supply, restoration and identical retest under source pinning.
estimated_minutes: 25
validator: eu-hardening-configurations
description: Stress-test the EU telecontrol boundary with an unauthorized breaker command from Kali. Observe loss
  of supply, restore the feeder, harden and repeat the identical wire command. L4 source pinning is live; IEC 104
  command observation is monitor-only, never command enforcement.
nodes:
- kali-1
- eng-ws-1
- fw-1
- cc-1
- rtu-1
- vendor-jump-1
tags:
- iec104
- eu-substation
- dpi
- segmentation
- hardening
- modbus
steps:
- id: verify-normal-operations
  title: Verify normal operations
  expected_config: weak
  node: cc-1
  description: |
    **Time budget:** ~25 minutes (estimate; optional depth takes extra time).

    Under weak policy confirm breaker closed, RMU1 closed/RMU2 open, OLTC remote/auto and supply present. Compare fresh CC observations with the separate **Physical System** view in [/substation](/substation). The PLC targets 20.4 kV ±1% (20.196–20.604 kV); out-of-band voltage must persist for 30 s before a tap request, not a US low-voltage band.

    :::hint Do not repair stale data with truth
    A completed current-connection GI and non-null valid observations within the attempt establish operator visibility, not continuously advancing status receipts. If the GI evidence is missing or outside ten minutes, press **Interrogate station** in the **Control Centre** and validate again. The **Physical System** view can remain correct while the CC is stale. Record both before the attack.
    :::
  action:
    type: check
    expect:
      breaker_closed: true
      supply_present: true
      cc_link_fresh: true
      rmu_normal: true
      oltc_auto: true
- id: attack-iec104-breaker-open
  title: Attack — unauthorized IEC 104 breaker OPEN
  expected_config: weak
  node: kali-1
  description: |
    > **Tip:** click **Show terminal** (top right) to run this from an embedded
    > shell on the **Kali** box (`10.10.10.50`, enterprise zone), or use the
    > **copy** button on the command block and paste into your own terminal.

    From Kali, under the weak baseline, issue the prescribed unauthorized breaker
    OPEN against the RTU (`10.30.30.20`, IEC 104 on TCP 2404). The telegram is a
    **C_DC** (double command, IEC 104 type 46) to **IOA** (Information Object
    Address) 3001 — the station breaker — sent in **SBO** (Select-Before-Operate)
    mode:

        iec104cmd 10.30.30.20 dc 3001 open -sbo --json

    `dc 3001 open` is the double-command OPEN at IOA 3001; `-sbo` sends the select
    then the operate; `--json` prints each telegram so you can read the activation
    confirmation (ACT-CON) and termination (ACT-TERM) the RTU returns. See
    [IEC 104 frames, addresses and the point map](/knowledge#iec104-wire-model)
    for the telegram structure and [Select-before-operate is sequencing, not
    authorization](/knowledge#iec104-sbo-commands) for what SBO does and does not prove.

    This is a **real wire command** — the telegram crosses the firewall to the
    RTU. Execute Step on this step only reads the resulting device state; it does
    not send the command for you.

    Wait for the RTU's poll/solve interval, then confirm the outcome two ways:

    - **Physical System** view in [/substation](/substation): the feeder section
      past the breaker de-energizes and loses supply. There is no auto-reclose
      model — the breaker stays open until an operator closes it.
    - **Control Centre**: after the next General Interrogation (**GI**) or cyclic
      report, the CC breaker-position feedback flips to OPEN. The EU range has no
      local HMI; the Control Centre is the operator-facing view. Record the
      ACT-CON/ACT-TERM telegrams and the command source — a command
      acknowledgement alone is not the physical outcome.

    **Why it worked:** the weak baseline allows enterprise → RTU on TCP 2404 with
    no source pin, so Kali's telegram reaches the RTU. SBO only sequences a select
    before the operate; it does not authenticate the sender. IEC 104 command
    observation would log this telegram, but logging is not prevention: the L4
    source pin enforces; DPI detects and logs.

    :::decision id=attack-hmi-impact options="LOSS_OF_SUPPLY,LOW_VOLTAGE_ALARM,NO_ALARM" correct=LOSS_OF_SUPPLY
    What did the feeder show?
    :::why
    The breaker OPEN dropped the downstream section, so the feeder lost supply.
    It is not a low-voltage condition (voltage regulation was never the issue) and
    not "no alarm" — the Control Centre shows the section de-energized once fresh
    observations arrive.
    :::

    :::hint SBO is not authorization
    Weak allows enterprise→RTU:2404. Select/execute sequencing does not authenticate Kali. [SBO and command evidence](/knowledge#iec104-sbo-commands).
    :::
  action:
    type: check
    run:
      - node: kali-1
        command: iec104cmd 10.30.30.20 dc 3001 open -sbo --json
    expect:
      breaker_closed: false
- id: restore-the-substation
  title: Restore the substation
  expected_config: weak
  description: |
    Restore with the breaker reset below after exporting the attack evidence. This is a lab restoration action, not the attack and not proof of a safe operating switching order. Confirm closed breaker, supply restored and fresh CC observations before changing policy.

    :::hint Preserve causality
    Keep command source, audit revision and solved outcome before restoration. Do not reset after hardening: Reset Lab reapplies weak and invalidates your hardened evidence window.
    :::
  action:
    type: sequence
    commands:
    - device: breaker
      command: reset
- id: apply-the-hardened-policy
  title: "Confirm the reviewed boundary before retesting"
  expected_config: hardened
  description: |
    Use the reviewed rules from Lab 2.2. Compare the running policy with your
    Lab 1.4 change request. If it differs, export the running rules first.
    Stage the approved removals and replacements together in containd. Review
    the full diff and first-match order, commit once, then read back the rules.
    Keep the management path and required operating conduits. Record the
    commit time and running identity. Do not widen the approved scope just
    to obtain a green result. Without a saved request, use the full Hardened reference.
    The current-system check reads the policy without replacing it.

    :::hint Optional catch-up — for less technical students or teams behind schedule
    This replaces typing rules. It does not replace your own observations, operator check or sign-off.
    Apply Your Plan for the approved Lab 1.4 scope. Apply Hardened only when
    you intend to test the full reference. Read back what is running.
    :::

    **Block enterprise → station RTU access** owns Kali→RTU TCP/2404.
    If selected, expect timeout. If deferred, the breaker command can still land.
    The full reference admits only CC 10.60.60.20 to RTU TCP/2404 and preserves
    six operational intents. Compare a partial request with its approved exceptions.
    **Monitor IEC 104 commands** adds explicit monitor rules on the allowed CC
    conduit. A would-deny match is not a denied command. Monitoring never
    satisfies a BLOCK requirement. Keep trusted-controller and same-subnet risks
    explicit; an allowed CC session is not command authorization.

    The L4 source pin enforces; DPI detects and logs.
  action:
    type: check
    expect:
      firewall_config: improved
- id: re-test-the-attack-under-the-hardened-policy
  title: Re-test the attack under the hardened policy
  expected_config: hardened
  node: kali-1
  description: |
    From **Kali**, repeat the identical wire command:

        iec104cmd 10.30.30.20 dc 3001 open -sbo --json

    With **Block enterprise → station RTU access** selected, expect a connection
    timeout; the breaker stays closed and supply remains. With it deferred, the command
    still opens the breaker and removes supply. Record physical truth and fresh
    CC feedback. The deferred result leaves an exposure. Record it against the approved scope. An acknowledgement alone is not the physical outcome.

    :::decision id=retest-hmi-state options="NORMAL_OPS,LOSS_OF_SUPPLY,UNCHANGED_FROM_ATTACK"
    What did the feeder show for this applied plan?
    :::why
    This depends on your plan, so it is not graded. A selected
    **Block enterprise → station RTU access** closure denies the retest: the
    breaker stays closed and the feeder keeps supply (NORMAL_OPS). A deferred closure lets the
    telegram land and the feeder loses supply again (LOSS_OF_SUPPLY). Read the
    physical outcome and fresh CC feedback, not the Execute Step label.
    :::
    :::decision id=retest-defense-in-depth options="L4_SOURCE_PIN,IEC104_DPI,EITHER_LAYER" correct=L4_SOURCE_PIN
    When the foreign path is denied, which layer enforces it?
    :::why
    The L4 source pin enforces; DPI detects and logs. **Monitor IEC 104 commands** adds
    monitor rules on the allowed CC conduit only; it never blocks a foreign source. So the
    source pin — not IEC 104 inspection — is what denies the Kali telegram.
    :::

    Restore the breaker and supply before Validate for every plan. Preserve
    wire/audit/solve evidence first. Use the prescribed breaker restoration,
    not Reset Lab to improve a verdict. Reset Lab reapplies Weak; if recovery
    needs it, reapply the intended plan and collect a new evidence window.
    Required CC→RTU link, GI and supply checks do not depend on the selected plan.

    :::hint Preserve both claims
    A deferred closure leaves the command path open. Record the risk and its owner.
    Neither TCP reachability nor a logged event establishes command authorization
    on an allowed CC session. Restore supply and fresh observations in all cases.
    :::
  action:
    type: check
    run:
      - node: kali-1
        command: iec104cmd 10.30.30.20 dc 3001 open -sbo --json
    expect:
      breaker_closed: true
      supply_present: true
- id: validate
  title: "Read fresh CC points and record the result"
  expected_config: hardened
  description: |
    Force a fresh CC connection after the policy commit. From cc-1 terminal:

        wget -qO- --post-data '' http://10.99.99.21:8080/api/reconnect

    This is the documented `POST /api/operator/reconnect` operation through the
    CC service (no body; see [operator API](/knowledge#eu-rtu-control-centre-apis)).
    Wait for `link.since` strictly later than the policy commit and matched GI
    completion on that connection. In Control Centre, select **Interrogate station**.
    Require every inventory point non-null and valid received since GI start.
    Record the UTC window, point values, quality and running policy identity.
    Do not run a second IEC 104 client from cc-1; watch the real CC connection.

    :::hint Fresh points and fresh admission are different checks
    Fresh-link admission starts at SYN; new points on an old connection alone
    do not show that a new connection can be admitted.
    :::

    Check breaker closed and fresh section supply in the operator view. A
    physically supplied feeder with stale CC points fails visibility, not supply.
    If the CC link stays down, inspect the running CC allow before changing plant
    state. Restore supply and fresh observations for every approved scope.

    | UTC / source | Point / value / quality | Link since / GI window | Supply / alarms | Running policy identity | Tester / operator |
    |---|---|---|---|---|---|
    | | | | | | |

    Record the attack and retest outcomes separately. Name remaining exposures
    and their risk owners. The optional current-system cross-check samples the
    current policy, breaker, supply and CC visibility. It does not sign this
    record or certify the earlier restoration, command authorization on an
    allowed session, all possible paths or regulatory compliance. Keep the
    readings for Lab 2.4. IEC 104 monitoring is observation, not denial;
    Modbus DPI remains planning-only.
  action:
    type: check
    expect:
      breaker_closed: true
      supply_present: true
      firewall_config: improved
