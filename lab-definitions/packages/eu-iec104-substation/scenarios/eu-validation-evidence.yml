id: eu-validation-evidence
order: '2.4'
name: Testing & Validation
summary: Generate the EU positive/negative matrix and PCAP report, confirm continuity and reflect on deferred risk.
estimated_minutes: 6
validator: eu-validation-evidence
description: Validate the policy actually running, not the intended design. Generate a change-board report, inspect
  authorized and unauthorized results, confirm the feeder still operates and explain residual risk. The report is
  bounded evidence, not proof of every possible attack or regulatory compliance.
nodes:
- kali-1
- eng-ws-1
- fw-1
- cc-1
- rtu-1
- vendor-jump-1
tags:
- iec104
- eu-substation
- validation
- testing
- pcap
- evidence
- defense
steps:
- id: confirm-hardened-config-is-active
  title: Confirm hardened config is active
  expected_config: hardened
  description: |
    Confirm the intended applied plan, package revision, action IDs and running hash.
    Do not replace a partial plan with Hardened just to obtain a green result.
    Named and manual policies use Hardened expectations; their plan proof is not applicable. You are validating an existing change, not authoring a new one.

    :::findings-panel from=eu-segmentation-requirements title="Your committed design"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU hosts → field (except PLC→OLTC)
    unauth-control: Unauthorized IEC 104 commands / Modbus writes
    :::

    :::hint Running, not candidate
    In containd inspect running configuration and its identity. Six operational conduits must remain. Hardened includes three separate explicit-monitor IEC 104 rules; a plan includes them only when `iec104-dpi` is selected. Verify running rules, not candidate-only entries. No command enforcement is claimed.
    :::
  action:
    type: check
    expect:
      firewall_config: improved
- id: generate-the-validation-report
  title: Generate the validation report
  expected_config: hardened
  description: |
    Generate against the policy you actually have active:

    :::validation-report
    :::

    Keep two independent results from the full **37-row TCP matrix**.

    - **Plan proof** checks this applied plan. It requires 0 skipped and a stable
      recorded plan hash before and after probing.
    - **Hardened acceptance** requires authorized **10/10** and unauthorized
      denied **27/27**, 0 skipped, capture and a stable running hash. Confirm a
      healthy HMI and fresh CC observations separately.

    A partial plan can pass plan proof while leaving Hardened prevention gaps.
    Keep each gap by row ID. Deferred exposures stay reachable; they are not
    skipped steps. Named and manual policies have no applicable plan proof.

    Completion uses the backend-retained result for the judging target, full running firewall hash and probe UTC window from this range and latest policy commit. The running policy is read before and after probing; a change or unreadable hash fails the report. Reapplying even the same policy invalidates the previous commit window: generate again. The backend retains the latest generated report until range/backend restart; export the markdown/PCAP before reset or shutdown. A local screenshot or old browser report cannot substitute for the retained proof.

    Read every row: a failed positive blocks operations; a failed negative leaves exposure. The package-derived matrix rows cover all six required intents and all five field devices including F2. Retain every inventory point after a fresh GI; F2 has four indications, no command. If you performed Lab 2.2's instructor-supervised F2 visibility check, retain its last-value IV/NT loss, healthy-peer and restored-GI evidence with the report. Negatives actively probe Kali→RTU, foreign→field, enterprise→PLC and Kali→vendor RDP/VNC. Only connect timeout is denied; connection refused is reached, tool/container errors fail honestly. Default-deny drops need not emit logs.

    Inspect PCAP source analysis: RTU **and PLC→OLTC** are legitimate field sources. RTU↔PLC/GPS stays invisible at the firewall. A SYN captured on ingress does not prove a completed control operation.

    In [/substation](/substation), confirm breaker closed, normal RMUs, OLTC auto, supply present and fresh GOOD CC observations. Plan proof plus operational continuity shows that this plan works as
    compiled. Hardened acceptance separately shows whether all sampled
    prevention gaps are closed. Keep both results.

    :::decision id=pos-test-ops-intact options="NORMAL_OPS,DEGRADED,ALARMS_PRESENT" correct=NORMAL_OPS
    Are operations intact after validation?
    :::
    :::decision id=neg-test-no-impact options="UNCHANGED,DEGRADED,UNCLEAR"
    Were operations unchanged? Record deferred reachable paths in Notes.
    :::

    :::hint Advanced: verify by hand
    Use the six-conduit inventory from Lab 2.2. From Kali read historian /api/points; from eng-ws GET PLC /login. Require a completed current-connection GI inside the ten-minute attempt window and non-null GOOD CC points received since that GI start, PLC heartbeat and advancing historian samples, not sockets alone. If GI evidence is missing or outside the window, press **Interrogate station** in the **Control Centre** and validate again. Quiet GOOD status need not have a recent receipt; floats have a cyclic-report watchdog. Repeat negatives from the named terminal tabs. At fw-1 capture with tcpdump -i any using ports 2404/502/8080/8081 and export the running policy through containd. Preserve UTC windows with the PCAP.
    :::

    :::hint Optional historian-gap evidence
    [Historian uncertainty](/knowledge#eu-historian) explains link-loss stale samples and archive gaps. This sidebar is optional, not a mandatory outage exercise or report prerequisite.
    :::

    ### Shadow evidence for the handover

    Retain Lab 2.2's applied three-rule readback and embedded containd **Firewall/ICS tables** baseline/deltas, snapshotVersion, since, unit, rule IDs and UTC window. Pair `ics.decision` monitor events (`would_allow` / `would_drop`, configured action and reason) with independent command feedback/field outcomes and the restored operating state. Retain the OLTC lower→step-only and raise→both comparison. A fully decoded SBO action normally adds two matches per matching rule, not guaranteed; require ≥1, never exactly two. Counts are matching rule × decoded message, not object counts, operation totals or full-policy predictions. A would-deny match is not a denied command; monitoring never satisfies a BLOCK requirement.

    Successful apply resets counters; engine restart loses them. `available:false`, missing rules, a changed snapshotVersion/since or retention gaps are evidence limitations, never zero. Export before another apply/reset; if monitoring was deferred, name that gap. The 37-row report remains TCP-only and cannot certify command authorization. Monitoring uses NFQUEUE 101 with no queue bypass and adds latency: if the engine is down, the CC conduit drops. Record this forwarding dependency, rollback owner and separate GI/PLC/historian continuity proof.

    :::hint Optional instructor-led PCAP Analysis sidebar — not graded
    The instructor demonstrates and does not grade anything in this optional sidebar. Use the embedded containd **PCAP Analysis** page to import a classic PCAP covering SYN through an already approved controlled command with **Analyze**. Inspect the sealed dataset, capture hash, gaps and expiry; explicitly **Generate suggestions**. Review certified evidence and withheld reasons: SBO sequences, setpoint values/QL and bitstrings remain withheld; monitoring ASDUs/startup do not become command ALLOWs. Certification is bounded evaluator evidence, not permission, delivery proof or universal protocol proof.

    An authenticated administrator **Review** approves the exact IEC revision and acknowledges wire/NAT scope; then select revisions and **Stage selected** as explicit `mode: monitor` only. Inspect the candidate diff and verify running policy is unchanged. Stage is not apply: **Commit is a separate deliberate step and is not performed in this sidebar**. End by **discarding the candidate**, checking no uncommitted diff remains and the running policy/hash is unchanged. Start only with a clean candidate so discarding cannot lose another operator's work. Do not mix suggestions or certification with the TCP acceptance score. [Workflow and limits](/knowledge#eu-ics-dpi).
    :::

    Save **Export plan record** beside **Export compiled config**, the report
    and PCAP. The record contains package ID, revision, label, action IDs and
    policy hash. Use `GET /api/firewall/active` to check what is running.
    The L4 source pin enforces; DPI detects and logs. Neither TCP proof, a
    logged L4 deny nor a would-deny monitor match proves command-aware prevention.
  action:
    type: check
    expect:
      firewall_config: improved
      breaker_closed: true
      supply_present: true
      cc_link_fresh: true
- id: reflection-what-did-your-plan-close
  title: Reflection - what did your plan close?
  description: |
    Review the complete evidence chain, including what passive capture missed.

    :::findings-panel from=eu-baseline-assessment title="Passive findings"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU hosts → field (except PLC→OLTC)
    unauth-control: Unauthorized IEC 104 commands / Modbus writes
    :::

    :::findings-panel from=eu-baseline-assessment title="Latent exposure"
    latent-exposure-confirmed: Active reachability beyond capture
    :::

    :::findings-panel from=eu-segmentation-requirements title="Committed design"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU hosts → field (except PLC→OLTC)
    unauth-control: Unauthorized IEC 104 commands / Modbus writes
    :::

    :::plan-coverage title="Selected actions vs committed design"
    :::

    In Notes answer: which findings did your plan close, which remain deferred and why, which role constrained it, and what would you fund next quarter? Map every residual to operational consequence, owner, acceptance authority and retest. What endpoint or station architecture control addresses same-subnet blind spots?

    :::hint Honest handover
    IEC 104 monitoring adds observation evidence, not command restriction or a promise of later enforcement. Modbus DPI remains planning-only. Breaker control on an allowed CC session remains a residual risk. L4 is live but cannot distinguish commands on an allowed CC session. Keep this residual explicit alongside IEC 62443 design and NIS2/BDEW change accountability. Retain policy, report and PCAP before reset.
    :::
