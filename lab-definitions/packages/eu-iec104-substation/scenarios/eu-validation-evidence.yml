id: eu-validation-evidence
order: '2.4'
name: Testing & Validation
summary: "Write a test plan, test named sources, read boundary captures and sign the operating record."
estimated_minutes: 40
validator: eu-validation-evidence
description: >
  Test the approved firewall change without control writes. Build a test plan,
  collect source and boundary evidence, check operations and sign a go/no-go
  record. These are sampled observations, not universal or regulatory proof.
nodes:
- kali-1
- eng-ws-1
- fw-1
- cc-1
- rtu-1
- vendor-jump-1
- plc-1
- gps-1
tags:
- iec104
- eu-substation
- validation
- testing
- pcap
- evidence
- defense
steps:
  - id: write-test-plan
    title: "Write the acceptance test plan"
    expected_config: hardened
    description: |
      ### Do this
      - Use Lab 1.3 requirements, the approved Lab 1.4 request and Lab 2.2 running-policy record.
      - Copy the test-plan table into Notes; name real sources, expected results and evidence files.
      - Include every required conduit, prohibited source group and approved deferral.
      - Agree operators, UTC window, abort criteria and reviewed rollback before testing.

      The bonus lab is optional; it is not a prerequisite.

      :::hint Set expectations before observing results
      Do not derive an expected result from whatever happens to work today.
      :::

      Copy this table into Notes. Add a positive for every required conduit and
      about one negative per prohibited requirement and source zone. Include
      any deferred exposure as an expected reach, with its named risk owner.

      | Test ID / requirement | Source host / IP / zone | Destination / IP | TCP port / purpose | Expected TCP and application result | Abort criteria |
      |---|---|---|---|---|---|
      | | | | | | |

      Keep the change ID, approved scope, tester, operator, rollback owner and
      UTC test window above the table. Name the evidence file for each row.
      Stop if a required positive fails, prohibited access succeeds, management
      is lost, points go stale, supply changes or a new alarm appears.
      Follow the reviewed Lab 2.2 rollback procedure;
      do not improvise a policy change during a test.

      **Time budget:** ~40 minutes (estimate, not a timed walk). Plan 6 minutes,
      baseline/capture 6, source tests 12, capture review 8, operator check 4 and
      sign-off 4. Optional depth takes extra time.

      :::notes-panel from=eu-remediation-planning title="Your change request (Lab 1.4)"
      :::

      :::notes-panel from=eu-firewall-implementation title="Your implementation record (Lab 2.2)"
      :::

      :::findings-panel from=eu-segmentation-requirements title="Your committed design"
      enterprise-to-field: Enterprise/vendor → field on Modbus/502
      enterprise-to-station: Enterprise → station RTU on IEC 104/2404
      vendor-to-station: Vendor DMZ → station engineering access
      non-rtu-to-field: Non-RTU station sources → field (except PLC→OLTC)
      unauth-control: Cross-zone foreign-source IEC 104 / Modbus attempts
      :::

      :::findings-panel from=eu-firewall-implementation title="Your evidence status (Lab 2.2)"
      evidence-policy: Running policy export and identity
      evidence-positive: Positive tests and operational continuity
      evidence-negative: Negative tests and deferred exposures
      evidence-capture: PCAP tied to the test window
      :::

  - id: confirm-hardened-config-is-active
    title: "Confirm the running policy matches your change request"
    expected_config: hardened
    description: |
      ### Do this
      - Start the interactive **fw-1** capture below before any source test; leave that terminal alone.
      - Use a second browser tab and a second fw-1 terminal for policy and operator work.
      - Compare running rules and first-match order with the approved request; stop on mismatch.
      - Save running export, identity, audit chronology and a values/quality/alarm baseline.

      **Start the boundary capture now, before any source test.** Keep this exercise
      tab open. Open [containd](/containd/), [Network Map](/console) and the
      [Control Centre](/substation) in a second browser tab. Leave the capturing fw-1 terminal
      alone; open a second fw-1 terminal from the Network Map tab for CLI work.

      Start ONE boundary capture before any source test. From fw-1, use the interactive
      terminal, not Run: this capture must span the whole test window. Type `exit`
      from `containd(config)#` to reach Linux bash; `containd cli` returns later.
      In the host filter below include every source and destination in your plan.
      Do not filter only application ports: that would hide remote-access negatives.

      :::interactive
          tcpdump -i any -nn -U -G 1200 -W 1 -w /data/captures/validation.pcap 'host 10.10.10.50 or net 10.20.20.0/24 or net 10.30.30.0/24 or net 10.40.40.0/24 or net 10.60.60.0/24 or net 10.70.70.0/24'
      :::

      The capture is bounded to 1200 seconds (20 minutes); Ctrl-C stops it early.
      If it expires before all tests finish, start a new named file/window and
      repeat those rows. Leave this terminal capturing. Wait for the listening message, then use
      other terminals for tests. Save the file outside the captures folder before
      Reset or shutdown; reset deletes /data/captures/*.pcap.

      :::hint Capture format and scope
      `any` writes Linux cooked SLL2 with interface metadata. A routed packet may
      appear twice; counts are not operation counts. A field-only egress capture
      misses dropped SYNs.
      :::

      In the second tab, read the running policy in [containd](/containd/), not just its label.
      Compare its source, destination, service and first-match order with the
      approved request. Without a saved request, use the full Hardened reference.
      Do not replace a partial plan with Hardened just to obtain a green result.
      A saved browser plan is not an applied plan. You are testing an existing
      change, not authoring a new one. If the rules differ, stop and return to Lab 2.2.

      Configuration → Running config shows committed policy. Firewall Rules edits
      and its Default row describe the candidate. An uncommitted edit is not active.
      From the second fw-1 terminal, in the configuration CLI:

          show running-config
          export config
          show audit

      Copy that redacted running JSON to your evidence document; the CLI does not
      create a file through shell redirection. Full export requires explicit
      administrator intent. Keep the running identity, package revision, selected
      actions if used, commit time and UTC start. Audit proves administrative
      chronology, not a per-packet verdict. Keep secrets out of the record.
      Take an operator baseline: values, quality, alarms and supplied loads.

      :::hint Optional catch-up — for less technical students or teams behind schedule
      This replaces typing rules. It does not replace your own observations, operator check or sign-off.
      If the intended policy is missing, stop the test. Apply Your Plan for the
      approved scope, or Apply Hardened for the full reference, then read back
      and start a new test window. Do not silently overwrite a different policy.
      :::

    action:
      type: check
      expect:
        firewall_config: improved

  - id: run-source-tests
    title: "Run tests from the named sources"
    expected_config: hardened
    description: |
      ### Do this
      - Use each actual source terminal and its installed method; never substitute another host.
      - Reconnect CC while capturing, wait for GI and retain valid current inventory.
      - Run planned positives first, then negatives; use application reads, never control writes.
      - Record UTC bounds, tuple, TCP/application results and errors; join logged denies to events.

      :::hint TCP results and application evidence
      Open each named source terminal. Never move a test to a convenient host.
      Use a scoped TCP connect and an application READ for test-host positives.
      No control writes belong in this acceptance run. A TCP connection is not
      command authorization.
      Use DENY for every required closure. A RESET rule answers with a TCP reset, so the host test shows "Connection refused" and cannot prove the drop; the validator reports it as blocked by RESET.
      Connection refused means the connection got an answer — from the host (nothing listening) or a firewall RESET rule; only a timeout can prove a DENY drop.
      Only a connect timeout counts as a DENY/drop result. Tool/container errors are
      untested evidence. A timeout alone does not explain why packets were lost.
      Use the working baseline, capture and running rules together.
      :::

      :::hint Production-poller evidence without extra clients
      For a production poller, use its own live traffic: fresh good-quality points
      at the operator view after the change, plus its request/response pairs in
      the boundary capture. You do not add test clients to a production RTU; you
      watch it work. Add a TCP connect only where a tool is already installed.
      Do not install tools or substitute another source. Do not call a connect a
      protocol read. Same-subnet flows need endpoint observations; they do not
      cross the firewall and cannot prove routed enforcement.
      :::

      | Source | Installed method / evidence | Where |
      |---|---|---|
      | Kali, eng-ws | `nmap -Pn -sT`; Kali historian HTTP READ, eng-ws PLC login READ | Run or terminal |
      | Vendor-jump | `nmap -Pn -sT`; Modbus READ only if your scope allows field access | Run or terminal |
      | cc-1, rtu-1 | BusyBox `pscan` for a scoped connect; own CC/RTU traffic for application evidence | Interactive terminal for pscan |
      | plc-1 | Python standard-library socket connect; own PLC→OLTC traffic | Interactive terminal, not Run |
      | gps-1 and field simulators | `nmap -Pn -sT`; use only the named source/destination in the plan | Run or terminal |

      For CC/RTU, an interactive connect example is `busybox pscan -cb -p 2404 -P 2404 -t 3000 10.30.30.20`.
      Read pscan’s state: `open` means connected; `closed` means the host or a
      firewall RESET rule answered; `blocked` means connect timeout. An unknown state or tool error is untested, not denied.
      Do not use its exit code alone.
      Use it only for a row whose actual source/destination is CC→RTU. Change
      port and destination for other approved rows; do not originate it elsewhere.
      For PLC, enter `python3` in the interactive terminal, not Run, then paste:

      ```python
      import socket
      s = socket.create_connection(("10.40.40.23", 502), timeout=3)
      s.close()
      ```

      A socket timeout, refusal and missing route are different results; retain
      the exception text. For the PLC negative row use breaker 10.40.40.20, not
      the allowed OLTC. Do not send control writes or change OLTC mode/tap.
      For all five RTU field paths (10.40.40.20…24 TCP/502), observe fresh points
      and the RTU's own Modbus requests/responses. For PLC→OLTC observe the live
      regulation traffic and fresh tap/mode points without forcing motion.
      For CC→historian ingest, require new archived samples and captured delivery;
      reader success alone does not test ingest. RTU↔PLC/GPS stays intra-zone.

      In Control Centre reconnect after the commit. From cc-1 terminal:

          wget -qO- --post-data '' http://10.99.99.21:8080/api/reconnect

      Wait for `link.since` strictly later than commit and matched GI completion.
      Select **Interrogate station**. Require every inventory point non-null,
      valid and received since GI start within the ten-minute attempt window.
      Quiet valid status need not advance continuously; float points have a
      cyclic-report watchdog. F2 has five indications, no command.

      Worked example — historian reader from Kali:

          nmap -Pn -sT -p 8080 10.70.70.40 --max-retries 1 -T4
          curl -fsS --max-time 3 http://10.70.70.40:8080/api/points

      Expect TCP open and a points response. This is not a CC ingest test.

      Compose the remaining commands from your test plan. Record source, tuple,
      UTC start/end, TCP result, application result and any stderr for each row.
      Run positives first, then negatives. Keep the operator watching throughout.
      Deferred closures may remain reachable; compare with the approved scope,
      not an assumed full-reference deny. The L4 source pin enforces; DPI detects and logs.

      :::hint Optional catch-up — for less technical students or teams behind schedule
      This replaces composing test commands. It does not replace your own observations, operator check or sign-off.

      ### Prepared positive test commands
      From the Kali terminal, read the historian:

          curl -fsS --max-time 3 http://10.70.70.40:8080/api/points

      From the eng-ws terminal, read the PLC login page:

          nmap -Pn -sT -p 8080 10.30.30.30 --max-retries 1 -T4
          curl -fsS --max-time 3 http://10.30.30.30:8080/login

      For production conduits use the live-poller procedure above. This list does
      not replace fresh CC inventory, RTU field responses or PLC→OLTC evidence.
      :::

      :::hint Optional catch-up — for less technical students or teams behind schedule
      This replaces composing test commands. It does not replace your own observations, operator check or sign-off.

      ### Prepared negative test commands
      Check these source/path
      groups, not just the first failed connection:

      - Kali → RTU TCP/2404, all five field devices TCP/502, PLC TCP/8080,
        vendor TCP/3389 and TCP/5900, and historian ingest TCP/8081.
      - Vendor-jump → RTU TCP/2404, PLC TCP/8080, all five field devices TCP/502,
        historian read TCP/8080 and ingest TCP/8081.
      - Eng-ws → all five field devices TCP/502.
      - PLC and GPS → breaker TCP/502 (non-RTU source-pin tests).
      - CC → GPS TCP/2404 (the authorized CC is not allowed every destination).

      From **Kali**, sample the enterprise-to-station and field paths:

          nmap -Pn -sT -p 2404 10.30.30.20 --max-retries 1 -T4
          nmap -Pn -sT -p 502 10.40.40.20 --max-retries 1 -T4
          nmap -Pn -sT -p 3389,5900 10.20.20.10 --max-retries 1 -T4

      `-Pn` skips host discovery. Under Hardened expect `filtered` / timeout,
      compared with an open-port Weak control. Under a partial plan compare the
      owning action: a deferred exposure may remain reachable. Connection refused means the connection got an answer — from the host (nothing listening) or a firewall RESET rule; only a timeout can prove a DENY drop.
      A refusal is not a DENY/drop result; a missing tool is missing evidence. Repeat from
      each named source using the intended destination and port; these samples
      cannot replace your test plan. Keep the Control Centre and process healthy while
      probing. See [port and source boundaries](/knowledge#eu-port-source-boundary).
      :::

      Classify each negative from the running export before interpreting events.
      The reference evidence classes are listed in the next capture-review step.
      For an explicit logged-rule negative, correlate the named host's connect
      timeout with a fw-1 DENY event and the boundary capture in the same UTC window.
      In the second fw-1 containd configuration CLI (type `containd cli` if in Linux), type:

          show events

      Match `KIND=firewall.rule.hit`, `action=DENY`, `proto=tcp`, `port=<p>` and
      `ruleId=<rule>` to that row's real SRC host:port, DST and UTC time. Record
      its event ID and matching ruleId, not merely the presence of any deny.
      A rule without logging or a default drop can deny without an event:
      absence of an event is not proof of an allow. An event alone does not
      prove the application is unaffected; keep the operator observations.

  - id: read-boundary-capture
    title: "Read the boundary capture"
    expected_config: hardened
    description: |
      ### Do this
      - Stop tcpdump with Ctrl-C; record UTC end and packet/drop statistics.
      - Open the PCAP on **eng-ws** and match each tuple/window on both named boundary interfaces.
      - Join logged-rule timeouts to SYN/absence and exact events; classify default drops separately.
      - Retain positive request/response and operator evidence; mark missing evidence inconclusive.
      - Copy the PCAP and records outside the reset path before any reset or shutdown.

      Stop tcpdump with Ctrl-C in fw-1 after the last test. Note the UTC end and
      its packet/drop statistics. A capture that dropped packets cannot establish
      absence reliably. Open the eng-ws desktop from the Network Map node
      drawer in the second browser tab, launch Wireshark and use **File → Open**
      for `/home/abc/pcaps/validation.pcap` (a read-only mount, no transfer needed).
      From the eng-ws terminal, list SYN/SYN-ACK rows for one test tuple
      (replace both hosts and port for each test):

          tshark -r /home/abc/pcaps/validation.pcap -Y 'tcp.flags.syn == 1 && ip.addr == 10.10.10.50 && ip.addr == 10.40.40.20 && tcp.port == 502' -T fields -E header=y -e frame.number -e frame.time_utc -e sll.ifindex -e ip.src -e tcp.srcport -e ip.dst -e tcp.dstport -e tcp.flags

      :::hint Capture columns and exact interface names
      `frame.time_utc` prints ISO 8601 UTC (ending in Z), matching the event
      time basis without converting epoch seconds.
      The `sll.ifindex` column is the Linux cooked SLL2 interface index;
      `frame.interface_id` is not the capture interface in this classic PCAP.
      The short listing is one row per matching frame, not a full packet dump.
      Use packet details → Linux cooked capture v2 interface index to distinguish
      the ingress and egress legs. Read fw-1's current interface indexes in its
      Linux terminal with `ip link`; join each index to its exact kernel name.
      `wan` is enterprise, `dmz` vendor/engineering, `lan1` station, `lan2` field,
      `lan4` Control Centre and `lan5` Operations DMZ. `lan3` is management.
      Never infer a zone from packet order or an ethN number. In Wireshark, filter
      one test tuple and its UTC window at a time. Expand TCP and the application
      dissector. Save packet/frame references against each test ID.
      :::

      | Reference negative tuples | Deciding rule / evidence class |
      |---|---|
      | Kali or vendor→RTU:2404 | `deny-unauthorized-iec104`, logged |
      | Kali, vendor, eng-ws→field:502; PLC/GPS→breaker:502 | `deny-unauthorized-modbus`, logged |
      | Kali/vendor→PLC:8080 | `deny-unauthorized-plc-web`, logged |
      | Kali/vendor→historian:8081 | `deny-unauthorized-historian-ingest`, logged |
      | Kali→vendor:3389,5900 | default drop, no rule-hit event |
      | Vendor→historian:8080 | default drop, no rule-hit event |
      | CC→GPS:2404 | `deny-unauthorized-iec104`, logged (GPS is in lan1) |

      These classes describe the full reference, not every partial plan. A
      deferred exposure may be allowed. For custom rules, read their actual
      first-match order and logging. Default-drop negatives have no rule-hit
      event: evidence is the connect timeout + source-zone SYN + destination-zone
      absence in a loss-free capture with a working control. Record event as
      “not applicable — default drop”, not “missing”. Never change the policy to
      manufacture an event. A logged-rule row without its expected event is
      incomplete evidence; investigate rather than treating it as default drop.

      For each negative expected to be denied, find the SYN on the source-zone
      interface and show it is absent on the destination-zone interface in that
      same window. Compare with a working authorized control to show that the
      capture covers both legs. If the destination sends RST, it was reached.

      :::hint Missing packets are inconclusive
      No packets is not proof of denial. Wrong filters, missing interfaces,
      packet loss or no source SYN make the result inconclusive. A timeout alone
      does not prove the firewall caused it. Record inconclusive rows and retest;
      do not turn missing evidence into a pass.
      :::

      From the fw-1 terminal, return to the containd CLI with `containd cli`
      and type:

          show events

      Join the `firewall.rule.hit` DENY row's event ID, ruleId, real SRC,
      DST, TCP port and UTC time to each logged-rule negative's host timeout and
      source-zone SYN / destination-zone absence. Preserve all three references
      for logged-rule rows. Default-drop rows use timeout and both capture legs,
      with no event expected. An event alone does not establish that required
      applications are unaffected.

      :::hint Positive connections and established production traffic
      For each new routed positive connection, find the handshake on both interfaces and the
      source's native request/response. Match the live poller's responses to the
      fresh points observed by the operator. A handshake without application
      response proves TCP reach only. Intra-zone traffic is outside this capture's
      scope; retain its endpoint and operator evidence separately.

      An already established production poller may send no SYN in this window.
      Clear the SYN filter in Wireshark and match its request/response pairs on
      both boundary interfaces. Record that a new handshake was not observed;
      do not restart a production poller just to manufacture one.
      :::

      | Test ID | UTC / tuple | Source-zone SYN frame | Destination-zone frame or checked absence | DENY event ID / ruleId | Handshake / request-response frames | Result / limitation |
      |---|---|---|---|---|---|---|
      | | | | | | | |

      ### Save your evidence before any reset

      - On the Docker host, open the install root in Finder or File Explorer.
        The capture is `data/eu-iec104-substation/firewall/captures/validation.pcap` relative to that root.
      - Copy that file with the host file manager to a folder outside `data/`
        (for example, Documents/Range evidence). For a browser on another
        machine, transfer that saved copy to the browser machine first. The
        eng-ws mount is read-only and is not a download to your computer.
      - Save Notes, the redacted running export, UTC window, test table,
        event IDs/ruleIds and packet/drop statistics alongside the PCAP.
      - Reset Lab deletes `/data/captures/*.pcap` and replaces the running
        policy with Weak. Save before reset or shutdown; do not rely on the
        captures directory as your evidence archive.

      Supplementary **Live Firewall Events**
      in the Segmentation drawer may add context. They do not replace this
      capture comparison; a detection record alone is not proof of prevention.

  - id: check-operator-health
    title: "Check operator and plant health"
    expected_config: hardened
    description: |
      ### Do this
      - Compare plant state, supply, alarms and CC quality with the baseline under the same policy.
      - Press **Interrogate station**; record fresh valid inventory values, quality and UTC time.
      - Answer both operator observations; use the approved rollback if an abort criterion was met.

      Compare the plant with the baseline while the reviewed policy remains active.
      Check breaker closed, RMU1 closed/RMU2 open, OLTC remote/auto, fresh section
      supply and CC quality in Control Centre and Physical System.
      Select **Interrogate station** again now. Record its UTC time and require
      every inventory point non-null and valid since this GI start within the
      ten-minute attempt window. This is a post-capture operator check, not
      packet evidence. A reconnect here needs a new capture window for fresh
      handshake evidence; do not claim a stopped capture contains that traffic.
      Record point values, quality and UTC time, not just a green screen. Require
      fresh good-quality points, no new alarms and loads supplied.

      :::hint Supply is not visibility
      A physically healthy plant with stale points is a visibility failure.
      Do not change the plant to manufacture an acceptance result.
      :::

      :::decision id=pos-test-ops-intact options=NORMAL_OPS,DEGRADED,ALARMS_PRESENT
      Are operations healthy after the tests?
      :::why
      This records your observation; it is not graded. NORMAL_OPS requires device
      and process continuity, not only open TCP ports. Investigate and restore
      DEGRADED or ALARMS_PRESENT before handing the change back.
      :::

      :::decision id=neg-test-no-impact options=UNCHANGED,DEGRADED,UNCLEAR
      Did the tests leave operations unchanged?
      :::why
      Compare before/after values. This is not graded. UNCLEAR needs a comparable
      baseline; a timeout does not show that operations were unaffected.
      :::

      If an abort criterion was met, stop, notify the operator and use the approved
      rollback: withhold `confirm` if a commit-confirmed deadline is pending, or use
      `rollback` for the previous running config (one level only). If that slot no
      longer holds the intended policy, import the saved JSON backup via browser
      upload or local/SSH `import config <file>` in fw-1. Import stages only: review
      the full diff, use `commit confirmed <seconds>`, check management and required
      operations, then `confirm`. Read back and retest the restored policy. Record
      who authorized restoration; management protection refuses unsafe targets.
      The **Cross-check the current system** samples plant state. It does not
      grade these observations or authorize the change.
    action:
      type: check
      expect:
        breaker_closed: true
        supply_present: true
        cc_link_fresh: true

  - id: sign-test-record
    title: "Sign the test record"
    expected_config: hardened
    description: |
      ### Do this
      - Read back the final running identity; start a new window if it changed.
      - Complete the test record below in Notes and attach every named artifact.
      - Choose go/no-go against the approved scope; name untested work and residual-risk owners.
      - Obtain tester, operator and change-owner signatures; save outside the reset path.

      Do not merge evidence from different policies. Fill every record field and
      attach the test plan, row results,
      packet references, PCAP, redacted running export and before/after operator
      readings. **Cross-check the current system** does not replace your test evidence; use
      **Cross-check the current system** only as an optional second check.

      Test record
      - Change ID / package / curriculum revision:
      - Running policy identity before and after / commit / UTC window:
      - Test IDs passed / failed / inconclusive, with evidence filenames:
      - Deferred Lab 1.4 actions / remaining exposures / named risk owner:
      - Exceptions and next test / owner / due date:
      - Limits: sampled tuples and time only; intra-zone visibility gaps;
        TCP reach is not command authorization. Monitoring never satisfies BLOCK.
      - Operator baseline and final readings / alarms / supply:
      - Abort or rollback performed / authority / restored readings:
      - Go / no-go and reason:
      - Tester signature / UTC:
      - Operator signature / UTC:
      - Change owner approval or rejection / UTC:

      Choose go or no-go from your evidence and approved scope. A missing positive,
      unexplained negative, stale point or unaccepted exception means no-go until
      resolved. A green current-system result does not sign this record. Record
      what remains untested and who accepts the residual risk. Preserve the files
      outside the reset path before closing the exercise.

      :::hint Optional historian-gap evidence
      [Historian uncertainty](/knowledge#eu-historian) explains link-loss stale samples and archive gaps. This sidebar is optional, not a mandatory outage exercise or validation prerequisite.
      :::

      :::hint Optional depth: shadow evidence for a local handover
      If you chose the optional Lab 2.2 monitoring work, retain its applied three-rule readback and embedded containd **Firewall/ICS tables** baseline/deltas, snapshotVersion, since, unit, rule IDs and UTC window. Pair `ics.decision` monitor events (`would_allow` / `would_drop`, configured action and reason) with independent command feedback/field outcomes and the restored operating state. Retain the OLTC lower→step-only and raise→both comparison. A fully decoded select-before-operate (SBO) action normally adds two matches per matching rule, not guaranteed; require ≥1, never exactly two. Counts are matching rule × decoded message, not object counts, operation totals or full-policy predictions. A would-deny match is not a denied command; monitoring never satisfies a BLOCK requirement.
      Expand **Inspect rule** for Conditions, ICS Filter and full Shadow matches. On ICS, inspect **Active inspection**, **Why?** and **Inspection details**; **Technical details** retains queue/interface values.

      Successful apply resets counters; engine restart loses them. `available:false`, missing rules, a changed snapshotVersion/since or retention gaps are evidence limitations, never zero. Export before another apply/reset; if monitoring was deferred, name that gap. Monitoring uses NFQUEUE 101 with no queue bypass and adds latency: if the engine is down, the CC conduit drops. Record this forwarding dependency, rollback owner and separate GI/PLC/historian continuity proof.

      :::

      :::hint Optional instructor-led PCAP Analysis sidebar — not graded
      The instructor demonstrates and does not grade anything in this optional sidebar. Make a separate **Ethernet classic PCAP**: in fw-1's Linux terminal (`exit` from the configuration CLI first), run `mkdir -p /data/captures`, then manually run `tcpdump -i lan4 -nn -s 0 -U -w /data/captures/approved-command.pcap 'host 10.60.60.20 and host 10.30.30.20 and tcp port 2404'`. Leave this terminal capturing; do not use the bounded Run button. After tcpdump reports it is listening, use a separate cc-1 terminal to run `wget -qO- --post-data '' http://10.99.99.21:8080/api/reconnect`. Wait for connect GI, then repeat Lab 2.2's approved CB1 OPEN and CLOSE in the Control Centre. Confirm fresh feedback, breaker closed and supply restored before pressing Ctrl-C in fw-1. Starting capture before reconnect retains SYN through the controlled commands.

      Do not import the baseline `tcpdump -i any` file: it is Linux cooked SLL2 (link type 276), which containd 0.1.40 rejects even though it is classic PCAP. `lan4` is fw-1's named Control Centre interface and writes Ethernet frames. The portal has no download for this manual file. On the Docker host, the instructor selects `data/eu-iec104-substation/firewall/captures/approved-command.pcap` relative to the install root using the browser's file chooser (the bind mount exposes the same file). A source checkout is also an install root. For a browser on another machine, copy the file to that machine first; the terminal and eng-ws read-only mount do not transfer it to the browser. Before any reset, copy the file out of the captures folder: reset deletes captures.

      Use embedded containd **PCAP Analysis → Import capture → Upload & Analyze PCAP** to select that host file and choose **Analyze**; do not assume it appears in **Existing PCAP Files**. Follow **Collect → Generate → Review → Stage**. Inspect the sealed dataset, capture hash, gaps and expiry; explicitly **Generate suggestions**. Expand **Inspect suggestion** and **Checks on saved evidence** for checks, limitations and withheld reasons: SBO sequences, setpoint values/QL and bitstrings remain withheld; monitoring ASDUs/startup do not become command ALLOWs. Certification is bounded evaluator evidence, not permission, delivery proof or universal protocol proof.

      An authenticated administrator **Review** approves the exact IEC revision and acknowledges wire/NAT scope; then select revisions and **Stage N selected** (where N is the selected revision count) as explicit `mode: monitor` only. Inspect the candidate diff and verify running policy is unchanged. Stage is not apply: **Commit is a separate deliberate step and is not performed in this sidebar**. End by **discarding the candidate**: open **Configuration → Staged config**, choose **Copy running → staged**, then **Save staged config**. Confirm the config diff shows no changes and the running policy/hash is unchanged. **Discard receipt** does not undo staged rules; verify the candidate diff is actually empty. Start only with a clean candidate so discarding cannot lose another operator's work. Do not mix suggestions or certification with the TCP acceptance score. [Workflow and limits](/knowledge#eu-ics-dpi).
      :::
