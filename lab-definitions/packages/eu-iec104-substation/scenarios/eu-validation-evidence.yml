id: eu-validation-evidence
order: '2.4'
name: Testing & Validation
summary: Review EU positive/negative tests and PCAP evidence, confirm continuity and reflect on deferred risk.
estimated_minutes: 7
validator: eu-validation-evidence
description: Validate the policy actually running, not the intended design. Inspect authorized and unauthorized results, confirm the feeder still operates and explain residual risk. These are bounded observations, not proof of every possible attack or regulatory compliance.
nodes:
- kali-1
- eng-ws-1
- fw-1
- cc-1
- rtu-1
- vendor-jump-1
tags:
- iec104
- eu-substation
- validation
- testing
- pcap
- evidence
- defense
steps:
- id: confirm-hardened-config-is-active
  title: Confirm hardened config is active
  expected_config: hardened
  description: |
    Confirm the intended applied plan, package revision, action IDs and running hash.
    Do not replace a partial plan with Hardened just to obtain a green result.
    Named and manual policies use Hardened expectations; their plan proof is not applicable. You are validating an existing change, not authoring a new one.

    :::findings-panel from=eu-segmentation-requirements title="Your committed design"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU station sources → field (except PLC→OLTC)
    unauth-control: Cross-zone foreign-source IEC 104 / Modbus attempts
    :::

    :::findings-panel from=eu-firewall-implementation title="Your evidence status (Lab 2.2)"
    evidence-policy: Running policy export and identity
    evidence-positive: Positive tests and operational continuity
    evidence-negative: Negative tests and deferred exposures
    evidence-capture: PCAP tied to the test window
    :::

    These are your earlier evidence statuses, not current proof. Resolve missing or
    unclear items and collect fresh evidence for this policy commit.

    **Time budget:** ~7 minutes for the Guided core path: continuity
    review and reflection. Advanced manual tests, shadow comparisons and the
    instructor PCAP walk are optional depth and take extra time.

    :::hint Running, not candidate
    In containd inspect running configuration and its identity. Six operational conduits must remain. Hardened includes three separate explicit-monitor IEC 104 rules; a plan includes them only when **Monitor IEC 104 commands** is selected. Verify running rules, not candidate-only entries. No command enforcement is claimed.
    :::
  action:
    type: check
    expect:
      firewall_config: improved
- id: generate-the-validation-report
  title: Review validation evidence
  expected_config: hardened
  description: |
    Read every row: a failed positive blocks operations; a failed negative leaves exposure. Retain every inventory point after a fresh general interrogation (GI); F2 has five indications, no command. Negative tests probe Kali→RTU, foreign→field, enterprise→PLC and Kali→vendor RDP/VNC. Only connect timeout is denied; connection refused is reached, tool/container errors fail honestly. Default-deny drops need not emit logs.

    Inspect your PCAP: RTU **and PLC→OLTC** are legitimate field sources. RTU↔PLC/GPS stays invisible at the firewall. A SYN captured on ingress does not prove a completed control operation.

    In [/substation](/substation), confirm breaker closed, normal RMUs, OLTC auto, supply present and fresh valid CC observations.

    :::decision id=pos-test-ops-intact options="NORMAL_OPS,DEGRADED,ALARMS_PRESENT"
    Are operations intact after validation?
    :::why
    NORMAL_OPS needs healthy operator observations and independent device/process continuity, not only open TCP ports. DEGRADED or ALARMS_PRESENT needs investigation and restoration; the dropdown records your run and is not an acceptance test.
    :::
    :::decision id=neg-test-no-impact options="UNCHANGED,DEGRADED,UNCLEAR"
    Were operations unchanged? Compare this result with your evidence and structured plan coverage.
    :::why
    UNCHANGED needs before/after operational evidence alongside the tests. DEGRADED means investigate impact; UNCLEAR means collect a comparable baseline. A timeout alone does not establish that operations were unaffected.
    :::

    :::hint Advanced: run the positive tests by hand
    Open a node on the [Network Map](/console), then **Show terminal**.
    Use the six-conduit inventory from Lab 2.2; every plan preserves these flows.
    In the **Control Centre**, reconnect after the commit and require a completed
    current-connection general interrogation (GI) within the ten-minute attempt
    window, with every inventory point non-null, valid and received since its
    GI start. If this evidence is missing, press **Interrogate station** and
    validate again. Quiet valid status need not advance continuously; float
    observations have a cyclic-report watchdog.

    From the **Kali terminal**, test authorized historian reader access:

        curl -fsS --max-time 3 http://10.70.70.40:8080/api/points

    Expect a points response; this tests reading, not the separate CC ingest
    conduit. Confirm advancing archive samples for ingest.

    From the **eng-ws terminal**, test the named engineering web exception:

        curl -fsS --max-time 3 http://10.30.30.30:8080/login

    Expect the PLC login page, not permission for vendor field control. Confirm
    RTU field points, PLC heartbeat and post-commit PLC-originated OLTC motion
    using Lab 2.2's controlled regulation loop. The operator screen needs fresh
    valid observations, normal breakers/RMUs, auto regulation and supply.
    Same-subnet successes are endpoint evidence, not routed firewall proof.
    See [acceptance and handover](/knowledge#eu-acceptance-handover).
    :::

    :::hint Advanced: run the negative tests by hand
    Check these source/path
    groups, not just the first failed connection:

    - Kali → RTU TCP/2404, all five field devices TCP/502, PLC TCP/8080,
      vendor TCP/3389 and TCP/5900, and historian ingest TCP/8081.
    - Vendor-jump → RTU TCP/2404, PLC TCP/8080, all five field devices TCP/502,
      historian read TCP/8080 and ingest TCP/8081.
    - Eng-ws → all five field devices TCP/502.
    - PLC and GPS → breaker TCP/502 (non-RTU source-pin tests).
    - CC → GPS TCP/2404 (the authorized CC is not allowed every destination).

    From **Kali**, sample the enterprise-to-station and field paths:

        nmap -Pn -p 2404 10.30.30.20 --max-retries 1 -T4
        nmap -Pn -p 502 10.40.40.20 --max-retries 1 -T4
        nmap -Pn -p 3389,5900 10.20.20.10 --max-retries 1 -T4

    `-Pn` skips host discovery. Under Hardened expect `filtered` / timeout,
    compared with an open-port Weak control. Under a partial plan compare the
    owning action: a deferred exposure may remain reachable. Connection refused
    is reached, never denied; a missing tool is missing evidence. Repeat from
    each named source using the intended destination and port; these samples
    cannot replace the matrix. Keep the Control Centre and process healthy while
    probing. See [port and source boundaries](/knowledge#eu-port-source-boundary).
    :::

    :::hint Advanced: capture PCAP by hand
    From the **fw-1 terminal**, type `exit` if the configuration CLI is open;
    the wrapper starts Linux bash. Start a bounded capture while named-source probes run in another terminal:

        tcpdump -i any -nn 'tcp port 2404 or tcp port 502 or tcp port 8080 or tcp port 8081' -G 12 -W 1 -w /data/captures/validation.pcap

    This collects a twelve-second window of telecontrol, field Modbus, reader/web
    and ingest traffic. A listening message is normal; wait for the capture to
    finish. Read it back from the **fw-1 terminal**:

        tcpdump -r /data/captures/validation.pcap -nn

    With `any`, a routed packet may appear on multiple interfaces; packet counts
    are not operation counts. Compare tuples and UTC times. RTU and the explicit
    PLC→OLTC exception are legitimate field sources; same-subnet RTU↔PLC/GPS
    traffic is invisible here. An ingress SYN alone is not delivery proof. This
    cooked capture is network evidence, not the Ethernet input for the optional
    instructor PCAP Analysis walk. Use `containd cli` to return to the CLI.
    See [tcpdump](/knowledge#eu-tool-tcpdump).
    :::

    :::hint Advanced: assemble the evidence package by hand
    From the **fw-1 terminal**, use `containd cli` if still in bash, then:

        export config
        show audit

    `export config` prints redacted running JSON: copy it, not shell redirection.
    Full export needs explicit administrator intent; do not share secrets.
    `show audit` provides commit identity/timing, not per-flow verdicts. Attach
    the plan record when applicable, matrix results, PCAP and UTC window with a
    Control Centre / Physical System screenshot showing fresh valid observations
    and normal supply/regulation. Correlate Live Firewall Events by tuple/time;
    silent default drops need not emit logs. The L4 source pin enforces; DPI
    detects and logs. Monitoring is not prevention and cannot satisfy BLOCK.
    See [evidence lifecycle](/knowledge#eu-evidence-lifecycle).
    :::

    :::hint Optional historian-gap evidence
    [Historian uncertainty](/knowledge#eu-historian) explains link-loss stale samples and archive gaps. This sidebar is optional, not a mandatory outage exercise or validation prerequisite.
    :::

    :::hint Optional depth: shadow evidence for a local handover
    If you chose the optional Lab 2.2 monitoring work, retain its applied three-rule readback and embedded containd **Firewall/ICS tables** baseline/deltas, snapshotVersion, since, unit, rule IDs and UTC window. Pair `ics.decision` monitor events (`would_allow` / `would_drop`, configured action and reason) with independent command feedback/field outcomes and the restored operating state. Retain the OLTC lower→step-only and raise→both comparison. A fully decoded select-before-operate (SBO) action normally adds two matches per matching rule, not guaranteed; require ≥1, never exactly two. Counts are matching rule × decoded message, not object counts, operation totals or full-policy predictions. A would-deny match is not a denied command; monitoring never satisfies a BLOCK requirement.
    Expand **Inspect rule** for Conditions, ICS Filter and full Shadow matches. On ICS, inspect **Active inspection**, **Why?** and **Inspection details**; **Technical details** retains queue/interface values.

    Successful apply resets counters; engine restart loses them. `available:false`, missing rules, a changed snapshotVersion/since or retention gaps are evidence limitations, never zero. Export before another apply/reset; if monitoring was deferred, name that gap. Monitoring uses NFQUEUE 101 with no queue bypass and adds latency: if the engine is down, the CC conduit drops. Record this forwarding dependency, rollback owner and separate GI/PLC/historian continuity proof.

    :::

    :::hint Optional instructor-led PCAP Analysis sidebar — not graded
    The instructor demonstrates and does not grade anything in this optional sidebar. Make a separate **Ethernet classic PCAP**: in fw-1's Linux terminal (`exit` from the configuration CLI first), run `mkdir -p /data/captures`, then manually run `tcpdump -i lan4 -nn -s 0 -U -w /data/captures/approved-command.pcap 'host 10.60.60.20 and host 10.30.30.20 and tcp port 2404'`. Leave this terminal capturing; do not use the bounded Run button. After tcpdump reports it is listening, use a separate cc-1 terminal to run `wget -qO- --post-data '' http://10.99.99.21:8080/api/reconnect`. Wait for connect GI, then repeat Lab 2.2's approved CB1 OPEN and CLOSE in the Control Centre. Confirm fresh feedback, breaker closed and supply restored before pressing Ctrl-C in fw-1. Starting capture before reconnect retains SYN through the controlled commands.

    Do not import the baseline `tcpdump -i any` file: it is Linux cooked SLL2 (link type 276), which containd 0.1.40 rejects even though it is classic PCAP. `lan4` is fw-1's named Control Centre interface and writes Ethernet frames. The portal has no download for this manual file. On the Docker host, the instructor selects `data/eu-iec104-substation/firewall/captures/approved-command.pcap` relative to the install root using the browser's file chooser (the bind mount exposes the same file). A source checkout is also an install root. For a browser on another machine, copy the file to that machine first; the terminal and eng-ws read-only mount do not transfer it to the browser. Before any reset, copy the file out of the captures folder: reset deletes captures.

    Use embedded containd **PCAP Analysis → Import capture → Upload & Analyze PCAP** to select that host file and choose **Analyze**; do not assume it appears in **Existing PCAP Files**. Follow **Collect → Generate → Review → Stage**. Inspect the sealed dataset, capture hash, gaps and expiry; explicitly **Generate suggestions**. Expand **Inspect suggestion** and **Checks on saved evidence** for checks, limitations and withheld reasons: SBO sequences, setpoint values/QL and bitstrings remain withheld; monitoring ASDUs/startup do not become command ALLOWs. Certification is bounded evaluator evidence, not permission, delivery proof or universal protocol proof.

    An authenticated administrator **Review** approves the exact IEC revision and acknowledges wire/NAT scope; then select revisions and **Stage N selected** (where N is the selected revision count) as explicit `mode: monitor` only. Inspect the candidate diff and verify running policy is unchanged. Stage is not apply: **Commit is a separate deliberate step and is not performed in this sidebar**. End by **discarding the candidate**: open **Configuration → Staged config**, choose **Copy running → staged**, then **Save staged config**. Confirm the config diff shows no changes and the running policy/hash is unchanged. **Discard receipt** does not undo staged rules; verify the candidate diff is actually empty. Start only with a clean candidate so discarding cannot lose another operator's work. Do not mix suggestions or certification with the TCP acceptance score. [Workflow and limits](/knowledge#eu-ics-dpi).
    :::

    Save **Export plan record** beside **Export compiled config**, your test evidence
    and PCAP. The record contains package ID, revision, label, action IDs and
    policy hash. Use `GET /api/firewall/active` to check what is running.
    The L4 source pin enforces; DPI detects and logs. Neither TCP proof, a
    logged L4 deny nor a would-deny monitor match proves command-aware prevention.
  action:
    type: check
    expect:
      firewall_config: improved
      breaker_closed: true
      supply_present: true
      cc_link_fresh: true
- id: reflection-what-did-your-plan-close
  title: Reflection - what did your plan close?
  description: |
    Review the complete evidence chain, including what passive capture missed.

    :::findings-panel from=eu-baseline-assessment title="Passive findings"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU station sources → field (except PLC→OLTC)
    unauth-control: Cross-zone foreign-source IEC 104 / Modbus attempts
    :::

    :::findings-panel from=eu-baseline-assessment title="Latent exposure"
    latent-exposure-confirmed: Active reachability beyond capture
    :::

    :::findings-panel from=eu-segmentation-requirements title="Committed design"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU station sources → field (except PLC→OLTC)
    unauth-control: Cross-zone foreign-source IEC 104 / Modbus attempts
    :::

    :::plan-coverage title="Selected actions vs committed design"
    :::

    The findings, design verdicts, selected actions and Lab 2.2 evidence statuses
    carry forward as structured inputs. Use them alongside the tests; do not
    transcribe the Lab 1.4 deferrals again.

    ### Now reflect

    In your Exercise Notes, discuss the validation evidence:

    1. Which positive or negative test result most changed your confidence in the running policy?
    2. What does your evidence prove, and what remains outside its scope?
    3. What evidence, operational owner or retest is needed before this change could be approved?
    4. What additional architecture or monitoring control would reduce a visibility blind spot?

    These discussion notes add context, not a replacement for evidence or a
    second transcription of structured inputs. For EU, consider the same-subnet
    RTU/PLC/GPS blind spot and command authority on an allowed CC connection.

    :::hint Honest handover
    IEC 104 monitoring adds observation evidence, not command restriction or a promise of later enforcement. Modbus DPI remains planning-only. Breaker control on an allowed CC session remains a residual risk. L4 is live but cannot distinguish commands on an allowed CC session. Keep this residual explicit alongside IEC 62443 design and NIS2/BDEW change accountability. Retain policy, test evidence and PCAP before reset.
    :::
