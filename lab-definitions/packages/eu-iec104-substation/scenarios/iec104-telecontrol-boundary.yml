id: iec104-telecontrol-boundary
order: "1.0"
name: "IEC 104 Telecontrol Boundary"
summary: "Trace a breaker command, constrain the telecontrol boundary, and prove that stale observation is not physical truth."
estimated_minutes: 35
validator: eu-iec104-telecontrol
description: |
  You are the station engineer reviewing a feeder's remote-control boundary.
  Follow a command from the CC through the RTU to the breaker. Observe
  select-before-operate (SBO), then restrict access to the named sources.
  Compare an established session with a new connection attempt. Take the
  CC off-line without disabling local protection. Compare its stale cache
  with the physical feeder state, then restore the telecontrol path.
  Keep a timestamped record of commands, observations, policy changes and
  recovery evidence. Export this record before reset. Carry your findings
  into Design and Prove the Station Conduits.
nodes: [cc-1, rtu-1, kali-1, fw-1, breaker-1]
tags: [iec104, telecontrol, firewall, process-truth]
steps:
  - id: observe-baseline
    title: "Map the boundary and capture a baseline"
    expected_config: weak
    node: kali-1
    description: |
      Start on the weak policy with a healthy, closed breaker. If this is
      not your starting state, use Reset Lab before gathering evidence.
      Record UTC start time and CC cache epoch. Map CC 10.60.60.20 (lan4)
      → RTU 10.30.30.20 (lan1), TCP/2404; RTU → breaker 10.40.40.20
      (lan2), TCP/502. Label each address, trust boundary and protocol.

      This exercise grades only breaker IOAs **1001, 1002, 2001 and 2002**.
      The RMUs, OLTC and PLC belong to the next labs. The RTU may return
      their points too. Filter for the four breaker IOAs; do not assume
      the whole station has only four points. IEC 104 timestamps are RTU
      observation times, not device SOE timestamps.

      Rules are source/port based, **not command authorisation**. An allowed
      CC can still open and close. The portal's physical feeder panel reads
      separate management APIs; it never supplies the CC's observed cache.
      Management and process networks are workshop infrastructure, not
      student conduits. The CC, vendor-jump and eng-ws share the management
      network with the sim/solver APIs. Do not use those APIs as an
      observation shortcut. This lab does not prove management isolation.

      Read [Architecture](#eu-telecontrol-architecture) and
      [Evidence lifecycle](#eu-evidence-lifecycle).

          iec104cmd 10.30.30.20 monitor --json --hold 2
          iec104cmd 10.30.30.20 gi --json

      Save the completed GI and compare the four breaker IOAs with
      [/substation](/substation). Keep quality and receipt times alongside
      values. Capture at fw-1's shell with
      `tcpdump -ni any -w /data/captures/lab1.pcap 'tcp port 2404 or tcp port 502'`.
      Stop it with Ctrl-C after the command exercise; copy/export the PCAP.

      :::decision id=baseline-reachable options=CONFIRMED,NOT_OBSERVED
      Can an enterprise host request station data without a CC identity?
      :::
      :::hint Evidence, not just a socket
      A completed GI with COT 20 objects and activation termination proves
      a protocol operation. An open TCP port alone does not.
      :::
      Read [GI and quality](#iec104-gi-cot-quality), [CLI](#tool-iec104cmd)
      and [Packet evidence](#tool-iec104-tshark).
    action:
      type: probe
      outcome: reachable
      targets:
        - {host: 10.30.30.20, port: 2404, note: "Kali to RTU; follow with a real GI"}

  - id: operate-breaker
    title: "Follow a command across both protocols"
    expected_config: weak
    node: cc-1
    description: |
      Predict which feeder loads lose supply when CB1 opens. Through the
      CC controls on /substation issue open, then close, waiting for each
      result before the next. Record command id, selected/executed times,
      ACT-CON, matching feedback and ACT-TERM. Decode Type 46 select and
      execute in the capture; correlate with the RTU's Modbus FC6 to HR0.
      Confirm operator observation, device position and solved feeder
      response separately. A write acknowledgement alone is not completion.

      :::decision id=port-is-authority options=NO,YES
      Does permitting TCP/2404 distinguish an authorised open from an
      unauthorised close issued by that same allowed host?
      :::
      :::hint Unknown is not failed
      Missing ACT-CON, termination or feedback leaves an ambiguous outcome.
      Do not retry blindly: read the observed state before another operation.
      :::
      Read [SBO commands](#iec104-sbo-commands) and
      [Control authority](#eu-control-authority).

  - id: expose-weak
    title: "Retain a foreign session before the change"
    expected_config: weak
    node: kali-1
    description: |
      Apply weak with this step, then leave this monitor in one terminal:

          iec104cmd 10.30.30.20 monitor --json --hold 180 --gi-every 2

      Record its source port and start time from conntrack at the firewall.
      Use a second Kali terminal for new attempts. Predict what will happen
      to the old flow when you replace the policy. If 180 seconds expires,
      repeat this step before applying improved; do not call an expired
      session proof that policy killed it.

      :::decision id=existing-flow options=SURVIVES,DISCONNECTS
      Will a new deny necessarily sever an already established connection?
      :::
      :::hint Mark two attempts
      Distinct source ports distinguish the retained session from a fresh
      attempt. Save the tuple as well as the policy-change timestamp.
      :::
      Read [Established sessions](#eu-established-sessions).
    action: {type: firewall, config: weak}

  - id: apply-improved
    title: "Source-pin the boundary and compare old with new"
    expected_config: hardened
    node: kali-1
    description: |
      Apply improved. Find the named-source allows CC 10.60.60.20/32 →
      RTU 10.30.30.20/32 TCP/2404 and RTU → breaker TCP/502, followed
      by logged denies for other sources. Later labs use additional allows;
      do not delete them merely because lab 1 examines only the breaker.

      While the old Kali monitor still receives ASDUs, run a NEW
      `iec104cmd 10.30.30.20 gi --json`. Save its failure and the matching
      firewall DENY with source, destination, port and UTC time. Recheck
      the CC still receives good points. If the old monitor expired, repeat
      the weak-to-improved experiment; do not weaken the acceptance rule.

      :::decision id=source-boundary options=CONFIRMED,NOT_OBSERVED
      Is the new foreign attempt denied while the named CC still operates?
      :::
      :::hint This is not DPI
      Both old and new sessions carry IEC 104. The difference is source
      identity and conntrack state, not inspection of an open/close payload.
      :::
      Read [Port/source boundaries](#eu-port-source-boundary).
    action: {type: firewall, config: improved}

  - id: cut-session
    title: "Isolate the CC and interpret its stale cache"
    expected_config: hardened
    node: cc-1
    description: |
      Export improved for rollback. In containd make a temporary restrictive
      copy removing only the CC→RTU allow, apply it and read back the
      running rules. Only THEN execute this step. It removes the exact
      CC→RTU conntrack tuple when exactly one complete session matches;
      it sends no TCP reset. The next packet must face the new deny.

      Wait for link_down and point_stale in the CC journal. Compare the
      last cached position, source time and received_at with the physical
      panel on /substation. IV+NT/link_lost means untrusted age, not open,
      not closed and not zero. Keep both views in your evidence record.

      :::decision id=stale-is-zero options=NO,YES
      May an operator treat the stale current as a fresh zero measurement?
      :::
      :::hint Separate the clocks
      Source time belongs to RTU observation; receipt time belongs to CC
      delivery. Neither is the time of your screenshot.
      :::
      Read [GI/quality](#iec104-gi-cot-quality) and
      [Observation versus truth](#eu-rtu-control-centre-apis).
    action: {type: session-cut, flow: cc-rtu}

  - id: local-trip
    title: "Prove autonomous protection during the outage"
    expected_config: hardened
    node: breaker-1
    description: |
      Confirm the breaker is closed and the CC points are stale before
      executing this step. It injects a process-owned S1 fault. Observe
      CB1 open, protection trip and lockout in the separate physical panel,
      with the solved feeder losing supply while the CC cache stays stale.
      Record the local_protection_trip audit revision and its first_solve
      acknowledgement between link_down and the eventual recovery GI.

      :::decision id=local-protection options=INDEPENDENT,CC_DEPENDENT
      Does severing telecontrol prevent this local protective trip?
      :::
      :::hint Do not repair observation with truth
      A correct physical panel does not mean the CC learned the trip.
      Only renewed IEC 104 reception can establish that.
      :::
      Read [Breaker protection](#eu-feeder-breaker-protection) and
      [Outage consequences](#eu-outage-voltage-consequences).
    action: {type: command, device: process, command: fault_s1}

  - id: clear-fault
    title: "Clear the fault without claiming restoration"
    expected_config: hardened
    node: breaker-1
    description: |
      Execute process clear_fault. The fault disappears, but CB1 remains
      open, locked out and tripped; the disconnected CC is still stale.
      Record all three facts separately. Do not reset CB1 yet: the final
      comparison needs its tripped state, and resetting loses that evidence.

      :::decision id=fault-clear-restores options=NO,YES
      Is clearing the initiating fault sufficient to restore feeder service?
      :::
      :::hint Latched means latched
      Removing a cause is not the same operation as acknowledging lockout
      or closing a switch. Reserve restoration until after evidence export.
      :::
    action: {type: command, device: process, command: clear_fault}

  - id: restore
    title: "Recover only the named telecontrol path"
    expected_config: hardened
    description: |
      Restore improved with this step. Wait for a later connection_seq,
      link_up and gi_complete in the SAME CC cache epoch. Verify the four
      breaker points are GOOD and the observed open position agrees with
      the independently read device. Protection stays latched. A CC restart
      discards the journal; if that happened, repeat the exercise rather
      than join unrelated boot identities.

      :::decision id=recovery-evidence options=GI_AND_FRESH_VALUES,TCP_ONLY
      What demonstrates restored operator visibility rather than a socket?
      :::
      :::hint Bound the narrative
      Order link_down → stale → local trip → first_solve → reconnect → GI.
      Missing entries or a truncated ring leave missing evidence, not a pass.
      :::
      Read [Evidence lifecycle](#eu-evidence-lifecycle).
    action: {type: firewall, config: improved}

  - id: evidence
    title: "Export findings for the conduit design"
    expected_config: hardened
    description: |
      Run Validate now, before resetting. Export the result, PCAP, CC state
      and journal, breaker audit, policy diff and firewall deny. Include
      UTC bounds, cache epoch, device generation and revision, source tuples
      and the four IOAs. Explain port access versus command authority,
      established versus new sessions, and stale observation versus truth.

      Your eight decisions are the handover to lab 2. For each, record the
      measured result and uncertainty in Notes; an unobserved result is a
      follow-up task, not a guessed success. Propose which other station
      conduits need the same named-source treatment and which cannot be
      enforced at this firewall. This validator does not grade RMU/OLTC/PLC
      point quality or prove management-plane isolation.
      Read [Acceptance handover](#eu-acceptance-handover).

  - id: restore-device
    title: "Return the feeder to a safe starting state"
    node: breaker-1
    description: |
      Having exported evidence and cleared the process fault, execute this
      breaker reset. Confirm closed, no lockout, no trip and fresh CC
      observation. If the process fault was not cleared, protection will
      trip again: stop and correct the cause. Reset Lab is a broader reset
      and returns weak policy; it does not clear historian retention.
      Leave improved active for handover, or explicitly record any return
      to weak. Lab 2 begins a new bounded evidence attempt.
      Read [Reset acceptance](#eu-reset-acceptance).
    action: {type: command, device: breaker, command: reset}
