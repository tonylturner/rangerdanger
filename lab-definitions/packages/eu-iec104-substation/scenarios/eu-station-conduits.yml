id: eu-station-conduits
order: "2.0"
name: "Design and Prove the Station Conduits"
summary: "Turn the boundary findings into a budgeted station-wide design, implement named-source conduits, and compare operations with the plan."
estimated_minutes: 50
validator: eu-station-conduits
description: |
  Act as a small distribution-system operator change team. Carry lab 1's
  boundary findings into a station-wide conduit design. Inventory the
  assets and zones, capture the required operational flows, and agree
  which named sources need each connection. Build a resource plan within
  the available labour budget, then implement and test your design. Prove
  that legitimate station operations still work and that fresh attempts
  at lateral movement are denied. Rehearse rollback and compare the
  measured results with your plan. Deliver a timestamped acceptance record
  covering the evidence, remaining gaps, assigned owners and next actions.
nodes: [fw-1, kali-1, vendor-jump-1, eng-ws-1, cc-1, rtu-1, breaker-1, rmu-1, rmu-2, oltc-1, plc-1, historian-1, gps-1]
tags: [segmentation, design, iec104, modbus, historian, acceptance]
steps:
  - id: inventory-and-findings
    title: "Carry forward the findings and inventory every zone"
    description: |
      Export lab 1's record before Reset Lab. Begin from healthy devices,
      no fault and load/source 1.0; Reset Lab also applies weak. Never reset
      another team's shared attempt. Record UTC start, CC cache epoch and
      the owner of this change. Mark unobserved lab-1 findings for follow-up.

      The improved policy is a reference answer, not the only possible design.
      The validator measures operations rather than requiring its exact hash.
      It does not certify your written risk assessment, resource allocation,
      rollback or every possible source: retain those in the acceptance record.

      :::findings-panel from=iec104-telecontrol-boundary title="Boundary findings to carry forward"
      baseline-reachable: Enterprise can interrogate under weak
      port-is-authority: A permitted port is not command authority
      existing-flow: Established flows may survive a deny
      source-boundary: New foreign attempts denied, CC operational
      stale-is-zero: Stale is not zero
      local-protection: Protection operates without CC connectivity
      fault-clear-restores: Fault clearance is not restoration
      recovery-evidence: Recovery requires GI and fresh observed values
      :::

      | Zone | Assets and teaching addresses |
      |---|---|
      | Enterprise / wan | Kali 10.10.10.50 |
      | Vendor/Engineering / dmz | jump box 10.20.20.10; eng-ws 10.20.20.20 |
      | Station / lan1 | RTU 10.30.30.20; PLC 10.30.30.30; GPS 10.30.30.50 |
      | Field / lan2 | breaker .20, RMU1 .21, RMU2 .22, OLTC .23 on 10.40.40.0/24 |
      | Control Centre / lan4 | CC 10.60.60.20 |
      | Operations DMZ / lan5 | historian 10.70.70.40 |

      Add fw-1 (.2 in every teaching subnet), management 10.99.99.0/24
      (policy lan3) and process 10.50.50.0/24 to your diagram. Management
      holds platform APIs and sim endpoints; the solver is 10.99.99.23:8080
      and also sits on process_net with field devices. Process_net is not
      a student route, but vendor-jump (.60) and eng-ws (.61) are also on
      mgmt_net. **Acceptance limit:** denying teaching-plane Modbus does not
      prove these hosts cannot reach field simulation/control APIs over
      management. This contradicts the intended non-student management
      boundary: record it as an unresolved acceptance blocker, not a firewall
      success. Do not claim complete vendor isolation; resolve this
      infrastructure issue before an unrestricted acceptance sign-off.
      Do not access sim/solver APIs from these hosts or change infrastructure
      to hide the gap. No PLC/historian field interface or forwarding exists.
      Inventory all interfaces, not just the icon's displayed address.
      :::hint Draw the boundary you actually have
      A second interface is a separate path even when the topology icon
      shows only one address. Put the management gap on the diagram.
      :::
      Read [Zone/conduit design](#eu-zone-conduit-design),
      [IEC 62443 risk design](#eu-iec62443-risk-design),
      [Change resource plan](#eu-change-resource-plan),
      [Node map](#eu-range-node-map) and [Feeder](#eu-mv-feeder).

  - id: capture-operational-flows
    title: "Capture operations before choosing the rules"
    expected_config: weak
    node: fw-1
    description: |
      Apply weak only for the agreed baseline window. Use the portal capture
      for at least 15 seconds: it covers IEC 104 (2404), Modbus (502),
      HTTP reads and PLC maintenance (8080), and historian ingest (8081).
      Download the PCAP. Identify source, destination, request,
      response, cadence, business owner and loss consequence for each flow.
      The firewall cannot observe same-subnet RTU→PLC or RTU→GPS traffic.
      Record CC protocol observations of PLC health and valid station time
      alongside the capture; do not claim direct PCAP visibility of those
      paths. The RTU image has no tcpdump. Save this blind spot explicitly.

      :::decision id=cc-rtu options=NAMED_SOURCE,BROAD_ALLOW,DENY
      CC→RTU TCP/2404: what is the smallest acceptable conduit for GI,
      indications and SBO? Which controls still belong at the endpoint?
      :::
      :::decision id=rtu-field options=NAMED_SOURCE,BROAD_ALLOW,DENY
      RTU→breaker/RMU1/RMU2/OLTC TCP/502: allow only 10.30.30.20/32,
      or the entire station? Include reads AND legitimate command writes.
      :::
      :::decision id=plc-loop options=OLTC_ONLY,ALL_FIELD,DENY
      PLC→OLTC TCP/502: does the PLC need breaker or RMU access?
      RTU→PLC FC3 is same-subnet and needs endpoint controls, not a
      claim that containd enforces it.
      :::
      :::hint Decode one operation per flow
      Look for IEC 104 GI COT 20 and termination; field FC4 input polls;
      PLC FC3 at 1024 and FC16 to OLTC HR1. A TCP handshake is insufficient.
      The PLC normally writes zero while quiescent; that is not a tap step.
      :::
      Read [Southbound Modbus](#eu-southbound-modbus),
      [OpenPLC logic](#eu-openplc-tap-logic) and [tcpdump](#eu-tool-tcpdump).
    action: {type: firewall, config: weak}

  - id: probe-three-footholds
    title: "Measure exposures from three distinct footholds"
    expected_config: weak
    node: kali-1
    description: |
      From Kali, vendor-jump and eng-ws separately run:

          nmap -Pn -sT -p 502 10.40.40.20-23
          nmap -Pn -sT -p 2404 10.30.30.20
          nmap -Pn -sT -p 8080 10.30.30.30
          nmap -Pn -sT -p 8080,8081 10.70.70.40

      Confirm one exposed Modbus operation with
      `mbpoll -m tcp -a 1 -0 -r 0 -c 3 -t 3 -1 10.40.40.21`.
      From Kali confirm a GI with `iec104cmd 10.30.30.20 gi --json`.
      The vendor image has no iec104cmd: use its port probe and Modbus
      client, not an invented tool. Do not write switching registers here.
      Record reachability, refusal, timeout and missing tools separately.

      :::decision id=foreign-control options=DENY_AND_LOG,ALLOW
      May enterprise, vendor or eng-ws bypass the RTU to ANY field device,
      or open their own IEC 104 session? Who accepts the residual risk
      from misuse of an already trusted CC, RTU or PLC?
      :::
      :::hint An absence is not a deny
      No observed flow in a PCAP may mean nobody tried. Generate a new
      attempt and match its tuple/time to a logged policy deny.
      :::
      Read [nmap probes](#eu-tool-nmap-probes) and
      [Trusted-host misuse](#eu-trusted-host-misuse).

  - id: decide-data-and-time-conduits
    title: "Decide the historian, clock and non-forwarding boundaries"
    description: |
      Complete a row for EVERY captured or proposed conduit: named source,
      destination, direction, port, operation, owner, allow/deny verdict,
      logging, test, rollback and residual risk. Include foreign control
      denied in step 3, and engineering maintenance scoped in step 9.

      :::decision id=historian-feed options=CC_ONLY,ANY_SOURCE,DENY
      CC 10.60.60.20→historian 10.70.70.40:8081 is POST ingest only.
      Does any other source need to submit observations?
      :::
      :::decision id=historian-read options=ENTERPRISE_READ_ONLY,OT_WRITEBACK,DENY
      Enterprise→historian:8080 is GET-only. Should anything leave lan5
      toward station, CC or field? How will you prove no write-back?
      :::
      :::decision id=station-time options=RTU_TO_GPS,ALL_ZONES,DENY
      RTU→GPS 10.30.30.50:8080 is HTTP time polling, not NTP in this
      package. Both are on lan1: name endpoint controls and the firewall
      blind spot rather than promising cross-zone enforcement.
      :::
      :::hint Separate data from control
      8080 reads are not 8081 ingest. The historian retains CC-observed
      quality and gaps; it never polls field/process truth or issues commands.
      A 1 Hz snapshot archive is not a complete sequence-of-events archive.
      :::
      Read [Historian](#eu-historian), [Station clock](#eu-station-clock)
      and [Security objectives](#eu-security-objectives).

  - id: budget-the-change
    title: "Resource the change before committing it"
    description: |
      You have 80 labour hours: 40 OT Engineer and 40 Firewall Admin.
      Effort splits evenly among the listed roles. Select the three core
      packages (60 h) and decide whether to spend the remaining 20 h on
      one follow-up or defer it with an owner and date. You cannot buy all
      work. No red role bar is acceptable even if the total fits.

      Explain how each selected action addresses a lab-1 finding or a
      measured exposure. These are planning records, NOT an automatic EU
      policy generator: do not use the US-specific Apply Your Plan path.
      Guided implementation below uses improved; advanced teams author
      and review the same matrix in containd. Budget omissions never permit
      skipping positive/negative acceptance or rollback tests.
      :::hint Check both constraints
      The core 60 hours cost 30 hours per role. One 20-hour follow-up costs
      another 10 each, exactly filling both caps. Two would exceed both
      total and role budgets; defer one explicitly.
      :::
      Read [Resource planning](#eu-change-resource-plan).
    action:
      type: decision
      budget_hours: 80
      roles:
        - {name: OT Engineer, capacity_hours: 40}
        - {name: Firewall Admin, capacity_hours: 40}
      actions:
        - {id: control-source-pins, title: "Pin telecontrol and field control sources", why: "Retain CC/RTU/PLC operations and remove foreign control paths.", effort_hours: 24, roles: [OT Engineer, Firewall Admin]}
        - {id: data-and-maintenance, title: "Separate feed, read and maintenance conduits", why: "Protect lan5 ingest and restrict PLC UI to eng-ws.", effort_hours: 20, roles: [OT Engineer, Firewall Admin]}
        - {id: prove-and-rollback, title: "Acceptance capture and rollback rehearsal", why: "Avoid a secure-looking policy that stops station operations.", effort_hours: 16, roles: [OT Engineer, Firewall Admin]}
        - {id: endpoint-authority-review, title: "Review endpoint command authority", why: "An allowed source can still misuse commands; no IEC 104 command DPI is claimed.", effort_hours: 20, roles: [OT Engineer, Firewall Admin]}
        - {id: same-subnet-review, title: "Design a future station microsegmentation change", why: "RTU/PLC/GPS same-subnet traffic bypasses containd; architecture work is deferred, not simulated by a rule.", effort_hours: 20, roles: [OT Engineer, Firewall Admin]}

  - id: implement-and-rehearse-rollback
    title: "Apply named sources and rehearse rollback"
    expected_config: hardened
    node: fw-1
    description: |
      Export the weak baseline and capture its running hash/rules. Agree a
      stop condition (lost GI, stale device, stopped PLC, missing historian
      ingest or invalid time) and designate who can restore the saved policy.
      Apply improved with this step, then inspect every named-source allow:
      CC→RTU 2404; RTU→all four field endpoints 502; PLC→OLTC 502;
      CC→historian 8081; enterprise→historian 8080; eng-ws→PLC UI 8080.
      Find logged foreign denies and confirm no lan5→OT allows.
      Default DROP alone does not produce a firewall.rule.hit DENY for the
      HTTP paths. If explicit logged HTTP denies are absent, stop the guided
      acceptance on that gap and record
      the policy-owner follow-up; do not treat an unexplained timeout as
      proof or claim the supplied policy earns a full pass.

      During the controlled rehearsal, restore the saved weak policy and
      read it back; demonstrate baseline GI/Modbus reachability again.
      Re-execute this step to return to improved and verify its running
      rules. Record both policy transitions, time to recover, who approved
      them and the observed effects. Do NOT leave weak active. Perform all
      following proof steps AFTER this rehearsal; an old pass is not evidence
      of the re-applied policy. Advanced teams can apply reviewed custom
      rules after the guided action; the validator does not require a hash.
      :::hint Rollback is an operation, not a saved filename
      Read back the restored policy and repeat an actual GI/Modbus read.
      Then re-apply the final policy and start new acceptance evidence.
      :::
      Read [Policy comparison](#eu-policy-comparison) and
      [Established sessions](#eu-established-sessions).
    action: {type: firewall, config: improved}

  - id: start-proof-window
    title: "Begin a new connection and prove GI, polls and time"
    expected_config: hardened
    node: cc-1
    description: |
      With the final policy active, execute the exact CC→RTU session cut.
      The allowed CC reconnects and completes GI. Record that link_up's UTC
      timestamp and connection_seq: this is the validator's attempt start.
      Its window ends at validation collection, at most ten minutes later.
      If you reconnect again, repeat steps 8–9 in the NEW window.

      Export CC state/journal. Require all 31 observed points present,
      non-null, GOOD and freshly received, including RMU1/2, OLTC and PLC.
      Capture responses to each field poll; read the PLC status through the
      observed CC points. GI objects are untimed: periodic GI clears the
      CC cache source_time, so its absence is not a failed GPS conduit.
      The validator instead makes a real RTU→GPS HTTP read and requires
      locked, current reported time. Capture timestamped spontaneous tap
      indications during step 8 for a separate station-time wire check.
      Never substitute physical-panel data for observed CC values. The
      same-subnet flows remain endpoint proofs, not firewall enforcement.
      Read [Exports](#eu-tool-curl-exports) and [GI quality](#iec104-gi-cot-quality).
    action: {type: session-cut, flow: cc-rtu}

  - id: prove-plc-and-historian
    title: "Prove the PLC loop and historian feed under the new rules"
    expected_config: hardened
    node: plc-1
    description: |
      Confirm OLTC remote/auto, unblocked, and PLC running/input-valid.
      Execute set_load 3.0 below. Observe voltage leave the ±1% band,
      continuous 10-second demand, then an accepted PLC Modbus request
      and completed tap step. Wait for valid solved measurements and fresh
      CC observation; a PLC socket or frozen heartbeat is not loop proof.
      Do not repeatedly click the action or bypass the delay with a write.
      :::hint Prove a loop, not just a process
      Pair the PLC peer's accepted plc_request with motion_complete and
      first_solve of that completed revision. A running bit alone could be
      a frozen status block; fresh quality and an actual tap operation matter.
      :::

      From Kali GET `http://10.70.70.40:8080/api/points`. To read history,
      use UTC bounds covering this attempt (replace the timestamps):

          curl -fsS 'http://10.70.70.40:8080/api/history?point=oltc-1-tap&since=2026-11-08T14:00:00Z&until=2026-11-08T14:05:00Z'

      All three parameters are mandatory. Save at least two successive
      samples in the current CC cache epoch with advancing snapshot_seq,
      ingested_at and in-window cc_received_at. Compare CC observation
      with archive quality and time; a gap is not zero. Validate will also
      make a fresh enterprise read and an eng-ws PLC-UI GET, not a write.
      Read [Voltage regulation](#eu-voltage-regulation),
      [OpenPLC](#eu-openplc-tap-logic) and [Historian](#eu-historian).
    action: {type: command, device: process, command: set_load, value: 3.0}

  - id: prove-denies-and-maintenance
    title: "Deny lateral movement and scope engineering maintenance"
    expected_config: hardened
    node: eng-ws-1
    description: |
      Repeat step 3's port matrix from ALL THREE footholds now, generating
      fresh attempts in this connection window. Match firewall DENY events
      for each source→each of the four field hosts:502 and each source→RTU:2404.
      Also require all three sources→historian:8081 denied, and Kali plus
      vendor-jump→PLC:8080 denied. Save source IP, port, destination and UTC
      bounds. A pre-change deny or timeout without its event is insufficient.
      Established flows from baseline may persist; stop them and test new
      connections. Do not count vendor-jump's management interface as a
      teaching path; bind to 10.20.20.10 if a tool chooses the wrong source.

      From eng-ws open `http://10.30.30.30:8080/`: retrieve the seeded PLC
      UI without modifying the program. Confirm it works only from the
      named engineering source, not every host in dmz. Do not grant direct
      field access as a maintenance shortcut.

      :::decision id=engineering-maintenance options=ENG_WS_UI_ONLY,WHOLE_VENDOR_ZONE,FIELD_ACCESS
      What maintenance scope, owner, expiry and revocation test will you
      approve? The plaintext workshop UI is not a production remote-access
      design; record that residual risk and a future authenticated gateway.
      :::
      :::hint Scope the assurance claim
      Tests sample named sources, not every possible compromised host.
      Inspect rule order and the absence of lan5 egress too. The validator
      cannot grade your ownership/expiry or prove an untested route closed.
      Its field denies concern 10.40.40.0/24 Modbus, NOT the separate
      management sim APIs. The management attachment remains a blocker to
      an unqualified claim that the vendor cannot control field equipment.
      :::
      Read [Vendor engineering access](#eu-vendor-engineering-access) and
      [Port/source boundaries](#eu-port-source-boundary).

  - id: compare-plan-and-outcome
    title: "Compare the funded plan with measured acceptance"
    expected_config: hardened
    description: |
      Within ten minutes of step 7, run Validate and save its result.
      For each matrix row record planned verdict, observed operation or
      deny, UTC bounds, evidence file, pass/gap, owner and next action.
      Compare actual change time and role effort with your 80-hour plan;
      explain deferrals and any overrun instead of editing the original
      estimate. Include the rollback rehearsal and lab-1 findings.

      The validator requires an in-window GI, fresh full-station points,
      accepted PLC request plus completed/solved tap, advancing historian
      samples, a current RTU GPS time read, logged foreign denies,
      enterprise GET and engineering GET. It does not infer success from
      the policy name, a TCP socket, process truth or an old audit. Missing
      evidence is not a pass. Retain observed PLC/time proof for same-subnet
      blind spots and rule review for lan5 no-egress; these are manual
      acceptance responsibilities.

      AFTER exporting, execute set_load 1.0 below and wait for the PLC to
      settle in band. Keep the final source-pinned policy active. Confirm
      feeder service, PLC health and fresh CC observations for lab 3.
      Read [Acceptance handover](#eu-acceptance-handover) and
      [Reset acceptance](#eu-reset-acceptance).
    action: {type: command, device: process, command: set_load, value: 1.0}
