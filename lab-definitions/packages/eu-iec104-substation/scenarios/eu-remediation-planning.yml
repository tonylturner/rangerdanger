id: eu-remediation-planning
order: '1.4'
name: Remediation Planning Under Constraint
summary: Choose EU remediation within 500 hours and the unchanged four-role capacity constraints.
estimated_minutes: 18
description: Fund a defensible subset of the station design. Balance the shared labor budget against specialist
  capacity, readiness and operational risk. Selected closures change L4 reachability; IEC 104 monitoring adds
  observation rules, while Modbus DPI and organizational controls remain planning-only.
nodes:
- kali-1
- eng-ws-1
- fw-1
- cc-1
- rtu-1
- vendor-jump-1
tags:
- iec104
- eu-substation
- planning
- requirements
- defense
- tradeoffs
steps:
- id: review-the-findings-you-captured
  title: Review the findings you captured
  expected_config: weak
  description: |
    Review your passive and latent findings and committed design before spending capacity.

    :::findings-panel from=eu-baseline-assessment title="Observed exposures"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU hosts → field (except PLC→OLTC)
    unauth-control: Unauthorized IEC 104 commands / Modbus writes
    :::

    :::findings-panel from=eu-baseline-assessment title="Latent paths"
    latent-exposure-confirmed: Reachability missed by passive observation
    :::

    :::findings-panel from=eu-segmentation-requirements title="Design verdicts"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU hosts → field (except PLC→OLTC)
    unauth-control: Unauthorized IEC 104 commands / Modbus writes
    :::

    :::hint Read coverage as a plan
    Coverage describes selected actions, not measured firewall enforcement. An ALLOW verdict is n/a, not a closed exposure.
    :::
- id: understand-the-team-budget
  title: Understand the team budget
  description: |
    You have **500 labor hours** this quarter. Default role capacities match the US workshop; Lab 1.3 readiness can reduce them:

    | Role | Capacity h |
    |---|---:|
    | OT Engineer | 120 |
    | Firewall Admin | 140 |
    | Network Engineer | 120 |
    | Security Analyst | 120 |

    Effort splits across each action's roles, rounded per role. Total hours may fit while a specialist role is already over capacity. Readiness answers reduce role caps, add DPI overhead or vendor effort, and block actions with unmet dependencies. The total envelope remains 500h. Use default budget restores the unconstrained model. Blocked saved choices remain recorded but are excluded from totals, coverage and Apply Your Plan; already-applied provenance is unchanged.

    :::hint Binding role
    A 500-hour envelope is not 500 interchangeable hours. Record which role becomes the bottleneck and which operational review or vendor window you need before shipping.
    :::
- id: choose-your-remediation-plan
  title: Choose your remediation plan
  description: |
    Select actions in the planner below. Total labor and role caps guide the tradeoff.
    Budget overrun is a warning only. Empty, partial and over-budget plans are valid. The package curriculum is the only catalog authority.

    Selected enforceable actions remove their Weak exposure. Deferred actions leave it open. Required operational conduits stay in every plan.

    | Kind | Actions | Effect when applied |
    |---|---|---|
    | Enforceable | `restrict-enterprise-to-vendor`, `block-enterprise-to-field`, `block-enterprise-to-station`, `restrict-vendor-to-station`, `block-vendor-to-field`, `pin-rtu-to-field`, `tighten-firewall-objects` | Change L4 reachability |
    | Detection-only | `iec104-dpi` | Append three explicit monitor rules for CC breaker and OLTC requests; no admission or denial |
    | Planning-only | `modbus-dpi`, `improve-logging`, `station-architecture-review`, `positive-validation`, `ids-deployment`, `ot-asset-inventory`, `vendor-zta-broker` | Emit no firewall change |

    Required diagnostic denies always log. The logging selection changes no rule. The L4 source pin enforces; DPI detects and logs. Monitoring never satisfies a BLOCK requirement. Empty and planning-only plans leave Weak exposures open.

    **Staffing trade-off:** `iec104-dpi` stays **80h** and is now a technical detection action required for the Hardened label. With all technical actions selected, Firewall Admin load is **149h vs 140h capacity — a 9h overrun**, not a capacity-compliant plan. Keep the 80h estimate and the 140h cap: request approved staffing or rescheduling, or defer work and accept a partial plan with its explicit gaps. Overrun remains a warning, not an apply prohibition. Readiness `GAP` or `UNAVAILABLE` exclusions can make Hardened unreachable; do not hide that by relabeling excluded work.

    :::plan-coverage title="Coverage of your design"
    :::

    :::hint Commit the tradeoff
    Compare coverage, readiness and the binding role before saving. Coverage is not evidence that a rule has been applied. Your plan carries into Lab 2.2 and the attack labs.
    :::
  action:
    type: decision
- id: reflect-what-are-you-accepting
  title: Reflect - what are you accepting?
  description: |
    In Notes, name the finding each funded action closes and the consequence of every deferral. Which role bound first? Did readiness, hours or risk acceptance drive the compromise? Who owns each residual risk, and what test will establish completion next quarter?

    :::hint Defensible deferral
    IEC 104 monitoring is live only after its rules are applied and verified; it is not command prevention. Modbus DPI remains planning-only. A broker or IDS selection deploys no infrastructure. Commands on allowed CC sessions and same-subnet paths remain residual risks. Continue to [implementation](/exercises/eu-firewall-implementation) with a saved plan.
    :::
