steps:
- id: review-the-findings-you-captured
  title: Review the findings you captured
  expected_config: weak
  description: |
    **Time budget:** ~18 minutes (Guided path).

    Review your structured passive findings, latent exposure and design verdicts before planning.

    :::findings-panel from=eu-baseline-assessment title="Passive findings"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU station sources → field (except PLC→OLTC)
    unauth-control: Cross-zone foreign-source IEC 104 / Modbus attempts
    :::

    :::hint Optional depth
    Keep observations, active reachability and design judgments distinct when comparing findings.
    :::

    :::findings-panel from=eu-baseline-assessment title="Latent exposure and required conduits"
    latent-exposure-confirmed: Active probe confirmed latent exposure
    required-cross-zone-conduits: Required cross-zone conduits
    intra-zone-dependencies: Same-zone operational dependencies
    continuity-with-minimal-conduits: Continuity with required conduits
    :::

    :::findings-panel from=eu-segmentation-requirements title="Design verdicts"
    enterprise-to-field: Enterprise/vendor → field on Modbus/502
    enterprise-to-station: Enterprise → station RTU on IEC 104/2404
    vendor-to-station: Vendor DMZ → station engineering access
    non-rtu-to-field: Non-RTU station sources → field (except PLC→OLTC)
    unauth-control: Cross-zone foreign-source IEC 104 / Modbus attempts
    :::
- id: understand-the-team-budget
  title: Understand the team budget
  description: |
    You have **500 labor hours** this quarter. Default capacities are:

    | Role | Capacity |
    |---|---:|
    | OT Engineer | 120h |
    | Firewall Admin | 140h |
    | Network Engineer | 120h |
    | Security Analyst | 120h |

    - **OT Engineer** reviews operational impact and continuity.
    - **Firewall Admin** configures and reviews firewall policy.
    - **Network Engineer** supports network access and interfaces.
    - **Security Analyst** checks requirements and test evidence.

    An action's effort is split across its required roles. For example, an 80h IEC 104 DPI action shared by three roles is about 27h per role after rounding.

    Readiness can change caps, effort or eligibility. Use default budget to compare with the unconstrained model; blocked selections stay saved but are excluded from effective totals and coverage. Selecting all technical actions gives Firewall Admin 149h vs 140h capacity (a 9h overrun); this is a warning, not an apply limit.

    :::hint Optional depth
    Confirm role availability and change windows before treating estimates as a schedule.
    :::
- id: choose-your-remediation-plan
  title: Choose your remediation plan
  description: |
    Select a defensible subset in the planner. Some actions change L4 reachability; others add observation or remain planning-only.

    IEC 104 monitoring adds evidence, not prevention. The L4 source pin enforces; DPI detects and logs. Modbus inspection and the organizational actions are planning work only.

    :::hint Optional depth
    Confirm the site test owner and operational window before scheduling policy changes.
    :::
  action:
    type: decision
- id: reflect-what-are-you-accepting
  title: Reflect - what are you accepting?
  description: |
    :::plan-coverage title="Coverage of your design"
    :::

    For discussion:

    1. Which findings do the funded actions address, and what stays open?
    2. What did you defer, why, and who accepts the residual risk?
    3. Which role or readiness constraint binds, and what test shows the work is done?

    Your action selections and design verdicts carry forward as structured inputs. Applying a plan and validating the running policy happen in later labs.

    :::hint Optional depth
    Coverage reports what a plan targets; it is not evidence that live validation has passed.
    :::
