id: eu-remediation-planning
order: '1.4'
name: Remediation Planning Under Constraint
summary: "Review findings, fund the scope and write an approved change request with tests and rollback."
estimated_minutes: 30
description: Write a change request for the substation firewall. Use the findings, required conduits and available roles to agree what to change now. Name an owner for every deferred exposure.
nodes:
- kali-1
- eng-ws-1
- fw-1
