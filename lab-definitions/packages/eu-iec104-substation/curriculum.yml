    - ${ip:oltc-1}/32
    protocols:
    - name: tcp
      port: '502'
    action: ALLOW
  logging: true
  semantic: modbus-dpi
  predicate:
    protocol: modbus
    functionCode:
    - 3
    - 4
    - 6
    - 16
- rule:
    id: plc-to-oltc-modbus
