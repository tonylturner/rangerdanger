    note: Plan function-code restrictions for southbound Modbus. Planned, not enforceable in this range yet.
  iec104-dpi:
    defends:
    - eu-hardening-configurations
    note: Plan breaker IOA 3001 denial, even from CC; preserve monitoring, system reads and RMU/OLTC commands. Planned, not enforceable in this
      range yet.
  improve-logging:
    defends:
    - eu-hardening-configurations
    note: Retain per-rule evidence and cross-zone PCAP so a policy change can be reviewed.
  station-architecture-review:
    defends:
    - eu-validation-evidence
    note: Planning-only review of RTU/PLC/GPS same-subnet trust and endpoint authority; no policy effect.
  tighten-firewall-objects:
    defends:
    - eu-hardening-configurations
    note: Pin historian reader/ingest destinations and separate read 8080 from CC ingest 8081.
  positive-validation:
    defends:
    - eu-validation-evidence
    note: 'Planning-only validation work: authorized operations, denied exposures and bounded evidence.'
  ids-deployment:
    defends:
    - eu-validation-evidence
    note: 'Planning-only detection work: sensors, rule tuning and response ownership; no sensor is deployed here.'
  ot-asset-inventory:
    defends:
    - eu-validation-evidence
    note: Planning-only inventory and drift baseline for station and field assets.
  vendor-zta-broker:
    defends:
    - eu-validation-evidence
    note: Planning-only identity, MFA, approval and recorded-session work; no broker is deployed here.
baselineRules:
- id: control-centre-to-rtu-iec104
  source: ${ip:cc-1}/32
  destination: ${ip:rtu-1}/32
  proto: TCP
  port: '2404'
  action: ALLOW
  purpose: Allow the named Control Centre to open IEC104 sessions to the RTU
- id: rtu-to-feeder-modbus
  source: ${ip:rtu-1}/32
  destination: ${ip:breaker-1}/32, ${ip:f2-breaker}/32, ${ip:rmu-1}/32, ${ip:rmu-2}/32, ${ip:oltc-1}/32
  proto: TCP
  port: '502'
  action: ALLOW
  purpose: Allow the named RTU to poll both breakers, RMUs and OLTC and control the existing command targets over Modbus TCP
- id: plc-to-oltc-modbus
  source: ${ip:plc-1}/32
  destination: ${ip:oltc-1}/32
  proto: TCP
  port: '502'
  action: ALLOW
  purpose: Allow only the named PLC to regulate the OLTC over Modbus TCP
- id: control-centre-to-historian-ingest
  source: ${ip:cc-1}/32
  destination: ${ip:historian-1}/32
  proto: TCP
  port: '8081'
  action: ALLOW
  purpose: Allow only the named CC to push historian snapshots
- id: enterprise-to-historian-read
  source: ${subnet:enterprise_net}
  destination: ${ip:historian-1}/32
  proto: TCP
  port: '8080'
  action: ALLOW
  purpose: Allow enterprise read-only historian access
- id: engineering-to-plc-web
  source: ${ip:eng-ws-1}/32
  destination: ${ip:plc-1}/32
  proto: TCP
  port: '8080'
  action: ALLOW
  purpose: Allow engineering maintenance of the OpenPLC web UI
enterpriseToVendorRule: null
groups:
  block-enterprise-to-field:
    title: block enterprise to field
    description: Close direct corporate Modbus access to the feeder; an unused path is still exposure.
    rules:
    - id: deny-block-enterprise-to-field
      source: ${zone:enterprise_net}
      destination: ${zone:field_net}
      proto: TCP
      port: '502'
      action: DENY
      purpose: deny-block-enterprise-to-field
      log: true
    effect: closes
    omittedRules:
    - id: weak-block-enterprise-to-field
      source: ${zone:enterprise_net}
      destination: ${zone:field_net}
      proto: TCP
      port: '502'
      action: ALLOW
      purpose: weak-block-enterprise-to-field
  block-enterprise-to-station:
    title: block enterprise to station
    description: Close enterprise IEC 104 access to RTU; only the named CC should initiate telecontrol.
    rules:
    - id: deny-block-enterprise-to-station
      source: ${zone:enterprise_net}
      destination: ${zone:station_net}
      proto: TCP
      port: '2404'
      action: DENY
      purpose: deny-block-enterprise-to-station
      log: true
    effect: closes
    omittedRules:
    - id: weak-block-enterprise-to-station
      source: ${zone:enterprise_net}
      destination: ${zone:station_net}
      proto: TCP
      port: '2404'
      action: ALLOW
      purpose: weak-block-enterprise-to-station
  restrict-vendor-to-station:
