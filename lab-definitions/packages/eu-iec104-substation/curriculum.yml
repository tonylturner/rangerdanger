      source: ${zone:station_net}
      destination: ${zone:field_net}
      proto: TCP
      port: '502'
      action: DENY
      purpose: deny-pin-rtu-to-field
      log: true
    effect: restricts
    omittedRules:
    - id: weak-pin-rtu-to-field
      source: ${zone:station_net}
      destination: ${zone:field_net}
      proto: TCP
      port: '502'
      action: ALLOW
      purpose: weak-pin-rtu-to-field
  modbus-dpi:
    title: modbus dpi
    description: Plan function-code restrictions for southbound Modbus. Planned, not enforceable in this range yet.
    rules:
    - id: rtu-to-feeder-modbus
      source: ${ip:rtu-1}/32
      destination: ${ip:breaker-1}/32, ${ip:rmu-1}/32, ${ip:rmu-2}/32, ${ip:oltc-1}/32
      proto: TCP
      port: '502'
      action: ALLOW
      purpose: Allow the named RTU to poll and control the breaker, RMUs and OLTC over Modbus TCP
      ics:
        protocol: modbus
        functionCode:
        - 3
        - 4
        - 6
        - 16
    effect: semantic
  iec104-dpi:
    title: iec104 dpi
    description: Plan breaker IOA 3001 denial, even from CC; preserve monitoring, system reads and RMU/OLTC commands. Planned, not enforceable
