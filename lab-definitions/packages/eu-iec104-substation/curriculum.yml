policy:
- rule:
    id: control-centre-to-rtu-iec104
    description: Allow the named Control Centre to open IEC104 sessions to the RTU
    sourceZones:
    - ${zone:control_centre_net}
    destZones:
    - ${zone:station_net}
    sources:
    - ${ip:cc-1}/32
    destinations:
    - ${ip:rtu-1}/32
    protocols:
    - name: tcp
      port: '2404'
    action: ALLOW
  logging: true
  semantic: iec104-dpi
  predicate:
    protocol: iec104
    readOnly: true
    mode: enforce
- rule:
    id: rtu-to-feeder-modbus
    description: Allow the named RTU to poll and control the breaker, RMUs and OLTC over Modbus TCP
