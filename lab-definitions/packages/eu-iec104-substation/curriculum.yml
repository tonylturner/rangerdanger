phases:
  rules: |-
    Implement the six required operational conduits. Default deny after.
    :::guided
    Apply Hardened for the reference or Apply Your Plan for your funded controls.
    :::
    :::technical
    Author source/destination pins in containd, commit and inspect running configuration.
    Preserve historian read/ingest separation and the PLC→OLTC exception. No ICS keys yet.
    :::
    {{noPlan}}{{ruleTable}}
  positive: |-
    Verify operations:
    {{tests}}
  negative: |-
    Verify blocked exposures:
    {{tests}}
noPlan: |
  Build a [plan](/exercises/{{planRole}}).
tests:
- kind: positive
  text: CC→RTU:2404 — completed current-connection GI and non-null GOOD points received within the attempt. Quiet status does not need advancing receipt times; press Interrogate station in the Control Centre and validate again if the GI evidence is missing or outside the ten-minute window. Verify fresh application/device evidence, not only a socket.
- kind: positive
  text: RTU→field:502 — fresh field points at CC. Verify fresh application/device evidence, not only a socket.
- kind: positive
  text: |-
    PLC→OLTC:502 — require an accepted PLC-source adjacent request, motion_complete and solved revision AFTER policy change. If nominal regulation is quiescent, use the CC terminal for this controlled operational check (not an attack):

        iec104cmd ${ip:rtu-1} sc 3302 off -sbo --json
        iec104cmd ${ip:rtu-1} rc 3301 lower -sbo --json

    Wait for completed motion and fresh feedback before one more lower, then restore auto:

        iec104cmd ${ip:rtu-1} rc 3301 lower -sbo --json
        iec104cmd ${ip:rtu-1} sc 3302 on -sbo --json

    With tap −2 the nominal bus is below band. Wait for the PLC's 10-second demand and 2-second motions to return in band. Verify remote/auto, advancing heartbeat, device audit and fresh CC observations. Never use a final socket alone as loop proof.
- kind: positive
  text: CC→historian:8081 — advancing ingested observations. Verify fresh application/device evidence, not only a socket.
- kind: positive
  text: Kali→historian:8080 — curl -fsS --max-time 3 http://${ip:historian-1}:8080/api/points Verify fresh application/device evidence, not only a socket.
- kind: positive
  text: eng-ws→PLC:8080 — curl -fsS --max-time 3 http://${ip:plc-1}:8080/login Verify fresh application/device evidence, not only a socket.
- kind: negative
  when: block-enterprise-to-field
  text: From Kali probe all field TCP/502; expect timeout.
- kind: negative
  when: block-enterprise-to-station
  text: 'From Kali: nmap -p 2404 ${ip:rtu-1} --max-retries 1 -T4; expect filtered/timeout.'
- kind: negative
  when: restrict-vendor-to-station
  text: From vendor-jump probe RTU:2404 and PLC:8080; both must time out. Only eng-ws retains PLC web.
- kind: negative
  when: block-vendor-to-field
  text: From vendor-jump probe all field TCP/502; expect timeout. Also independently probe Kali→vendor 3389/5900.
- kind: negative
  when: pin-rtu-to-field
  text: From eng-ws probe all field TCP/502; expect timeout. Preserve the RTU and PLC→OLTC exceptions.
- kind: negative
  when: tighten-firewall-objects
  text: From vendor-jump probe historian:8081; expect timeout. Verify enterprise reader cannot use ingest.
negativeEmpty: No selected exposure closures to test yet.
