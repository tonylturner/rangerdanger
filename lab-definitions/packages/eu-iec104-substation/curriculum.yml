schema: 1
requirements:
  enterprise-to-field:
    label: Enterprise/vendor → five field devices on Modbus/502
    impl:
      BLOCK:
      - block-enterprise-to-field
      - block-vendor-to-field
      BLOCK and LOG:
      - block-enterprise-to-field
      - block-vendor-to-field
      - improve-logging
  enterprise-to-station:
    label: Enterprise → station RTU on IEC 104/2404
    impl:
      BLOCK:
      - block-enterprise-to-station
      BLOCK and LOG:
      - block-enterprise-to-station
      - improve-logging
  vendor-to-station:
    label: Vendor DMZ → station (engineering access)
    impl:
      BLOCK:
      - restrict-vendor-to-station
      BLOCK and LOG:
      - restrict-vendor-to-station
      - improve-logging
      RESTRICT:
      - restrict-vendor-to-station
  non-rtu-to-field:
    label: Hosts other than RTU (and PLC→OLTC) → five field devices
    impl:
      BLOCK:
      - pin-rtu-to-field
      BLOCK and LOG:
      - pin-rtu-to-field
      - improve-logging
  unauth-control:
    label: Unauthorized IEC 104 commands / Modbus writes
    impl:
      BLOCK:
      - modbus-dpi
      - iec104-dpi
      BLOCK and LOG:
      - modbus-dpi
      - iec104-dpi
      - improve-logging
      LOG:
      - improve-logging
requirementOrder:
- enterprise-to-field
- enterprise-to-station
- vendor-to-station
- non-rtu-to-field
- unauth-control
readiness:
- id: ot-eng-availability
  label: OT engineering capacity
  good: AVAILABLE
- id: fw-admin-skills
  label: Firewall admin skills
  good: IN_HOUSE
- id: vendor-change-window
  label: Vendor change windows
  good: SECURED
- id: risk-acceptance-authority
  label: Risk-acceptance authority
  good: CLEAR
readinessFlags:
- actions:
  - restrict-vendor-to-station
  - block-vendor-to-field
  - pin-rtu-to-field
  - modbus-dpi
  - iec104-dpi
  - station-architecture-review
  - positive-validation
  severity: warn
  source: ot-eng-availability
  sourceLabel: OT engineering capacity
  verdict: STRETCHED
  message: OT Engineer marked STRETCHED — expect this to take longer than the budget shows.
- actions:
  - restrict-vendor-to-station
  - block-vendor-to-field
  - pin-rtu-to-field
  - modbus-dpi
  - iec104-dpi
  - station-architecture-review
  - positive-validation
  severity: blocked
  source: ot-eng-availability
  sourceLabel: OT engineering capacity
  verdict: UNAVAILABLE
  message: OT Engineer marked UNAVAILABLE — this action can't ship without OT review.
- actions:
  - modbus-dpi
  - iec104-dpi
  severity: warn
  source: fw-admin-skills
  sourceLabel: Firewall admin skills
  verdict: VENDOR_LED
  message: Firewall admin skills are vendor-led — DPI tuning will need vendor cycles, not just internal time.
- actions:
  - block-enterprise-to-field
  - block-enterprise-to-station
  - restrict-vendor-to-station
  - block-vendor-to-field
  - pin-rtu-to-field
  - tighten-firewall-objects
  severity: warn
  source: fw-admin-skills
  sourceLabel: Firewall admin skills
  verdict: GAP
  message: Firewall admin skills marked GAP — basic policy work needs hiring or training to land cleanly.
- actions:
  - modbus-dpi
  - iec104-dpi
  severity: blocked
  source: fw-admin-skills
  sourceLabel: Firewall admin skills
  verdict: GAP
  message: Firewall admin skills marked GAP — DPI tuning can't ship without hiring or training first.
- actions:
  - restrict-vendor-to-station
  - block-vendor-to-field
  severity: warn
  source: vendor-change-window
  sourceLabel: Vendor change windows
  verdict: NEGOTIATING
  message: Vendor change window NEGOTIATING — schedule slip is likely.
- actions:
  - restrict-vendor-to-station
  - block-vendor-to-field
  severity: blocked
  source: vendor-change-window
  sourceLabel: Vendor change windows
  verdict: NOT_DISCUSSED
  message: Vendor change window NOT_DISCUSSED — this action can't ship until that conversation happens.
- actions:
  - block-enterprise-to-field
  - block-enterprise-to-station
  - block-vendor-to-field
  - pin-rtu-to-field
  severity: warn
  source: risk-acceptance-authority
  sourceLabel: Risk-acceptance authority
  verdict: UNCLEAR
  message: Risk-acceptance authority UNCLEAR — get the signoff path nailed down before applying this rule.
- actions:
  - block-enterprise-to-field
  - block-enterprise-to-station
  - block-vendor-to-field
  - pin-rtu-to-field
  severity: blocked
  source: risk-acceptance-authority
  sourceLabel: Risk-acceptance authority
  verdict: DISPUTED
  message: Risk-acceptance authority DISPUTED — denying production flows without a clear signoff path is unsafe.
budgetHours: 500
teams:
- name: OT Engineer
  capacity_hours: 120
- name: Firewall Admin
  capacity_hours: 140
- name: Network Engineer
  capacity_hours: 120
- name: Security Analyst
  capacity_hours: 120
catalog:
- id: restrict-enterprise-to-vendor
  title: Restrict enterprise → vendor remote access
  why: Remove direct enterprise RDP/VNC access to the vendor jump box; retain only the package’s named operational
    exceptions.
  effort_hours: 30
  roles:
  - Firewall Admin
  - Network Engineer
  tags:
  - enterprise-vendor
- id: block-enterprise-to-field
  title: Block enterprise to field
  why: Close direct corporate Modbus access to the feeder; an unused path is still exposure.
  effort_hours: 40
  roles: [Firewall Admin, Security Analyst]
  tags: []
- id: block-enterprise-to-station
  title: Block enterprise to station
  why: Close enterprise IEC 104 access to RTU; only the named CC should initiate telecontrol.
  effort_hours: 30
  roles: [Firewall Admin, Security Analyst]
  tags: []
- id: restrict-vendor-to-station
  title: Restrict vendor to station
  why: Replace broad vendor-zone trust with named engineering PLC web access; field control is separate.
  effort_hours: 50
  roles: [Firewall Admin, Network Engineer, OT Engineer]
  tags: []
- id: block-vendor-to-field
  title: Block vendor to field
  why: Remove direct vendor Modbus access even if a compromised remote-access foothold exists.
  effort_hours: 30
  roles: [Firewall Admin, OT Engineer]
  tags: []
- id: pin-rtu-to-field
  title: Pin rtu to field
  why: Keep RTU field polling and the explicit PLC→OLTC exception; exclude other station sources.
  effort_hours: 40
  roles: [Firewall Admin, OT Engineer]
  tags: []
- id: modbus-dpi
  title: Modbus dpi
  why: Plan function-code restrictions for southbound Modbus. Planned, not enforceable in this range yet.
  effort_hours: 70
  roles: [Firewall Admin, OT Engineer, Security Analyst]
  tags: []
- id: iec104-dpi
  title: Iec104 dpi
  why: Plan breaker IOA 3001 denial, even from CC; preserve monitoring, system reads and RMU/OLTC commands. Planned, not enforceable in this range
    yet.
  effort_hours: 80
  roles: [Firewall Admin, OT Engineer, Security Analyst]
  tags: []
- id: improve-logging
  title: Improve logging
  why: Retain per-rule evidence and cross-zone PCAP so a policy change can be reviewed.
  effort_hours: 50
  roles: [Firewall Admin, Security Analyst]
  tags: []
- id: station-architecture-review
  title: Station architecture review
  why: Planning-only review of RTU/PLC/GPS same-subnet trust and endpoint authority; no policy effect.
  effort_hours: 30
  roles: [OT Engineer, Security Analyst]
  tags: []
- id: tighten-firewall-objects
  title: Tighten firewall objects
  why: Pin CC telecontrol to the RTU endpoint, pin historian reader/ingest destinations and separate read 8080 from CC ingest 8081.
  effort_hours: 40
  roles: [Firewall Admin, Network Engineer]
  tags: []
- id: positive-validation
  title: Positive validation
  why: 'Planning-only validation work: authorized operations, denied exposures and bounded evidence.'
  effort_hours: 60
  roles: [Security Analyst, OT Engineer]
  tags: []
- id: ids-deployment
  title: Ids deployment
  why: 'Planning-only detection work: sensors, rule tuning and response ownership; no sensor is deployed here.'
  effort_hours: 80
  roles: [Security Analyst, Network Engineer]
  tags: []
- id: ot-asset-inventory
  title: Ot asset inventory
  why: Planning-only inventory and drift baseline for station and field assets.
  effort_hours: 100
  roles: [Security Analyst, OT Engineer, Network Engineer]
  tags: []
- id: vendor-zta-broker
  title: Vendor zta broker
  why: Planning-only identity, MFA, approval and recorded-session work; no broker is deployed here.
  effort_hours: 150
  roles: [Network Engineer, Firewall Admin, Security Analyst]
  tags: []
impact:
  block-enterprise-to-field:
    defends:
    - eu-hardening-configurations
    note: Close direct corporate Modbus access to the feeder; an unused path is still exposure.
  block-enterprise-to-station:
    defends:
    - eu-hardening-configurations
    note: Close enterprise IEC 104 access to RTU; only the named CC should initiate telecontrol.
  restrict-vendor-to-station:
