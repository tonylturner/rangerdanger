      purpose: deny-block-vendor-to-field
      log: true
    effect: closes
    omittedRules:
    - id: weak-block-vendor-to-field
      source: ${zone:vendor_net}
      destination: ${zone:field_net}
      proto: TCP
      port: '502'
      action: ALLOW
      purpose: weak-block-vendor-to-field
  pin-rtu-to-field:
    title: pin rtu to field
    description: Keep RTU field polling and the explicit PLC→OLTC exception; exclude other station sources.
    rules:
    - id: deny-pin-rtu-to-field
      source: ${zone:station_net}
      destination: ${zone:field_net}
      proto: TCP
      port: '502'
      action: DENY
      purpose: deny-pin-rtu-to-field
      log: true
    effect: restricts
    omittedRules:
    - id: weak-pin-rtu-to-field
      source: ${zone:station_net}
      destination: ${zone:field_net}
      proto: TCP
      port: '502'
      action: ALLOW
      purpose: weak-pin-rtu-to-field
  modbus-dpi:
    title: modbus dpi
    description: Plan function-code restrictions for southbound Modbus. Planned, not enforceable in this range yet.
    rules:
    - id: rtu-to-feeder-modbus
      source: ${ip:rtu-1}/32
      destination: ${ip:breaker-1}/32, ${ip:f2-breaker}/32, ${ip:rmu-1}/32, ${ip:rmu-2}/32, ${ip:oltc-1}/32
      proto: TCP
      port: '502'
      action: ALLOW
      purpose: Allow the named RTU to poll both breakers, RMUs and OLTC and control the existing command targets over Modbus TCP
      ics:
        protocol: modbus
        functionCode:
        - 3
        - 4
        - 6
        - 16
    effect: semantic
  iec104-dpi:
    title: iec104 dpi
    description: Plan breaker IOA 3001 denial, even from CC; preserve monitoring, system reads and RMU/OLTC commands. Planned, not enforceable
      in this range yet.
    rules:
    - id: control-centre-to-rtu-iec104
      source: ${ip:cc-1}/32
      destination: ${ip:rtu-1}/32
      proto: TCP
      port: '2404'
      action: ALLOW
      purpose: Allow the named Control Centre to open IEC104 sessions to the RTU
      ics:
        protocol: iec104
        readOnly: true
        mode: enforce
    effect: semantic
  improve-logging:
    title: improve logging
    description: Retain per-rule evidence and cross-zone PCAP so a policy change can be reviewed.
    rules: []
    effect: logging
  station-architecture-review:
    title: station architecture review
    description: Planning-only review of RTU/PLC/GPS same-subnet trust and endpoint authority; no policy effect.
    rules: []
    effect: conceptual
  tighten-firewall-objects:
    title: tighten firewall objects
    description: Pin historian reader/ingest destinations and separate read 8080 from CC ingest 8081.
    rules:
    - id: deny-tighten-firewall-objects
      source: ${zone:enterprise_net}, ${zone:vendor_net}, ${zone:control_centre_net}
      destination: ${zone:ops_dmz_net}
      proto: TCP
      port: 8080, 8081
      action: DENY
      purpose: deny-tighten-firewall-objects
      log: true
    effect: restricts
    omittedRules:
    - id: weak-tighten-firewall-objects
      source: ${zone:enterprise_net}, ${zone:vendor_net}, ${zone:control_centre_net}
      destination: ${zone:ops_dmz_net}
      proto: TCP
      port: 8080, 8081
      action: ALLOW
      purpose: weak-tighten-firewall-objects
  positive-validation:
    title: positive validation
    description: 'Planning-only validation work: authorized operations, denied exposures and bounded evidence.'
    rules: []
    effect: conceptual
  ids-deployment:
    title: ids deployment
    description: 'Planning-only detection work: sensors, rule tuning and response ownership; no sensor is deployed here.'
    rules: []
    effect: conceptual
  ot-asset-inventory:
    title: ot asset inventory
    description: Planning-only inventory and drift baseline for station and field assets.
    rules: []
    effect: conceptual
  vendor-zta-broker:
    title: vendor zta broker
    description: Planning-only identity, MFA, approval and recorded-session work; no broker is deployed here.
    rules: []
    effect: conceptual
planningOnly: []
policy:
- rule:
    id: control-centre-to-rtu-iec104
    description: Allow the named Control Centre to open IEC104 sessions to the RTU
    sourceZones:
    - ${zone:control_centre_net}
    destZones:
    - ${zone:station_net}
    sources:
    - ${ip:cc-1}/32
    destinations:
    - ${ip:rtu-1}/32
    protocols:
    - name: tcp
      port: '2404'
    action: ALLOW
  logging: true
  semantic: iec104-dpi
  predicate:
    protocol: iec104
    readOnly: true
    mode: enforce
- rule:
    id: rtu-to-feeder-modbus
    description: Allow the named RTU to poll both breakers, RMUs and OLTC and control the existing command targets over Modbus TCP
    sourceZones:
    - ${zone:station_net}
    destZones:
    - ${zone:field_net}
    sources:
