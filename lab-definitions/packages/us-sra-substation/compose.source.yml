name: rangerdanger

# Complete SRA substation range model; relative paths resolve at the install root.
services:
  firewall:
    # Source mode builds RangerDanger only; containd is always a published image.
    image: ${CONTAIND_IMAGE:-ghcr.io/tonylturner/containd:latest}
    container_name: rangerdanger-firewall
    # Same capability set as docker-compose.release.yml. Until v0.1.32
    # this file also ran the firewall privileged with seccomp=unconfined,
    # a v0.1.13 workaround for containd's nflog consumer failing to bind
    # its netfilter log group on macOS Docker Desktop. containd v0.1.30
    # fixed the nflog bind race; with it the caps-only release model
    # delivers firewall.rule.hit events on macOS, so dev matches release.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_TIME
    environment:
      - CONTAIND_MODE=all
      - CONTAIND_JWT_SECRET=${CONTAIND_JWT_SECRET:-rangerdanger-dev}
      - CONTAIND_LAB_MODE=1
      - CONTAIND_SSH_SHELL_MODE=linux
      - CONTAIND_ALLOWED_ORIGINS=http://localhost:8088
      # Containd renamed NGFW_* to CONTAIND_* in v0.1.x. The legacy
      # names still work for most vars but enforcement defaults to OFF
      # in the new image, which black-holes all cross-zone traffic
      # because no nft filter table is built. Setting CONTAIND_ENFORCE_ENABLED=1
      # explicitly is required for the lab to actually forward traffic.
      - CONTAIND_ENGINE_URL=http://127.0.0.1:8081
      - CONTAIND_ENGINE_ADDR=127.0.0.1:8081
      - CONTAIND_CONFIG_DB=/data/config.db
      # CONTAIND_CAPTURE_IFACES intentionally unset. The backend selects
      # native capture zones from the authored topology via containd's API,
      # not kernel interface names. US startup errors do not select tcpdump.
      - CONTAIND_ENFORCE_ENABLED=1
      - CONTAIND_AUTO_WAN_SUBNET=10.10.10.0/24
      - CONTAIND_AUTO_DMZ_SUBNET=10.20.20.0/24
      - CONTAIND_AUTO_LAN1_SUBNET=10.30.30.0/24
      - CONTAIND_AUTO_LAN2_SUBNET=10.40.40.0/24
      # lan3 is the RangerDanger control-plane (backend↔firewall over
      # mgmt_net). containd's auto-bind matches lan3's subnet against
      # the mgmt_net NIC. Without this, the mgmt NIC falls outside the
      # policy and the input chain drops backend's API calls -
      # RangerDanger UI shows 502 on apply.
      - CONTAIND_AUTO_LAN3_SUBNET=10.99.99.0/24
      # Reserved management (containd 0.1.33+): the backend (.10) and the proxy
      # (.3) always reach the API on lan3; no applied policy can remove that path.
      - 'CONTAIND_MGMT_RESERVATION={"subnet":"10.99.99.0/24","sources":["10.99.99.10","10.99.99.3"],"listen":":8080"}'
    volumes:
      - ./data/us-sra-substation/firewall:/data
    ports:
      # Bound to 127.0.0.1 only (lab-only posture; A3 in release plan).
      # See SECURITY.md → "Exposing the lab beyond localhost" for how
      # to share the stack with another machine on purpose.
      - "127.0.0.1:9080:8080"   # containd UI
      - "127.0.0.1:9443:8443"   # containd HTTPS
      - "127.0.0.1:2222:2222"   # containd SSH console
    # interface_name pins each NIC's kernel name to its containd zone, so
    # `tcpdump -i lan2` is the field zone on every host (Docker's ethN order
    # is not stable). Needs Compose 2.36+ on Engine 28.1+ (setup.sh checks);
    # packagelint checks the names against the topology and policies.
    networks:
      mgmt_net:
        interface_name: lan3
        ipv4_address: 10.99.99.2
      enterprise_net:
        interface_name: wan
        ipv4_address: 10.10.10.2
      vendor_net:
        interface_name: dmz
        ipv4_address: 10.20.20.2
      ot_ops_net:
        interface_name: lan1
        ipv4_address: 10.30.30.2
      field_net:
        interface_name: lan2
        ipv4_address: 10.40.40.2
      sra_dmz_net:
        interface_name: lan4
        ipv4_address: 10.25.25.2
    restart: unless-stopped

  kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    container_name: rangerdanger-kali
    hostname: kali
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - GATEWAY=10.10.10.2
    networks:
      enterprise_net:
        ipv4_address: 10.10.10.50
    volumes:
      - ./data/us-sra-substation/kali_home:/home/kali
      - ./data/us-sra-substation/firewall/captures:/home/kali/pcaps:ro
      - ./scripts/set-gateway.sh:/usr/local/bin/set-gateway.sh:ro
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      - firewall

  vendor_jump:
    build:
      context: .
      dockerfile: Dockerfile.vendor-jump
    container_name: rangerdanger-vendor-jump
    hostname: vendor-jump
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - GATEWAY=10.20.20.2
    cap_add:
      - NET_ADMIN
    volumes:
      - ./scripts/vendor-jump-services.sh:/custom-cont-init.d/01-vendor-services.sh:ro
      - ./scripts/set-gateway.sh:/custom-cont-init.d/10-set-gateway.sh:ro
    networks:
      vendor_net:
        ipv4_address: 10.20.20.10
      desk_vendor_net:
        ipv4_address: 10.98.2.3
    shm_size: "1gb"
    mem_limit: 2g
    restart: unless-stopped
    depends_on:
      - firewall
    sysctls:
      net.ipv4.ip_forward: 0

  fuxa_hmi:
    image: rangerdanger-fuxa-hmi
    build:
      context: .
      dockerfile: Dockerfile.fuxa-hmi
    container_name: rangerdanger-fuxa-hmi
    hostname: fuxa-hmi
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY=10.30.30.2
    networks:
      ot_ops_net:
        ipv4_address: 10.30.30.10
      mgmt_net:
        ipv4_address: 10.99.99.50
    volumes:
      - ./data/us-sra-substation/fuxa_hmi_appdata:/usr/src/app/FUXA/server/_appdata
      - ./data/us-sra-substation/fuxa_hmi_db:/usr/src/app/FUXA/server/_db
      - ./data/us-sra-substation/fuxa_hmi_logs:/usr/src/app/FUXA/server/_logs
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      - firewall

  hmi_poller:
    image: alpine:3.21
    container_name: rangerdanger-hmi-poller
    network_mode: "service:fuxa_hmi"
    # Busybox nc is included in alpine and supports -w. Send a raw
    # Modbus FC3 Read Holding Registers request (12-byte frame) to
    # the RTAC at 10.30.30.20:502 on a steady interval. No output
    # is needed; the goal is producing observable Modbus wire
    # traffic from the HMI container.
    command:
      - sh
      - -c
      - |
        MODBUS_FRAME='\x00\x01\x00\x00\x00\x06\x01\x03\x00\x00\x00\x0a'
        while true; do
          printf "$$MODBUS_FRAME" | nc -w 1 10.30.30.20 502 > /dev/null 2>&1 || true
          sleep 2
        done
    restart: unless-stopped
    depends_on:
      - fuxa_hmi
      - rtac_sim

  rtac_sim:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: rtac-sim
    container_name: rangerdanger-rtac-sim
    hostname: rtac-sim
    cap_add:
      - NET_ADMIN
    # RTAC hardening sysctls - prevent the RTAC from ever acting as a
    # router or transit node between its multiple zone interfaces.
    # /proc/sys is read-only inside the container, so these must be set
    # via docker-compose sysctls: (namespaced network sysctls that Docker
    # applies at container creation).
    sysctls:
      net.ipv4.ip_forward: 0
      net.ipv4.conf.all.forwarding: 0
      net.ipv4.conf.default.forwarding: 0
      net.ipv4.conf.all.proxy_arp: 0
      net.ipv4.conf.default.proxy_arp: 0
      net.ipv4.conf.all.send_redirects: 0
      net.ipv4.conf.default.send_redirects: 0
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.default.accept_redirects: 0
      net.ipv4.conf.all.rp_filter: 1
      net.ipv4.conf.default.rp_filter: 1
    environment:
      - RELAY_SIM_HOST=relay-sim:8080
      - RECLOSER_SIM_HOST=recloser-sim:8080
      - REGULATOR_SIM_HOST=regulator-sim:8080
      - OPENDSS_SIM_HOST=opendss-sim:8080
      - GATEWAY=10.30.30.2
    networks:
      ot_ops_net:
        ipv4_address: 10.30.30.20
      field_net:
        ipv4_address: 10.40.40.10
      physics_net:
        ipv4_address: 10.50.50.10
      mgmt_net:
        ipv4_address: 10.99.99.20
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # rtac waits for the field-device sims (Modbus/DNP3 polling
    # targets) to be healthy before it starts polling them, so
    # /api/state never returns half-initialised data.
    depends_on:
      firewall:
        condition: service_started
      relay_sim:
        condition: service_healthy
      recloser_sim:
        condition: service_healthy
      regulator_sim:
        condition: service_healthy
      capbank_sim:
        condition: service_healthy
      opendss_sim:
        condition: service_healthy

  relay_sim:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: relay-sim
    container_name: rangerdanger-relay-sim
    hostname: relay-sim
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY=10.40.40.2
    networks:
      field_net:
        ipv4_address: 10.40.40.20
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - firewall

  recloser_sim:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: recloser-sim
    container_name: rangerdanger-recloser-sim
    hostname: recloser-sim
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY=10.40.40.2
    networks:
      field_net:
        ipv4_address: 10.40.40.21
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - firewall

  regulator_sim:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: regulator-sim
    container_name: rangerdanger-regulator-sim
    hostname: regulator-sim
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY=10.40.40.2
    networks:
      field_net:
        ipv4_address: 10.40.40.22
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - firewall

  capbank_sim:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: capbank-sim
    container_name: rangerdanger-capbank-sim
    hostname: capbank-sim
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY=10.40.40.2
    networks:
      field_net:
        ipv4_address: 10.40.40.23
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - firewall

  historian_sim:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: historian-sim
    container_name: rangerdanger-historian-sim
    hostname: historian-sim
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY=10.30.30.2
      - RTAC_ENDPOINT=http://10.30.30.20:8080
    networks:
      ot_ops_net:
        ipv4_address: 10.30.30.40
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - firewall
      - rtac_sim

  gps_sim:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: gps-sim
    container_name: rangerdanger-gps-sim
    hostname: gps-sim
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY=10.30.30.2
    networks:
      ot_ops_net:
        ipv4_address: 10.30.30.50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - firewall

  opendss_sim:
    build:
      context: .
      dockerfile: services/opendss-sim/Dockerfile
    container_name: rangerdanger-opendss-sim
    hostname: opendss-sim
    cap_add:
      - NET_ADMIN
    networks:
      physics_net:
        ipv4_address: 10.50.50.20
    # opendss-sim uses python:3.12-slim, not alpine, so no busybox wget.
    # python's urllib is always available - use it directly.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/api/health',timeout=2).read(); sys.exit(0)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Health probes are baked into the wrappers; no probe waits across a firewall zone.

  sra_keycloak:
    build:
      context: .
      dockerfile: Dockerfile.sra-keycloak
    container_name: rangerdanger-sra-keycloak
    hostname: sra-keycloak
    environment:
      - GATEWAY=10.25.25.2
    cap_add:
      - NET_ADMIN
    networks:
      sra_dmz_net:
        ipv4_address: 10.25.25.10
    mem_limit: 1g
    restart: unless-stopped

  sra_guacamole:
    build:
      context: .
      dockerfile: Dockerfile.sra-guacamole
    container_name: rangerdanger-sra-guacamole
    hostname: sra-guacamole
    environment:
      - GATEWAY=10.25.25.2
    cap_add:
      - NET_ADMIN
    networks:
      sra_dmz_net:
        ipv4_address: 10.25.25.20
    volumes:
      - ./data/us-sra-substation/recordings:/recordings:ro
    depends_on:
      sra_keycloak:
        condition: service_healthy
      sra_postgres:
        condition: service_healthy
      sra_guacd:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  sra_guacd:
    build:
      context: .
      dockerfile: Dockerfile.sra-guacd
    container_name: rangerdanger-sra-guacd
    hostname: sra-guacd
    networks:
      sra_dmz_net:
        ipv4_address: 10.25.25.30
    volumes:
      - ./data/us-sra-substation/recordings:/recordings
    depends_on:
      sra_ziti_router:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  sra_postgres:
    build:
      context: .
      dockerfile: Dockerfile.sra-postgres
    container_name: rangerdanger-sra-postgres
    hostname: sra-postgres
    networks:
      sra_dmz_net:
        ipv4_address: 10.25.25.31
    mem_limit: 256m
    restart: unless-stopped

  sra_ziti_controller:
    build:
      context: .
      dockerfile: Dockerfile.sra-ziti-controller
    container_name: rangerdanger-sra-ziti-controller
    hostname: sra-ziti-controller
    environment:
      - GATEWAY=10.25.25.2
    cap_add:
      - NET_ADMIN
    networks:
      sra_dmz_net:
        ipv4_address: 10.25.25.40
    volumes:
      - ./data/us-sra-substation/enrollment:/run/sra/enrollment
    mem_limit: 256m
    restart: unless-stopped

  sra_ziti_router:
    build:
      context: .
      dockerfile: Dockerfile.sra-ziti-router
    container_name: rangerdanger-sra-ziti-router
    hostname: sra-ziti-router
    environment:
      - GATEWAY=10.25.25.2
    cap_add:
      - NET_ADMIN
    networks:
      sra_dmz_net:
        ipv4_address: 10.25.25.50
    volumes:
      - ./data/us-sra-substation/enrollment:/run/sra/enrollment:ro
    depends_on:
      sra_ziti_controller:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  sra_ziti_host:
    build:
      context: .
      dockerfile: Dockerfile.sra-ziti-host
    container_name: rangerdanger-sra-ziti-host
    hostname: sra-ziti-host
    environment:
      - GATEWAY=10.30.30.2
    cap_add:
      - NET_ADMIN
    networks:
      ot_ops_net:
        ipv4_address: 10.30.30.60
    volumes:
      - ./data/us-sra-substation/enrollment:/run/sra/enrollment:ro
    depends_on:
      sra_ziti_controller:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

networks:
  mgmt_net:
    external: true
    name: rangerdanger_mgmt_net
  enterprise_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
  vendor_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.20.0/24
          gateway: 10.20.20.1
  ot_ops_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.30.0/24
          gateway: 10.30.30.1
  field_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.40.0/24
          gateway: 10.40.40.1
  physics_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.50.0/24
          gateway: 10.50.50.1
  desk_vendor_net:
    external: true
    name: rangerdanger_desk_vendor
  sra_dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.25.25.0/24
          gateway: 10.25.25.1
