worker_processes  1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # Basic security headers for embedded apps
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  server_tokens off;

  # WebSocket support maps
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream backend { server backend:8080; }
  upstream frontend { server frontend:3000; }

  server {
    listen 8080;

    # Use relative redirects (don't include host:port in Location headers)
    absolute_redirect off;

    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }


    # API gateway with WebSocket support for terminal
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400;
    }
    # The selected package provides routes. With none installed, only the
    # persistent portal and API are available.
    include /etc/nginx/rd-routes/*.conf;
  }
}
